[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ductus"
version = "0.1.0"
description = "A parametric font design language and compiler"
requires-python = ">=3.11"
dependencies = [
    "fonttools>=4.40",
    "skia-pathops>=0.8",
    "numpy>=1.24",
    "pyyaml>=6",
    "typer>=0.9",
]

[project.optional-dependencies]
proof = ["matplotlib>=3.7", "freetype-py>=2.4", "pillow>=9"]
validate = ["opentype-sanitizer>=9"]
serve = ["starlette>=0.37", "uvicorn>=0.29", "websockets>=12", "watchfiles>=0.21"]
bench = ["scipy>=1.10", "freetype-py>=2.4", "brotli>=1.0"]
test = ["pytest>=7", "httpx>=0.27"]

[project.scripts]
ductus = "ductus.cli:app"

[tool.setuptools]
packages = ["ductus", "ductus.serve", "ductus.bench"]

[tool.setuptools.package-data]
"ductus.serve" = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
