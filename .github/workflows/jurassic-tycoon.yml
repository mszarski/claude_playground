name: Jurassic Tycoon tests

on:
  push:
    paths: ['jurassic_tycoon/**', '.github/workflows/jurassic-tycoon.yml']
  pull_request:
    paths: ['jurassic_tycoon/**', '.github/workflows/jurassic-tycoon.yml']

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: jurassic_tycoon
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Run test suite
        run: node tools/ci.js
      - name: RTS controls with the real mouse
        run: node tools/rts.js
