const classOn={direct:true,surface:true,bottom:true,both:true}, legOn={out:true,back:true}, tgtOn=D.targets.map(()=>true);
const unique = new Set(D.models.map(m=>m.model));
function ssp(){ const W=170, Hh=120, prof=[]; if (E.ssp_section){ E.ssp_section.c.forEach((c,i)=>prof.push({z:E.ssp_section.z, c, name:`${fx(E.ssp_section.r[i],0)} m`})); }
  else if (E.ssp) prof.push({z:E.ssp.z, c:E.ssp.c, name:'profile'}); else prof.push({z:[0, zRef], c:[E.sound_speed, E.sound_speed], name:'isovelocity'});
  const cs=prof.flatMap(p=>p.c), zs=prof.flatMap(p=>p.z); let c0=Math.min(...cs), c1=Math.max(...cs); if (c1-c0<2){ c0-=1; c1+=1; } const z1=Math.max(...zs, 1e-6);
  const X=c=>28+(c-c0)/(c1-c0)*(W-36), Y=z=>8+z/z1*(Hh-24); const cols=['#2a78d6','#eb6834','#1baf7a','#8e5cc4','#555'];
  return `<svg width="${W}" height="${Hh}" role="img" aria-label="sound speed against depth"><rect x="28" y="8" width="${W-36}" height="${Hh-24}" fill="none" stroke="#999" stroke-width=".5"/>`
   + prof.map((p,i)=>`<polyline fill="none" stroke="${cols[i%5]}" stroke-width="1.6" points="${p.z.map((z,k)=>X(p.c[k]).toFixed(1)+','+Y(z).toFixed(1)).join(' ')}"/>`).join('')
   + `<text x="28" y="${Hh-4}" font-size="9" fill="currentColor">${fx(c0,0)}</text><text x="${W-8}" y="${Hh-4}" font-size="9" text-anchor="end" fill="currentColor">${fx(c1,0)} m/s</text>`
   + `<text x="2" y="14" font-size="9" fill="currentColor">0</text><text x="2" y="${Hh-16}" font-size="9" fill="currentColor">${fx(z1,0)}</text></svg>`
   + (prof.length>1?`<div class="m">${prof.map((p,i)=>`<span style="color:${cols[i%5]}">■</span> ${p.name}`).join(' ')}</div>`:''); }
const missing = [...(D.missing||[]), ...(S3.notes||[])];
if (D.undrawn) missing.push(`${D.undrawn} eigenray(s) of the trace have no path to draw (see above)`);
const lim = D.limits||{}; missing.push(`page thinned: the ${lim.max_rays} strongest drawable eigenrays of each leg and the ${lim.max_pairs} strongest of ${D.n_pairs} two-way pairs; polylines simplified (tolerance x${lim.tolerance}).` + (lim.over_budget?' STILL OVER THE SIZE BUDGET.':''));
missing.push('sound at the hydrophones (package V5) and the live chain\'s tracker taps (V6) are not on this page yet.');
$('info').innerHTML = `<h1>${esc(D.scenario)}</h1><div class="m">tier ${esc(D.tier)} · ${esc(D.sonar.name)} (${esc(D.sonar.mode)}) · ${fx(D.sonar.band_hz[0]/1e3,1)}–${fx(D.sonar.band_hz[1]/1e3,1)} kHz · ${H.length} hydrophone${H.length===1?'':'s'} · ${esc(D.view?.note||'ping '+D.ping)}</div>`
 + `<div><a href="${esc(D.links?.png)}">2-D page</a>${D.links?.index?` · <a href="${esc(D.links.index)}">index</a>`:''} · <span class="m">a picture of the simulator, not a measurement</span></div>`
 + `<p${RAYS.length?'':' class="warn"'}>${esc(rayNote)}</p>`
 + `<div>${Object.entries(CLS).map(([k,[c,t]])=>`<label class="t"><input type="checkbox" data-cls="${k}" checked>${sw(c,t)}</label>`).join('<br>')}</div>`
 + `<div><label class="t"><input type="checkbox" data-leg="out" checked>${sw('#555','out: projector to target')}</label><label class="t"><input type="checkbox" data-leg="back" checked>${sw('#555','back: target to array',1)}</label></div>`
 + `<div class="m"><span class="dot" style="background:#111"></span>projector <span class="dot" style="background:${ROWC[0]}"></span>hydrophones${rowsZ.length>1?' (colour: row)':''} <span class="dot" style="background:#c0392b"></span>targets <span class="dot" style="background:#ff8c00"></span>target at the chosen ping · small dots on a ray: its bounces</div>`
 + (D.targets.length>1?`<h2>targets</h2>`+D.targets.map((t,i)=>`<label class="t"><input type="checkbox" data-tgt="${i}" checked>${esc(t.label)}</label>`).join(''):'')
 + `<h2>layers</h2>` + toggles.map(([k,t])=>`<label class="t"><input type="checkbox" data-layer="${k}" checked>${t}</label>`).join('') + `<label class="t"><input type="checkbox" id="labs" checked>labels</label>`
 + `<h2>boundaries</h2><div>${esc(surfText)}</div><div>bed: ${esc(botText || (E.bottom_z_site!=null?'none in the propagation':'–'))}${E.bathymetry_note && !S3.bed_grid?` <span class="m">(${esc(E.bathymetry_note)})</span>`:''}${S3.bed_grid?' <span class="m">(the 3-D bed, drawn on a grid from the scenario\'s bathymetry, as Bellhop3D is given it)</span>':''}</div>`
 + `<div class="m">absorption ${esc(E.absorption)}: ${fx(E.absorption_db_per_km,3)} dB/km at the band centre</div>`
 + `<h2>beams</h2><div class="m">${esc(beamText)}</div><div class="m">${esc(B?.projector_text||'')}</div>`
 + `<h2>sound speed</h2>${ssp()}`
 + `<details><summary>what is modelled here (${D.models.length})</summary><table>${D.models.map(m=>`<tr><td>${esc(m.area)}</td><td>${esc(m.what||m.model)}${m.chosen==='default'?' <span class="m">(default)</span>':''}</td><td class="m">${esc(m.status)}</td></tr>`).join('')}</table></details>`
 + `<details open><summary>not shown, or shown with a caveat (${missing.length})</summary><ul>${missing.map(s=>`<li>${esc(s)}</li>`).join('')}</ul></details>`;
document.querySelectorAll('[data-cls]').forEach(el=>el.addEventListener('change',()=>{ classOn[el.dataset.cls]=el.checked; vis(); }));
document.querySelectorAll('[data-leg]').forEach(el=>el.addEventListener('change',()=>{ legOn[el.dataset.leg]=el.checked; vis(); }));
document.querySelectorAll('[data-tgt]').forEach(el=>el.addEventListener('change',()=>{ tgtOn[+el.dataset.tgt]=el.checked; vis(); }));
document.querySelectorAll('[data-layer]').forEach(el=>el.addEventListener('change',()=>{ G[el.dataset.layer].visible=el.checked; draw(); }));
$('labs').addEventListener('change',e=>{ showLabels=e.target.checked; draw(); });
function vis(){ const pingOk = !M || M.times.length<2 || pingIdx===tracedIdx;
  for (const x of RAYS){ const on = pingOk && classOn[x.cls] && (x.kind!=='leg' || (legOn[x.which] && tgtOn[x.ti])); x.line.visible=on; if (x.bp) x.bp.visible=on; if(!on) x.dot.visible=false; }
  draw(); }

// ---------- picking: a ray, a hydrophone ----------
const rc = new THREE.Raycaster(); let selected=null;
function pick(e){ const r=renderer.domElement.getBoundingClientRect(); const m=new THREE.Vector2(((e.clientX-r.left)/r.width)*2-1, -((e.clientY-r.top)/r.height)*2+1);
  rc.setFromCamera(m,camera); rc.params.Line.threshold=ctl.dist*0.006; rc.params.Points.threshold=ctl.dist*0.006;
  if (G.array.visible){ const hh=rc.intersectObject(hydPts); if (hh.length){ selectHyd(hh[0].index); return; } }
  const hit=rc.intersectObjects(RAYS.filter(x=>x.line.visible).map(x=>x.line), false);
  if (hit.length) selectRay(RAYS.find(x=>x.line===hit[0].object)); else clearSel(); }
function emphasise(set){ for (const x of RAYS){ const on=!set||set.has(x); x.line.material.opacity=on?1:0.12; x.line.material.color.set(set&&on?'#ffb000':x.color); x.line.renderOrder=on?3:0; } draw(); }
function clearSel(){ selected=null; emphasise(null); $('pick').hidden=true; }
function rayHtml(x){ const r=x.r; const tgt=x.kind==='leg'?D.targets[x.ti]?.label:'';
  return `<h2>${esc(x.name)} · eigenray ${r.k}</h2><table>`
   + `<tr><td>delay</td><td>${fx(r.delay,6)} s ${x.kind==='leg'?'(one leg)':''}</td></tr><tr><td>level</td><td>${fx(r.db,1)} dB re 1 m (spreading and reflection; no absorption, no beams)</td></tr>`
   + `<tr><td>launch</td><td>${fx(r.launch,2)}° (positive down)</td></tr><tr><td>bounces</td><td>${r.ns} surface, ${r.nb} bottom (${CLS[x.cls][1]})</td></tr>`
   + (r.tt!=null?`<tr><td>along the drawn ray</td><td>${fx(r.tt,6)} s (${fx((r.tt-r.delay)*1e3,3)} ms from the delay)</td></tr>`:'')
   + (r.miss!=null?`<tr><td>miss</td><td>${fx(r.miss,2)} m from the target</td></tr>`:'') + `</table>`
   + (r.bounces.length?`<table><tr><th>#</th><th>boundary</th><th>grazing</th><th>loss</th><th>x, y, z (m)</th></tr>${r.bounces.map((b,i)=>`<tr><td>${i+1}</td><td>${esc(b.b)}</td><td>${fx(b.g,1)}°</td><td>${b.loss==null?'–':fx(Math.abs(b.loss)<0.005?0:b.loss,2)+' dB'}</td><td class="m">${b.xyz.map(v=>fx(v,1)).join(', ')}</td></tr>`).join('')}</table>`
     + `<div class="m">loss per bounce: the model the tier applies, evaluated at the drawn grazing angle${D.tier.startsWith('eigenray')?' (Bellhop does not report a loss per bounce: the same Rayleigh law, evaluated again)':''}.</div>`:'<div class="m">no bounce</div>')
   + `<div class="m">${esc(r.path||'')}</div>`; }
function selectRay(x){ selected=x; const set=new Set([x]); emphasise(set);
  const pairs = x.kind==='leg' ? D.pairs.filter(p=>p.target===x.ti && (x.which==='out'?p.out===x.r.k:p.back===x.r.k)) : [];
  $('pick').innerHTML = `<button id="pclose" style="float:right">close</button>` + rayHtml(x)
    + (x.kind==='leg'?`<div>${pairs.length} of the ${D.pairs.length} strongest pairs use it${pairs.length?`: ${pairs.slice(0,6).map(p=>`${fx(p.t,5)} s (${fx(p.db,1)} dB)`).join(', ')}`:''}</div>`:'');
  $('pick').hidden=false; $('pclose').onclick=clearSel; }
function selectHyd(c){ $('hsel').value=String(c); if (c<0){ selPt.visible=false; clearSel(); return; }
  selPt.geometry.setFromPoints([L(H[c])]); selPt.visible=true;
  const rows=[]; D.pairs.forEach((p,i)=>rows.push({t:p.ch[c], db:p.db, c:cls(p.ns,p.nb), what:`${D.targets[p.target]?.label}: out ${p.out}, back ${p.back}`, pair:p}));
  (D.oneway||[]).forEach(o=>o.arrivals.forEach(a=>rows.push({t:a.ch[c], db:a.db, c:cls(a.ns,a.nb), what:`one way from ${o.label}, ray ${a.k}`})));
  if (D.direct) D.direct.arrivals.forEach(a=>rows.push({t:a.ch[c], db:null, c:cls(a.ns,a.nb), what:`direct sound, ray ${a.k}`}));
  rows.sort((a,b)=>a.t-b.t);
  $('pick').innerHTML = `<button id="pclose" style="float:right">close</button><h2>hydrophone ${c}</h2><div class="m">at ${H[c].map(v=>fx(v,3)).join(', ')} m (row ${rowOf[c]+1} of ${rowsZ.length}). Arrivals of the ${D.pairs.length} strongest of ${D.n_pairs} two-way pairs at this hydrophone, as the synthesis places them (time after transmit); click a row to show its rays.</div>`
    + `<table><tr><th>time (s)</th><th>level</th><th>class</th><th>what</th></tr>${rows.map((r,i)=>`<tr class="row" data-i="${i}"><td>${fx(r.t,6)}</td><td>${r.db==null?'–':fx(r.db,1)+' dB'}</td><td><span class="dot" style="background:${CLS[r.c][0]}"></span></td><td>${esc(r.what)}</td></tr>`).join('')}</table>`;
  $('pick').hidden=false; $('pclose').onclick=()=>selectHyd(-1);
  $('pick').querySelectorAll('tr.row').forEach(el=>el.addEventListener('click',()=>{ const p=rows[+el.dataset.i].pair; if (!p) return;
    emphasise(new Set(RAYS.filter(x=>x.kind==='leg' && x.ti===p.target && ((x.which==='out'&&x.r.k===p.out)||(x.which==='back'&&x.r.k===p.back))))); }));
  draw(); }
H.forEach((p,i)=>{ const o=document.createElement('option'); o.value=String(i); o.textContent=`${i}${rowsZ.length>1?' (row '+(rowOf[i]+1)+')':''}`; $('hsel').appendChild(o); });
$('hsel').addEventListener('change', e=>selectHyd(+e.target.value));

// ---------- time: a dot along each ray, hydrophones light as pairs arrive ----------
const allT = [...D.pairs.map(p=>p.t), ...(D.oneway||[]).flatMap(o=>o.arrivals.map(a=>a.t)), ...(D.direct?D.direct.arrivals.map(a=>a.t):[])];
const tMax = Math.max(...allT, ...RAYS.map(x=>x.r.delay), 1e-3)*1.02;
const tOut = Math.min(...D.legs.flatMap(l=>l.out.map(r=>r.delay)), Infinity);
const slider=$('time'), tval=$('tval');
const baseCol = hydPts.geometry.getAttribute('color').array.slice();
function at(x, f){ const s=f*x.Lc[x.Lc.length-1]; let i=1; while(i<x.Lc.length-1 && x.Lc[i]<s) i++; const a=x.r.line[i-1], b=x.r.line[i], u=(s-x.Lc[i-1])/Math.max(x.Lc[i]-x.Lc[i-1],1e-12); return [a[0]+u*(b[0]-a[0]), a[1]+u*(b[1]-a[1]), a[2]+u*(b[2]-a[2])]; }
function setTime(t){ for (const x of RAYS){ if (!x.line.visible){ x.dot.visible=false; continue; }
    // out legs from 0; back legs (stored array to target) run backwards from the earliest arrival at the target; one-way rays (stored array to source) backwards from 0
    let f; if (x.which==='out'||x.kind==='direct') f=t/x.r.delay; else if (x.kind==='leg') f=1-(t-tOut)/x.r.delay; else f=1-t/x.r.delay;
    const ok = x.which==='out'||x.kind==='direct' ? (f>0&&f<1) : (x.kind==='leg' ? (t>tOut && f>0 && f<1) : (f>0&&f<1));
    if (!ok){ x.dot.visible=false; continue; } x.dot.geometry.setFromPoints([L(at(x, x.kind==='direct'? 1-f : f))]); x.dot.visible=true; }
  const col=hydPts.geometry.getAttribute('color'), win=0.004*tMax, lit=new THREE.Color(0xffc000);
  H.forEach((p,c)=>{ const hit=D.pairs.some(q=>Math.abs(q.ch[c]-t)<win) || (D.oneway||[]).some(o=>o.arrivals.some(a=>Math.abs(a.ch[c]-t)<win));
    if (hit) col.setXYZ(c, lit.r, lit.g, lit.b); else col.setXYZ(c, baseCol[3*c], baseCol[3*c+1], baseCol[3*c+2]); });
  col.needsUpdate=true; tval.textContent=t.toFixed(5)+' s'; }
slider.addEventListener('input',()=>{ setTime(slider.value/1000*tMax); draw(); });
let playing=null; $('play').addEventListener('click',()=>{ if (playing){ cancelAnimationFrame(playing); playing=null; return; }
  const start=performance.now(), from=+slider.value>=1000?0:+slider.value;
  const step=now=>{ const v=Math.min(1000, from+(now-start)/8); slider.value=v; setTime(v/1000*tMax); draw(); playing = v<1000 ? requestAnimationFrame(step) : null; };
  playing=requestAnimationFrame(step); });

// ---------- ping slider ----------
if ($('ping')){ const pin=$('ping'), pval=$('pval');
  const upd=()=>{ pingIdx=+pin.value; const t=M.times[pingIdx];
    pval.textContent=`${M.ping_index[pingIdx]} (t = ${fx(t,2)} s)` + (pingIdx===tracedIdx?' · rays traced at this ping':' · rays are traced at ping '+M.ping+' only');
    if (pingMarks) pingMarks.geometry.setFromPoints(D.targets.map((tg,i)=>L((M.targets[i]||[tg.position])[pingIdx]||tg.position)));
    if (pingPlat) pingPlat.geometry.setFromPoints([L(M.track[pingIdx])]); vis(); };
  pin.addEventListener('input', upd); upd(); }

// ---------- vertical exaggeration, views ----------
const vin=$('vex'), vval=$('vval');
function setVex(v){ const old=vex; vex=Math.max(1, Math.min(60, Math.round(v))); world.scale.set(1, vex, 1); ctl.target.y*=vex/old; vin.value=vex; vval.textContent=vex+'x'+(vex===1?' (true scale)':''); place(); draw(); }
vin.addEventListener('input',()=>setVex(+vin.value));
$('truescale').addEventListener('click',()=>setVex(1));
function zoomAll(){ ctl.target.set(0, -(zTop+zBot)/2*vex, 0); ctl.dist=1.7*Math.max(span, zSpan*vex); ctl.az=0.85; ctl.el=0.45; place(); draw(); }
$('zall').addEventListener('click', zoomAll);
$('zarr').addEventListener('click',()=>{ const c=L(ref); c.y*=vex; ctl.target.copy(c);
  if (B) { ctl.az=Math.atan2(-B.broadside[1], B.broadside[0])+0.55; ctl.el=0.35; }   /* from behind the array, looking along its look */ ctl.dist=Math.max(aperture*2.2, 0.5, Math.hypot(PJ[0]-ref[0],PJ[1]-ref[1],(PJ[2]-ref[2])*vex)*3); place(); draw(); });

function draw(){ renderer.render(scene, camera); placeLabels(); }
window.addEventListener('resize',()=>{ resize(); draw(); });
setVex(Math.max(1, Math.min(60, Math.round(0.3*span/zSpan))));
resize(); zoomAll(); vis(); setTime(tMax*0.999); draw();
window.__page = {rays: RAYS.length, legRays: nDrawn, threeD: three_d.length, hydrophones: H.length, labels: LABELS.length, vex};
// For a browser check (tools/page3d_check.js, tests): where on the screen a drawn ray's middle vertex is.
window.__screenOfRay = i => { const x=RAYS[i]; if (!x) return null; world.updateMatrixWorld(); const v=L(x.r.line[Math.floor(x.r.line.length/2)]).applyMatrix4(world.matrixWorld).project(camera);
  const r=renderer.domElement.getBoundingClientRect(); return [r.left+(v.x+1)/2*r.width, r.top+(1-v.y)/2*r.height]; };
window.__ready = true;
</script></body></html>
