  const m0=(C.pings.find(p=>p.map)||{}).map; if (m0) for (let i=0;i<m0.rows;i++){ const o=document.createElement('option'); o.value=String(i); o.textContent=`${fx(m0.b0+(i+0.5)*m0.db,1)}°`; $('chbeam').appendChild(o); }
  $('chbeam').addEventListener('change', ()=>chainProfile(chainK));
  $('chzoom').addEventListener('click', chainZoom);
  pn.querySelectorAll('[data-ch]').forEach(el=>el.addEventListener('change',()=>{ chainOn[el.dataset.ch]=el.checked; chainSet(chainK, false); }));
  $('chping').addEventListener('input', e=>chainSet(+e.target.value, true));
  if (C.audio) $('chsndon').addEventListener('change', e=>{ chainSound=e.target.checked; if (!chainSound && chainAudio) chainAudio.pause(); });
  // Stepping: one clock with the sound. With sound on, the next ping comes when this ping's sound ends (at least 0.4 s).
  const stepNext=()=>{ if (!chainStepper) return; const n=(chainK+1)%C.n_pings; chainSet(n, true);
    const wait = chainSound && chainAudio && !chainAudio.paused ? null : 700; if (wait) chainStepper=setTimeout(stepNext, wait); };
  $('chstep').addEventListener('click',()=>{ if (chainStepper){ clearTimeout(chainStepper); chainStepper=null; $('chstep').textContent='step pings'; if (chainAudio) chainAudio.pause(); return; }
    $('chstep').textContent='stop'; chainStepper=1; stepNext(); });
  if (C.audio){ chainAudio=new Audio(); chainAudio.addEventListener('ended', ()=>{ if (chainStepper) chainStepper=setTimeout(stepNext, 400); }); }
  chainSet(Math.max(C.n_pings-1,0), false); }

// ---------- vertical exaggeration, views ----------
const vin=$('vex'), vval=$('vval');
function setVex(v){ const old=vex; vex=Math.max(1, Math.min(60, Math.round(v))); world.scale.set(1, vex, 1); ctl.target.y*=vex/old; vin.value=vex; vval.textContent=vex+'x'+(vex===1?' (true scale)':''); place(); draw(); }
vin.addEventListener('input',()=>setVex(+vin.value));
$('truescale').addEventListener('click',()=>setVex(1));
function zoomAll(){ ctl.target.set(0, -(zTop+zBot)/2*vex, 0); ctl.dist=1.7*Math.max(span, zSpan*vex); ctl.az=0.85; ctl.el=0.45; place(); draw(); }
$('zall').addEventListener('click', zoomAll);
$('zarr').addEventListener('click',()=>{ const c=L(ref); c.y*=vex; ctl.target.copy(c);
  if (B) { ctl.az=Math.atan2(-B.broadside[1], B.broadside[0])+0.55; ctl.el=0.35; }   /* from behind the array, looking along its look */ ctl.dist=Math.max(aperture*2.2, 0.5, Math.hypot(PJ[0]-ref[0],PJ[1]-ref[1],(PJ[2]-ref[2])*vex)*3); place(); draw(); });

function draw(){ renderer.render(scene, camera); placeLabels(); }
window.addEventListener('resize',()=>{ resize(); draw(); });
setVex(Math.max(1, Math.min(60, Math.round(0.3*span/zSpan))));
resize(); zoomAll(); vis(); setTime(tMax*0.999); draw();
window.__page = {rays: RAYS.length, legRays: nDrawn, threeD: three_d.length, hydrophones: H.length, labels: LABELS.length, vex, audio: !!A, audioFiles: A ? A.files.length : 0,
  chain: C ? C.n_pings : 0};
// For a browser check (tools/page3d_check.js): the chain layer's drawn counts at a ping against the report lines'.
window.__chain = C ? {pings: C.n_pings, set: k => { const st=chainSet(k, false); return {k: chainK, drawn_detections: st.det, drawn_tracks: st.trk, truth: st.truth, ellipses: st.ell,
  gates: st.gates, map: st.map, report_detections: C.pings[chainK].report_counts?.detections, report_tracks: C.pings[chainK].report_counts?.tracks}; }} : null;
// For a browser check (tests/python/test_scene_audio.py): the clock and the lit hydrophones.
window.__viz = {setTime: t => { setTime(t); draw(); return litNow.slice(); }, lit: () => litNow.slice(), win: WIN, tMax, t2a, a2t,
  sound: () => A ? {hyd: sndHyd, kind: sndKind, src: audioEl.getAttribute('src')} : null, setSound: (c,k) => { setSound(c,k); return {hyd: sndHyd, kind: sndKind}; }};
// For a browser check (tools/page3d_check.js, tests): where on the screen a drawn ray's middle vertex is.
window.__screenOfRay = i => { const x=RAYS[i]; if (!x) return null; world.updateMatrixWorld(); const v=L(x.r.line[Math.floor(x.r.line.length/2)]).applyMatrix4(world.matrixWorld).project(camera);
  const r=renderer.domElement.getBoundingClientRect(); return [r.left+(v.x+1)/2*r.width, r.top+(1-v.y)/2*r.height]; };
window.__ready = true;
</script></body></html>
