# Stage 2, the prototype on the test AUV with a second row: two rows of 32 hydrophones over 3 m,
# 0.30 m apart (one wavelength at 5 kHz). Elevation to 0.9 degrees at 20 dB with no repeat inside
# +-25 degrees: enough to prove the elevation chain and to give depth to a few metres at 500 m.
# The usable height on the test AUV is NOT known; the separation is a parameter
# (tools/popoto_elevation_study.py sweeps 0.1 to 0.5 m; below about 0.15 m it is not worth a row).
base: popoto_testauv_1row
name: popoto_testauv_2row

array:
  layout_choice: two_rows
  layouts:
    two_rows:
      layout: stacked_lines
      rows:                       # up: m above the mid-height; out: m out from the hull
        - {up: -0.15, out: 0.0}
        - {up: 0.15, out: 0.0}

unconfirmed:
  - array.layouts.two_rows.rows   # 0.30 m apart: a placeholder until the test AUV's usable height is known
