# Stage 0: Popoto PMM6081 modem board, 8 hydrophones, PMT-28 transducer.
name: popoto_8
mode: flank
nominal_sound_speed: 1500.0

array:
  axis: [1, 0, 0]                # along the vehicle
  boresight: [0, 1, 0]           # broadside to starboard; hydrophones are omnidirectional
  layout_choice: dense
  layouts:
    dense:
      layout: uniform_line
      count: 8
      pitch: 0.027               # m; half a wavelength at 27.5 kHz
    sparse:
      # Non-uniform over 3 m: an 8-element minimum-redundancy pattern
      # (0 1 4 10 16 22 28 30) on a 0.1 m unit, centred.
      layout: line
      positions: [-1.5, -1.4, -1.1, -0.5, 0.1, 0.7, 1.3, 1.5]

transmit:
  kind: point
  lever_arm: [0, 0, 0.3]
  waveform:
    type: lfm
    f_start: 20.0e3
    f_stop: 35.0e3                # the plan's example is a 22-32 kHz sweep inside this band
    duration: 0.5                 # s, as in the plan's Phase 0 link budget
    window_alpha: 0.1
    source_level_db_rms: 190.0       # dB re 1 uPa at 1 m, RMS

receive:
  kind: real
  sample_rate: 102400.0
  adc_bits: 24
  # Plan, Phase 0 (PMM6081 ICD): 43 dB preamp, 37 mVpp full scale at the input.
  # Referred to the preamp output that is 18.5 mV * 10^(43/20) = 2.61 V peak.
  adc_full_scale: 2.61           # V at the ADC
  sensitivity_db: -208.0         # dB re 1 V/uPa: an AS-1 class passive hydrophone
  gain_db: 43.0
  # The ICD's 100 Hz AC coupling (10 Hz has also been quoted) is not simulated here: at 4 kHz and up a
  # one-pole 100 Hz high-pass moves every channel's phase alike by under 1.5 deg and its level by under
  # 0.003 dB. It matters after an overload: give it as `receive.overload.highpass_corner_hz`.
  window: {range: [50.0, 2000.0]}

unconfirmed:
  - receive.sample_rate          # Popoto ADC rate
  - receive.adc_bits
  - receive.sensitivity_db       # depends on the hydrophones wired to the board
  - receive.simultaneous_sampling   # whether the 8 inputs record simultaneously
  - transmit.waveform.duration
