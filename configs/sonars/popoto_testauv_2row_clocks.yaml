# The two-row prototype with every board on its own clock, for rehearsals: 8 boards of eight inputs with clock
# offsets, drifts and jitter as the simulator's truth, and the shared synchronisation reference (one
# electrical signal wired to every board and summed into its first input, above the acoustic band:
# see popoto_4x8.yaml). The chain has to estimate the clocks.
base: popoto_testauv_2row
name: popoto_testauv_2row_clocks

receive:
  boards:
    - {first: 0, count: 8, clock_offset: 0.00e+00, clock_drift_ppm: 0.0, jitter_rms: 2.0e-8, reference_channel: 0}
    - {first: 8, count: 8, clock_offset: -1.04e-04, clock_drift_ppm: 24.4, jitter_rms: 2.0e-8, reference_channel: 8}
    - {first: 16, count: 8, clock_offset: -1.09e-04, clock_drift_ppm: 14.4, jitter_rms: 2.0e-8, reference_channel: 16}
    - {first: 24, count: 8, clock_offset: 2.22e-04, clock_drift_ppm: -5.4, jitter_rms: 2.0e-8, reference_channel: 24}
    - {first: 32, count: 8, clock_offset: -3.70e-05, clock_drift_ppm: -6.4, jitter_rms: 2.0e-8, reference_channel: 32}
    - {first: 40, count: 8, clock_offset: -2.36e-04, clock_drift_ppm: -1.1, jitter_rms: 2.0e-8, reference_channel: 40}
    - {first: 48, count: 8, clock_offset: -1.55e-04, clock_drift_ppm: -12.1, jitter_rms: 2.0e-8, reference_channel: 48}
    - {first: 56, count: 8, clock_offset: -1.89e-04, clock_drift_ppm: -15.3, jitter_rms: 2.0e-8, reference_channel: 56}
  reference:
    mode: sync_chirp
    f_start: 38.0e3
    f_stop: 48.0e3
    duration: 4.0e-3
    level: 2.0e-3                # V peak at the ADC
    lead: 5.0e-3
    tail: 10.0e-3
    channels: [0, 8, 16, 24, 32, 40, 48, 56]

unconfirmed:
  - receive.boards               # whether boards can be batched, and their clock stability, are questions for Popoto
  - receive.reference
