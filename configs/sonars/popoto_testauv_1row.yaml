# Stage 1, the prototype on the test AUV: ONE row of 32 hydrophones over 3 m, the long-range
# band (4-6 kHz) and boards. It is the 32-hydrophone array of `popoto_4x8` / `flank_32` (3 m,
# 0.094 m pitch) at 0.09 m with the long-range waveform: 0.30 of a wavelength apart at 5 kHz, so no
# repeats in bearing at any steering, a beam 5 degrees wide instead of 3.2, the same array gain
# in white noise. For a 2 m span: sonar_overrides {array: {pitch: 0.0625}}.
# Stages and what each is for: docs/DESIGN.md Sec. 3; tools/popoto_elevation_study.py.
base: popoto_long_range
name: popoto_testauv_1row

platform:                        # the test AUV the prototype goes on (the owner: "probably like 2-3 [m] span we can attach")
  name: test_auv
  span_m: 3.0                    # usable length along the hull: 2 to 3 m by the owner's words; 3 m taken here, 2 m by override
  height_m: 0.40                 # usable height: NO figure from the owner ("not much elevation"); a placeholder
  mounting: hull

array:
  count: 32
  pitch: 0.09                    # m: 32 hydrophones over 2.9 m

transmit:
  lever_arm: [0, 0, 0.3]         # the projector 0.3 m below the row: a placeholder
  waveform:
    duration: 0.1                # s: short-range trials. The array cannot listen while it transmits: a 1 s pulse hides
                                 # everything inside 750 m, 0.1 s everything inside 75 m, at 10 dB less processing gain

unconfirmed:
  - platform.span_m              # 2 or 3 m
  - platform.height_m
  - transmit                     # the projector for the test AUV, its place and its source level are not chosen
  - array.pitch
