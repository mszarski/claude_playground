# The long-range Popoto array as three rows of 32 hydrophones: with the rows 0.19 m apart (less
# than a wavelength at 6 kHz) no second elevation lobe falls inside +-30 degrees, which two rows
# 0.38 m apart cannot offer. Accuracy is that of the two-row array (the same top-to-bottom span).
# 96 hydrophones on 12 boards of 8 inputs; channels run row by row from the lowest row up.
# Geometry and numbers: docs/DESIGN.md Sec. 3, tools/popoto_elevation_study.py.
base: popoto_long_range
name: popoto_long_range_3row

array:
  layout_choice: three_rows
  layouts:
    three_rows:
      layout: stacked_lines
      rows:                       # up: m towards the vehicle's top; out: m along the boresight
        - {up: -0.19, out: 0.0}
        - {up: 0.0, out: 0.079}   # the hull's widest point: further out on a round 0.533 m hull
        - {up: 0.19, out: 0.0}

unconfirmed:
  - array.layouts.three_rows.rows   # assumes a round 0.533 m (21 in) hull; the hull, the fairing and
                                    # where hydrophones can be mounted on it are not confirmed
