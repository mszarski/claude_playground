# The two-row long-range array with every board on its own clock, for rehearsals: eight boards
# of eight inputs, clock offsets, drifts and jitter as the simulator's truth, and the shared
# synchronisation reference (one electrical signal wired to every board and summed into its
# first input, above the acoustic band: see popoto_4x8.yaml). The chain has to estimate the
# clocks; elevation is the stage most sensitive to what is left (docs/DESIGN.md Sec. 3).
base: popoto_long_range_2row
name: popoto_long_range_2row_clocks

receive:
  boards:
    - {first: 0,  count: 8, clock_offset: 0.0,     clock_drift_ppm: 0.0,   jitter_rms: 2.0e-8, reference_channel: 0}
    - {first: 8,  count: 8, clock_offset: 3.1e-4,  clock_drift_ppm: 12.0,  jitter_rms: 2.0e-8, reference_channel: 8}
    - {first: 16, count: 8, clock_offset: -1.7e-4, clock_drift_ppm: -8.0,  jitter_rms: 2.0e-8, reference_channel: 16}
    - {first: 24, count: 8, clock_offset: 5.2e-5,  clock_drift_ppm: 25.0,  jitter_rms: 2.0e-8, reference_channel: 24}
    - {first: 32, count: 8, clock_offset: -2.4e-4, clock_drift_ppm: 17.0,  jitter_rms: 2.0e-8, reference_channel: 32}
    - {first: 40, count: 8, clock_offset: 1.3e-4,  clock_drift_ppm: -21.0, jitter_rms: 2.0e-8, reference_channel: 40}
    - {first: 48, count: 8, clock_offset: 2.8e-4,  clock_drift_ppm: 4.0,   jitter_rms: 2.0e-8, reference_channel: 48}
    - {first: 56, count: 8, clock_offset: -9.0e-5, clock_drift_ppm: -14.0, jitter_rms: 2.0e-8, reference_channel: 56}
  reference:
    mode: sync_chirp
    f_start: 38.0e3
    f_stop: 48.0e3
    duration: 4.0e-3
    level: 2.0e-3                # V peak at the ADC
    lead: 5.0e-3
    tail: 10.0e-3
    channels: [0, 8, 16, 24, 32, 40, 48, 56]

unconfirmed:
  - receive.boards               # whether boards can be batched, and their clock stability, are questions for Popoto
  - receive.reference
