# Downward-looking sub-bottom imaging sonar for 3D near-field work (ASASIN Sec. III-B):
# one projector and a short receive line, raster-scanned 1-3 m above the seabed to form
# a 2D synthetic aperture. Not one of the brief's hardware stages; it exists so the
# buried-object scenario has a sonar. All values are placeholders.
name: subbottom
mode: sas
nominal_sound_speed: 1500.0

array:
  layout: uniform_line
  count: 4
  pitch: 0.05
  axis: [0, 1, 0]
  boresight: [0, 0, 1]             # straight down; elements are omnidirectional

transmit:
  kind: point
  lever_arm: [0, 0, 0]
  boresight: [0, 0, 1]
  waveform:
    type: gaussian
    f_start: 10.0e3
    f_stop: 30.0e3                 # 20 kHz centre, 20 kHz bandwidth
    duration: 3.0e-4
    amplitude: 1.0

receive:
  kind: baseband
  sample_rate: 100.0e3
  window: {range: [1.0, 3.0]}

unconfirmed:
  - array
  - transmit
  - receive
