# The three-row full-face array with every board on its own clock, for rehearsals: 12 boards of eight inputs with clock
# offsets, drifts and jitter as the simulator's truth, and the shared synchronisation reference (one
# electrical signal wired to every board and summed into its first input, above the acoustic band:
# see popoto_4x8.yaml). The chain has to estimate the clocks.
base: popoto_long_range_3row
name: popoto_long_range_3row_clocks

receive:
  boards:
    - {first: 0, count: 8, clock_offset: 0.00e+00, clock_drift_ppm: 0.0, jitter_rms: 2.0e-8, reference_channel: 0}
    - {first: 8, count: 8, clock_offset: -1.50e-04, clock_drift_ppm: 22.3, jitter_rms: 2.0e-8, reference_channel: 8}
    - {first: 16, count: 8, clock_offset: -1.86e-04, clock_drift_ppm: -16.0, jitter_rms: 2.0e-8, reference_channel: 16}
    - {first: 24, count: 8, clock_offset: -9.00e-05, clock_drift_ppm: -13.5, jitter_rms: 2.0e-8, reference_channel: 24}
    - {first: 32, count: 8, clock_offset: 1.02e-04, clock_drift_ppm: -19.2, jitter_rms: 2.0e-8, reference_channel: 32}
    - {first: 40, count: 8, clock_offset: 2.38e-04, clock_drift_ppm: 17.9, jitter_rms: 2.0e-8, reference_channel: 40}
    - {first: 48, count: 8, clock_offset: -2.98e-04, clock_drift_ppm: 2.1, jitter_rms: 2.0e-8, reference_channel: 48}
    - {first: 56, count: 8, clock_offset: -2.36e-04, clock_drift_ppm: -12.1, jitter_rms: 2.0e-8, reference_channel: 56}
    - {first: 64, count: 8, clock_offset: -5.00e-05, clock_drift_ppm: -2.3, jitter_rms: 2.0e-8, reference_channel: 64}
    - {first: 72, count: 8, clock_offset: -1.90e-05, clock_drift_ppm: 21.4, jitter_rms: 2.0e-8, reference_channel: 72}
    - {first: 80, count: 8, clock_offset: -1.45e-04, clock_drift_ppm: -15.6, jitter_rms: 2.0e-8, reference_channel: 80}
    - {first: 88, count: 8, clock_offset: 1.02e-04, clock_drift_ppm: 22.3, jitter_rms: 2.0e-8, reference_channel: 88}
  reference:
    mode: sync_chirp
    f_start: 38.0e3
    f_stop: 48.0e3
    duration: 4.0e-3
    level: 2.0e-3                # V peak at the ADC
    lead: 5.0e-3
    tail: 10.0e-3
    channels: [0, 8, 16, 24, 32, 40, 48, 56, 64, 72, 80, 88]

unconfirmed:
  - receive.boards               # whether boards can be batched, and their clock stability, are questions for Popoto
  - receive.reference
