# The three-row static array in free field: three targets about 400 m off at known depths above, level
# with and below the frame, in noise. No boundaries: the depths the chain reports must be the targets'.
# Chain: configs/deploy/popoto_static_3row.yaml (without sync: these pings are at baseband).
name: popoto_static_free
sonar: popoto_static_3row
fidelity: free_field
sonar_overrides:
  receive: {kind: baseband, sample_rate: 8.0e3, window: {range: [250.0, 600.0]}}
environment: {sound_speed: 1500.0, temperature: 12.0, salinity: 35.0}
platform: {position: [0, 0, 40.0], rpy: [0.0349, 0, 0], velocity: [0, 0, 0]}     # still; tilted 2 degrees
pings: {count: 4, interval: 3.0}
scene:
  - {type: points, label: shallow, positions: [[-120.0, 380.0, 10.0]], target_strength_db: 10.0}
  - {type: points, label: level,   positions: [[40.0, 420.0, 40.0]], target_strength_db: 10.0}
  - {type: points, label: deep,    positions: [[200.0, 460.0, 90.0]], target_strength_db: 10.0}
absorption: ainslie_mccolm
receiver:
  adc: false
  ambient_noise: {wind_speed: 5.0, shipping: 0.5}
seed: 25
