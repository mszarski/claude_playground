# Rehearsal of the full stacked-row system as it would run on the vehicle: the three-row array
# sampled raw at 102.4 kHz on twelve boards with their own clocks (offsets to 0.3 ms, drifts to
# 25 ppm), the vehicle rolled 4 degrees and pitched 1, rolling 1.5 degrees a second during the
# ping (the record carries the attitude samples navigation would send), under way at 1.5 m/s, in
# 100 m of water over sand with a local sound speed of 1490 m/s; a target at 60 m depth and one
# near the surface, about 1 km off.
#   tools/sonar_live.py configs/deploy/popoto_elevation_rehearsal.yaml --scenario popoto_elevation_rehearsal
# The chain must synchronise the boards, find both targets, and report their depths with the
# roll at each echo's arrival taken out. Bottom parameters are typical values for sand, not measurements.
name: popoto_elevation_rehearsal
sonar: popoto_long_range_3row_clocks
fidelity: image_source
sonar_overrides:
  receive: {window: {range: [850.0, 1150.0]}}
  transmit:
    waveform: {type: lfm, source: null, duration: 1.0e+0}   # D-256: the shipped sonar sends a 2 s hyperbolic sweep, blind inside 1.5 km; this rehearsal's targets are at about 1 km, so it keeps the former 1 s linear sweep (blind inside 0.75 km), stated here
environment:
  base: coastal_12c_sand
  sound_speed_m_s: 1490.0
  water_depth_m: 100.0
  wind_speed_m_s: 5.0
  shipping: 0.5
  absorption: ainslie_mccolm
  overrides:
    sound_speed_m_s: "1490 m/s is this rehearsal's point: a local sound speed that is NOT the nominal 1500 m/s the deployment file would assume, carried by the record; the base's 12 deg C / 35 PSU (1496.8 m/s) only feed absorption"
propagation:
  surface_z: 0.0
  max_order: 1
platform: {position: [0, 0, 30.0], rpy: [0.0698, 0.0175, 0], velocity: [1.5, 0, 0], rates: [0.0262, 0, 0]}
pings: {count: 3, interval: 4.0}
scene:
  - {type: points, label: deep, positions: [[150.0, 1000.0, 60.0]], target_strength_db: 10.0}
  - {type: points, label: shallow, positions: [[-250.0, 950.0, 8.0]], target_strength_db: 10.0}
receiver:
  adc: false
  ambient_noise: {model: wenz}        # wind and shipping: the environment's
seed: 13
