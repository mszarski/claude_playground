# Rehearsal of the stacked-row option as it would run on the vehicle: the two-row array sampled
# raw at 102.4 kHz on eight boards with their own clocks (offsets to 0.3 ms, drifts to 25 ppm),
# the vehicle rolled 4 degrees and pitched 1, under way at 1.5 m/s, in 100 m of water over
# sand; a target at 60 m depth and one near the surface, about 1 km off.
#   tools/sonar_live.py configs/deploy/popoto_elevation_rehearsal.yaml --scenario popoto_elevation_rehearsal
# The chain must synchronise the boards, find both targets, and report their depths with the
# roll taken out. Bottom parameters are typical values for sand, not measurements.
name: popoto_elevation_rehearsal
sonar: popoto_long_range_2row_clocks
fidelity: image_source
sonar_overrides:
  receive: {window: {range: [800.0, 1200.0]}}
environment: {sound_speed: 1500.0, temperature: 12.0, salinity: 35.0, water_depth: 100.0}
propagation:
  surface_z: 0.0
  bottom_z: 100.0
  max_order: 1
  bottom: {speed: 1650.0, density: 1.9, attenuation: 0.8}
platform: {position: [0, 0, 30.0], rpy: [0.0698, 0.0175, 0], velocity: [1.5, 0, 0]}
pings: {count: 4, interval: 4.0}
scene:
  - {type: points, label: deep, positions: [[150.0, 1000.0, 60.0]], target_strength_db: 10.0}
  - {type: points, label: shallow, positions: [[-250.0, 950.0, 8.0]], target_strength_db: 10.0}
absorption: ainslie_mccolm
receiver:
  adc: false
  ambient_noise: {wind_speed: 5.0, shipping: 0.5}
seed: 13
