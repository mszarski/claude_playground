# flank_patrol with a Doppler-resolving ping whose tone lies ABOVE the sweep's band (docs/tasks/DOPPLER.md, package D3):
# a 1 s Hann-tapered tone at 10.5 kHz, then the scene's own 6-10 kHz sweep (1 s, Tukey 0.05), back to back in one 2 s
# ping. flank_patrol_doppler (D2) has the tone at the band centre (8 kHz), where D2 measured the sweep's reverberation
# filling the tone's Doppler cells (the small vehicle's tone at 10.9 dB over its background); D2's control with the tone
# at 10.5 kHz gave 37.7 dB (DOPPLER.md "D2 done", ours). This file is that control as a scene, for D3's chain. Everything
# else is flank_patrol_doppler's (and so flank_patrol's): the same water, platform (still), targets, reverberation,
# noise and seed.
#
# UNCONFIRMED, waiting on the owner (docs/tasks/DOPPLER.md section 5): the owner has said the transmitter is a free
# design choice; a tone at 10.5 kHz from the same projector as the 6-10 kHz sweep (its response there, its peak power
# and duty for a 2 s ping) is an assumption of this file, as is the energy split (half each, as flank_patrol_doppler:
# the sweep has 3 dB LESS energy than in flank_patrol; the derived peak is set by the Hann tone).
# Like flank_patrol: needs GPUSONAR_BELLHOP; the reverberation has the platform's Doppler only (still here), no Doppler
# spread of the sea surface (docs/tasks/DOPPLER.md section 0 item 1).
name: flank_patrol_doppler_tone
sonar: flank_32
fidelity: eigenray
sonar_overrides:
  receive: {window: {range: [1800, 4200]}}
  transmit:
    waveform:
      type: sampled
      source: train
      f_start: 6.0e+3                     # the band the train occupies: the sweep's and the tone above it
      f_stop: 10.6e+3
      source_level_db_rms: null           # derived from source_energy_db (sonar.py): 201.1 dB, the train's peak
      source_energy_db: 199.86            # dB re 1 uPa^2 s at 1 m: flank_patrol's sweep, all of it
      segments:
        - {kind: cw, frequency: 10.5e+3, duration: 1.0, window_alpha: 1.0, energy_share: 0.5}
        - {kind: gap, duration: 0.0}
        - {kind: lfm, f_start: 6.0e+3, f_stop: 10.0e+3, duration: 1.0, window_alpha: 0.05, energy_share: 0.5}
environment: {base: coastal_12c_bellhop_sand, water_depth_m: 100.0, wind_speed_m_s: 5.0, absorption: ainslie_mccolm, water_depth_known: false}
propagation:
  max_range: 4500
  range_step: 20.0
  depth_step: 2.0
  max_arrivals: 32
  wind_speed: 0.0          # a flat surface for the eigenrays: see environment_overrides
platform: {position: [0, 0, 30.0], rpy: [0, 0, 0], velocity: [0, 0, 0]}
pings: {count: 6, interval: 12.0}
scene:
  - type: points
    label: submarine
    positions: [[-628.0, 2900.0, 60.0], [-620.0, 2900.0, 60.0], [-612.0, 2900.0, 60.0], [-604.0, 2900.0, 60.0],
                [-596.0, 2900.0, 60.0], [-588.0, 2900.0, 60.0], [-580.0, 2900.0, 60.0], [-572.0, 2900.0, 60.0]]
    target_strength_db: 7.0
    velocity: [3.0, 0.0, 0.0]
  - {type: points, label: small_vehicle, positions: [[900.0, 2000.0, 40.0]], target_strength_db: -3.0, velocity: [0.82, 1.82, 0.0]}
  - {type: points, label: wreck, positions: [[1500.0, 3270.0, 98.0]], target_strength_db: 12.0}
reverberation:
  - {mu_db: -27.0}
  - {model: chapman_harris}
receiver:
  adc: false
  ambient_noise: {level_db: 45.0}
seed: 17
environment_overrides:
  propagation.wind_speed: "the eigenrays reflect from a FLAT surface although the site has wind (surface reverberation and noise use it); as in flank_patrol"
