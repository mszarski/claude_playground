# Point-target grid for `sas_auv`: targets on a range x bearing fan about the boresight.
name: point_grid_sas_auv
sonar: sas_auv
fidelity: free_field
environment: {temperature_c: 12.0, salinity_psu: 35.0}
platform:
  position: [0, 0, 20.0]
  rpy: [0, 0, 0]
  velocity: [0, 0, 0]
pings: {count: 1, interval: 0.1}
scene:
  - type: polar_grid
    label: grid
    origin: [0, 0, 20.0]
    forward: [0.0, 0.9396926, 0.3420201]
    across: [1.0, 0.0, 0.0]
    ranges: [30, 60, 100, 140]
    bearings_deg: [-3, 0, 3]
    target_strength_db: 0.0
receiver: {noise_rms: 0.0, adc: true}
seed: 1
