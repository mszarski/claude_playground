# Flank array on patrol in 100 m of water: six pings 12 s apart. In the water: a
# submarine-like target (eight highlights along 56 m, about +16 dB in all) crossing at
# 3 m/s near 3 km, a small vehicle (-3 dB) opening at 2 m/s near 2.2 km, and a wreck on
# the seabed (+12 dB, not moving) at 3.6 km. Multipath from Bellhop (needs
# GPUSONAR_BELLHOP), bottom and sea-surface reverberation, ambient noise.
# Hundreds of eigenray pairs per highlight and a 1 s pulse: run with the CUDA backend.
# Limits: highlights are fixed-strength points (no aspect dependence), reverberation has
# no Doppler spread, and the platform does not move.
name: flank_patrol
sonar: flank_32
fidelity: eigenray
sonar_overrides:
  receive: {window: {range: [1800, 4200]}}
environment: {base: coastal_12c_bellhop_sand, water_depth_m: 100.0, wind_speed_m_s: 5.0, absorption: ainslie_mccolm, water_depth_known: false}
propagation:
  max_range: 4500
  range_step: 20.0
  depth_step: 2.0
  max_arrivals: 32
  wind_speed: 0.0          # a flat surface for the eigenrays: see environment_overrides
platform: {position: [0, 0, 30.0], rpy: [0, 0, 0], velocity: [0, 0, 0]}
pings: {count: 6, interval: 12.0}
scene:
  - type: points
    label: submarine
    positions: [[-628.0, 2900.0, 60.0], [-620.0, 2900.0, 60.0], [-612.0, 2900.0, 60.0], [-604.0, 2900.0, 60.0],
                [-596.0, 2900.0, 60.0], [-588.0, 2900.0, 60.0], [-580.0, 2900.0, 60.0], [-572.0, 2900.0, 60.0]]
    target_strength_db: 7.0
    velocity: [3.0, 0.0, 0.0]
  - {type: points, label: small_vehicle, positions: [[900.0, 2000.0, 40.0]], target_strength_db: -3.0, velocity: [0.82, 1.82, 0.0]}
  - {type: points, label: wreck, positions: [[1500.0, 3270.0, 98.0]], target_strength_db: 12.0}
reverberation:
  - {mu_db: -27.0}
  - {model: chapman_harris}
receiver:
  adc: false
  ambient_noise: {level_db: 45.0}
seed: 17
environment_overrides:
  propagation.wind_speed: "the eigenrays reflect from a FLAT surface although the site has wind (surface reverberation and noise use it); as before, so that the record does not change"
