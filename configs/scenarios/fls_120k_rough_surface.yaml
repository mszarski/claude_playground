# 120 kHz forward-looking sonar under a rough sea: 10 m/s of wind over an irregular wind sea
# 1.2 m in significant height (a Pierson-Moskowitz spectrum sampled at 30 wave trains with
# random phases, spread 25 degrees about the wind direction). Every train travels at its own
# deep-water speed, so the pattern of crests moves through the world (the longest, 83 m,
# at 11 m/s) and changes shape as it goes. The 20 degree vertical beam looks at the
# underside of the surface: wave faces turned towards the sonar return more, their backs
# less. In that clutter: a boat under way with keel, propeller and wake, a kayak-sized
# target and a mooring buoy. AUV at 20 m, 2 m/s; 60 m of water.
# The surface is modelled once, by the wave facets, so there is no statistical surface
# boundary under `reverberation` here (that would count it twice).
# Strengths are placeholders: the facets' Lambert strength (-8 dB about each facet) puts
# the mean backscatter near 7 degrees grazing at about the Chapman-Harris value for this
# wind (-23 dB; that formula was fitted below 6.4 kHz), and `isotropic_db` adds -30 dB per
# square metre that does not depend on tilt (small-scale roughness and bubbles), without
# which the backs of the waves are black (tools/rough_surface_bands.py).
# Limits: no breaking, no bubble plumes other than the boat's wake, no shadowing of one
# crest by another, no Doppler from the water's orbital motion; fewer facets than
# resolution cells; a finite patch (its edges show); direct paths only. The same scene at
# 330 kHz showed no surface at all: one cell of it is below that sonar's noise floor at
# 250 m (docs/SCENARIOS.md).
name: fls_120k_rough_surface
sonar: fls_120k
fidelity: free_field
sonar_overrides:
  receive: {kind: baseband, sample_rate: 40000.0, window: {range: [20.0, 300.0]}}
environment: {base: coastal_12c, water_depth_m: 60.0, wind_speed_m_s: 10.0, shipping: 0.5, absorption: francois_garrison}
platform:
  position: [0, 0, 20.0]
  rpy: [0, 0, 0]
  velocity: [2.0, 0, 0]
pings: {count: 8, interval: 0.5}
scene:
  - {type: boat, label: boat_under_way, origin: [235.0, -45.0, 0.0], length: 10.0, beam: 3.2, draft: 0.6, keel_depth: 1.2,
     heading_deg: 80.0, velocity: [0.87, 4.92, 0.0], count: 500, wake: {length: 60.0, count: 400, strength_db_per_m: -20.0}}
  - {type: points, label: kayak, positions: [[205.0, 35.0, 0.3], [206.5, 35.0, 0.3], [208.0, 35.0, 0.3]], target_strength_db: -22.0,
     velocity: [-1.2, 0.5, 0.0]}
  - {type: sphere, label: mooring_buoy, centre: [255.0, 60.0, 1.5], radius: 0.6, density: 60.0, mu_db: -8.0}
  - {type: sea_surface, label: waves, x_range: [45.0, 297.0], y_range: [-150.0, 150.0], density: 0.5, mu_db: -8.0, isotropic_db: -30.0,
     velocity: [0.3, 0.2, 0.0],
     spectrum: {wind_speed: 10.0, significant_height: 1.2, direction_deg: 15.0, spread_deg: 25.0, components: 30}}
reverberation:
  - {mu_db: -27.0}
synthesis: {beam_floor_db: -45.0}
receiver:
  adc: false
  ambient_noise: {model: wenz}        # wind and shipping: the environment's
seed: 62
