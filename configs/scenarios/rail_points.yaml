# Rail SAS: the P4-2v probe looking sideways, stepped along a motorised rail.
name: rail_points
sonar: sas_rail
fidelity: free_field
sonar_overrides:
  receive: {window: {range: [1.9, 2.1]}}
environment: {base: pool_20c_fresh, absorption: none}
platform:
  position: [0, 0, -0.684]         # the boresight (20 degrees down) meets z = 0 at 1.88 m ground range
  rpy: [0, 0, 0]
  velocity: [0.02, 0, 0]           # with the interval below: 2 mm per ping
  stop_and_go: true
pings: {count: 151, interval: 0.1}
scene:
  - type: points
    label: targets
    positions: [[0.15, 1.88, 0.0], [0.13, 1.84, 0.0]]
    target_strength_db: 0.0
receiver: {noise_rms: 0.0, adc: false}
seed: 1
