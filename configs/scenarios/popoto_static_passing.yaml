# A target passing the three-row static array: 400 m off the beam at 20 m depth, crossing at 3 m/s,
# eight pings 4 s apart, 30 m of water over sand (image-source multipath). The frame does not move, so
# everything the tracker sees moving is the target; the report must hold one mover with the target's
# speed and depth. Chain: configs/deploy/popoto_static_3row.yaml (without sync: these pings are at baseband).
# Depths and bottom values are placeholders for a trial site that is not chosen.
name: popoto_static_passing
sonar: popoto_static_3row
fidelity: image_source
sonar_overrides:
  receive: {kind: baseband, sample_rate: 8.0e3, window: {range: [250.0, 600.0]}}
environment: {base: coastal_12c_sand, water_depth_m: 30.0, wind_speed_m_s: 5.0, shipping: 0.5, absorption: ainslie_mccolm}
propagation:
  surface_z: 0.0
  max_order: 1
platform: {position: [0, 0, 10.0], rpy: [0, 0, 0], velocity: [0, 0, 0]}
pings: {count: 8, interval: 4.0}
scene:
  - {type: points, label: mover, positions: [[-40.0, 400.0, 20.0]], target_strength_db: 10.0, velocity: [3.0, 0.0, 0.0]}
receiver:
  adc: false
  ambient_noise: {model: wenz}        # wind and shipping: the environment's
seed: 26
