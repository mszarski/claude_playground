# MINSAS-class SAS over a seabed with developed speckle: 5000 scatterers per square metre,
# 2.6 in every 2.0 cm x 2.6 cm resolution cell, so the floor is continuous texture rather
# than separate points on black. A 13 m x 6 m strip at 50 m, with a calibration cube, five
# rocks, a short pipe and a cable across the track. It answers one question the sparse
# scenes could not: are the along-track ambiguity copies (10.3 m from each object, -47 dB on
# a point) covered by the seabed's own return? One leg, 12 m altitude, 0.544 m per ping.
# Limits: the strip is small because every scatterer is synthesised (390,000 of them);
# exact navigation; Lambert facets, no glints; no noise.
name: sas_minsas_speckle
sonar: sas_minsas120
fidelity: free_field
sonar_overrides:
  receive: {kind: baseband, sample_rate: 60.0e3, window: {range: [44.0, 60.0]}}
  transmit: {waveform: {duration: 2.5e-3}}
environment: {sound_speed: 1500.0, temperature: 10.0, salinity: 35.0}
platform:
  speed: 2.176                   # 0.544 m per ping: half the 1.088 m array
  legs:
    - {start: [-5.0, 0.0, -12.0], heading_deg: 0.0, pings: 44}
pings: {interval: 0.25}
scene:
  - {type: seafloor, label: seabed, x_range: [0.0, 13.0], y_range: [47.0, 53.0], density: 5000.0, lambert_mu_db: -27.0}
  - {type: box, label: calibration_cube, min: [1.5, 49.5, -0.5], max: [2.0, 50.0, 0.0], density: 6000.0, mu_db: -8.0}
  - {type: cable, label: cable, radius: 0.04, density: 6000.0, mu_db: -10.0,
     waypoints: [[0.6, 47.2, -0.04], [1.2, 49.0, -0.04], [0.8, 51.0, -0.04], [1.4, 52.8, -0.04]]}
  - {type: rocks, label: rocks, x_range: [4.5, 9.0], y_range: [48.0, 52.0], count: 5, radius_range: [0.2, 0.5], density: 5000.0, mu_db: -15.0}
  - {type: cylinder, label: pipe, start: [9.2, 47.5, -0.15], end: [10.3, 48.6, -0.15], radius: 0.15, density: 5000.0, mu_db: -10.0}
synthesis: {beam_floor_db: -40.0}
absorption: francois_garrison
receiver: {noise_rms: 0.0, adc: false}
seed: 73
