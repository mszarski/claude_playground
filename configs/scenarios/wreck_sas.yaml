# Stripmap SAS past a wreck (a 3 m box on the seafloor) with large unknown motion: sway
# and heave of several wavelengths that navigation does not report, which is the input
# motion estimation is for. Frame: seafloor at z = 0, sonar at 15 m altitude.
# About 3000 scatterers and 90 pings: slow on a CPU; run it with the CUDA backend.
name: wreck_sas
sonar: sas_auv
fidelity: free_field
sonar_overrides:
  receive: {window: {range: [38.0, 52.0]}}
environment: {sound_speed: 1500.0, temperature: 12.0, salinity: 35.0}
platform:
  position: [0, 0, -15.0]
  rpy: [0, 0, 0]
  velocity: [1.6, 0, 0]            # 0.32 m per ping
  motion: {sway_rms: 0.03, heave_rms: 0.02, correlation_pings: 8.0, nav_knows_disturbance: false}
pings: {count: 90, interval: 0.2}
scene:
  - {type: seafloor, label: seafloor, x_range: [11.0, 18.0], y_range: [39.0, 45.0], density: 30.0, lambert_mu_db: -27.0}
  - {type: box, label: wreck, min: [13.0, 41.0, -1.0], max: [16.0, 42.0, 0.0], density: 120.0, mu_db: -15.0}
absorption: none
receiver: {noise_rms: 0.0, adc: false}
seed: 5
