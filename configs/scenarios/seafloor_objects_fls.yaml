# Forward-looking sonar over a flat seafloor with objects: a sphere, a box and scattered
# rocks. Each object returns sound from the faces turned to the sonar and casts an
# acoustic shadow on the floor behind it. Frame: the seafloor is z = 0, the sonar is 1 m
# above it (z = -1, z is down).
name: seafloor_objects_fls
sonar: fls_300k
fidelity: free_field
sonar_overrides:
  receive: {kind: baseband, sample_rate: 150.0e+3, window: {range: [3.0, 10.5]}, tvg: null}
environment: {base: coastal_12c, absorption: none}
platform:
  position: [0, 0, -1.0]
  rpy: [0, 0, 0]
  velocity: [0, 0, 0]
pings: {count: 1, interval: 0.5}
scene:
  - {type: seafloor, label: seafloor, x_range: [3.5, 10.0], y_range: [-2.5, 2.5], density: 250.0, lambert_mu_db: -27.0}
  - {type: sphere, label: sphere, centre: [5.0, 0.0, -0.3], radius: 0.3, density: 3000.0, mu_db: -15.0}
  - {type: box, label: box, min: [6.0, 1.0, -0.4], max: [6.6, 1.8, 0.0], density: 2000.0, mu_db: -15.0}
  - {type: rocks, label: rocks, x_range: [4.0, 8.0], y_range: [-2.2, -0.8], count: 6, radius_range: [0.08, 0.2], density: 3000.0, mu_db: -15.0}
receiver: {noise_rms: 0.0, adc: false}
seed: 3
