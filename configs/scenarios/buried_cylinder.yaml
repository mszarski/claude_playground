# 3D near-field imaging of a buried object (ASASIN Sec. III-B): a cylinder 0.5 m long,
# 0.3 m below a flat sediment interface, surveyed by a downward-looking sonar rastered
# over a 1.8 m square 1.5 m above the bed. Sound refracts at the interface (1500 m/s in
# water, 1700 m/s in sediment). Image it with recon.image_volume(..., interface_z=0.0,
# sediment_speed=1700.0).
name: buried_cylinder
sonar: subbottom
fidelity: sediment
propagation: {sediment_speed: 1700.0, interface_z: 0.0}
environment: {sound_speed: 1500.0}
platform:
  position: [0, 0, -1.5]
  rpy: [0, 0, 0]
  velocity: [0, 0, 0]
  raster: {x: [-0.9, 0.9001, 0.075], y: [-0.9, 0.9001, 0.075]}
pings: {count: 1, interval: 0.05}
scene:
  - {type: wire, label: cylinder, start: [-0.25, 0.0, 0.3], end: [0.25, 0.0, 0.3], spacing: 0.02}
absorption: none
receiver: {noise_rms: 0.0, adc: false}
seed: 1
