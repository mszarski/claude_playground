# Stage 2 trial: the two-row static array (rows 1.5 m apart) against a target 2.6 km away, 30 m below it.
#   tools/sonar_live.py configs/deploy/popoto_static_2row.yaml --scenario popoto_static_trial_2row --out DIR
# Raw 102.4 kHz samples, every board on its own clock (the chain must synchronise them), the frame
# hanging still at 30 m and tilted 2 degrees (a known tilt: the record carries it), 100 m of water over
# sand (image-source multipath; no `max_order` is stated, so bounces are kept by the simulator's energy
# rule: twelve here, with the cap raised to 16 so the series is not cut, D-142).
# Why this far and this deep: two rows 1.5 m apart repeat every 11.5 degrees, so they give ONE elevation only
# where water depth and range confine every arrival to within 5.7 degrees of level
# (chain.elevation.sector_from_depth): in 100 m of water with one bounce, beyond 2.4 km. In 30 m of water that
# is beyond 0.7 km, where the direct, surface and bottom echoes are less than a range cell apart and cannot be
# told apart at all. Closer in, two rows give candidates (the three-row trial shows the short range).
# THAT HOLDS FOR ONE BOUNCE. With the bounces the energy rule keeps, later arrivals come from steeper angles and
# the detection is about 100 m long. At eight bounces the two rows gave candidates (+3.7 and -4.4 degrees for a
# direct path from -0.66). At twelve (D-142) they give one elevation, -3.42 degrees, read as a sea-bed bounce and
# folded to 13 to 14 m for the target at 60 m, with a depth sigma of 123 m: the direct path is not claimed and the
# sigma says how little the depth means (tests/python/test_elevation.py). This trial does not show two rows
# measuring depth here; it shows them saying they cannot.
# The pulse is 1 s here (0.1 s in the sonar file) for the signal at this range.
# Depths and bottom values are placeholders for a trial site that is not chosen.
name: popoto_static_trial_2row
sonar: popoto_static_2row_clocks
fidelity: image_source
sonar_overrides:
  transmit: {waveform: {duration: 1.0}}
  receive: {window: {range: [2450, 2750]}}
environment: {base: coastal_12c_sand, water_depth_m: 100.0, wind_speed_m_s: 5.0, shipping: 0.5, absorption: ainslie_mccolm}
propagation:
  surface_z: 0.0
  max_order_cap: 16   # at the default 8 the series was cut with the next order 5 dB down (D-142)
platform: {position: [0, 0, 30.0], rpy: [0.0349, 0.0, 0], velocity: [0, 0, 0]}   # still; tilted 2 deg
pings: {count: 4, interval: 5.0}
scene:
  - {type: points, label: target, positions: [[300.0, 2583.0, 60.0]], target_strength_db: 15.0}
receiver:
  adc: false
  ambient_noise: {model: wenz}        # wind and shipping: the environment's
seed: 22
