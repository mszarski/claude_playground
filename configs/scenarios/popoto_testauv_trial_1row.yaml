# Stage 1 trial: the one-row prototype on the test AUV against a target at 500 m.
#   tools/sonar_live.py configs/deploy/popoto_testauv_1row.yaml --scenario popoto_testauv_trial_1row --out DIR
# Raw 102.4 kHz samples, every board on its own clock (the chain must synchronise them), the
# vehicle rolled and pitched and still rolling during the ping (the record carries the attitude
# samples navigation would send), 30 m of water over sand (image-source multipath, bounces kept by
# the simulator's energy rule: no `max_order` is stated, nine here, with the cap raised to 16 so the
# series is not cut, D-142), a target at
# 500 m as in the Popoto trial scenarios (popoto_trial_*). Depths and bottom values are
# placeholders for a trial site that is not chosen.
name: popoto_testauv_trial_1row
sonar: popoto_testauv_1row_clocks
fidelity: image_source
sonar_overrides:
  receive: {window: {range: [150, 900]}}
environment: {base: coastal_12c_sand, water_depth_m: 30.0, wind_speed_m_s: 5.0, shipping: 0.5, absorption: ainslie_mccolm}
propagation:
  surface_z: 0.0
  max_order_cap: 16   # at the default 8 the series was cut with the next order 18 dB down (D-142)
platform: {position: [0, 0, 10.0], rpy: [0.0524, 0.0175, 0], velocity: [1.0, 0, 0], rates: [0.0349, 0, 0]}   # rolled 3 deg, rolling 2 deg/s
pings: {count: 4, interval: 3.0}
scene:
  - {type: points, label: target, positions: [[120.0, 485.0, 15.0]], target_strength_db: 10.0}
receiver:
  adc: false
  ambient_noise: {model: wenz}        # wind and shipping: the environment's
seed: 21
