# 120 kHz forward-looking sonar over a cluttered seabed: AUV at 20 m in 40 m of water, so
# the seabed lies inside the 20 degree vertical beam from about 115 m. On the bed: sand
# texture, boulders, dumped debris and a pipeline. On the surface: a cruising boat with a
# keel, a propeller and a bubble wake crossing ahead, and a second boat at anchor.
# Ownship makes 2 m/s; seabed and surface are fixed in the world.
# Limits: direct paths only to the objects (no surface or bottom bounce), the sand patch has
# far fewer scatterers than resolution cells, and the wake is a fixed cloud laid down at
# the start (it does not grow as the boat moves on).
name: fls_120k_cluttered_seabed
sonar: fls_120k
fidelity: free_field
sonar_overrides:
  receive: {kind: baseband, sample_rate: 40000.0, window: {range: [20.0, 300.0]}}
environment: {sound_speed: 1500.0, temperature: 12.0, salinity: 35.0, water_depth: 40.0}
platform:
  position: [0, 0, 20.0]
  rpy: [0, 0, 0]
  velocity: [2.0, 0, 0]
pings: {count: 8, interval: 0.5}
scene:
  - {type: boat, label: boat_under_way, origin: [215.0, 55.0, 0.0], length: 11.0, beam: 3.4, draft: 0.7, keel_depth: 1.3,
     heading_deg: -70.0, velocity: [1.71, -4.70, 0.0], count: 500, wake: {length: 70.0, count: 400, strength_db_per_m: -22.0}}
  - {type: boat, label: boat_at_anchor, origin: [265.0, -70.0, 0.0], length: 8.0, beam: 2.8, draft: 0.6, keel_depth: 1.0,
     heading_deg: 20.0, count: 400}
  - {type: seafloor, label: sand, x_range: [120.0, 295.0], y_range: [-85.0, 85.0], depth: 40.0, density: 0.12, lambert_mu_db: -27.0}
  - {type: rocks, label: boulders, x_range: [140.0, 285.0], y_range: [-75.0, 75.0], depth: 40.0, count: 22, radius_range: [0.5, 1.6],
     density: 3.0, mu_db: -12.0}
  - {type: debris, label: debris, x_range: [150.0, 240.0], y_range: [-40.0, 10.0], depth: 40.0, count: 12, size_range: [0.6, 2.0],
     density: 6.0, mu_db: -10.0}
  - {type: cable, label: pipeline, radius: 0.3, density: 3.0, mu_db: -10.0,
     waypoints: [[150.0, -78.0, 39.7], [190.0, -30.0, 39.7], [230.0, 5.0, 39.7], [262.0, 60.0, 39.7]]}
reverberation:
  - {boundary_z: 40.0, mu_db: -27.0}
  - {boundary_z: 0.0, model: chapman_harris, wind_speed: 5.0}
synthesis: {beam_floor_db: -45.0}
absorption: francois_garrison
receiver:
  adc: false
  ambient_noise: {wind_speed: 5.0, shipping: 0.5}
seed: 61
