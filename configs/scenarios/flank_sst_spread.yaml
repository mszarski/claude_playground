# flank_sst_shallow's channel with the options beyond SST's time spreading switched on
# (sim/timespread.py): the tail of each surface-bounce path arrives from a spread of
# directions (angle_spread), varies during the 1 s pulse (doppler), has the decay time and
# shape of Gaussian facets (decay_time: facet), and paths with two rough bounces get the
# convolution of the two tails (multi_bounce: convolve).
# Few taps and lines: every bounce ray becomes 1 + taps x doppler_lines rays each way.
# The sediment numbers are PLACEHOLDERS (bottom.PLACEHOLDER_SAND) and the bubble loss is
# illustrative: none is a measurement. Frame: z = 0 is the sea surface.
name: flank_sst_spread
sonar: flank_32
fidelity: image_source
sonar_overrides:
  receive: {window: {range: [700, 1300]}}
environment: {base: coastal_12c_sand, water_depth_m: 100.0, wind_speed_m_s: 6.0, shipping: 0.5, absorption: ainslie_mccolm, water_depth_known: false}
propagation:
  surface_z: 0.0
  max_order: 2
time_spread:
  surface: {bubble_loss_db: 0.5}     # unconfirmed: bubble loss per bounce
  taps: 3
  angle_spread: true
  decay_time: facet
  doppler: true
  doppler_spectrum: gaussian
  doppler_lines: 3
  multi_bounce: convolve
platform: {position: [0, 0, 30.0], rpy: [0, 0, 0], velocity: [0, 0, 0]}
pings: {count: 4, interval: 15.0}
scene:
  - {type: points, label: target, positions: [[0.0, 1000.0, 50.0]], target_strength_db: 10.0}
reverberation:
  - {model: fluid_sediment, rho: 1.9, nu: 1.1, delta: 0.0147, w2: 2.0e-5, gamma2: 3.25, sigma2: 0.002}   # unconfirmed
  - {model: chapman_harris}
receiver:
  adc: false
  ambient_noise: {model: wenz}        # wind and shipping: the environment's
seed: 7
