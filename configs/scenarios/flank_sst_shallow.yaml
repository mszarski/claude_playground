# The SST-style channel in one scenario: a target at 1 km in 100 m of isovelocity water seen
# by the 32-hydrophone flank array, with
#   - bounce paths time-spread by a wind-roughened surface (sim/timespread.py),
#   - bottom reverberation from a rough fluid sediment (sim/bottom.py) instead of Lambert's law,
#   - surface reverberation (Chapman-Harris) and a volume-scattering layer (SST's sheet).
# The sediment numbers are PLACEHOLDERS (bottom.PLACEHOLDER_SAND), the volume strength and the
# bubble loss are illustrative: none is a measurement. Frame: z = 0 is the sea surface.
name: flank_sst_shallow
sonar: flank_32
fidelity: image_source
sonar_overrides:
  receive: {window: {range: [700, 1300]}}
environment: {sound_speed: 1500.0, temperature: 12.0, salinity: 35.0}
propagation:
  surface_z: 0.0
  bottom_z: 100.0
  max_order: 2
  bottom: {speed: 1650.0, density: 1.9, attenuation: 0.8}
time_spread:
  surface: {wind_speed: 6.0, bubble_loss_db: 0.5}     # unconfirmed: bubble loss per bounce
  taps: 4
platform: {position: [0, 0, 30.0], rpy: [0, 0, 0], velocity: [0, 0, 0]}
pings: {count: 4, interval: 15.0}
scene:
  - {type: points, label: target, positions: [[0.0, 1000.0, 50.0]], target_strength_db: 10.0}
reverberation:
  - {model: fluid_sediment, boundary_z: 100.0, rho: 1.9, nu: 1.1, delta: 0.0147, w2: 2.0e-5, gamma2: 3.25, sigma2: 0.002}   # unconfirmed
  - {boundary_z: 0.0, model: chapman_harris, wind_speed: 6.0}
  - {model: volume, layer: [20.0, 40.0], sv_db: -80.0}                                                                      # unconfirmed
absorption: ainslie_mccolm
receiver:
  adc: false
  ambient_noise: {wind_speed: 6.0, shipping: 0.5}
seed: 7
