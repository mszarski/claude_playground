# The SST-style channel in one scenario: a target at 1 km in 100 m of isovelocity water seen
# by the 32-hydrophone flank array, with
#   - bounce paths time-spread by a wind-roughened surface (sim/timespread.py),
#   - bottom reverberation from a rough fluid sediment (sim/bottom.py) instead of Lambert's law,
#   - surface reverberation (Chapman-Harris) and a volume-scattering layer (SST's sheet).
# The sediment numbers are PLACEHOLDERS (bottom.PLACEHOLDER_SAND), the volume strength and the
# bubble loss are illustrative: none is a measurement. Frame: z = 0 is the sea surface.
# The surface's slope for time spreading is the long-wave slope from the 6 m/s wind, Dahl 1996
# eq. (A7): 0.0199, the default since docs/references/CONFORMANCE.md A4 (it was the Cox-Munk total,
# 0.0337: `time_spread.surface.slope_law: cox_munk_total`). The surface-bounce tail to the target
# is 0.59 times as long as before. Chapman-Harris at 6-10 kHz is just above its 0.4-6.4 kHz.
name: flank_sst_shallow
sonar: flank_32
fidelity: image_source
sonar_overrides:
  receive: {window: {range: [700, 1300]}}
environment: {base: coastal_12c_sand, water_depth_m: 100.0, wind_speed_m_s: 6.0, shipping: 0.5, absorption: ainslie_mccolm, water_depth_known: false}
propagation:
  surface_z: 0.0
  max_order: 2
time_spread:
  surface: {bubble_loss_db: 0.5}     # unconfirmed: bubble loss per bounce
  taps: 4
platform: {position: [0, 0, 30.0], rpy: [0, 0, 0], velocity: [0, 0, 0]}
pings: {count: 4, interval: 15.0}
scene:
  - {type: points, label: target, positions: [[0.0, 1000.0, 50.0]], target_strength_db: 10.0}
reverberation:
  - {model: fluid_sediment, rho: 1.9, nu: 1.1, delta: 0.0147, w2: 2.0e-5, gamma2: 3.25, sigma2: 0.002}   # unconfirmed
  - {model: chapman_harris}
  - {model: volume, layer: [20.0, 40.0], sv_db: -80.0}                                                                      # unconfirmed
receiver:
  adc: false
  ambient_noise: {model: wenz}        # wind and shipping: the environment's
seed: 7
