# ILLUSTRATIVE. The `eigenray` twin (Bellhop 2-D, GPUSONAR_BELLHOP) of `flank_level_3d` and `flank_bank_3d`: the same
# sonar, three targets at 5 km, noise and seed over a level 100 m bed. It is the exact reference of `flank_level_3d`
# (no relief: the tiers must agree within 0.2 dB, D-197) and the exact N x 2-D reference of `flank_bank_3d`'s
# broadside target (that bearing runs along a depth contour of the bank).
name: flank_level_nx2d
sonar: flank_32
fidelity: eigenray
sonar_overrides:
  receive: {window: {range: [4600, 5400]}}
environment: {base: coastal_12c_bellhop_sand, water_depth_m: 100.0, absorption: ainslie_mccolm, water_depth_known: false}
propagation:
  range_step: 25.0
  depth_step: 4.0
platform: {position: [0, 0, 30.0], rpy: [0, 0, 0], velocity: [0, 0, 0]}
pings: {count: 1, interval: 15.0}
scene:
  - {type: points, label: north, positions: [[1039.6, 4890.7, 50.0]], target_strength_db: 10.0}
  - {type: points, label: broadside, positions: [[0.0, 5000.0, 50.0]], target_strength_db: 10.0}
  - {type: points, label: south, positions: [[-1039.6, 4890.7, 50.0]], target_strength_db: 10.0}
receiver:
  adc: false
  ambient_noise: {level_db: 45.0}
seed: 1
