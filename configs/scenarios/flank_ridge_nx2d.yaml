# ILLUSTRATIVE. The N x 2-D twin of `flank_ridge_3d` at the `eigenray` tier (Bellhop 2-D, GPUSONAR_BELLHOP): the same
# sonar, target, noise and seed over the oblique sill's depth profile along broadside (90 degrees from the sonar;
# sim/bathymetry.py `profile_along`, 50 m steps over the sill, written as Bellhop's piecewise-linear bed).
