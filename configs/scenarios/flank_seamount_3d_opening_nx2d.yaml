# ILLUSTRATIVE. The N x 2-D twin of `flank_seamount_3d_opening`: the same sonar, target track, pings, noise and seed
# at the `eigenray` tier (Bellhop 2-D), over the seamount's depth profile along the target's bearing (94 degrees from
# the sonar; sim/bathymetry.py `profile_along`, 100 m steps, written as Bellhop's piecewise-linear bed). On that
# bearing this is exactly what an N x 2-D run sees; the difference from the 3-D scenario is the bed's horizontal
# refraction (plus the 2-D tier's own arrivals over a piecewise-linear bed: docs/tasks/PROPAGATION_3D.md section 2).
# Needs Bellhop (GPUSONAR_BELLHOP).
