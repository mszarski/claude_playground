# Deep water, 1000 m, silt: a thermocline over cold deep water; the bottom is far away.
# Popoto long-range array (32 hydrophones, 4-6 kHz, 197 dB) under way at 1.5 m/s; a
# ship-sized mover (+25 dB) at 10 km crossing at 6 m/s. Bellhop multipath (needs
# GPUSONAR_BELLHOP), bottom and surface reverberation, ambient noise. Six pings.
# Ownship at 50 m; paths to a surface target are refracted down and return by way of the bottom.
# Bottom parameters are typical textbook values for the sediment type, not measurements;
# the Lambert strength for it is a placeholder.
name: popoto_env_deep_silt_1000m
sonar: popoto_long_range
fidelity: eigenray
sonar_overrides:
  receive: {kind: baseband, sample_rate: 8.0e3, window: {range: [9300.0, 10700.0]}}
environment: {sound_speed: 1510.0, temperature: 12.0, salinity: 35.0}
propagation:
  environment: {depth: 1000.0, ssp_depth: [0.0, 50.0, 200.0, 600.0, 1000.0], ssp_speed: [1510.0, 1509.0, 1492.0, 1486.0, 1492.0], bottom_speed: 1575.0, bottom_density: 1.7, bottom_attenuation: 1.0}
  frequency: 5000.0
  max_range: 11200.0
  range_step: 40.0
  depth_step: 20.0
  max_arrivals: 40
platform: {position: [0, 0, 50.0], rpy: [0, 0, 0], velocity: [1.5, 0, 0]}
pings: {count: 6, interval: 17.3}
scene:
  - type: points
    label: ship
    positions: [[740.0, 10000.0, 4.0], [770.0, 10000.0, 4.0], [800.0, 10000.0, 4.0], [830.0, 10000.0, 4.0], [860.0, 10000.0, 4.0]]
    target_strength_db: 18.0
    velocity: [-6.0, 0.0, 0.0]
reverberation:
  - {boundary_z: 1000.0, mu_db: -30.0}
  - {boundary_z: 0.0, model: chapman_harris, wind_speed: 5.0}
absorption: ainslie_mccolm
receiver:
  adc: false
  ambient_noise: {wind_speed: 5.0, shipping: 0.5}
seed: 51
