# Very shallow, 30 m, gravel: a hard, reflective bottom and many bounces.
# Popoto long-range array (32 hydrophones, 4-6 kHz, 197 dB) under way at 1.5 m/s; a
# ship-sized mover (+25 dB) at 3 km crossing at 6 m/s. Bellhop multipath (needs
# GPUSONAR_BELLHOP), bottom and surface reverberation, ambient noise. Six pings.
# Isovelocity; strong bottom reverberation.
# Bottom parameters are typical textbook values for the sediment type, not measurements;
# the Lambert strength for it is a placeholder.
name: popoto_env_gravel_30m
sonar: popoto_long_range
fidelity: eigenray
sonar_overrides:
  receive: {kind: baseband, sample_rate: 8.0e3, window: {range: [2300.0, 3700.0]}}
environment: {sound_speed: 1500.0, temperature: 12.0, salinity: 35.0}
propagation:
  environment: {depth: 30.0, ssp_depth: [0.0, 30.0], ssp_speed: [1500.0, 1500.0], bottom_speed: 1800.0, bottom_density: 2.0, bottom_attenuation: 0.6}
  frequency: 5000.0
  max_range: 4200.0
  range_step: 40.0
  depth_step: 1.0
  max_arrivals: 40
platform: {position: [0, 0, 8.0], rpy: [0, 0, 0], velocity: [1.5, 0, 0]}
pings: {count: 6, interval: 7.9}
scene:
  - type: points
    label: ship
    positions: [[740.0, 3000.0, 3.0], [770.0, 3000.0, 3.0], [800.0, 3000.0, 3.0], [830.0, 3000.0, 3.0], [860.0, 3000.0, 3.0]]
    target_strength_db: 18.0
    velocity: [-6.0, 0.0, 0.0]
reverberation:
  - {boundary_z: 30.0, mu_db: -20.0}
  - {boundary_z: 0.0, model: chapman_harris, wind_speed: 5.0}
absorption: ainslie_mccolm
receiver:
  adc: false
  ambient_noise: {wind_speed: 5.0, shipping: 0.5}
seed: 51
