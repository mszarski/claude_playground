# Stage 3 trial: the three-row static array against a target at 150 m, 8 m below it.
#   tools/sonar_live.py configs/deploy/popoto_static_3row.yaml --scenario popoto_static_trial_3row --out DIR
# Raw 102.4 kHz samples, twelve boards on their own clocks (the chain must synchronise them), the frame
# hanging still at 10 m and tilted 2 degrees, 30 m of water over sand (image-source multipath). The third
# row makes the elevation one answer at this short range, where two rows give candidates.
# Why 150 m: here the surface and bottom echoes arrive 2.4 m and 3.2 m behind the direct one and the chain
# takes the first. With the same target depth at 300 m they are 1.1 to 1.5 m behind, inside the pulse's range
# sidelobes, and the reported depth is pulled 5 m towards the bottom echo (measured; see docs/DESIGN.md).
# Depths and bottom values are placeholders for a trial site that is not chosen.
name: popoto_static_trial_3row
sonar: popoto_static_3row_clocks
fidelity: image_source
sonar_overrides:
  receive: {window: {range: [90, 400]}}
environment: {sound_speed: 1500.0, temperature: 12.0, salinity: 35.0, water_depth: 30.0}
propagation:
  surface_z: 0.0
  bottom_z: 30.0
  max_order: 1
  bottom: {speed: 1650.0, density: 1.9, attenuation: 0.8}
platform: {position: [0, 0, 10.0], rpy: [0.0349, 0.0, 0], velocity: [0, 0, 0]}   # still; tilted 2 deg
pings: {count: 4, interval: 3.0}
scene:
  - {type: points, label: target, positions: [[30.0, 147.0, 18.0]], target_strength_db: 10.0}
absorption: ainslie_mccolm
receiver:
  adc: false
  ambient_noise: {wind_speed: 5.0, shipping: 0.5}
seed: 24
