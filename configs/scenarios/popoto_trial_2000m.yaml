# Popoto PMM6081 trial: 8 hydrophones (dense layout), 190 dB source, +10 dB target at
# 2000 m, shallow water, at the eigenray tier (Bellhop; needs GPUSONAR_BELLHOP).
name: popoto_trial_2000m
sonar: popoto_8
fidelity: eigenray
sonar_overrides:
  receive: {window: {range: [1750, 2250]}}
environment: {sound_speed: 1500.0, temperature: 12.0, salinity: 35.0}
propagation:
  environment: {depth: 30.0, sound_speed: 1500.0, bottom_speed: 1600.0, bottom_density: 1.8, bottom_attenuation: 0.5}
  frequency: 27500.0
  max_range: 2300
  range_step: 10.0
  depth_step: 1.0
  max_arrivals: 8
platform: {position: [0, 0, 5.0], rpy: [0, 0, 0], velocity: [0, 0, 0]}
pings: {count: 1, interval: 5.0}
scene:
  - {type: points, label: target, positions: [[0.0, 2000.0, 15.0]], target_strength_db: 10.0}
absorption: ainslie_mccolm
receiver:
  adc: false
  ambient_noise: {level_db: 38.0}     # reproduces the plan's Phase 0 estimate
seed: 1
