# Rail SAS of a smooth rigid cylinder (a 10 cm rod, 2 cm across) lying parallel to the rail:
# a specular target (sim/targets.py), not a Lambert surface. Each ping sees one glint, at the
# foot of the perpendicular from the sonar onto the rod, on the side facing the sonar; as the
# sonar steps along the rail the glint steps along the rod, and the image shows the line.
# Turn the rod (heading_deg) by more than the rail subtends and it never presents its side:
# only the weak returns of its ends remain. k a = 115 at 2.72 MHz.
# `resolved: true` is needed: the rod is in its own near field (L^2 / lambda = 18 m).
name: rail_cylinder_glint
sonar: sas_rail
fidelity: free_field
sonar_overrides:
  receive: {window: {range: [1.9, 2.1]}}
environment: {base: tank_20c_1480, absorption: none}
platform:
  position: [0, 0, -0.684]
  rpy: [0, 0, 0]
  velocity: [0.02, 0, 0]           # with the interval below: 2 mm per ping
  stop_and_go: true
pings: {count: 151, interval: 0.1}
scene:
  - type: target
    label: rod
    origin: [0.15, 1.88, -0.01]
    heading_deg: 0.0
    shapes:
      - {shape: cylinder, start: [-0.05, 0, 0], end: [0.05, 0, 0], radius: 0.01, resolved: true, spacing: 0.00025}
receiver: {noise_rms: 0.0, adc: false}
seed: 1
