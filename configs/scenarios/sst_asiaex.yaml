# The forward-scatter example of SST's time-spreading section (APL-UW TR 0702, Sec. 12.2-12.6,
# Figs. 3-5): Run/Set 22 of the ASIAEX experiment as SST simulated it. As printed there:
# a 3 ms pulse at 8 kHz, a receiver "about 500 m" from the transmitter, shallow water, low
# wind ("quoted as 4 m/s, but 3 m/s fits the tail better"), sets of 20 pings, the eigenrays
# direct, surface, bottom, surface-bottom and bottom-surface, a time axis of 0 to 35 ms after
# the first arrival, and for the bottom
#     bottom = FineSand { rmsHeight = 0.012; meanSquareSlope = 0.045 }   ("fit to the data by eye").
#
# NOT given in TR 0702, and chosen here (every block under `unconfirmed`): the water depth, the
# depths of source and receiver, the sound speed, the time between pings, the sediment under
# the name FineSand, and the laws that turn a wind speed into the surface's rms height, slope
# and vertical speed (SST: McDanielSurface; here: Pierson-Moskowitz and Cox-Munk,
# gpusonar/acoustics.py). Depths were chosen only so that the five arrivals are separate
# pulses inside the 35 ms of the figures (direct 0, surface 4.0, bottom 9.2, surface-bottom
# 20.7, bottom-surface 30.6 ms). This is not a numerical reproduction of Figs. 3-5 and must
# not be presented as one; the data in those figures (Dahl 2002) were not used.
#
# How a one-way path is made with a simulator of echoes: the receiver is the sonar's array;
# the projector is 500 m away (its lever arm); a point "relay" of strength -20 dB stands 0.1 m
# from the projector. The transmit leg is then 0.1 m long (its own surface and bottom paths
# are 55 dB down and arrive after the window), and the product (1 / 0.1) x 0.1 = 1 leaves
# the return leg alone: the record is the one-way sound of a source of the stated level.
# Frame: z down, z = 0 the sea surface; the receiver is at the origin's x, y.
name: sst_asiaex
sonar: flank_32
fidelity: image_source
sonar_overrides:
  name: sst_asiaex_receiver
  array: {count: 1, pitch: 0.094}             # TR 0702 shows one channel ("Ch 1"); omnidirectional
  transmit:
    lever_arm: [500.0, 0.0, -20.0]            # projector 500 m away, 30 m deep
    waveform: {type: cw, f_start: 8000.0, f_stop: 8000.0, duration: 0.003, window_alpha: 0.1, source_level_db: 190.0}
  receive:
    sample_rate: 64000.0
    window: {range: [246.5, 280.0]}           # two-way "range": 5 ms before the first arrival to 40 ms after it
environment: {sound_speed: 1500.0, temperature: 15.0, salinity: 34.0}
propagation:
  surface_z: 0.0
  bottom_z: 100.0
  max_order: 2
  bottom: {speed: 1767.0, density: 1.845, attenuation: 0.88}   # medium sand of configs/sediments.yaml; SST used "FineSand"
time_spread:
  surface: {wind_speed: 3.0}                  # the wind SST used for Fig. 4
  bottom: {rms_height: 0.012, mean_square_slope: 0.045}        # as printed in TR 0702
  taps: 12
platform: {position: [0, 0, 50.0], rpy: [0, 0, 0], velocity: [0, 0, 0]}
pings: {count: 20, interval: 5.0}
scene:
  - {type: points, label: relay, positions: [[500.0, 0.1, 30.0]], target_strength_db: -20.0}
absorption: francois_garrison
receiver: {noise_rms: 0.0, adc: false}
seed: 22
unconfirmed:
  - platform                      # receiver depth
  - sonar_overrides               # source depth and level, exact separation, pulse taper, sampling
  - propagation                   # water depth, sound speed, sediment for the reflection coefficient
  - pings.interval
  - time_spread.surface           # wind -> rms height, slope, vertical speed: our laws, not McDanielSurface
  - time_spread.taps
