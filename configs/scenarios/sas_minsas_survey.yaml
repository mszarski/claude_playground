# SAS survey with a MINSAS-120-class sonar: two parallel legs in opposite directions, each
# looking to starboard at the same patch of seabed from 50 m, so every object is seen from
# both sides. On the seabed (z = 0): a shipwreck (an upright hull 18 m long with a
# deckhouse and a mast), a cable snaking across the patch, scattered rocks, and a 0.5 m
# cube as a calibration target. Altitude 12 m, 2.18 m/s (4.2 kn), a ping every 0.25 s:
# 0.544 m per ping, exactly half the array, so the phase centres of successive pings are
# evenly spaced (at 0.4 m per ping they overlap unevenly and along-track ambiguities rise
# from -36 dB to -15 dB; tests/python/test_minsas_resolution.py).
# Limits: navigation is exact (see `wreck_sas` and `minefield_sas` for unknown motion);
# the seabed has far fewer scatterers than resolution cells; the turn between legs is not
# simulated; the receive chain is taken as already at baseband.
name: sas_minsas_survey
sonar: sas_minsas120
fidelity: free_field
sonar_overrides:
  receive: {kind: baseband, sample_rate: 60.0e3, window: {range: [38.0, 68.0]}}
  transmit: {waveform: {duration: 2.5e-3}}
environment: {sound_speed: 1500.0, temperature: 10.0, salinity: 35.0}
platform:
  speed: 2.176                   # 0.544 m per ping: exactly half the 1.088 m array, so phase centres are evenly spaced
  legs:
    - {start: [0.0, 0.0, -12.0], heading_deg: 0.0, pings: 80}        # northbound, wreck to starboard
    - {start: [40.0, 100.0, -12.0], heading_deg: 180.0, pings: 80}   # southbound, 100 m over, looking back
pings: {interval: 0.25}
scene:
  - {type: seafloor, label: seabed, x_range: [-2.0, 42.0], y_range: [36.0, 64.0], density: 8.0, lambert_mu_db: -27.0}
  - {type: hull, label: wreck_hull, origin: [20.0, 50.0, -3.0], length: 18.0, beam: 4.5, depth: 3.0, heading_deg: 20.0,
     count: 3000, mu_db: -12.0, occlude: true}
  - {type: box, label: wreck_deckhouse, min: [18.0, 48.8, -4.6], max: [21.5, 51.0, -3.0], density: 60.0, mu_db: -12.0}
  - {type: cylinder, label: wreck_mast, start: [15.0, 48.6, -3.0], end: [15.0, 48.6, -7.0], radius: 0.1, density: 300.0, mu_db: -10.0}
  - {type: cable, label: cable, radius: 0.04, density: 300.0, mu_db: -10.0,
     waypoints: [[1.0, 41.0, -0.04], [9.0, 43.5, -0.04], [14.0, 41.5, -0.04], [26.0, 43.0, -0.04], [33.0, 47.0, -0.04], [40.0, 58.0, -0.04]]}
  - {type: rocks, label: rocks, x_range: [3.0, 14.0], y_range: [54.0, 61.0], count: 9, radius_range: [0.2, 0.6], density: 100.0, mu_db: -15.0}
  - {type: box, label: calibration_cube, min: [31.0, 55.0, -0.5], max: [31.5, 55.5, 0.0], density: 600.0, mu_db: -8.0}
# Paths more than 40 dB down both beam patterns are not synthesised (most of the seabed
# is outside the 3.5 degree transmit beam of any one ping).
synthesis: {beam_floor_db: -40.0}
absorption: francois_garrison
receiver: {noise_rms: 0.0, adc: false}
seed: 31
