# popoto_12km with a Doppler-resolving ping (docs/tasks/DOPPLER.md, option C, packages D2 and D9): a 1 s
# Hann-tapered tone at 5 kHz, then the sonar's own 4-6 kHz sweep (1 s, Tukey 0.1), back to back in one 2 s ping.
# Everything else is popoto_12km's (ownship 1.5 m/s, the ship at 12 km crossing at 6 m/s: range rate -0.50 m/s).
# The baseline found the background here is noise, not reverberation, and the ship's radial speed small
# (DOPPLER.md section 3.3 item 4): the Doppler path is not expected to help; this scene is there to show it.
#
# UNCONFIRMED, waiting on the owner (docs/tasks/DOPPLER.md section 5):
#   - question 1: whether the projector can send a tone followed by a sweep in one ping, at what peak power and duty
#     (assumed here: yes, no gap, a 2 s ping: twice popoto_long_range's 1 s, i.e. 11 % duty at the 19.9 s interval
#     against the 5.6 % docs/design/projector_selection.md sizes the source for).
#   - questions 1 and 3: the split of energy. The total is popoto_long_range's sweep (197 dB rms, Tukey 0.1, 1 s =
#     196.72 dB re 1 uPa^2 s at 1 m), half to each segment: the sweep has 3 dB LESS energy than in popoto_12km.
#     The Hann tone sets the peak: derived source_level_db_rms 198.0 dB, 1.0 dB above 197.
#   - questions 2 and 4: the tone's length (1 s; 0.15 m/s of speed resolution at 5 kHz) and the 12 km target's aspect.
# Like popoto_12km: needs GPUSONAR_BELLHOP; no Doppler spread of the sea surface (DOPPLER.md section 0 item 1).
name: popoto_12km_doppler
sonar: popoto_long_range
fidelity: eigenray
sonar_overrides:
  receive: {kind: baseband, sample_rate: 8.0e+3, window: {range: [11300.0, 12700.0]}}
  transmit:
    waveform:
      type: sampled
      source: train
      f_start: 4.0e+3                     # the band the train occupies (the sweep's)
      f_stop: 6.0e+3
      source_level_db_rms: null           # derived from source_energy_db (sonar.py)
      source_energy_db: 196.72            # dB re 1 uPa^2 s at 1 m: popoto_long_range's sweep, all of it
      segments:
        - {kind: cw, frequency: 5.0e+3, duration: 1.0, window_alpha: 1.0, energy_share: 0.5}
        - {kind: gap, duration: 0.0}
        - {kind: lfm, f_start: 4.0e+3, f_stop: 6.0e+3, duration: 1.0, window_alpha: 0.1, energy_share: 0.5}
environment: {base: shelf_100m_sand_12c, absorption: ainslie_mccolm, water_depth_known: false}
propagation:
  max_range: 13200.0
  range_step: 40.0
  depth_step: 2.0
  wind_speed: 0.0          # a flat surface for the eigenrays: see environment_overrides
platform: {position: [0, 0, 10.0], rpy: [0, 0, 0], velocity: [1.5, 0, 0]}
pings: {count: 6, interval: 19.9}
scene:
  - type: points
    label: ship
    positions: [[740.0, 12000.0, 4.0], [770.0, 12000.0, 4.0], [800.0, 12000.0, 4.0], [830.0, 12000.0, 4.0], [860.0, 12000.0, 4.0]]
    target_strength_db: 18.0
    velocity: [-6.0, 0.0, 0.0]
reverberation:
  - {mu_db: -27.0}
  - {model: chapman_harris}
receiver:
  adc: false
  ambient_noise: {model: wenz}        # wind and shipping: the environment's
seed: 51
environment_overrides:
  propagation.wind_speed: "the eigenrays reflect from a FLAT surface although the site has wind (surface reverberation and noise use it); as in popoto_12km"
