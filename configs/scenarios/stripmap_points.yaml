# Stripmap SAS with known navigation: three point targets on a flat seafloor.
# Frame: origin on the seafloor below the first ping (ASASIN Sec. II-B), z down,
# so the sonar flies at z = -altitude.
name: stripmap_points
sonar: sas_auv
fidelity: free_field
sonar_overrides:
  receive: {window: {range: [38.0, 52.0]}}
environment: {base: coastal_12c, absorption: none}
platform:
  position: [0, 0, -15.0]          # 15 m altitude
  rpy: [0, 0, 0]
  velocity: [1.6, 0, 0]            # 0.32 m per ping: half the receive array length
pings: {count: 90, interval: 0.2}
scene:
  - type: points
    label: targets
    positions: [[14.4, 41.2, 0.0], [12.0, 38.0, 0.0], [17.0, 45.0, 0.0]]
    target_strength_db: 0.0
receiver: {noise_rms: 0.0, adc: false}
seed: 1
