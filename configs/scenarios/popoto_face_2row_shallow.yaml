# Stage 4: two rows 1.5 m apart on the full face, 100 m of isovelocity water over sand, a target
# at 60 m depth 3 km away (image-source multipath to first order). Two rows this far apart repeat
# every 11.5 degrees; here water depth and range confine every arrival to within 4 degrees of
# level, so with chain.elevation.sector_from_depth the elevation is unambiguous.
#   chain: configs/deploy/popoto_face_2row.yaml (without its sync section: these pings are at baseband)
name: popoto_face_2row_shallow
sonar: popoto_long_range_2row
fidelity: image_source
sonar_overrides:
  receive: {kind: baseband, sample_rate: 8.0e3, window: {range: [2700.0, 3300.0]}}
environment: {base: coastal_12c_sand, water_depth_m: 100.0, wind_speed_m_s: 5.0, shipping: 0.5, absorption: ainslie_mccolm}
propagation:
  surface_z: 0.0
  max_order: 1
platform: {position: [0, 0, 30.0], rpy: [0.0349, 0, 0], velocity: [1.5, 0, 0]}
pings: {count: 4, interval: 5.0}
scene:
  - {type: points, label: target, positions: [[400.0, 2970.0, 60.0]], target_strength_db: 15.0}
receiver:
  adc: false
  ambient_noise: {model: wenz}        # wind and shipping: the environment's
seed: 23
