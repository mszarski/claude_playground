# Stage 4: two rows 1.5 m apart on the full face, 100 m of isovelocity water over sand, a target
# at 60 m depth 3 km away (image-source multipath; how many bounces are kept is the simulator's
# energy rule, fourteen here, with the cap raised to 16 so the series is not cut: no `max_order` is
# stated, D-142). Two rows this far apart repeat every 11.5
# degrees; water depth and range confine the direct echo and the once-bounced ones to within 4
# degrees of level, so with chain.elevation.sector_from_depth the elevation is unambiguous. The
# later bounces are not so confined: they follow in the same detection, 100 m of them, and pull the
# elevation read: with fourteen bounces the depth is 14 to 33 m off over the pings, with a stated sigma of 19 to
# 20 m once the multipath term (D-133) is on (tests/python/test_elevation.py).
#   chain: configs/deploy/popoto_face_2row.yaml (without its sync section: these pings are at baseband)
name: popoto_face_2row_shallow
sonar: popoto_long_range_2row
fidelity: image_source
sonar_overrides:
  receive: {kind: baseband, sample_rate: 8.0e3, window: {range: [2700.0, 3300.0]}}
environment: {base: coastal_12c_sand, water_depth_m: 100.0, wind_speed_m_s: 5.0, shipping: 0.5, absorption: ainslie_mccolm}
propagation:
  surface_z: 0.0
  max_order_cap: 16   # at the default 8 the series was cut with the next order 4 dB down (D-142)
platform: {position: [0, 0, 30.0], rpy: [0.0349, 0, 0], velocity: [1.5, 0, 0]}
pings: {count: 4, interval: 5.0}
scene:
  - {type: points, label: target, positions: [[400.0, 2970.0, 60.0]], target_strength_db: 15.0}
receiver:
  adc: false
  ambient_noise: {model: wenz}        # wind and shipping: the environment's
seed: 23
