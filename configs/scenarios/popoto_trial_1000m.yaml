# Popoto PMM6081 trial: 8 hydrophones (dense layout), 190 dB source, +10 dB target at
# 1000 m, shallow water, at the eigenray tier (Bellhop; needs GPUSONAR_BELLHOP).
name: popoto_trial_1000m
sonar: popoto_8
fidelity: eigenray
sonar_overrides:
  receive: {window: {range: [750, 1250]}}
environment: {base: coastal_12c_bellhop_sand, water_depth_m: 30.0, absorption: ainslie_mccolm, water_depth_known: false}
propagation:
  max_range: 1300
  range_step: 10.0
  depth_step: 1.0
  max_arrivals: 32        # keeps the two-way echo energy within about 0.5 dB (RESULTS.md)
platform: {position: [0, 0, 5.0], rpy: [0, 0, 0], velocity: [0, 0, 0]}
pings: {count: 1, interval: 5.0}
scene:
  - {type: points, label: target, positions: [[0.0, 1000.0, 15.0]], target_strength_db: 10.0}
# Bottom reverberation by the scattering-function method; Lambert, Mackenzie's -27 dB.
reverberation:
  - {mu_db: -27.0}
receiver:
  adc: false
  ambient_noise: {level_db: 38.0}     # reproduces the plan's Phase 0 estimate
seed: 1
