# Flank-array target at 5000 m in noise, shallow water, at the eigenray tier (Bellhop).
# Needs Bellhop as an external program (GPUSONAR_BELLHOP). Frame: z = 0 is the sea surface.
name: flank_target_5km
sonar: flank_32
fidelity: eigenray
sonar_overrides:
  receive: {window: {range: [4600, 5400]}}
environment: {base: coastal_12c_bellhop_sand, water_depth_m: 100.0, absorption: ainslie_mccolm, water_depth_known: false}
propagation:
  max_range: 5500
  range_step: 25.0
  depth_step: 2.0
  max_arrivals: 48        # keeps the two-way echo energy within about 0.5 dB (RESULTS.md)
platform: {position: [0, 0, 30.0], rpy: [0, 0, 0], velocity: [0, 0, 0]}
pings: {count: 1, interval: 15.0}
scene:
  - {type: points, label: target, positions: [[0.0, 5000.0, 50.0]], target_strength_db: 10.0}
receiver:
  adc: false
  ambient_noise: {level_db: 45.0}     # the plan's link-budget assumption at 8 kHz
# Bottom reverberation by the scattering-function method; Lambert, Mackenzie's -27 dB.
reverberation:
  - {mu_db: -27.0}
seed: 1
