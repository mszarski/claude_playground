# Elevation in a shallow-water channel: the three-row long-range array at 30 m in 100 m of
# isovelocity water over sand, a target at 50 m depth 1 km away. Image-source multipath to
# second order: the echo arrives by the direct path first (from 1.2 degrees below level), then by
# the surface (3 m later in range, from 4.6 degrees above) and by the bottom (7 m later, from
# 6.8 degrees below), and by mixtures of them in between. Straight back along its arrival angle
# the surface echo lands 50 m ABOVE the surface and the bottom echo 50 m below the bottom;
# folded back into the water column both are the target's depth.
# Chain: configs/deploy/popoto_vehicle_elevation.yaml with chain.elevation.water_depth: 100.
# Bottom parameters are typical textbook values for sand, not measurements.
name: popoto_elevation_shallow
sonar: popoto_long_range_3row
fidelity: image_source
sonar_overrides:
  receive: {kind: baseband, sample_rate: 8.0e+3, window: {range: [700.0, 1300.0]}}
  transmit:
    waveform: {type: lfm, source: null, duration: 1.0e+0}   # D-256: the shipped sonar sends a 2 s hyperbolic sweep, blind inside 1.5 km; this scene shows the rows' elevation at 1 km, so it keeps the former 1 s linear sweep (blind inside 0.75 km), stated here
environment: {base: coastal_12c_sand, water_depth_m: 100.0, wind_speed_m_s: 5.0, shipping: 0.5, absorption: ainslie_mccolm}
propagation:
  surface_z: 0.0
  max_order: 2
platform: {position: [0, 0, 30.0], rpy: [0, 0, 0], velocity: [0, 0, 0]}
pings: {count: 4, interval: 4.0}
scene:
  - {type: points, label: target, positions: [[0.0, 1000.0, 50.0]], target_strength_db: 10.0}
receiver:
  adc: false
  ambient_noise: {model: wenz}        # wind and shipping: the environment's
seed: 12
