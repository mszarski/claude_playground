# Winter, 200 m, sand: mixed, isothermal water in which sound speed rises with depth and sound is trapped near the surface.
# Popoto long-range array (32 hydrophones, 4-6 kHz, 197 dB) under way at 1.5 m/s; a
# ship-sized mover (+25 dB) at 8 km crossing at 6 m/s. Bellhop multipath (needs
# GPUSONAR_BELLHOP), bottom and surface reverberation, ambient noise. Six pings.
# Upward-refracting surface duct.
# Bottom parameters are typical textbook values for the sediment type, not measurements;
# the Lambert strength for it is a placeholder.
name: popoto_env_winter_sand_200m
sonar: popoto_long_range
fidelity: eigenray
sonar_overrides:
  receive: {kind: baseband, sample_rate: 8.0e3, window: {range: [7300.0, 8700.0]}}
environment: {sound_speed: 1480.0, temperature: 12.0, salinity: 35.0}
propagation:
  environment: {depth: 200.0, ssp_depth: [0.0, 200.0], ssp_speed: [1480.0, 1483.4], bottom_speed: 1650.0, bottom_density: 1.9, bottom_attenuation: 0.8}
  frequency: 5000.0
  max_range: 9200.0
  range_step: 40.0
  depth_step: 4.0
  max_arrivals: 40
platform: {position: [0, 0, 10.0], rpy: [0, 0, 0], velocity: [1.5, 0, 0]}
pings: {count: 6, interval: 14.6}
scene:
  - type: points
    label: ship
    positions: [[740.0, 8000.0, 4.0], [770.0, 8000.0, 4.0], [800.0, 8000.0, 4.0], [830.0, 8000.0, 4.0], [860.0, 8000.0, 4.0]]
    target_strength_db: 18.0
    velocity: [-6.0, 0.0, 0.0]
reverberation:
  - {boundary_z: 200.0, mu_db: -27.0}
  - {boundary_z: 0.0, model: chapman_harris, wind_speed: 5.0}
absorption: ainslie_mccolm
receiver:
  adc: false
  ambient_noise: {wind_speed: 5.0, shipping: 0.5}
seed: 51
