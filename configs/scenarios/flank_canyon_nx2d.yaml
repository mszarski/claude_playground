# ILLUSTRATIVE. The N x 2-D twin of `flank_canyon_3d` at the `eigenray` tier (Bellhop 2-D, GPUSONAR_BELLHOP): the same
# sonar, target, noise and seed over a level 250 m bed, which is the canyon's profile along its axis (the look
# direction): what an N x 2-D run sees there.
name: flank_canyon_nx2d
sonar: flank_32
fidelity: eigenray
sonar_overrides:
  receive: {window: {range: [4600, 5400]}}
environment: {base: coastal_12c_bellhop_sand, water_depth_m: 250.0, absorption: ainslie_mccolm, water_depth_known: false}
propagation:
  range_step: 25.0
  depth_step: 4.0
platform: {position: [0, 0, 50.0], rpy: [0, 0, 0], velocity: [0, 0, 0]}
pings: {count: 1, interval: 15.0}
scene:
  - {type: points, label: target, positions: [[0.0, 5000.0, 50.0]], target_strength_db: 10.0}
receiver:
  adc: false
  ambient_noise: {level_db: 45.0}
seed: 1
