# Closed-form check through the whole simulator (tools/sst_validation.py, "checks"): the echo
# of one highlight of known target strength against the sonar equation and TR 0702's simple
# target-echo model (eqs. 66, 68) with the image eigenrays of eqs. 36-38.
# A geometry for a calculation, not a sonar: omnidirectional hydrophones and projector at one
# place, a flat surface (coefficient -1) and a flat bottom (coefficient 0.5), one bounce at
# most per leg, so that the six groups of eigenray pairs arrive as six separate pulses after
# pulse compression (2 kHz of band: 0.75 m of two-way path; the groups are 29 m or more apart,
# so that the range sidelobes of one do not reach the next).
# The tool also runs it with `fidelity: free_field`, and with a sampled (m-sequence) pulse and
# a moving target for the Doppler check.
name: sst_echo_level
sonar: flank_32
fidelity: image_source
sonar_overrides:
  name: sst_echo_level_sonar
  array: {count: 4}
  transmit:
    lever_arm: [0, 0, 0]
    waveform: {type: lfm, f_start: 7000.0, f_stop: 9000.0, duration: 0.05, window_alpha: 0.1, source_level_db: 200.0}
  receive:
    kind: baseband
    sample_rate: 16000.0
    window: {range: [990.0, 1390.0]}
environment: {sound_speed: 1500.0, temperature: 10.0, salinity: 35.0}
propagation:
  surface_z: 0.0
  bottom_z: 600.0
  max_order: 1
  bottom_coefficient: 0.5
platform: {position: [0, 0, 100.0], rpy: [0, 0, 0], velocity: [0, 0, 0]}
pings: {count: 1, interval: 1.0}
scene:
  - type: target
    label: highlight
    origin: [0.0, 1000.0, 150.0]             # broadside to the line of hydrophones
    velocity: [0.0, 0.0, 0.0]
    highlights:
      - {position: [0, 0, 0], target_strength_db: 7.0}
absorption: francois_garrison
receiver: {noise_rms: 0.0, adc: false}
seed: 1
