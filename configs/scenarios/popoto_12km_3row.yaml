# The 12 km design point with three stacked rows on the face: popoto_12km with the three-row array (outer rows 1.5 m apart).
# 100 m of isovelocity water over sand; a ship-sized mover (+25 dB in all) at 12 km, 4 m deep, crossing at 6 m/s; Bellhop
# multipath (needs GPUSONAR_BELLHOP), bottom and surface reverberation, ambient noise. Six pings.
#   chain: configs/deploy/popoto_vehicle_elevation.yaml (without its sync section: these pings are at baseband), with
#   chain.elevation.water_depth: 100. Measured through the chain: tools/popoto_12km_study.py -> docs/design/popoto_12km.json.
# Without Bellhop the same scenario runs with image-source paths (tools/popoto_12km_study.py: image_source;
# tests/python/test_buildspec.py). `truth` is what those check against.
# Bottom parameters are typical textbook values for sand, not measurements; the Lambert strength is a placeholder.
name: popoto_12km_3row
sonar: popoto_long_range_3row
fidelity: eigenray
sonar_overrides:
  receive: {kind: baseband, sample_rate: 8.0e3, window: {range: [11300.0, 12700.0]}}
environment: {base: shelf_100m_sand_12c, absorption: ainslie_mccolm, water_depth_known: false}
propagation:
  max_range: 13200.0
  range_step: 40.0
  depth_step: 2.0
  wind_speed: 0.0          # a flat surface for the eigenrays: see environment_overrides
platform: {position: [0, 0, 10.0], rpy: [0, 0, 0], velocity: [1.5, 0, 0]}
pings: {count: 6, interval: 19.9}
scene:
  - type: points
    label: ship
    positions: [[740.0, 12000.0, 4.0], [770.0, 12000.0, 4.0], [800.0, 12000.0, 4.0], [830.0, 12000.0, 4.0], [860.0, 12000.0, 4.0]]
    target_strength_db: 18.0
    velocity: [-6.0, 0.0, 0.0]
reverberation:
  - {mu_db: -27.0}
  - {model: chapman_harris}
receiver:
  adc: false
  ambient_noise: {model: wenz}        # wind and shipping: the environment's
seed: 51
truth:
  ship: {range_m: 12000.0, depth_m: 4.0, velocity: [-6.0, 0.0, 0.0], first_x_m: 800.0}
  water_depth_m: 100.0
environment_overrides:
  propagation.wind_speed: "the eigenrays reflect from a FLAT surface although the site has wind (surface reverberation and noise use it); as before, so that the record does not change"
