# Summer, 60 m, mud: a warm surface layer over a thermocline bends sound down into a soft, absorbing bottom.
# Popoto long-range array (32 hydrophones, 4-6 kHz, 197 dB) under way at 1.5 m/s; a
# ship-sized mover (+25 dB) at 4 km crossing at 6 m/s. Bellhop multipath (needs
# GPUSONAR_BELLHOP), bottom and surface reverberation, ambient noise. Six pings.
# Downward-refracting: little reaches a shallow target at range.
# Bottom parameters are typical textbook values for the sediment type, not measurements;
# the Lambert strength for it is a placeholder.
name: popoto_env_summer_mud_60m
sonar: popoto_long_range
fidelity: eigenray
sonar_overrides:
  receive: {kind: baseband, sample_rate: 8.0e3, window: {range: [3300.0, 4700.0]}}
environment: {sound_speed: 1522.0, temperature: 12.0, salinity: 35.0}
propagation:
  environment: {depth: 60.0, ssp_depth: [0.0, 15.0, 30.0, 60.0], ssp_speed: [1522.0, 1520.0, 1492.0, 1490.0], bottom_speed: 1500.0, bottom_density: 1.5, bottom_attenuation: 0.2}
  frequency: 5000.0
  max_range: 5200.0
  range_step: 40.0
  depth_step: 1.5
  max_arrivals: 40
platform: {position: [0, 0, 10.0], rpy: [0, 0, 0], velocity: [1.5, 0, 0]}
pings: {count: 6, interval: 9.3}
scene:
  - type: points
    label: ship
    positions: [[740.0, 4000.0, 4.0], [770.0, 4000.0, 4.0], [800.0, 4000.0, 4.0], [830.0, 4000.0, 4.0], [860.0, 4000.0, 4.0]]
    target_strength_db: 18.0
    velocity: [-6.0, 0.0, 0.0]
reverberation:
  - {boundary_z: 60.0, mu_db: -35.0}
  - {boundary_z: 0.0, model: chapman_harris, wind_speed: 5.0}
absorption: ainslie_mccolm
receiver:
  adc: false
  ambient_noise: {wind_speed: 5.0, shipping: 0.5}
seed: 51
