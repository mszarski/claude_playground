# 3D near-field imaging of buried objects (ASASIN Sec. III-B) in a realistic bed: a
# cylinder 0.5 m long at 0.30 m depth and a sphere at 0.22 m, under a rough sediment
# interface, with scattered inhomogeneities (shell, gravel) through the sediment.
# Sound refracts at the interface (1500 m/s over 1700 m/s). Image with
# recon.image_volume(..., interface_z=0.0, sediment_speed=1700.0).
# Sediment: the scene states only a sound speed (1700 m/s, kept). `penetration: fluid` also needs a
# density and a loss, so the scene names the medium sand class: density ratio 1.845 and loss
# 0.884 dB per wavelength (10.4 dB/m at 20 kHz at 1700 m/s) are that class's published values in
# configs/sediments.yaml, not a site survey. Against the tier without the option the cylinder's echo
# is about 6 dB lower (owner's decision 2026-11-26; docs/PHYSICS_NOTES.md section 31).
name: buried_objects
sonar: subbottom
fidelity: sediment
propagation: {sediment_speed: 1700.0, interface_z: 0.0, penetration: fluid, bottom: {sediment: medium_sand, speed: 1700.0}}
environment: {sound_speed_m_s: 1500.0, absorption: none}
platform:
  position: [0, 0, -1.5]
  rpy: [0, 0, 0]
  velocity: [0, 0, 0]
  raster: {x: [-0.9, 0.9001, 0.075], y: [-0.9, 0.9001, 0.075]}
pings: {count: 1, interval: 0.05}
scene:
  - {type: cylinder, label: cylinder, start: [-0.25, 0.0, 0.30], end: [0.25, 0.0, 0.30], radius: 0.05, density: 3000.0, mu_db: -3.0, occlude: false}
  - {type: sphere, label: sphere, centre: [0.35, 0.40, 0.22], radius: 0.08, density: 3000.0, mu_db: -3.0}
  - {type: seafloor, label: interface, x_range: [-1.3, 1.3], y_range: [-1.3, 1.3], density: 400.0, lambert_mu_db: -30.0}
  - {type: volume, label: sediment_clutter, min: [-1.0, -1.0, 0.03], max: [1.0, 1.0, 0.6], count: 1500, rms_amplitude: 0.004}
receiver: {noise_rms: 0.0, adc: false}
seed: 16
