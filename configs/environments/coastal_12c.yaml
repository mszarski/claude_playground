# Coastal sea water at 12 deg C and 35 PSU: the water most shipped scenarios use. ILLUSTRATIVE: no site was measured.
# No wind, depth or bottom: a scenario adds those (environment: {base: coastal_12c, water_depth_m: 60.0, ...}).
# No sound speed is typed: it follows from the temperature and salinity (Mackenzie: 1496.8 m/s), so geometry,
# wavelengths and absorption are those of one water. (A nominal 1500 m/s stood here until the owner's decision on
# D-101; a scenario that means a particular speed types it and names it under its environment's `overrides`.)
# Fields: gpusonar/environment.py (FIELDS), docs/CONFIGURATION.md "Environment".
name: coastal_12c
title: "Sea water, 12 deg C, 35 PSU"
temperature_c: 12.0
salinity_psu: 35.0
illustrative: true
