# Row module: 32 hydrophones over 2.88 m. The row the test AUV carries (the owner: "probably like 2-3 span we can attach"),
# the static array stacks two or three of, and the face "can start with" ("Keep at 32, can start with a smaller array in the
# 7m zone. Probably makes sense to keep the one design for auv and static right? Except for elevation").
# One module = 32 hydrophones, their cable harness, and four boards of eight inputs. Builds name it with `array.module`.
name: row32_short
array:
  count: 32                      # the owner: "Keep at 32"
  pitch_m: 0.09                  # 0.30 of a wavelength at 5 kHz: closer than half a wavelength, so less gain against sea noise than 32 suggests
  confirmed: [count]
hydrophone:
  model: null                    # not chosen. The plan: "ordinary passive hydrophones wired to the board's inputs"
  sensitivity_db: -208.0         # dB re 1 V/uPa: an assumption (the figure the plan quotes for its AS-1 reference hydrophone)
