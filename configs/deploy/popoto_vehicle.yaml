# The Popoto-board array on a vehicle: tools/sonar_live.py configs/deploy/popoto_vehicle.yaml
# One file says where pings come from, how they are processed and where results go.
# docs/DEPLOYMENT.md explains each part and what is not yet confirmed against hardware.

source:
  type: flank_udp                # blocks from the capture boards (sources/flank_stream.py)
  sonar: popoto_long_range       # configs/sonars/popoto_long_range.yaml: array, band, sampling
  host: 0.0.0.0
  port: 5700
  timeout: 30.0                  # s without a ping before the run ends
  # sonar_overrides: {receive: {window: {range: [500.0, 13000.0]}}}

nav:                             # the vehicle's navigation: JSON datagrams (gpusonar/live.py, NavListener)
  port: 5702                     # {"time_ns", "x", "y", "z", "roll", "pitch", "yaw", "vx", "vy", "vz"}, NED metres, radians
  # static: {x: 0.0, y: 0.0, z: 10.0, yaw: 0.0}     # instead, for a bench or a moored array
  # The navigation unit to the array (docs/CONFIGURATION.md, nav.lever_arm_m): UNCONFIRMED, not surveyed yet, so
  # left at the default, zero: the array is taken to sit at the unit's reference point, in the unit's axes.
  # Uncomment and fill in from the survey:
  # lever_arm_m: [0.0, 0.0, 0.0]     # unconfirmed: the array's reference point from the unit's, in the unit's body axes
  #                                  # (x forward, y starboard, z down), m
  # mount_rpy_deg: [0.0, 0.0, 0.0]   # unconfirmed: roll, pitch, yaw of the array's axes against the unit's, degrees,
  #                                  # yaw, then pitch, then roll (ASASIN Eq. 2 order, as the datagram's attitude)

chain:                           # gpusonar/live.py; anything left out keeps its default
  bearings_deg: [-60.0, 60.0, 0.5]
  look: starboard
  # range cell, CFAR windows, SNR floor, tracker and classifier sizes: the chain derives or defaults them from the sonar
  # (libs/live derive.hpp; `LiveChain.resolved` and the report say what was used). Write one here only to change it.
  coverage:                      # what the sonar can see from where it is, on every report line (docs/DEPLOYMENT.md, "The coverage picture")
    # The SITE: water depth and bottom are required (the chain does not start without them) and have no default. No site is
    # chosen: these are the illustrative shelf of the 12 km design point
    # (configs/builds/environments/illustrative.yaml, shelf_100m_sand). Put the real site's in before a deployment.
    water_depth_m: 100.0         # used on a ping that carries no water depth (elevation.water_depth and navigation come first)
    bottom: {speed: 1650.0, density: 1.9, attenuation: 0.8}
    surface: {rms_height_m: 0.134}                     # the wind law's height at 5 m/s
    # The classes and one row's link budget at 5 m/s of wind, as the generator writes them for the face builds
    # (tools/coverage_map.py --build popoto_face_1x32 --environment shelf_100m_sand --chain-config prints the block).
    # Every target strength and depth is an assumed placeholder (configs/builds/targets/reference_classes.yaml).
    classes:
      - {name: ship, ts_db: 25.0, depth_m: [2.0, 6.0]}
      - {name: xl_auv, ts_db: 5.0, depth_m: [20.0, 200.0]}
      - {name: large_submerged, ts_db: 25.0, depth_m: [30.0, 300.0]}
    budget: {source_level_db: 197.0, noise_spectrum_db: 51.46, array_gain_db: 15.05, absorption_db_per_km: 0.32}
    own_depth_limits_m: [5.0, 500.0]
    bottom_clearance_m: 10.0

output:
  recording: /data/sonar/popoto_%Y%m%d_%H%M%S.h5     # every raw ping, before processing
  report: /data/sonar/popoto_%Y%m%d_%H%M%S.jsonl      # one line per ping: detections and tracks
  report_udp: [127.0.0.1, 5701]                       # the same line to the vehicle computer
  taps: {dir: /data/sonar/taps, pings: 2}             # every stage of the first two pings
