    1.3570), but three other prints of the same row give 1.337: two tests in that repository
    (test/test_pekeris.jl:229, FluidBoundary(2.492 * 1023, 1.3370 * 1528, 0.01705);
    test/test_basic.jl:57), Snellen, Siemes and Simons (2011), Table II (Mz = -1: 2.492, 1.337,
    0.0171) and Cintron (2001), Table 1 ("Sandy Gravel", 2.492, 1.337, 0.01705). The table line is
    taken as a typing error and 1.337 x 1528 = 2042.94 m/s is carried.
  source: >-
