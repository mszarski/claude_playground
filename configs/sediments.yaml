# Named parameter sets for the fluid-sediment bottom model (python/gpusonar/sim/bottom.py).
# Use in a scenario:  reverberation: [{model: fluid_sediment, boundary_z: ..., sediment: <name>}]
# (keys given in the item override the table's).
#
# An entry gives the six model parameters directly:
#   rho (density ratio), nu (sound-speed ratio), delta (loss parameter),
#   w2 (roughness spectral strength, m^(4 - gamma2), wavenumbers in rad/m), gamma2 (spectral
#   exponent), sigma2 (volume parameter: volume cross section per unit volume / attenuation in dB/m)
# or a `physical:` block in the units of its source, converted by
# bottom.parameters_from_physical (the conversion is written out there and tested):
#   density kg/m3, sound_speed m/s, attenuation_db_per_m at attenuation_frequency (Hz),
#   w2 m^(4 - gamma2), gamma2, volume_strength_db (10 log10 of the volume cross section per
#   unit volume in 1/m), water_density kg/m3, water_sound_speed m/s.
# A spectral strength quoted in cm^4 (1 cm reference length) must be converted first:
# bottom.w2_from_cm4.
#
# status: confirmed   - every number in the entry was read in the open documents the entry cites
#                       (`source`, `provenance`), or computed by a relation they print; the loader
#                       (bottom._warn_status) then raises no warning. This is NOT the `confirmed` of
#                       docs/REFERENCES.md ("read in the source itself"): those documents attribute
#                       the values to APL-UW TR 9407 or other originals that were not read, so in
#                       REFERENCES.md's words the tabulated values are `via secondary` (its Sec. 3.1).
# status: unconfirmed - illustrative; a warning is raised when it is used.
#
# One convention in this file: the model takes RATIOS to the water above the sediment (rho, nu).
# A block in physical units states the water it refers to, and the loader divides by it. The two
# sources below agree on the ratios (1.845 and 1.178 for medium sand, 1.147 and 0.984 for very
# fine silt) although one prints kg/m3 and m/s for water of 1000 kg/m3 and 1500 m/s and the
# other for 1023 kg/m3 and 1528 m/s: the ratio is what both took from their source
# (tests/python/test_sediment_table.py checks this).
#
# Rows read from UnderwaterAcoustics.jl carry density, sound speed and loss in a `reflection:`
# block (kg/m3, m/s, loss parameter, with the reference water the source states). They serve the
# flat-interface reflection coefficient (image-source `bottom: {sediment: name}`, Bellhop
# `environment: {sediment: name}`, bottom.sediment_reflection). A `scattering:` block beside it
# gives the three scattering parameters in the units of their source: `w2_cm4` (spectral
# strength in cm^4 with a 1 cm reference length, converted by bottom.w2_from_cm4), `gamma2`,
# `sigma2`. `provenance:` says, parameter by parameter, where each number comes from.
# `unconfirmed_fields` lists parameters of an otherwise confirmed entry that could not be
# settled; a warning is raised when one is used.
#
# Where the scattering parameters come from (2026-11-18; docs/REFERENCES.md has the register).
# APL-UW TR 9407 (limited distribution) was not read; each item below is printed in an open
# document that attributes it to the handbook.
#
# - Sediment name -> mean grain size (phi = -log2 of the diameter in mm): Cintron, "Environmental
#   impact on mine hunting in the Yellow Sea using the CASS/GRAB model", MS thesis, Naval
#   Postgraduate School, 2001 (public release; https://hdl.handle.net/10945/10842), Table 1
#   "APL/UW TR9407 Geo-acoustic parameters associated with bulk grain size index": 23 rows from
#   "Rough Rock" to "Clay" with the grain size index, density ratio, sound speed ratio and loss
#   parameter. Its ratios agree with the rows here to the printed digits
#   (tests/python/test_sediment_literature.py).
# - Spectral strength: Snellen, Eleftherakis, Amiri-Simkooei, Koomans and Simons, J. Acoust.
#   Soc. Am. 134, 959-970 (2013), eq. (5) (author copy, TU Delft repository,
#   uuid:118445fc-6696-4fe2-abae-53272b80db43): w2 = 0.00207 h^2 cm^4,
#   h = (2.03846 - 0.26923 Mz) / (1 + 0.076923 Mz) for -1 <= Mz < 5 and h = 0.5 for 5 <= Mz <= 9,
#   for the spectrum W(K) = w2 (h0 K)^-gamma, h0 = 1 cm. Snellen, Siemes and Simons, J. Acoust.
#   Soc. Am. 129, 2878-2888 (2011), Table II (TU Delft repository,
#   uuid:b635a0a8-2ca1-44ae-8fbc-0866b3304827) tabulates the same quantity at whole phi from -1
#   to 9 (0.0129 ... 0.0005 cm^4); the regression reproduces it to the printed digits, and it
#   reproduces the two rows of arXiv:1809.08459 (printed in m^(4 - gamma)) within 0.3 %, which
#   also checks the unit conversion. The original print (2026-11-26): Mourad and Jackson, "High
#   Frequency Sonar Equation Models for Bottom Backscatter and Forward Loss", OCEANS '89 Proceedings,
#   pp. 1168-1175, eqs. (6)-(7) print this relief rule and w2 = 0.00207 h^2 h0^2 for gamma = 3.25,
#   "defined for 1 <= Mz <= 9" (confirmed; docs/references/bottom_mourad_jackson_1989.md Sec. 2.2).
#   Our rows from -1 to 1 phi extend it as Snellen et al. do.
# - Spectral exponent: 3.25 for every sediment (Snellen et al. 2011, Sec. II.A: "a value of 3.25
#   for the exponent of the bottom relief spectrum is found to work well for many types of
#   sediments", citing the handbook). Printed as "3.25 for all grain sizes" in Mourad and Jackson
#   (1989), eq. (5) (confirmed); the measured exponents they cite average 3.23 (sd 0.44), via secondary.
# - Volume parameter (volume scattering cross section / attenuation in dB/m): 0.002 for
#   -1 <= Mz < 5.5 and 0.001 for 5.5 <= Mz <= 9 (Snellen et al. 2013, text after eq. (5); Snellen
#   et al. 2011, Table II). It is the least certain of the three: the GeoHab report says it "has
#   to be adjusted empirically", and Snellen et al. (2013) found values half the rule at 300 kHz.
#   The row `medium_sand` (from arXiv:1809.08459) holds 0.001 where this rule gives 0.002: see
#   its note. Mourad and Jackson (1989), eq. (4), the original, step it at 5.0 phi (0.002 for
#   1 <= Mz < 5.0, 0.001 for 5.0 <= Mz <= 9; confirmed), but their own Fig. 8 used 0.002 at 5.3 phi
#   and the later prints of the model (Snellen et al. 2011, 2013) step at 5.5: the step stays at
#   5.5. Only `sandy_silt` (5.0 phi) would differ: 0.001 by eq. (4), -3.0 dB on its volume term.
#   The density and speed relations of the same paper (eqs. (1)-(2)) are those of
#   `bottom.apl_grain_size_relations` (seven-digit constants since C5 of the note above).
# - Rock and pebbles are not fluid sediments. The open literature describes rock by Lambert's
#   law fitted to measurements, or by an elastic small-slope model with measured roughness; the
#   handbook's own curves for rock exceed the largest Lambert law energy conservation allows
#   (Olson, Lyons and Saebo, arXiv:1601.06078, introduction). These two rows stay `reflection_only`
#   and carry an `empirical_backscatter:` block instead (bottom.empirical_backscatter): a Lambert
#   parameter with the range of the published values. The fluid-sediment scattering models
#   still refuse them.
#
# `sigma2_range: [low, high]`, `basis:` and `w2_note:` (the seven rows of 5.5 phi and finer; conformance item A6 of
# docs/references/CONFORMANCE.md, option E of docs/tasks/SEDIMENT_DEFAULTS_DECISION.md) are information for the
# user and are NOT used by the loader or any model: the class values stay as they are. `sigma2_range` is what
# measured sites of that grain size imply for the volume parameter (agents' computations and three fitted sites,
# `basis` says which); `w2_note` says how the roughness rule compares with measured spectra. A site with its own
# numbers is a NAMED SITE ROW (`gallaudet_2001_site`), never a class row: use it, or give `sigma2` beside a class
# name, or fit the site (tools/fit_sediment.py).
#
# `grain_size_phi: [low, high]` is the mean grain size range that Lurton, Lamarche et al.,
# "Backscatter measurements by seafloor-mapping sonars: Guidelines and Recommendations" (GeoHab
# Backscatter Working Group, 2015; CC BY 4.0; doi:10.5281/zenodo.10089261), Table 2-1, gives for
# that sediment name; `mean_grain_size_phi` (Cintron's table) is its midpoint in eight of the nine
# rows that have both (clay: 9 phi for "above 8"). That table ("Adapted from APL 1994 ... nominal values for c1 and rho1
# (1500 m/s and 1000 kg/m3)") is a further open source for density, velocity and absorption of
# those nine rows and agrees with the entries here to its printed digits
# (tests/python/test_sediment_table.py), with one exception noted at coarse_silt.
#
# Other things looked at and not used as rows:
# - Olson, Lyons and Saebo, arXiv:1601.06078, Table II gives "generic rock" as an elastic solid
#   (compressional speed 3600 m/s, shear speed 1900 m/s, density 2500 kg/m3, loss parameters
#   0.0018 and 0.085; attributed there to TR 9407 Table IV.2), with no roughness or volume
#   parameters for it.
# - Tables of sound speed, density and attenuation alone (arXiv:1611.00608 Table 1,
#   arXiv:2003.11156 Tables 1-2) lack the roughness and volume parameters.

medium_sand:
  grain_size_phi: [1.0, 2.0]
  physical:
    density: 1845.0
    sound_speed: 1767.0
    attenuation_db_per_m: 10.0
    attenuation_frequency: 20.0e+3
    w2: 1.410e-4
    gamma2: 3.25
    volume_strength_db: -20.0
    water_density: 1000.0
    water_sound_speed: 1500.0
  mean_grain_size_phi: 1.5
  provenance:
    rho_nu_delta: "tabulated (arXiv:1809.08459 Table 1; the same ratios in UnderwaterAcoustics.jl and Cintron 2001, Table 1)"
    mean_grain_size_phi: 'tabulated (Cintron 2001, Table 1, row "Sand or Medium Sand", bulk grain size index 1.5)'
    w2: "tabulated (arXiv:1809.08459 Table 1; the regression of Snellen et al. 2013, eq. (5), gives 1.406e-4 at 1.5 phi)"
    gamma2: "tabulated (arXiv:1809.08459 Table 1)"
    # A further print of rho, nu, delta, w2 and gamma2: Jackson and Richardson (2007), Fig. 13.2, p. 337,
    # inputs "typical of a medium sand seafloor": a_rho 1.845, nu_p 1.1782, delta_p 0.01624,
    # w2 0.000141 m^0.75, gamma2 3.25 (the book does not say they are TR 9407's; it prints no sigma2 for
    # medium sand). Held by tests/python/test_jackson_2007_bottom.py.
    sigma2: "tabulated (arXiv:1809.08459 Table 1, as a volume scattering strength): 0.001. The grain-size rule gives 0.002; the difference is known and the tabulated value is kept (D-90: a sourced tabulated value outranks a rule), see note"
  note: >-
    Volume parameter: the paper's -20.0 dB/m with 10.0 dB/m of attenuation is sigma2 = 0.0010.
    The grain-size rule printed by Snellen et al. (2011, Table II; 2013) gives 0.002 for every
    sediment coarser than 5.5 phi, which would be -17.0 dB/m here. The very fine silt row of the
    same paper does agree with the rule (0.00099 against 0.001). Nothing read decides which is
    the handbook's value for medium sand. The difference is known and the paper's number is
    kept, on the owner's decision (docs/DECISIONS.md D-90): a value tabulated for this very
    sediment in a cited source outranks a general rule. The rule's 0.002 would raise the
    volume term by 3 dB and the row by 0 to 2.5 dB (most at 6 kHz and 45 degrees); to try it,
    give `sigma2: 0.002` beside the name.
  status: confirmed
  source: >-
    Brown, Johnson and Brownstead, "Simulation and testing results for a sub-bottom imaging
    sonar", arXiv:1809.08459, Table 1, column "Medium Sand" (the paper says the values are
    taken from APL-UW TR 9407 and that the attenuation is given at 20 kHz). The spectral
    strength is printed there in m^(4 - gamma).
  assumptions: >-
    The paper does not print its water density and sound speed; 1000 kg/m3 and 1500 m/s are
    used here to form the ratios. That choice is now supported: it gives rho = 1.845 and
    nu = 1.178, and UnderwaterAcoustics.jl (MIT; src/stdlib.jl:122, "MediumSand", attributed
    there to APL-UW TR 9407 IV-6 Table 2) gives 1887.44 / 1023 = 1.8450 and
    1800.29 / 1528 = 1.1782 for the same sediment; its loss parameter 0.01624 is within 0.4 %
    of the 0.016189 that follows from 10 dB/m at 20 kHz. "Vol. Scat. Strength [dB/m]" is read
    as 10 log10 of the volume scattering cross section per unit volume in 1/m.

very_fine_silt:
  grain_size_phi: [7.0, 8.0]
  physical:
    density: 1147.0
    sound_speed: 1476.0
    attenuation_db_per_m: 1.4
    attenuation_frequency: 20.0e+3
    w2: 1.638e-5
    gamma2: 3.25
    volume_strength_db: -28.6
    water_density: 1000.0
    water_sound_speed: 1500.0
  mean_grain_size_phi: 7.5
  provenance:
    rho_nu_delta: "tabulated (arXiv:1809.08459 Table 1; the same ratios in UnderwaterAcoustics.jl and Cintron 2001, Table 1)"
    mean_grain_size_phi: 'tabulated (Cintron 2001, Table 1, row "Very Fine Silt", bulk grain size index 7.5)'
    w2: "tabulated (arXiv:1809.08459 Table 1; the regression of Snellen et al. 2013, eq. (5), gives 1.6365e-5 at 7.5 phi)"
    gamma2: "tabulated (arXiv:1809.08459 Table 1)"
    sigma2: "tabulated (arXiv:1809.08459 Table 1, as a volume scattering strength, 0.00099; the grain-size rule gives 0.001)"
  sigma2_range: [0.0008, 0.005]
  basis: &soft_basis >-
    The class value is the published model's (0.001 from 5.5 phi: Snellen et al. 2013, text after eq. (5);
    Snellen et al. 2011, Table II; arXiv:1809.08459 Table 1, very fine silt 0.00099; printed, all attributed
    to APL-UW TR 9407). Measured sites of this grain size imply 0.0008 to 0.005 (-1.0 to +7.0 dB on the
    volume term). Two are printed fits by the model's authors: Jackson and Briggs (1992) Table V print fitted
    values at two of these sites, Arafura Sea 0.005 (0.004-0.006 "give reasonable fits"; 5.63 phi; the paper
    says the sediment is bimodal, sand and gravel in a silty clay, so its mean grain size misleads, and 0.005 is at
    the border of single scattering) and San Francisco 0.002 (6.39 phi); one site each (rows
    jackson_briggs_1992_arafura, jackson_briggs_1992_san_francisco). The agents' (14.10) values for the same two
    sites below, 0.0031 and 0.0037, are ours, disagree with the authors' fits, and are superseded as evidence by
    them. Five of those numbers are rows of ONE table, J&R (2007) Table 14.1, pushed through (14.10)
    by agents (ours, not printed volume parameters, not five independent measurements;
    docs/references/jackson_richardson_2007/02_roughness_heterogeneity_statistics.md Sec. 3.3, recomputed in
    docs/tasks/SEDIMENT_DEFAULTS_DECISION.md Sec. 2.1): Arafura Sea 5.6 phi 20 kHz 0.0031; San Francisco
    6.4 phi 40 kHz 0.0037 (both superseded, above); Orcas 8.1 phi 40 kHz 0.0008; Porto Venere 9.1 phi 140 kHz 0.0017; P. della
    Mariella 7.2 phi 140 kHz 0.0016. One fitted site: Gallaudet (2001) Ch. 3 Table VI, 0.003 (printed; NE
    Gulf of Mexico, 6.36 phi, 68 kHz; row gallaudet_2001_site). His two band means cannot separate volume from
    roughness scattering, so his 0.003 is not independent evidence for the volume parameter: it is evidence
    only under volume dominance, which is our model's assumption there (roughness 21 to 28 dB below volume
    off specular, docs/DECISIONS.md D-193); the range counts it as one fitted site. The class value is unchanged (a fit at one site is not a class value). For a measured mud give
    sigma2 beside the name or fit the site.
  w2_note: &soft_w2_note >-
    The roughness is the grain-size rule (Snellen et al. 2013 eq. (5): 0.0005175 cm^4 from 5 phi, exponent
    3.25). Briggs' measured spectra for silts and clays (J&R Table 6.1, the 8 rows of 5.5 phi and finer, four
    sites) lie above it: median +7.1 dB at 10 kHz, +2.2 dB at 100 kHz, -0.9 dB at 300 kHz at the backscatter
    Bragg wavenumber (an agent's comparison, ours:
    docs/references/jackson_richardson_2007/02_roughness_heterogeneity_statistics.md Sec. 3.2). Kept: for these
    rows the volume term is at least 14.3 dB above the roughness term at 5-60 degrees, so the data's class
    median would move the total by at most 0.45 dB up to 60 degrees and 1.3 to 2.5 dB at 75 degrees
    (docs/tasks/SEDIMENT_DEFAULTS_DECISION.md Sec. 0, table T4).
  status: confirmed
  source: >-
    Brown, Johnson and Brownstead, arXiv:1809.08459, Table 1, column "Very Fine Silt" (values
    attributed there to APL-UW TR 9407; attenuation at 20 kHz; spectral strength in m^(4 - gamma)).
  assumptions: >-
    Water density 1000 kg/m3 and sound speed 1500 m/s used to form the ratios (not printed in
    the paper). Supported by UnderwaterAcoustics.jl (src/stdlib.jl:134, "VeryFineSilt"):
    1173.38 / 1023 = 1.1470 and 1503.09 / 1528 = 0.9837 against 1.147 and 0.984 here; its loss
    parameter 0.00194 is 2.4 % above the 0.001893 that follows from the paper's two-digit
    1.4 dB/m. "Vol. Scat. Strength [dB/m]" read as 10 log10 of the volume cross section per
    unit volume in 1/m.

placeholder_sand:
  rho: 1.9
  nu: 1.1
  delta: 0.0147
  w2: 2.0e-5
  gamma2: 3.25
  sigma2: 0.002
  status: unconfirmed
  source: >-
    Not a measured or published sediment. Density, speed and loss are the values the
    scenarios already use for a sand bottom (1.9, 1650 m/s, 0.8 dB per wavelength); roughness
    and volume numbers were chosen to give about -30 dB backscattering strength at 20 degrees
    and 100 kHz.


# --- Entries read from UnderwaterAcoustics.jl (density, sound speed, loss) --------------------
# Read from UnderwaterAcoustics.jl (org-arl, MIT licence), src/stdlib.jl lines 113-136, commit
# 7b9c47e (2026-11-12), whose comment reads "seabeds from APL-UW TR 9407 (1994), IV-6 Table 2;
# ratios evaluated wrt reference rho=1023, c=1528". Each line there is
# FluidBoundary(density kg/m3, sound speed m/s, dimensionless loss parameter); the numbers
# are copied as printed and the reference water is the one that comment states. TR 9407 was
# not read. The loss parameter is the one of src/basic.jl:171 (dB per wavelength /
# (40 pi / ln 10)), the same as `delta` here. Its rows MediumSand and VeryFineSilt are the two
# complete entries above and are not repeated.

rock:
  reflection:
    density: 2557.50
    sound_speed: 3820.00
    delta: 0.01374
    water_density: 1023.0
    water_sound_speed: 1528.0
    shear_speed: 1900.0
    shear_delta: 0.085
  reflection_only: true
  unconfirmed_fields: [shear]
  note: >-
    An elastic solid (A8): with shear_speed the flat-interface reflection is Jackson and Richardson
    (2007) (9.34)-(9.40) (bottom.reflection, propagation.rayleigh_reflection, Bellhop's shear column).
    shear_speed 1900 m/s and shear_delta 0.085 are the "generic rock" of Olson, Lyons and Saebo,
    arXiv:1601.06078, Table II (this file's header; they attribute it to TR 9407 Table IV.2, not read:
    via secondary), the best-sourced rock shear values the notes name
    (docs/references/jackson_richardson_2007/03_wave_theories_reflection_penetration.md Sec. 3.3 and
    WP4; 01_sediment_properties.md Sec. 3.4, WP-C). That rock has 3600 m/s and 2500 kg/m3; this row's
    compressional speed and density are UnderwaterAcoustics.jl's, so 1900 / 3820 = 0.50 of V_p, inside
    J&R Sect. 5.6's printed 40-60 % (p. 169): putting the two sources together is ours, hence
    unconfirmed. Per bounce 1.6 / 2.9 / 5.5 / 14.6 / 8.8 / 6.3 / 4.5 dB at 5 / 10 / 20 / 30 / 40 / 45 / 60
    degrees, as a fluid 0.0 to 0.1 dB (tests/python/test_elastic_bottom.py). The fluid half-space of
    this row stays selectable: image_source bottom {sediment: rock, shear_speed: 0}, Bellhop
    environment {sediment: rock, elastic: false}, the live chain's coverage and multipath_depth
    bottom {sediment: rock, shear_speed: 0} (they take the row as elastic otherwise).
  empirical_backscatter:
    model: lambert
    mu_db: -16.0
    mu_db_range: [-23.0, -10.0]
    basis: >-
      Lambert's law, strength = mu sin^2(grazing), fitted to measurements on rock: mu = -13 dB
      (two sites) and -18 dB (two sites) on glacially plucked, very rough rock at 100 kHz (Olson,
      Lyons and Saebo, arXiv:1601.06078, results and conclusion); average -23 dB (-24 to -22 dB
      with the measured bottom slope) on granodiorite outcrops at 200 kHz, 10 to 65 degrees
      (Gruber, MS thesis, Naval Postgraduate School, 2019, https://hdl.handle.net/10945/64176);
      about -13 dB at 45 degrees from 80 to 450 kHz with a calibrated echosounder (Fezzani,
      Berger, Le Bouffant and Lurton, Front. Remote Sens. 2025, doi:10.3389/frsen.2025.1574996,
      Sec. 3.3), which is mu = -10 dB. Smooth, glacially abraded rock is lower and not
      Lambertian: -33 to -26 dB at 20 degrees (arXiv:1601.06078). mu_db is the middle of the
      published range, our choice of a representative value; give the site's own where known.
      Energy conservation limits mu to 10 log10(1 / pi) = -5 dB.
    # A further reference, not used: Jackson and Richardson (2007), Ch. 12 (pp. 324-326), fit Lambert's
    # law to rock data at mu = -5.6 dB (10.4 dB above mu_db here), with the book's caveat that its rock
    # data are sparse and older and include TR 9407 levels that exceed the energy bound (-4.97 dB).
    # (docs/references/jackson_richardson_2007/04_scattering_models.md Sec. 3.5)
  status: confirmed
  source: >-
    UnderwaterAcoustics.jl (MIT), src/stdlib.jl:115, "Rock"; attributed there to APL-UW
    TR 9407 (1994), IV-6 Table 2.

pebbles:
  reflection:
    density: 2557.50
    sound_speed: 2750.40
    delta: 0.01374
    water_density: 1023.0
    water_sound_speed: 1528.0
  reflection_only: true
  empirical_backscatter:
    model: lambert
    mu_db: -9.0
    mu_db_range: [-10.0, -8.0]
    valid_from_hz: 150.0e+3
    basis: >-
      Lambert's law with the level of the one open statement found: "coarse sediments, such as
      maerl, pebbles, and boulders, can exhibit backscatter levels exceeding those of rock at
      high frequencies (> 200 kHz), reaching values between -13 dB and -11 dB" at 45 degrees
      (Fezzani et al. 2025, doi:10.3389/frsen.2025.1574996, Sec. 3.4, comparing with Weber and
      Ward 2015 and Trzcinska et al. 2021, neither opened), i.e. mu = -10 to -8 dB. One angle
      and a narrative statement, not a measured curve: unconfirmed below about 150 kHz and
      away from 45 degrees.
    # A further reference, not used: Jackson and Richardson (2007), Ch. 12 (pp. 324-326), fit Lambert's
    # law to gravel data at mu = -11.7 dB (2.7 dB below mu_db here), from sparse, older data; the book
    # says no experiment has characterised a gravel or rock seafloor (p. 362).
    # (docs/references/jackson_richardson_2007/04_scattering_models.md Sec. 3.5)
  unconfirmed_fields: [empirical_backscatter]
  status: confirmed
  source: >-
    UnderwaterAcoustics.jl (MIT), src/stdlib.jl:116, "Pebbles"; attributed there to APL-UW
    TR 9407 (1994), IV-6 Table 2.

sandy_gravel:
  reflection:
    density: 2549.32
    sound_speed: 2042.94
    delta: 0.01705
    water_density: 1023.0
    water_sound_speed: 1528.0
  mean_grain_size_phi: -1.0
  scattering:
    w2_cm4: 0.0129375
    gamma2: 3.25
    sigma2: 0.002
  provenance:
    rho_nu_delta: "tabulated (UnderwaterAcoustics.jl; the same ratios are printed in Cintron 2001, Table 1)"
    mean_grain_size_phi: 'tabulated (Cintron 2001, Table 1, row "Sandy Gravel", bulk grain size index -1)'
    w2: >-
      regression against grain size (Snellen et al. 2013, eq. (5), spectral strength in cm^4 with a
      1 cm reference length; converted by bottom.w2_from_cm4). Snellen et al. (2011) Table II prints 0.0129 cm^4 and 0.002 for this grain size.
    gamma2: "single value for all sediments (Snellen, Siemes and Simons 2011, Sec. II.A, citing the handbook)"
    sigma2: "step in grain size (Snellen et al. 2013, text after eq. (5); 0.002 below 5.5 phi, 0.001 from 5.5 phi)"
  status: confirmed
  note: >-
    Sound speed corrected. UnderwaterAcoustics.jl's table line prints 2073.50 m/s (a ratio of
    1.3570), but three other prints of the same row give 1.337: two tests in that repository
    (test/test_pekeris.jl:229, FluidBoundary(2.492 * 1023, 1.3370 * 1528, 0.01705);
