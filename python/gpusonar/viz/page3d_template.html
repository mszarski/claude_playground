<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>%TITLE%</title><link rel="icon" href="data:,">
<style>
:root{--bg:#f4f4f1;--ink:#1d1d1b;--muted:#5d5d58;--panel:rgba(255,255,255,.93);--line:#d6d6d0;--acc:#2a78d6}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#15171a;--ink:#e8e8e4;--muted:#a3a39d;--panel:rgba(30,32,36,.93);--line:#3a3d42}}
:root[data-theme="dark"]{--bg:#15171a;--ink:#e8e8e4;--muted:#a3a39d;--panel:rgba(30,32,36,.93);--line:#3a3d42}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:12.5px/1.4 system-ui,sans-serif;overflow:hidden}
#view{position:absolute;inset:0}
#labels{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.lab{position:absolute;left:0;top:0;white-space:nowrap;font-size:11px;padding:1px 4px;border-radius:3px;background:rgba(255,255,255,.75);color:#1d1d1b;margin:-9px 0 0 6px}
.lab.surf{color:#174f86}.lab.bed{color:#6b4518}.lab.tgt{color:#a8201a;font-weight:600}.lab.beam{color:#1f5fae}.lab.arr{color:#333}
.panel{position:absolute;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:8px 10px;box-sizing:border-box}
#info{left:16px;top:16px;width:min(380px,calc(100% - 32px));max-height:calc(100% - 128px);overflow:auto}
#pick{right:16px;top:16px;width:min(360px,calc(100% - 32px));max-height:calc(100% - 128px);overflow:auto}
#ctl{left:16px;bottom:16px;right:16px;display:flex;gap:6px 14px;flex-wrap:wrap;align-items:center}
#ctl input[type=range]{width:min(220px,40vw);vertical-align:middle}
h1{font-size:15px;margin:0 0 2px} h2{font-size:12.5px;margin:8px 0 2px}
.m{color:var(--muted)} table{border-collapse:collapse;font-size:11.5px;width:100%} td,th{padding:1px 5px 1px 0;vertical-align:top;text-align:left}
tr.row{cursor:pointer} tr.row:hover{background:rgba(42,120,214,.12)}
.sw{display:inline-block;width:16px;height:3px;vertical-align:middle;margin-right:5px}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;vertical-align:middle;margin-right:5px}
details{margin-top:6px} summary{cursor:pointer;font-weight:600}
label.t{display:inline-block;margin-right:10px;white-space:nowrap}
button,select{font:inherit} a{color:var(--acc)}
.warn{color:#b0451b}
#snd{right:16px;bottom:96px;width:min(460px,calc(100% - 32px))}
#snd canvas{width:100%;height:150px;display:block;background:#000;border-radius:3px;margin-top:4px}
#snd .row{display:flex;gap:4px 10px;flex-wrap:wrap;align-items:center}
#chn{left:16px;bottom:76px;width:min(600px,calc(100% - 32px));max-height:44%;overflow:auto}
#chn canvas{width:100%;height:120px;display:block;background:#fff;border:1px solid var(--line);border-radius:3px;margin-top:4px}
body.haschain #info{max-height:calc(56% - 110px)}
@media (max-width:700px){#pick{top:auto;bottom:120px;max-height:40%}#snd{bottom:140px}#chn{max-height:35%}}
</style></head><body>
<div id="view"></div><div id="labels"></div>
<div class="panel" id="info"></div>
<div class="panel" id="pick" hidden></div>
<div class="panel" id="snd" hidden></div>
<div class="panel" id="chn" hidden></div>
<div class="panel" id="ctl">
 <button id="play" title="move a dot along every ray">play</button>
 <label>time <input id="time" type="range" min="0" max="1000" value="1000"> <span id="tval"></span></label>
 <label>depth x <input id="vex" type="range" min="1" max="60" value="1"> <span id="vval"></span></label>
 <button id="truescale" title="vertical exaggeration 1">true scale</button>
 <button id="zarr" title="zoom to the hydrophones">zoom to array</button>
 <button id="zall">whole scene</button>
 <label>hydrophone <select id="hsel"><option value="-1">none</option></select></label>
 <span id="pingbox"></span>
 <span class="m">drag: turn · right-drag or shift-drag: pan · wheel: zoom · click a ray or a hydrophone</span>
</div>
%LIB%
%AUDIO%
<script type="application/json" id="trace">%DATA%</script>
<script type="module">
%LOADER%
const D = JSON.parse(document.getElementById('trace').textContent);
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fx = (v, n=1) => (v == null || !isFinite(v)) ? '–' : (+v).toFixed(n);
const CLS = {direct:['#2a78d6','direct'], surface:['#1baf7a','surface bounces only'], bottom:['#eb6834','bottom bounces only'], both:['#8e5cc4','surface and bottom']};
const cls = (ns,nb) => ns===0&&nb===0?'direct':nb===0?'surface':ns===0?'bottom':'both';
const ROWC = ['#1d1d1b','#c2185b','#00838f','#7b5e00','#5e35b1'];
const E = D.environment, S3 = D.scene3d || {}, B = D.beams, M = S3.motion;
const H = D.sonar.hydrophones, PJ = D.sonar.projector;
const ref = H.reduce((a,p)=>a.map((v,i)=>v+p[i]/H.length),[0,0,0]);
const allPts = [PJ, ...H, ...D.targets.map(t=>t.position), ...(D.oneway||[]).map(o=>o.position), ...((M&&M.track)||[])];
let box = S3.box;
if (!box){ const xs=allPts.map(p=>p[0]), ys=allPts.map(p=>p[1]); const m=Math.max(0.15*Math.max(Math.max(...xs)-Math.min(...xs),Math.max(...ys)-Math.min(...ys)),1);
  box=[Math.min(...xs)-m,Math.max(...xs)+m,Math.min(...ys)-m,Math.max(...ys)+m]; }
const ox=(box[0]+box[1])/2, oy=(box[2]+box[3])/2, WX=box[1]-box[0], WY=box[3]-box[2], span=Math.max(WX,WY,1);
const zMaxPts = Math.max(...allPts.map(p=>p[2]), 0);
let zBed = E.bottom_z ?? E.bottom_z_site ?? null;
if (S3.bed_grid) zBed = Math.max(...S3.bed_grid.z.flat());
const zRef = zBed ?? Math.max(zMaxPts*1.2, 1);
const zTop = Math.min(E.surface_z ?? 0, ...allPts.map(p=>p[2])), zBot = Math.max(zRef, zMaxPts), zSpan = Math.max(zBot-zTop, 1e-3);
const L = p => new THREE.Vector3(p[1]-oy, -p[2], -(p[0]-ox));      // NED (x north, y east, z down) to three.js (X east, Y up, Z south)
const LD = d => new THREE.Vector3(d[1], -d[2], -d[0]);

// ---------- renderer, scene, camera, our own orbit controls ----------
const view = $('view');
const renderer = new THREE.WebGLRenderer({antialias:true, preserveDrawingBuffer:true});
renderer.setPixelRatio(window.devicePixelRatio); view.appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(getComputedStyle(document.body).backgroundColor);
const camera = new THREE.PerspectiveCamera(40, 1, 0.01, 1e7);
scene.add(new THREE.AmbientLight(0xffffff, 1.6)); const dl = new THREE.DirectionalLight(0xffffff, 1.4); dl.position.set(0.4,1,0.3); scene.add(dl);
const world = new THREE.Group(); scene.add(world);
const G = {}; for (const k of ['surface','bed','beams','projpat','array','targets','motion','rays','oneway','direct','chain']) { G[k]=new THREE.Group(); world.add(G[k]); }
let vex = 1;
const ctl = {target:new THREE.Vector3(), az:0.85, el:0.45, dist:1.7*span};
function place(){ const c=ctl; camera.position.set(c.target.x+c.dist*Math.cos(c.el)*Math.sin(c.az), c.target.y+c.dist*Math.sin(c.el), c.target.z+c.dist*Math.cos(c.el)*Math.cos(c.az));
  camera.near=Math.max(c.dist*1e-3,1e-4); camera.far=c.dist*50+span*20; camera.updateProjectionMatrix(); camera.lookAt(c.target); }
function resize(){ const w=view.clientWidth, h=view.clientHeight; renderer.setSize(w,h); camera.aspect=w/Math.max(h,1); camera.updateProjectionMatrix(); }
let drag=null, down=null;
renderer.domElement.addEventListener('contextmenu', e=>e.preventDefault());
renderer.domElement.addEventListener('pointerdown', e=>{ drag={x:e.clientX,y:e.clientY,pan:e.button===2||e.shiftKey}; down={x:e.clientX,y:e.clientY}; });
window.addEventListener('pointerup', e=>{ if (down && Math.hypot(e.clientX-down.x, e.clientY-down.y)<5 && e.target===renderer.domElement) pick(e); drag=null; down=null; });
window.addEventListener('pointermove', e=>{ if(!drag) return; const dx=e.clientX-drag.x, dy=e.clientY-drag.y; drag.x=e.clientX; drag.y=e.clientY;
  if (drag.pan){ const s=ctl.dist*0.0016, r=new THREE.Vector3().setFromMatrixColumn(camera.matrix,0), u=new THREE.Vector3().setFromMatrixColumn(camera.matrix,1);
    ctl.target.addScaledVector(r,-dx*s).addScaledVector(u,dy*s); }
  else { ctl.az-=dx*0.005; ctl.el=Math.max(-1.5,Math.min(1.5,ctl.el+dy*0.005)); }
  place(); draw(); });
renderer.domElement.addEventListener('wheel', e=>{ e.preventDefault(); ctl.dist=Math.max(1e-3, ctl.dist*Math.exp(e.deltaY*0.0012)); place(); draw(); }, {passive:false});

// ---------- glyphs and labels ----------
const disc = (()=>{ const c=document.createElement('canvas'); c.width=c.height=64; const g=c.getContext('2d'); g.beginPath(); g.arc(32,32,27,0,2*Math.PI); g.fillStyle='#fff'; g.fill(); g.lineWidth=5; g.strokeStyle='rgba(0,0,0,.55)'; g.stroke(); return new THREE.CanvasTexture(c); })();
function points(list, color, size, opts={}){ const g=new THREE.BufferGeometry().setFromPoints(list.map(L));
  const m=new THREE.PointsMaterial({color, size, sizeAttenuation:false, map:disc, alphaTest:0.5, transparent:true, depthTest:opts.depthTest??true});
  if (opts.colors){ g.setAttribute('color', new THREE.Float32BufferAttribute(opts.colors.flatMap(c=>new THREE.Color(c).toArray()),3)); m.vertexColors=true; m.color.set(0xffffff); }
  const p=new THREE.Points(g,m); p.renderOrder=5; return p; }
function line(list, color, opts={}){ const g=new THREE.BufferGeometry().setFromPoints(list.map(L));
  const m = opts.dashed ? new THREE.LineDashedMaterial({color, dashSize:opts.dash||span/90, gapSize:(opts.dash||span/90)*0.7, transparent:true, opacity:opts.opacity??1})
                        : new THREE.LineBasicMaterial({color, transparent:true, opacity:opts.opacity??1});
  const l=new THREE.Line(g,m); if (opts.dashed) l.computeLineDistances(); return l; }
const LABELS=[]; let showLabels=true;
function label(text, p, klass, layer, near){ const el=document.createElement('div'); el.className='lab '+(klass||''); el.textContent=text; $('labels').appendChild(el); LABELS.push({el, v:L(p), layer, near}); return el; }
function placeLabels(){ const w=view.clientWidth, h=view.clientHeight; world.updateMatrixWorld();
  for (const l of LABELS){ const on = showLabels && (!l.layer || G[l.layer].visible) && !l.off && (!l.near || ctl.dist < l.near);
    if (!on){ l.el.style.display='none'; continue; }
    const v=l.v.clone().applyMatrix4(world.matrixWorld).project(camera);
    if (v.z>1||v.z<-1||Math.abs(v.x)>1.05||Math.abs(v.y)>1.05){ l.el.style.display='none'; continue; }
    l.el.style.display=''; l.el.style.transform=`translate(${((v.x+1)/2*w).toFixed(1)}px,${((1-v.y)/2*h).toFixed(1)}px)`; } }

// ---------- surface ----------
const free = D.tier==='free_field';
function hplane(z, color, op, group){ const m=new THREE.Mesh(new THREE.PlaneGeometry(WY,WX), new THREE.MeshBasicMaterial({color, transparent:true, opacity:op, side:THREE.DoubleSide, depthWrite:false}));
  m.rotation.x=-Math.PI/2; m.position.set(0,-z,0); group.add(m); return m; }
function grid(z, color, op, group, n=10){ const v=[]; for(let i=0;i<=n;i++){ const a=box[0]+WX*i/n, b=box[2]+WY*i/n; v.push(L([a,box[2],z]),L([a,box[3],z]),L([box[0],b,z]),L([box[1],b,z])); }
  group.add(new THREE.LineSegments(new THREE.BufferGeometry().setFromPoints(v), new THREE.LineBasicMaterial({color, transparent:true, opacity:op}))); }
const sz = E.surface_z ?? 0;
const hasSurface = !free && !(D.tier==='sediment');
hplane(sz, 0x3d8fd6, hasSurface?0.13:0.035, G.surface); grid(sz, 0x3d8fd6, hasSurface?0.45:0.15, G.surface);
let surfText = hasSurface ? 'sea surface: pressure release, R = −1' : 'sea surface: not in the propagation (' + (free?'free field':'sediment tier') + ')';
if (E.wind_speed_propagation>0) surfText += `; coherent loss of wind ${E.wind_speed_propagation} m/s`;
if (E.surface && E.surface.rms_height){ const h=E.surface.rms_height; hplane(sz-h, 0x3d8fd6, 0.06, G.surface); hplane(sz+h, 0x3d8fd6, 0.06, G.surface);
  surfText += `; rms height ±${fx(h,3)} m` + (E.surface.wind_speed?` (wind ${E.surface.wind_speed} m/s)`:'') + ' (time spreading)'; }
label(surfText, [box[1], box[2], sz], 'surf', 'surface');

// ---------- bed ----------
const SAND0=new THREE.Color('#e3c48d'), SAND1=new THREE.Color('#7d5427');
function bedMesh(V, Z, nx, ny, op){ const g=new THREE.BufferGeometry(); const pos=[], col=[], idx=[]; const z0=Math.min(...Z), z1=Math.max(...Z);
  V.forEach((p,i)=>{ pos.push(...L(p).toArray()); const c=SAND0.clone().lerp(SAND1, z1>z0?(Z[i]-z0)/(z1-z0):0.5); col.push(c.r,c.g,c.b); });
  for(let j=0;j<ny-1;j++) for(let i=0;i<nx-1;i++){ const a=j*nx+i; idx.push(a,a+1,a+nx, a+1,a+nx+1,a+nx); }
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos,3)); g.setAttribute('color', new THREE.Float32BufferAttribute(col,3)); g.setIndex(idx); g.computeVertexNormals();
  const m=new THREE.Mesh(g, new THREE.MeshLambertMaterial({vertexColors:true, transparent:true, opacity:op, side:THREE.DoubleSide})); G.bed.add(m);
  const lv=[]; const st=Math.max(1,Math.round(nx/12));
  for(let j=0;j<ny;j+=st) for(let i=0;i<nx-1;i++) lv.push(L(V[j*nx+i]),L(V[j*nx+i+1]));
  for(let i=0;i<nx;i+=st) for(let j=0;j<ny-1;j++) lv.push(L(V[j*nx+i]),L(V[(j+1)*nx+i]));
  G.bed.add(new THREE.LineSegments(new THREE.BufferGeometry().setFromPoints(lv), new THREE.LineBasicMaterial({color:0x5a3a14, transparent:true, opacity:0.35}))); }
const bot = E.bottom || {};
const botText = bot.coefficient!=null ? `constant |R| = ${fx(bot.coefficient,3)}` : bot.speed ? `fluid half-space ${fx(bot.speed,0)} m/s, density ${fx(bot.density,2)}, attenuation ${fx(bot.attenuation,2)} dB/λ`+(bot.shear_speed?`, shear ${fx(bot.shear_speed,0)} m/s (elastic)`:'')+(E.critical_angle_deg?`; critical angle ${fx(E.critical_angle_deg,1)}°`:'') : '';
if (S3.bed_grid){ const bg=S3.bed_grid, V=[], Z=[]; bg.y.forEach((y,j)=>bg.x.forEach((x,i)=>{ V.push([x,y,bg.z[j][i]]); Z.push(bg.z[j][i]); }));
  bedMesh(V, Z, bg.x.length, bg.y.length, 0.88);
  const jm=Z.indexOf(Math.min(...Z)); label(`3-D bed (Bellhop3D's grid): ${fx(Math.min(...Z),0)} to ${fx(Math.max(...Z),0)} m; ${botText}`, V[jm], 'bed', 'bed'); }
else if (E.bathymetry && E.bathymetry.length>1){ const prof=E.bathymetry;
  const dep=r=>{ if (r<=prof[0][0]) return prof[0][1]; for(let i=1;i<prof.length;i++) if (prof[i][0]>=r){ const w=(r-prof[i-1][0])/Math.max(prof[i][0]-prof[i-1][0],1e-9); return prof[i-1][1]+w*(prof[i][1]-prof[i-1][1]); } return prof[prof.length-1][1]; };
  const n=61, V=[], Z=[]; for(let j=0;j<n;j++) for(let i=0;i<n;i++){ const x=box[0]+WX*i/(n-1), y=box[2]+WY*j/(n-1), z=dep(Math.hypot(x-PJ[0], y-PJ[1])); V.push([x,y,z]); Z.push(z); }
  bedMesh(V, Z, n, n, 0.8);
  const far=D.targets.length? D.targets[0].position : [box[1],box[3],0], rf=Math.hypot(far[0]-PJ[0], far[1]-PJ[1]);
  label(`bed by range from the sonar (the same section on every bearing): ${fx(Math.min(...Z),0)} to ${fx(Math.max(...Z),0)} m; ${botText}`, [far[0], far[1], dep(rf)], 'bed', 'bed'); }
else if (E.planes){ for (const pl of E.planes){ if (pl.kind==='surface') continue; const n=pl.normal, q=pl.point, bnd=pl.bounds||[];
    const clamp=p=>{ for(const [ax,lo,hi] of bnd) p[ax]=Math.max(lo,Math.min(hi,p[ax])); return p; };
    let C;
    if (Math.abs(n[2])>0.5){ C=[[box[0],box[2]],[box[1],box[2]],[box[1],box[3]],[box[0],box[3]]].map(([x,y])=>clamp([x,y,q[2]-(n[0]*(x-q[0])+n[1]*(y-q[1]))/n[2]])); }
    else { const t=[-n[1],n[0]], tn=Math.hypot(...t); const tt=[t[0]/tn,t[1]/tn]; const s=[[box[0],box[2]],[box[1],box[2]],[box[1],box[3]],[box[0],box[3]]].map(c=>(c[0]-q[0])*tt[0]+(c[1]-q[1])*tt[1]);
      const s0=Math.min(...s), s1=Math.max(...s), zt=sz, zb=zRef*1.05; C=[[s0,zt],[s1,zt],[s1,zb],[s0,zb]].map(([u,z])=>clamp([q[0]+u*tt[0], q[1]+u*tt[1], z])); }
    const g=new THREE.BufferGeometry().setFromPoints([C[0],C[1],C[2],C[0],C[2],C[3]].map(L)); g.computeVertexNormals();
    const wall=pl.kind==='wall';
    G.bed.add(new THREE.Mesh(g, new THREE.MeshLambertMaterial({color: wall?0x8a8f96:0xc9a467, transparent:true, opacity: wall?0.4:0.8, side:THREE.DoubleSide, depthWrite:!wall})));
    G.bed.add(new THREE.LineLoop(new THREE.BufferGeometry().setFromPoints(C.map(L)), new THREE.LineBasicMaterial({color: wall?0x3d4148:0x5a3a14})));
    const mid=C.reduce((a,p)=>a.map((v,i)=>v+p[i]/4),[0,0,0]);
    label(wall ? `wall (a plane), |R| = ${fx(pl.coefficient,2)}` : `bed, tilted (slope ${E.bottom_slope? E.bottom_slope.map(v=>fx(v,4)).join(', '):''}); ${botText}`, mid, 'bed', 'bed'); } }
else if (E.interface){ const I=E.interface, zi=I.z, deep=Math.max(...D.targets.map(t=>t.position[2]), zi)+Math.max(0.3*(Math.max(...D.targets.map(t=>t.position[2]),zi)-zi), 0.05*span);
  hplane(zi, 0xb98a46, 0.45, G.bed); grid(zi, 0x7d5427, 0.4, G.bed);
  const slab=new THREE.Mesh(new THREE.BoxGeometry(WY, deep-zi, WX), new THREE.MeshBasicMaterial({color:0xb98a46, transparent:true, opacity:0.12, depthWrite:false})); slab.position.set(0, -(zi+deep)/2, 0); G.bed.add(slab);
  label(`sediment interface z = ${fx(zi,2)} m: ${fx(I.sediment_speed,0)} m/s, penetration ${I.penetration}`+(I.critical_deg?`; critical angle ${fx(I.critical_deg,1)}° (evanescent below)`:'')+(I.transmission!=null?`; transmission ${fx(I.transmission,3)}`:''), [box[1],box[2],zi], 'bed', 'bed'); }
else if (E.bottom_z!=null){ hplane(E.bottom_z, 0xc9a467, 0.75, G.bed); grid(E.bottom_z, 0x5a3a14, 0.4, G.bed);
  label(`bed z = ${fx(E.bottom_z,1)} m (flat): ${botText}`, [box[1],box[2],E.bottom_z], 'bed', 'bed'); }
else if (E.bottom_z_site!=null){ const z=E.bottom_z_site; G.bed.add(line([[box[0],box[2],z],[box[1],box[2],z],[box[1],box[3],z],[box[0],box[3],z],[box[0],box[2],z]], 0x8a6a3a, {dashed:true, dash:span/60}));
  label(`site depth ${fx(z,1)} m: no bottom in the propagation (${D.tier})`, [box[1],box[2],z], 'bed', 'bed'); }

// ---------- array, projector, beams, projector pattern ----------
const rowsZ=[...new Set(H.map(p=>Math.round(p[2]*20)/20))].sort((a,b)=>a-b);
const rowOf=H.map(p=>rowsZ.indexOf(Math.round(p[2]*20)/20));
const hydColors=H.map((p,i)=>ROWC[rowOf[i]%ROWC.length]);
const hydPts=points(H, 0xffffff, 7, {colors:hydColors}); G.array.add(hydPts);
const selPt=points([H[0]], 0xff00aa, 15, {depthTest:false}); selPt.visible=false; G.array.add(selPt);
G.array.add(points([PJ], 0x111111, 10));
label('projector', PJ, 'arr', 'array', Math.max(Math.hypot(PJ[0]-ref[0],PJ[1]-ref[1],PJ[2]-ref[2])*40, 1e-9));
const aperture = B?.aperture_m ?? Math.max(...H.map(p=>Math.hypot(p[0]-ref[0],p[1]-ref[1],p[2]-ref[2])))*2;
label(`array: ${H.length} hydrophone${H.length===1?'':'s'}` + (rowsZ.length>1?` in ${rowsZ.length} rows (z ${rowsZ.map(z=>fx(z,2)).join(', ')} m)`:'') + `, aperture ${fx(aperture,2)} m` + (B&&B.chain?.look?`, look ${B.chain.look}`:''), ref, 'arr', 'array');
if (B && H.length>1){ const La=Math.max(aperture*0.6, 0.3);
  G.array.add(new THREE.ArrowHelper(LD(B.axis), L(ref), La, 0x444444, La*0.1, La*0.04));
  G.array.add(new THREE.ArrowHelper(LD(B.broadside), L(ref), La, 0x2a78d6, La*0.1, La*0.04));
  label('array axis (+)', [ref[0]+B.axis[0]*La, ref[1]+B.axis[1]*La, ref[2]], 'arr', 'array', La*30);
  label(`look (${B.chain?.look ?? 'broadside'})`, [ref[0]+B.broadside[0]*La, ref[1]+B.broadside[1]*La, ref[2]], 'beam', 'array', La*30); }
const Rbeam = Math.max(...D.targets.map(t=>Math.hypot(t.position[0]-ref[0], t.position[1]-ref[1])), 0)*1.08 || span*0.45;

  return `<div class="m">ping ${k} of ${C.n_pings} (report ping ${P.ping}) · ${P.detections.length} detections, ${P.tracks.length} tracks${P.pings_without_nav?` · ${P.pings_without_nav} pings without navigation`:''} · chain ${fx(P.seconds*1e3,0)} ms on this CPU${T?` · tracker: ${T.association}, gate ${T.gate}σ: ${T.took.length} taken, ${born.length} born${born.length?' ('+born.join(', ')+')':''}, ${now.length} confirmed now${now.length?' ('+now.join(', ')+')':''}, ${drop.length} dropped${drop.length?' ('+drop.map(d=>d.id+': '+d.reason).join('; ')+')':''}`:''}</div>`
   + `<table><tr><th>id</th><th>kind</th><th>why (classifier evidence)</th><th>speed</th><th>seen</th><th>snr</th><th>truth, error</th></tr>`
   + P.tracks.map(t=>{ const e=ev[t.id], a=asc[t.id]; return `<tr><td>${t.id}</td><td><span class="dot" style="background:${KINDC[t.kind]||'#555'}"></span>${esc(t.kind)}${t.parent!=null?' of '+t.parent:''}</td><td class="m">${e?esc(e.rule.replace(/_/g,' '))+`: ${fx(e.speed,2)} m/s vs ${fx(e.need*e.speed_sigma,2)} (need ${fx(e.need,1)}σ), fit ${fx(e.fit_rms,1)}${e.limit!=null?'/'+fx(e.limit,1):''} m, ${e.fitted}/${e.rows} pts`+(e.later.length?'; then '+esc(e.later.join(', ')):''):'–'}</td><td>${fx(t.speed_m_s,2)}</td><td>${fx(t.seen,2)}</td><td>${fx(t.mean_snr_db,1)}</td><td>${a&&a.truth!=null?esc(a.truth)+', '+fx(a.error_m,1)+' m':'–'}</td></tr>`; }).join('') + `</table>`
   + (oth?`<div class="${oth.differences.length?'warn':'m'}">engine ${esc(oth.engine)} against ${esc(C.engine)}: ${oth.differences.length? oth.differences.length+' differences beyond the tolerances of tests/python/test_live_cpp.py: '+oth.differences.slice(0,6).map(esc).join('; ') : 'no difference beyond the tolerances of tests/python/test_live_cpp.py (counts, ids, kinds exact; ranges, bearings, positions and velocities 0.05)'}</div>`:''); }
function chainSet(k, play){ chainK=Math.max(0, Math.min(C.n_pings-1, k)); const st=chainDraw(chainK); $('chping').value=chainK; $('chval').textContent=`${chainK}`;
  $('chbody').innerHTML=chainHtml(chainK); chainProfile(chainK); draw();
  if (play && chainSound && C.audio){ const c=+($('hsel').value)>=0? +($('hsel').value) : C.audio.files[0].channel; const f=C.audio.files.find(x=>x.ping===chainK && x.channel===c) || C.audio.files.find(x=>x.ping===chainK);
    if (f){ if (!chainAudio) chainAudio=new Audio(); chainAudio.src=C.audio.dir+'/'+f.file; chainAudio.play().catch(()=>{}); $('chsnd').textContent=`h${f.channel}, ping ${chainK}`; } }
  return st; }
function chainZoom(){ if (!C) return; const P=C.pings[chainK], g=P.geometry, o=P.ownship, z=o[2];
  const dir=b=>{ const r=b*Math.PI/180; return [Math.sin(r)*g.axis[0]+Math.cos(r)*g.broadside[0], Math.sin(r)*g.axis[1]+Math.cos(r)*g.broadside[1]]; };
  const pts=[o, ...P.detections.map(d=>{ const u=dir(d.bearing_deg); return [o[0]+d.range_m*u[0], o[1]+d.range_m*u[1], z]; }), ...P.tracks.map(t=>[t.x,t.y,z]),
             ...C.truth.map(x=>x.positions[Math.min(chainK, x.positions.length-1)])];
  const xs=pts.map(p=>p[0]), ys=pts.map(p=>p[1]); const cx=(Math.min(...xs)+Math.max(...xs))/2, cy=(Math.min(...ys)+Math.max(...ys))/2;
  const size=Math.max(Math.max(...xs)-Math.min(...xs), Math.max(...ys)-Math.min(...ys), span*0.02);
  const c=L([cx,cy,z]); c.y*=vex; ctl.target.copy(c); ctl.dist=1.5*size; ctl.el=1.25; place(); draw(); }
window.__chainZoom = chainZoom;
if (C){ document.body.classList.add('haschain'); const pn=$('chn'); pn.hidden=false;
  const P0=C.pings[0]||{};
  pn.innerHTML = `<b>live chain</b> <span class="m">(${esc(C.engine)} engine · ${esc(C.config_source)}${C.quick?' · '+esc(C.quick):''} · taps: ${C.taps.length?esc(C.taps.join(', ')):'none'})</span>`
   + `<div><label>ping <input id="chping" type="range" min="0" max="${Math.max(C.n_pings-1,0)}" value="0" style="width:min(220px,40vw)"> <span id="chval"></span></label> <button id="chstep">step pings</button> <button id="chzoom">zoom to the chain</button>`
   + (C.audio?` <label class="t"><input type="checkbox" id="chsndon">sound per ping</label> <span class="m" id="chsnd"></span>`:` <span class="m">no sound per ping on this page</span>`) + `</div>`
   + `<div>${[['map','power map (fan)'],['det','detections'],['trk','tracks'],['truth','truth'],['cov','covariance (2σ)'],['gates','gates']].map(([k2,t])=>`<label class="t"><input type="checkbox" data-ch="${k2}" checked>${t}</label>`).join('')}</div>`
   + `<div class="m">detections coloured by snr (blue 10 dB to red 35 dB; green: the tone path, purple: both); tracks by kind (${Object.entries(KINDC).map(([k2,c])=>`<span style="color:${c}">■</span> ${k2}`).join(' ')}) with their history and velocity (3 ping intervals); green dots: the truth (${esc(C.truth_rule||'none')}), dashed: each track to its nearest object (the association error); purple ellipses: each track's 2σ covariance (grey: tentative); dashed: each track's gate (${P0.tracker?P0.tracker.gate:4}σ of the innovation) about the track predicted to its nearest detection (blue: that detection is inside it, grey: outside), solid blue: the detection it took. Labels: id and kind; the table below says why and how far from the truth. In the array's horizontal plane at each ping.</div>`
   + `<div id="chbody"></div><label class="m">detector along <select id="chbeam"><option value="">the strongest detection's bearing</option></select></label><canvas id="chcv"></canvas>`
   + (C.audio?`<div class="m">sound per ping: ${esc(C.audio.method_words)}</div>`:'')
   + `<div class="m">${esc(C.note||'')} <a href="${esc(D.links?.chain_png||'')}">2-D chain page</a></div>`;
  const m0=(C.pings.find(p=>p.map)||{}).map; if (m0) for (let i=0;i<m0.rows;i++){ const o=document.createElement('option'); o.value=String(i); o.textContent=`${fx(m0.b0+(i+0.5)*m0.db,1)}°`; $('chbeam').appendChild(o); }
  $('chbeam').addEventListener('change', ()=>chainProfile(chainK));
  $('chzoom').addEventListener('click', chainZoom);
  pn.querySelectorAll('[data-ch]').forEach(el=>el.addEventListener('change',()=>{ chainOn[el.dataset.ch]=el.checked; chainSet(chainK, false); }));
  $('chping').addEventListener('input', e=>chainSet(+e.target.value, true));
  if (C.audio) $('chsndon').addEventListener('change', e=>{ chainSound=e.target.checked; if (!chainSound && chainAudio) chainAudio.pause(); });
  // Stepping: one clock with the sound. With sound on, the next ping comes when this ping's sound ends (at least 0.4 s).
  const stepNext=()=>{ if (!chainStepper) return; const n=(chainK+1)%C.n_pings; chainSet(n, true);
    const wait = chainSound && chainAudio && !chainAudio.paused ? null : 700; if (wait) chainStepper=setTimeout(stepNext, wait); };
  $('chstep').addEventListener('click',()=>{ if (chainStepper){ clearTimeout(chainStepper); chainStepper=null; $('chstep').textContent='step pings'; if (chainAudio) chainAudio.pause(); return; }
    $('chstep').textContent='stop'; chainStepper=1; stepNext(); });
  if (C.audio){ chainAudio=new Audio(); chainAudio.addEventListener('ended', ()=>{ if (chainStepper) chainStepper=setTimeout(stepNext, 400); }); }
  chainSet(Math.max(C.n_pings-1,0), false); }

// ---------- vertical exaggeration, views ----------
const vin=$('vex'), vval=$('vval');
function setVex(v){ const old=vex; vex=Math.max(1, Math.min(60, Math.round(v))); world.scale.set(1, vex, 1); ctl.target.y*=vex/old; vin.value=vex; vval.textContent=vex+'x'+(vex===1?' (true scale)':''); place(); draw(); }
vin.addEventListener('input',()=>setVex(+vin.value));
$('truescale').addEventListener('click',()=>setVex(1));
function zoomAll(){ ctl.target.set(0, -(zTop+zBot)/2*vex, 0); ctl.dist=1.7*Math.max(span, zSpan*vex); ctl.az=0.85; ctl.el=0.45; place(); draw(); }
$('zall').addEventListener('click', zoomAll);
$('zarr').addEventListener('click',()=>{ const c=L(ref); c.y*=vex; ctl.target.copy(c);
  if (B) { ctl.az=Math.atan2(-B.broadside[1], B.broadside[0])+0.55; ctl.el=0.35; }   /* from behind the array, looking along its look */ ctl.dist=Math.max(aperture*2.2, 0.5, Math.hypot(PJ[0]-ref[0],PJ[1]-ref[1],(PJ[2]-ref[2])*vex)*3); place(); draw(); });

function draw(){ renderer.render(scene, camera); placeLabels(); }
window.addEventListener('resize',()=>{ resize(); draw(); });
setVex(Math.max(1, Math.min(60, Math.round(0.3*span/zSpan))));
resize(); zoomAll(); vis(); setTime(tMax*0.999); draw();
window.__page = {rays: RAYS.length, legRays: nDrawn, threeD: three_d.length, hydrophones: H.length, labels: LABELS.length, vex, audio: !!A, audioFiles: A ? A.files.length : 0,
  chain: C ? C.n_pings : 0};
// For a browser check (tools/page3d_check.js): the chain layer's drawn counts at a ping against the report lines'.
window.__chain = C ? {pings: C.n_pings, set: k => { const st=chainSet(k, false); return {k: chainK, drawn_detections: st.det, drawn_tracks: st.trk, truth: st.truth, ellipses: st.ell,
  gates: st.gates, map: st.map, report_detections: C.pings[chainK].report_counts?.detections, report_tracks: C.pings[chainK].report_counts?.tracks}; }} : null;
// For a browser check (tests/python/test_scene_audio.py): the clock and the lit hydrophones.
window.__viz = {setTime: t => { setTime(t); draw(); return litNow.slice(); }, lit: () => litNow.slice(), win: WIN, tMax, t2a, a2t,
  sound: () => A ? {hyd: sndHyd, kind: sndKind, src: audioEl.getAttribute('src')} : null, setSound: (c,k) => { setSound(c,k); return {hyd: sndHyd, kind: sndKind}; }};
// For a browser check (tools/page3d_check.js, tests): where on the screen a drawn ray's middle vertex is.
window.__screenOfRay = i => { const x=RAYS[i]; if (!x) return null; world.updateMatrixWorld(); const v=L(x.r.line[Math.floor(x.r.line.length/2)]).applyMatrix4(world.matrixWorld).project(camera);
  const r=renderer.domElement.getBoundingClientRect(); return [r.left+(v.x+1)/2*r.width, r.top+(1-v.y)/2*r.height]; };
window.__ready = true;
</script></body></html>
