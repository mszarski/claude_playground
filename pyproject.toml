[project]
name = "reachy-motion-recreation"
version = "0.1.0"
description = "Recreation of text-to-motion for Reachy Mini: an LLM writes a motion recipe, a flow-matching transformer turns it into reachable 25 Hz motion"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = ["numpy>=1.26", "scipy>=1.11"]

[project.optional-dependencies]
ik = ["reachy-mini-rust-kinematics>=1.0.3"]
generator = ["torch>=2.3"]
hf = ["huggingface-hub>=0.24", "datasets"]
render = ["mujoco>=3.3", "imageio[ffmpeg]>=2.34", "pillow>=10"]   # + `pip install --no-deps reachy-mini`
serve = ["fastapi>=0.110", "uvicorn>=0.29"]
planner = ["transformers>=5.5", "peft>=0.18", "trl>=0.29", "datasets", "accelerate"]
dev = ["pytest"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["rmr", "rmr.generator", "rmr.planner", "rmr.renderer"]

[tool.setuptools.package-data]
rmr = ["assets/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
