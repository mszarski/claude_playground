:root {
  color-scheme: dark;
  --bg: #0e140e;
  --panel: #1c2a1a;
  --panel2: #253822;
  --edge: #070b07;
  --hi: #3e5a36;
  --text: #e8f0d8;
  --dim: #9ab08a;
  --gold: #f8d040;
  --red: #e04838;
  --green: #7ad04a;
  --blue: #70b8f0;
  --orange: #f0a030;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--text);
  font-family: 'VT323', 'Courier New', monospace; font-size: 18px; user-select: none; -webkit-user-select: none; }
#view { position: absolute; inset: 0; width: 100%; height: 100%; image-rendering: pixelated; cursor: crosshair; display: block; touch-action: none; }
/* only the map takes over touch gestures; menus and panels scroll normally */
#minimap, #zoomBtns, #topbar, #toolbar { touch-action: manipulation; }
.px { font-family: 'Press Start 2P', monospace; }
.panel { background: var(--panel); border: 3px solid var(--edge); box-shadow: inset 0 0 0 2px var(--hi), 0 4px 0 rgba(0,0,0,0.4); }
button { font-family: 'VT323', monospace; font-size: 18px; color: var(--text); background: var(--panel2); border: 2px solid var(--edge);
  box-shadow: inset 0 -3px 0 rgba(0,0,0,0.35), inset 0 2px 0 rgba(255,255,255,0.08); padding: 2px 8px; cursor: pointer; line-height: 1.1; }
button:hover { background: #33492e; }
button:active { box-shadow: inset 0 3px 0 rgba(0,0,0,0.35); }
button.on { background: #5a7a2a; color: #fff; box-shadow: inset 0 0 0 2px var(--gold); }
button.danger { background: #7a2018; }
button.danger:hover { background: #9a2a1e; }
button:disabled { opacity: 0.45; cursor: default; }
/* a locked menu entry stays solid so it reads over the title art; only the text dims */
#title .menu button:disabled { opacity: 1; color: #7a8a6a; background: #1a2a18; }
#title .menu button:disabled small { opacity: 0.75; }

/* top bar */
#topbar { position: absolute; top: 0; left: 0; right: 0; height: 44px; display: flex; align-items: center; gap: 10px; padding: 0 8px; z-index: 10;
  background: linear-gradient(#24361f, #172414); border-bottom: 3px solid var(--edge); box-shadow: 0 2px 0 var(--hi); white-space: nowrap; overflow-x: auto; overflow-y: hidden; scrollbar-width: none; }
#topbar::-webkit-scrollbar { display: none; }
#logo { font-family: 'Press Start 2P'; font-size: 11px; color: var(--gold); text-shadow: 2px 2px 0 #7a2010; letter-spacing: 1px; line-height: 1.2; }
#logo small { display: block; font-size: 7px; color: var(--orange); text-shadow: none; }
.stat { display: flex; flex-direction: column; line-height: 0.95; padding: 0 6px; border-left: 2px solid #0a120a; }
.stat .k { font-size: 13px; color: var(--dim); }
.stat .v { font-size: 21px; }
.stat .v.neg { color: var(--red); }
#stars { color: var(--gold); letter-spacing: -1px; font-size: 20px; }
#powerbar { width: 70px; height: 8px; background: #000; border: 1px solid #444; margin-top: 3px; position: relative; }
#powerbar i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--gold); }
.pbar { width: 70px; height: 8px; background: #000; border: 1px solid #444; margin-top: 5px; position: relative; }
.pbar i { position: absolute; left: 0; top: 0; bottom: 0; background: #9a7ac8; }
.rgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 6px; }
.rcard { padding: 6px 8px; background: var(--panel2); border: 2px solid var(--edge); font-size: 16px; display: flex; flex-direction: column; gap: 2px; }
.rcard .nm { font-family: 'Press Start 2P'; font-size: 8px; color: var(--gold); line-height: 1.4; }
.rcard.done { opacity: 0.6; box-shadow: inset 0 0 0 2px var(--green); }
.rcard.locked { opacity: 0.45; }
.rcard.active { box-shadow: inset 0 0 0 2px #9a7ac8; }
.spacer { flex: 1; }
.grp { display: flex; gap: 3px; }
#alarmBtn { background: #6a1810; font-weight: bold; }
#alarmBtn.on { animation: blink 0.5s steps(2) infinite; background: #e02010; box-shadow: inset 0 0 0 2px #fff; }
@keyframes blink { 50% { background: #600; } }

/* alert strip */
#alerts { position: absolute; top: calc(var(--top, 44px) + 6px); left: 50%; transform: translateX(-50%); z-index: 9; display: flex; flex-direction: column; gap: 4px; align-items: center; pointer-events: none; }
.alert { pointer-events: auto; font-family: 'Press Start 2P'; font-size: 10px; padding: 7px 12px; border: 3px solid #000; cursor: pointer; display: flex; gap: 10px; align-items: center; }
.alert.red { background: #b01e10; color: #fff; animation: pulse 0.8s steps(2) infinite; }
.alert.amber { background: #c88010; color: #1a0a00; }
.alert.blue { background: #2a5a9a; color: #fff; }
.alert button { font-size: 16px; padding: 0 6px; }
@keyframes pulse { 50% { background: #7a0e06; } }

/* toast */
#toasts { position: absolute; top: calc(var(--top, 44px) + 52px); left: 50%; transform: translateX(-50%); z-index: 8; display: flex; flex-direction: column; gap: 4px; align-items: center; pointer-events: none; }
.toast { font-size: 18px; padding: 4px 14px; background: rgba(10,16,10,0.92); border: 2px solid var(--edge); box-shadow: inset 0 0 0 2px var(--hi); transition: opacity 0.5s; max-width: 80vw; text-align: center; }
.toast.bad { box-shadow: inset 0 0 0 2px var(--red); color: #ffd0c8; }
.toast.good { box-shadow: inset 0 0 0 2px var(--green); }
.toast.goal { box-shadow: inset 0 0 0 2px var(--gold); color: var(--gold); }
.toast.warn { box-shadow: inset 0 0 0 2px var(--orange); color: #ffe0b0; }

/* toolbar */
#toolbar { position: absolute; left: 6px; top: calc(var(--top, 44px) + 10px); z-index: 10; display: flex; flex-direction: column; gap: 4px; padding: 5px; }

<script>
// ---------- Utilities: RNG, noise, math helpers ----------
'use strict';

function mulberry32(seed) {
  let a = seed >>> 0;
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

let RNG = mulberry32(Date.now() & 0xffffffff);
const rand = () => RNG();
const randi = (a, b) => a + Math.floor(RNG() * (b - a + 1));
const randf = (a, b) => a + RNG() * (b - a);
const chance = (p) => RNG() < p;
const pick = (arr) => arr[Math.floor(RNG() * arr.length)];
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const dist2 = (ax, ay, bx, by) => (ax - bx) * (ax - bx) + (ay - by) * (ay - by);
const dist = (ax, ay, bx, by) => Math.sqrt(dist2(ax, ay, bx, by));

function weightedPick(items, weightFn) {
  let total = 0;
  for (const it of items) total += Math.max(0, weightFn(it));
  if (total <= 0) return null;
  let r = RNG() * total;
  for (const it of items) {
    r -= Math.max(0, weightFn(it));
    if (r <= 0) return it;
  }
  return items[items.length - 1];
}

// Value noise (seeded) for terrain generation
function makeNoise(seed) {
  const r = mulberry32(seed);
  const SIZE = 256;
  const perm = new Uint8Array(SIZE * 2);
  const vals = new Float32Array(SIZE);
  for (let i = 0; i < SIZE; i++) { perm[i] = i; vals[i] = r(); }
  for (let i = SIZE - 1; i > 0; i--) {
    const j = Math.floor(r() * (i + 1));
    const t = perm[i]; perm[i] = perm[j]; perm[j] = t;
  }
  for (let i = 0; i < SIZE; i++) perm[i + SIZE] = perm[i];
  const smooth = (t) => t * t * (3 - 2 * t);
  function n2(x, y) {
    const xi = Math.floor(x), yi = Math.floor(y);
    const xf = x - xi, yf = y - yi;
    const X = xi & 255, Y = yi & 255;
    const v00 = vals[perm[X + perm[Y]]];
    const v10 = vals[perm[X + 1 + perm[Y]]];
    const v01 = vals[perm[X + perm[Y + 1]]];
    const v11 = vals[perm[X + 1 + perm[Y + 1]]];
    const u = smooth(xf), v = smooth(yf);
    return lerp(lerp(v00, v10, u), lerp(v01, v11, u), v);
  }
  return function fbm(x, y, oct = 4) {
    let amp = 1, freq = 1, sum = 0, norm = 0;
    for (let o = 0; o < oct; o++) {
      sum += n2(x * freq, y * freq) * amp;
      norm += amp; amp *= 0.5; freq *= 2;
    }
    return sum / norm;
  };
}

function seedCode(n) { return (n >>> 0).toString(36).toUpperCase(); }
function parseSeed(str) {
  const s = String(str || '').trim();
  if (!s) return null;
  const n = parseInt(s, 36);
  return Number.isFinite(n) && n > 0 ? n % 4294967296 : null;
}

function fmtMoney(v) {
  const neg = v < 0; v = Math.abs(Math.round(v));
  let s;
  if (v >= 1e6) s = (v / 1e6).toFixed(v >= 1e7 ? 1 : 2) + 'M';
  else if (v >= 1e4) s = (v / 1e3).toFixed(0) + 'k';
  else s = v.toLocaleString('en-US');
  return (neg ? '-$' : '$') + s;
}
function fmtMoneyFull(v) {

  return (neg ? '-$' : '$') + v.toLocaleString('en-US');

'use strict';

function makeCanvas(w, h) {
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  const ctx = c.getContext('2d');
  ctx.imageSmoothingEnabled = false;
  return [c, ctx];
}

// Render character-grid rows into a canvas using a palette map.
function gridToCanvas(rows, pal) {
  const h = rows.length;
  let w = 0;
  for (const r of rows) w = Math.max(w, r.length);
  const [c, ctx] = makeCanvas(w, h);
  for (let y = 0; y < h; y++) {
    const r = rows[y];
    for (let x = 0; x < r.length; x++) {
      const ch = r[x];
      if (ch === '.' || ch === ' ') continue;
      const col = pal[ch];
      if (!col) continue;
      ctx.fillStyle = col;
      ctx.fillRect(x, y, 1, 1);
    }
  }
  return c;
}

function flipCanvas(src) {
  const [c, ctx] = makeCanvas(src.width, src.height);
  ctx.translate(src.width, 0); ctx.scale(-1, 1);
  ctx.drawImage(src, 0, 0);
  return c;
}

// Tint every opaque pixel of a canvas (used for hit flashes / silhouettes)
function tintCanvas(src, color, alpha = 1) {
  const [c, ctx] = makeCanvas(src.width, src.height);
  ctx.drawImage(src, 0, 0);
  ctx.globalCompositeOperation = 'source-atop';
  ctx.globalAlpha = alpha;
  ctx.fillStyle = color;
  ctx.fillRect(0, 0, c.width, c.height);
  return c;
}

const DINO_SPRITES = {}; // species -> {right:[a,b], left:[a,b], sleep:{right,left}, w, h}

function buildDinoSprites() {
  for (const key of Object.keys(SPECIES)) {
    const sp = SPECIES[key];
    const tpl = DINO_TEMPLATES[key];
    const pal = Object.assign({ T: '#f4f0e0', c: '#efe6c8' }, sp.colors);
    const fa = gridToCanvas(tpl.body.concat(tpl.legsA), pal);
    const fb = gridToCanvas(tpl.body.concat(tpl.legsB), pal);
    // Sleep: eyes closed (E -> D), legs tucked (use legsB)
    const sleepRows = tpl.body.map((r) => r.replace(/E/g, 'D')).concat(tpl.legsB);
    const sl = gridToCanvas(sleepRows, pal);
    const w = Math.max(fa.width, fb.width), h = Math.max(fa.height, fb.height);
    // Normalize sizes to same canvas
    const norm = (src) => { const [c, ctx] = makeCanvas(w, h); ctx.drawImage(src, 0, h - src.height); return c; };
    const a = norm(fa), b = norm(fb), s = norm(sl);
    const mv = typeof VIEW_ART !== 'undefined' && VIEW_ART[key] ? makeViewArt : makeView;
    const vs = (front) => [mv(key, front, 0), mv(key, front, 1)];
    DINO_SPRITES[key] = {
      w, h,
      up: vs(false), down: vs(true),
      right: [a, b], left: [flipCanvas(a), flipCanvas(b)],
      sleepR: s, sleepL: flipCanvas(s),
      flashR: [tintCanvas(a, '#ffffff', 0.85), tintCanvas(b, '#ffffff', 0.85)],
      flashL: [tintCanvas(flipCanvas(a), '#ffffff', 0.85), tintCanvas(flipCanvas(b), '#ffffff', 0.85)],
      sickR: [tintCanvas(a, '#7ad04a', 0.35), tintCanvas(b, '#7ad04a', 0.35)],
      sickL: [tintCanvas(flipCanvas(a), '#7ad04a', 0.35), tintCanvas(flipCanvas(b), '#7ad04a', 0.35)],
    };
  }
}

  galli: { w: 7, h: 8, legs: 2, tail: 7, neck: 7, head: 3 },
  para: { w: 9, h: 10, legs: 2, tail: 7, neck: 4, head: 4, crest: true },

  anky: { w: 15, h: 11, legs: 4, tail: 6, neck: 0, head: 4, spikes: true },
  brachio: { w: 13, h: 14, legs: 4, tail: 7, neck: 14, head: 4 },

  indom: { w: 13, h: 14, legs: 2, tail: 9, neck: 2, head: 7, teeth: true },
  ptera: { w: 6, h: 7, legs: 2, tail: 2, neck: 2, head: 3 },
};

function makeView(spKey, front, frame) {
  const sh = VIEW_SHAPES[spKey], C = SPECIES[spKey].colors;
  const W = sh.w + 10, Hh = sh.h + sh.tail + sh.neck + sh.head + 8;
  const [c, ctx] = makeCanvas(W, Hh);
  const p = (x, y, col) => { if (x >= 0 && y >= 0 && x < W && y < Hh) { ctx.fillStyle = col; ctx.fillRect(x, y, 1, 1); } };
  const cx = Math.floor(W / 2);
  const oval = (ocx, ocy, rx, ry, fill, line, belly) => {
    for (let y = -ry; y <= ry; y++) {
      const half = Math.round(rx * Math.sqrt(Math.max(0, 1 - (y * y) / (ry * ry))));
      for (let x = -half; x <= half; x++) {
        const edge = Math.abs(x) === half || Math.abs(y) === ry;
        p(ocx + x, ocy + y, edge ? line : (belly && y > ry * 0.2 && Math.abs(x) < half - 1 ? belly : fill));
      }
    }
  };
  // vertical layout (top to bottom). Back view: head at top, tail toward viewer at bottom. Front view: reversed.
  const bodyRY = Math.floor(sh.h / 2), bodyRX = Math.floor(sh.w / 2);
  const headTop = 2, neckLen = sh.neck, headH = sh.head;
  const bodyCY = front ? 2 + sh.tail + bodyRY : headTop + headH + neckLen + bodyRY;
  const legOff = frame ? 1 : -1;
  // legs (drawn first so the body overlaps)
  const legY = bodyCY + bodyRY - 2;
  const legX = sh.legs === 4 ? [-bodyRX + 1, -bodyRX + 3, bodyRX - 3, bodyRX - 1] : [-Math.max(2, bodyRX - 2), Math.max(2, bodyRX - 2)];
  legX.forEach((lx, k) => {
    const up = (k % 2 === 0) === !!frame ? -1 : 0;
    for (let y = 0; y < 4; y++) { p(cx + lx, legY + y + up, C.D); p(cx + lx + 1, legY + y + up, C.D); }
    p(cx + lx, legY + 4 + up, C.O); p(cx + lx + 1, legY + 4 + up, C.O);
  });
  if (!front) {
    // tail toward the viewer
    for (let t = 0; t < sh.tail; t++) {
      const tw = Math.max(1, Math.round((sh.tail - t) / sh.tail * (bodyRX * 0.6)));
      const ty = bodyCY + bodyRY - 1 + t, sway = Math.round(Math.sin((t / sh.tail) * 2 + legOff) * t * 0.15);
      for (let x = -tw; x <= tw; x++) p(cx + x + sway, ty, Math.abs(x) === tw ? C.O : C.B);
    }
  } else {
    // tail tip peeking out behind
    const tl = Math.min(4, sh.tail), top = 2 + sh.tail - tl;
    for (let t = 0; t < tl; t++) { const tw = 1 + Math.round(t / tl * Math.max(1, bodyRX * 0.4)); for (let x = -tw; x <= tw; x++) p(cx + x + (t === 0 ? legOff : 0), top + t, Math.abs(x) === tw ? C.O : C.B); }
  }
  oval(cx, bodyCY, bodyRX, bodyRY, C.B, C.O, front ? C.L : null);
  if (!front) for (let y = -bodyRY + 2; y < bodyRY - 1; y++) p(cx, bodyCY + y, C.D); // spine
  if (sh.plates) for (let y = -bodyRY + 1; y < bodyRY; y += 3) { p(cx - 1, bodyCY + y, C.S); p(cx + 1, bodyCY + y + 1, C.S); p(cx, bodyCY + y - 1, C.O); }
  if (sh.sail) for (let y = -bodyRY - 2; y < bodyRY - 1; y++) { p(cx, bodyCY + y, C.S); if (y % 3 === 0) p(cx, bodyCY + y, C.O); }
  if (sh.spikes) for (let y = -bodyRY + 2; y < bodyRY - 1; y += 2) { p(cx - bodyRX - 1, bodyCY + y, C.S); p(cx + bodyRX + 1, bodyCY + y, C.S); }
  // neck + head
  if (!front) {
    for (let n = 0; n < neckLen; n++) { const y = bodyCY - bodyRY - n; p(cx - 1, y, C.O); p(cx, y, C.B); p(cx + 1, y, C.B); p(cx + 2, y, C.O); }
    const hy = bodyCY - bodyRY - neckLen - Math.floor(headH / 2);
    oval(cx, hy, Math.max(2, Math.floor(headH / 2)), Math.max(1, Math.floor(headH / 2)), C.B, C.O);
    if (sh.crest) for (let k = 0; k < 4; k++) p(cx, hy + 1 + k, C.S);
    if (sh.horns) { oval(cx, hy + 1, bodyRX - 1, 3, C.S, C.O); }
    if (sh.frill) { p(cx - 3, hy, C.S); p(cx + 3, hy, C.S); }
  } else {
    const headCY = bodyCY + bodyRY + Math.floor(headH / 2) - 1 + (neckLen > 4 ? 0 : 0);
    if (neckLen > 4) for (let n = 0; n < Math.min(neckLen, 6); n++) { const y = bodyCY + bodyRY - 2 + n; p(cx - 1, y, C.O); p(cx, y, C.B); p(cx + 1, y, C.B); p(cx + 2, y, C.O); }
    const hy = neckLen > 4 ? bodyCY + bodyRY + 4 : headCY;
    if (sh.horns) oval(cx, hy - 2, bodyRX, 4, C.S, C.O); // frill behind the face
    if (sh.frill) { oval(cx, hy - 1, 4, 3, C.S, C.O); }
    if (sh.crest) for (let k = 0; k < 4; k++) p(cx, hy - 3 - k, C.S);
    const hrx = Math.max(2, Math.floor(headH / 2)), hry = Math.max(2, Math.floor(headH / 2));
    oval(cx, hy, hrx, hry, C.B, C.O);
    p(cx - Math.max(1, hrx - 1), hy - 1, C.E); p(cx + Math.max(1, hrx - 1), hy - 1, C.E);
    p(cx, hy + hry - 1, C.D);
    if (sh.teeth) for (let x = -hrx + 2; x <= hrx - 2; x += 2) p(cx + x, hy + hry - 2, '#f4f0e0');
    if (sh.horns) { p(cx - 2, hy - hry - 1, '#efe6c8'); p(cx + 2, hy - hry - 1, '#efe6c8'); p(cx, hy + 1, '#efe6c8'); }
  }
  return c;
}

// ---------------- People ----------------
const SKIN = ['#f0c8a0', '#d8a078', '#b07850', '#8a5a3a', '#603a24'];
const HAIR = ['#2a1a10', '#5a3a1a', '#c89a4a', '#1a1a1a', '#8a4a2a', '#d8d0c0'];
const SHIRT = ['#e04838', '#3878c8', '#f0a030', '#68a088', '#9858b8', '#f8e060', '#e8e8e8', '#e86aa0', '#40a0a0'];
const PANTS = ['#2a3a5a', '#5a4a3a', '#3a3a3a', '#7a6a4a', '#284878'];

function makePersonFrames(opts) {
  // 5x9 tiny person, two walking frames
  const { skin, hair, shirt, pants, hat, vest } = opts;
  const frames = [];
  for (let f = 0; f < 2; f++) {
    const [c, ctx] = makeCanvas(6, 10);
    const p = (x, y, col) => { ctx.fillStyle = col; ctx.fillRect(x, y, 1, 1); };
    // head
    if (hat) { for (let x = 0; x < 6; x++) p(x, 1, hat); p(1, 0, hat); p(2, 0, hat); p(3, 0, hat); p(4, 0, hat); }
    else { p(1, 0, hair); p(2, 0, hair); p(3, 0, hair); p(4, 0, hair); p(1, 1, hair); p(4, 1, hair); }
    p(2, 1, hat ? hat : skin); p(3, 1, hat ? hat : skin);
    p(1, 2, skin); p(2, 2, skin); p(3, 2, skin); p(4, 2, skin);
    // body
    for (let y = 3; y < 6; y++) for (let x = 1; x < 5; x++) p(x, y, shirt);
    if (vest) { p(1, 3, vest); p(4, 3, vest); p(1, 4, vest); p(4, 4, vest); p(2, 5, vest); p(3, 5, vest); }
    // arms
    p(0, 3 + f, skin); p(5, 4 - f, skin);
    // legs
    p(1, 6, pants); p(2, 6, pants); p(3, 6, pants); p(4, 6, pants);
    if (f === 0) { p(1, 7, pants); p(4, 7, pants); p(1, 8, '#201810'); p(4, 8, '#201810'); }
    else { p(2, 7, pants); p(3, 7, pants); p(2, 8, '#201810'); p(3, 8, '#201810'); }
    frames.push(c);
  }
  return frames;
}

function makeKidFrames(opts) {
  const { skin, hair, shirt, pants } = opts;
  const frames = [];
  for (let f = 0; f < 2; f++) {
    const [c, ctx] = makeCanvas(6, 10);
    const p = (x, y, col) => { ctx.fillStyle = col; ctx.fillRect(x, y, 1, 1); };
    p(2, 3, hair); p(3, 3, hair); p(1, 3, hair); p(4, 3, hair);
    p(2, 4, skin); p(3, 4, skin); p(1, 4, hair); p(4, 4, hair);
    for (let x = 1; x < 5; x++) { p(x, 5, shirt); p(x, 6, shirt); }
    p(0, 5 + f, skin); p(5, 6 - f, skin);
    p(1, 7, pants); p(2, 7, pants); p(3, 7, pants); p(4, 7, pants);
    if (f === 0) { p(1, 8, '#201810'); p(4, 8, '#201810'); } else { p(2, 8, '#201810'); p(3, 8, '#201810'); }
    frames.push(c);
  }
  return frames;
}

const PEOPLE = { guests: [], kids: [], ranger: null, worker: null, vet: null };
function buildPeople() {
  const r = mulberry32(1234);
  const pk = (a) => a[Math.floor(r() * a.length)];
  for (let i = 0; i < 40; i++) {
    PEOPLE.guests.push(makePersonFrames({ skin: pk(SKIN), hair: pk(HAIR), shirt: pk(SHIRT), pants: pk(PANTS), hat: r() < 0.25 ? pk(['#e8e0c0', '#e04838', '#3878c8', '#f8e060']) : null }));
  }
  for (let i = 0; i < 16; i++) PEOPLE.kids.push(makeKidFrames({ skin: pk(SKIN), hair: pk(HAIR), shirt: pk(SHIRT), pants: pk(PANTS) }));
  PEOPLE.ranger = makePersonFrames({ skin: '#d8a078', hair: '#2a1a10', shirt: '#8a7a4a', pants: '#5a4a2a', hat: '#c8b078' });
  PEOPLE.worker = makePersonFrames({ skin: '#b07850', hair: '#1a1a1a', shirt: '#3a5a8a', pants: '#2a3a5a', hat: '#f8e060', vest: '#f08020' });
}

// ---------------- Terrain tiles ----------------
const TILES = {}; // name -> canvas (or arrays of variants)

function noiseFill(ctx, w, h, base, specks, r) {
  ctx.fillStyle = base; ctx.fillRect(0, 0, w, h);
  for (const [col, n] of specks) {
    ctx.fillStyle = col;
    for (let i = 0; i < n; i++) ctx.fillRect(Math.floor(r() * w), Math.floor(r() * h), 1, 1);
  }
}

function buildTiles() {
  const r = mulberry32(777);
  const mk = (fn) => { const [c, ctx] = makeCanvas(TILE, TILE); fn(ctx); return c; };
  TILES.grass = [];
  for (let v = 0; v < 6; v++) {
    TILES.grass.push(mk((ctx) => {
      noiseFill(ctx, 16, 16, '#4f8a32', [['#5c9a3a', 26], ['#447a2a', 18], ['#6aa840', 6]], r);
      // grass tufts
      for (let i = 0; i < 3; i++) {
        const x = 1 + Math.floor(r() * 13), y = 2 + Math.floor(r() * 12);
        ctx.fillStyle = '#6fb048'; ctx.fillRect(x, y, 1, 1); ctx.fillRect(x + 2, y, 1, 1);
        ctx.fillStyle = '#3c6a24'; ctx.fillRect(x + 1, y + 1, 1, 1);
      }
      if (r() < 0.3) { // flower
        const x = 2 + Math.floor(r() * 12), y = 2 + Math.floor(r() * 12);
        ctx.fillStyle = pick2(r, ['#f8e060', '#f0f0f0', '#e86aa0']); ctx.fillRect(x, y, 1, 1);
      }
    }));
  }
  TILES.sand = [];
  for (let v = 0; v < 4; v++) TILES.sand.push(mk((ctx) => noiseFill(ctx, 16, 16, '#dcc68a', [['#e8d6a0', 20], ['#c8b074', 16], ['#b89c64', 4]], r)));
  TILES.basalt = [];
  for (let v = 0; v < 3; v++) TILES.basalt.push(mk((ctx) => noiseFill(ctx, 16, 16, '#3a3436', [['#4a4244', 30], ['#2a2426', 20], ['#5a3a30', 4]], r)));
  TILES.water = [[], []];
  TILES.deep = [[], []];
  for (let f = 0; f < 2; f++) {
    for (let v = 0; v < 3; v++) {
      TILES.water[f].push(mk((ctx) => {
        noiseFill(ctx, 16, 16, '#3a88c8', [['#4898d4', 18], ['#3078b8', 14]], r);
        ctx.fillStyle = '#7cc0ec';
        for (let i = 0; i < 2; i++) { const x = Math.floor(r() * 12), y = Math.floor(r() * 15); ctx.fillRect(x + f, y, 3, 1); }
      }));
      TILES.deep[f].push(mk((ctx) => {
        noiseFill(ctx, 16, 16, '#24609e', [['#2a6aa8', 16], ['#1e5490', 16]], r);
        ctx.fillStyle = '#4a8ac8';
        for (let i = 0; i < 2; i++) { const x = Math.floor(r() * 12), y = Math.floor(r() * 15); ctx.fillRect(x + f * 2, y, 2, 1); }
      }));
    }
  }
  TILES.lava = [[], []];
  for (let f = 0; f < 2; f++) for (let v = 0; v < 3; v++) {
    TILES.lava[f].push(mk((ctx) => {
      noiseFill(ctx, 16, 16, '#d84a1a', [['#f08a2a', 30], ['#a02a10', 26], ['#f8d050', 6 + f * 6]], r);
    }));
  }
  TILES.rock = [];
  for (let v = 0; v < 4; v++) TILES.rock.push(mk((ctx) => {
    noiseFill(ctx, 16, 16, '#7a7468', [['#8a8478', 26], ['#6a6458', 22], ['#9a9488', 8]], r);
    // boulders
    for (let i = 0; i < 2; i++) {
      const x = 1 + Math.floor(r() * 10), y = 1 + Math.floor(r() * 10);
      ctx.fillStyle = '#5a554c'; ctx.fillRect(x, y + 3, 5, 1);

  // Trees (drawn bigger than a tile, anchored bottom-center)
  TILES.trees = [];
  for (let v = 0; v < 8; v++) TILES.trees.push(makeTree(r, v));
  TILES.bush = [];
  for (let v = 0; v < 3; v++) TILES.bush.push(makeBush(r));
}

function pick2(r, a) { return a[Math.floor(r() * a.length)]; }

function makeTree(r, v) {
  const [c, ctx] = makeCanvas(20, 26);
  const p = (x, y, w, h, col) => { ctx.fillStyle = col; ctx.fillRect(x, y, w, h); };
  if (v % 3 === 0) {
    // Palm
    p(9, 10, 2, 14, '#7a5a32'); p(10, 10, 1, 14, '#5a4022');
    for (let y = 12; y < 24; y += 3) p(9, y, 2, 1, '#9a7a4a');
    const leaf = ['#3f8a2a', '#57a838', '#2e6a20'];
    const fronds = [[-8, 2], [-6, -3], [0, -6], [6, -3], [8, 2], [-3, 5], [3, 5]];
    for (const [dx, dy] of fronds) {
      const steps = 8;
      for (let i = 0; i <= steps; i++) {
        const t = i / steps;
        const x = Math.round(10 + dx * t), y = Math.round(9 + dy * t + (Math.abs(dx) > 5 ? t * t * 4 : 0));
        p(x - 1, y, 3, 1, leaf[i % 3]);
      }
    }
    p(9, 8, 3, 3, '#6a4a22'); p(8, 10, 2, 2, '#4a3a1a');
  } else if (v % 3 === 1) {
    // Broadleaf jungle tree
    p(9, 16, 3, 9, '#5a3e22'); p(9, 16, 1, 9, '#7a5a32');
    const cols = ['#2a5a1e', '#3a7a2a', '#4f9a36', '#6ab848'];
    const blobs = [[10, 9, 8], [5, 12, 5], [15, 12, 5], [10, 5, 5], [7, 7, 4], [13, 7, 4]];
    for (let pass = 0; pass < 4; pass++) {
      for (const [bx, by, br] of blobs) {
        const rr = br - pass * 1.2;
        if (rr <= 0) continue;
        for (let y = -br; y <= br; y++) for (let x = -br; x <= br; x++) {
          if (x * x + y * y <= rr * rr) {
            const px = bx + x - pass, py = by + y - pass;
            if (px >= 0 && px < 20 && py >= 0 && py < 26) p(px, py, 1, 1, cols[pass]);
          }
        }
      }
    }
    for (let i = 0; i < 10; i++) p(2 + Math.floor(r() * 16), 2 + Math.floor(r() * 14), 1, 1, '#1e4a16');
  } else {
    // Conifer / cycad-ish tall tree
    p(9, 19, 2, 6, '#5a3e22');
    const cols = ['#1e4a24', '#2a6232', '#3a7a3e'];
    for (let y = 0; y < 20; y++) {
      const wdt = Math.min(9, 1 + Math.floor(y * 0.55) + (y % 4 === 3 ? -1 : 0));
      for (let x = -wdt; x <= wdt; x++) {
        const col = x < -wdt / 3 ? cols[0] : x > wdt / 2 ? cols[0] : (y % 4 === 0 ? cols[2] : cols[1]);
        p(10 + x, y + 1, 1, 1, col);
      }
    }
  }
  return c;
}

function makeBush(r) {
  const [c, ctx] = makeCanvas(12, 9);
  const cols = ['#2e6a20', '#3f8a2a', '#57a838'];
  for (let pass = 0; pass < 3; pass++) {
    for (let i = 0; i < 18; i++) {
      const x = 2 + Math.floor(r() * 8) - pass + 1, y = 2 + Math.floor(r() * 6) - pass + 1;
      ctx.fillStyle = cols[pass]; ctx.fillRect(x, y, 2, 2);
    }
  }
  return c;
}

// ---------------- Building sprites (procedural pixel art) ----------------
const BSPR = {}; // key -> {canvas, ox, oy} where oy = extra height above footprint

function P(ctx) {
  return {
    r(x, y, w, h, c) { ctx.fillStyle = c; ctx.fillRect(x, y, w, h); },
    box(x, y, w, h, fill, line) { ctx.fillStyle = line; ctx.fillRect(x, y, w, h); ctx.fillStyle = fill; ctx.fillRect(x + 1, y + 1, w - 2, h - 2); },
    px(x, y, c) { ctx.fillStyle = c; ctx.fillRect(x, y, 1, 1); },
  };
}

// Tiny 3x5 pixel font for signs
const FONT3 = {
  A: '010101111101101', B: '110101110101110', C: '011100100100011', D: '110101101101110', E: '111100110100111',
  F: '111100110100100', G: '011100101101011', H: '101101111101101', I: '111010010010111', J: '001001001101010',
  K: '101101110101101', L: '100100100100111', M: '101111111101101', N: '110101101101101', O: '010101101101010',
  P: '110101110100100', Q: '010101101110011', R: '110101110101101', S: '011100010001110', T: '111010010010010',
  U: '101101101101111', V: '101101101101010', W: '101101111111101', X: '101101010101101', Y: '101101010010010',
  Z: '111001010100111', ' ': '000000000000000', '!': '010010010000010', '0': '111101101101111', '1': '010110010010111',
  '2': '111001111100111', '3': '111001011001111', '4': '101101111001001', '5': '111100111001111', '6': '111100111101111', '7': '111001010010010', '8': '111101111101111', '9': '111101111001111',
  '+': '000010111010000', '$': '011110010011110', '-': '000000111000000',
};
function drawText3(ctx, text, x, y, col) {
  ctx.fillStyle = col;
  for (const ch of text.toUpperCase()) {
    const g = FONT3[ch] || FONT3[' '];
    for (let i = 0; i < 15; i++) if (g[i] === '1') ctx.fillRect(x + (i % 3), y + Math.floor(i / 3), 1, 1);
    x += 4;
  }
}

function roofThatch(p, x, y, w, h) {
  // Visitor-center style thatched roof
  for (let yy = 0; yy < h; yy++) {
    const inset = Math.max(0, Math.floor((h - yy) * 0.25));
    for (let xx = inset; xx < w - inset; xx++) {
      const stripe = (xx + yy * 2) % 5 === 0;
      const shade = yy < 2 ? '#c8a050' : yy > h - 3 ? '#7a5a2a' : stripe ? '#9a7432' : '#b08a42';
      p.px(x + xx, y + yy, shade);
    }
  }
  p.r(x, y + h - 1, w, 1, '#4a3418');
}

function roofFlat(p, x, y, w, h, base, light, dark) {
  p.r(x, y, w, h, dark);
  p.r(x + 1, y, w - 2, h - 1, base);
  p.r(x + 1, y, w - 2, 1, light);
}

function roofGable(p, x, y, w, h, base, light, dark) {
  // Front-facing gable roof viewed top-down 3/4: lighter top band, darker lower band
  p.r(x, y, w, h, dark);
  p.r(x + 1, y + 1, w - 2, Math.floor(h / 2), light);
  p.r(x + 1, y + 1 + Math.floor(h / 2), w - 2, h - 2 - Math.floor(h / 2), base);
  for (let xx = x + 2; xx < x + w - 2; xx += 3) p.r(xx, y + 1 + Math.floor(h / 2), 1, h - 2 - Math.floor(h / 2), dark);
}

function windowRow(p, x, y, w, n, lit) {
  const gap = Math.floor(w / n);
  for (let i = 0; i < n; i++) {
    const wx = x + i * gap + Math.floor(gap / 2) - 1;
    p.r(wx, y, 3, 3, '#1a2430');
    p.r(wx, y, 3, 1, lit ? '#f8e080' : '#6ab0d8');
    p.px(wx, y + 1, lit ? '#f0c060' : '#3a7aa8');
  }
}

// Volcano: a cone ~7 tiles wide, crater at the top
let VOLCANO_SPR = null;
function buildVolcano() {
  const W = 112, H = 84;
  const [c, ctx] = makeCanvas(W, H);
  const r = mulberry32(99);
  const cx = W / 2;
  for (let y = 0; y < H; y++) {
    const t = y / (H - 1);
    const half = 9 + Math.pow(t, 0.85) * (W / 2 - 9);
    for (let x = Math.floor(cx - half); x < Math.ceil(cx + half); x++) {
      const rel = (x - (cx - half)) / (half * 2); // 0 left .. 1 right
      let col;
      if (rel < 0.18) col = '#7a6656';
      else if (rel < 0.42) col = '#5e4c40';
      else if (rel < 0.75) col = '#4a3c34';
      else col = '#382c26';
      // ridges
      const ridge = Math.sin(x * 0.45 + y * 0.12) > 0.82;
      if (ridge) col = rel < 0.5 ? '#86705e' : '#2e241f';
      if (r() < 0.05) col = '#2a201c';
      if (y > H - 10 && r() < 0.25 + (y - (H - 10)) * 0.07) col = r() < 0.5 ? '#4f8a32' : '#3e7228';
      ctx.fillStyle = col; ctx.fillRect(x, y, 1, 1);
    }
  }
  // outline edges
  ctx.fillStyle = '#1e1714';
  for (let y = 0; y < H - 8; y++) {
    const t = y / (H - 1);
    const half = 9 + Math.pow(t, 0.85) * (W / 2 - 9);
    ctx.fillRect(Math.floor(cx - half), y, 1, 1); ctx.fillRect(Math.ceil(cx + half) - 1, y, 1, 1);
  }
  // crater rim + glow
  ctx.fillStyle = '#1e1714'; ctx.fillRect(cx - 10, 0, 20, 5);
  ctx.fillStyle = '#c83a10'; ctx.fillRect(cx - 8, 1, 16, 3);
  ctx.fillStyle = '#f8a030'; ctx.fillRect(cx - 5, 1, 10, 2);
  ctx.fillStyle = '#f8e070'; ctx.fillRect(cx - 2, 1, 4, 1);
  // old lava channels
  for (const [sx, len] of [[-4, 30], [3, 44], [7, 22]]) {
    let x = cx + sx;
    for (let y = 4; y < 4 + len; y++) {
      x += (r() - 0.5) * 1.6 + sx * 0.03;
      ctx.fillStyle = '#6a2a16'; ctx.fillRect(Math.round(x), y, 2, 1);
    }
  }
  VOLCANO_SPR = c;
}

// Toolbar icons (24x24) generated from sprites
const ICONS = {};
function iconFrom(src, bg) {
  const S = 24;
  const [c, ctx] = makeCanvas(S, S);
  if (bg) { ctx.fillStyle = bg; ctx.fillRect(0, 0, S, S); }
  const fit = Math.min((S - 2) / src.width, (S - 2) / src.height);
  const s2 = fit >= 2 ? 2 : fit >= 1 ? 1 : fit >= 0.5 ? 0.5 : 0.25;
  const w = Math.round(src.width * s2), h = Math.round(src.height * s2);
  ctx.drawImage(src, Math.floor((S - w) / 2), Math.floor((S - h) / 2), w, h);
  return c;
}

// Night variants: window glass pixels become warm light
function buildNightBuildings() {
  const glass = new Set(['106,176,216', '58,122,168', '168,216,240']);
  for (const k of Object.keys(BSPR)) {
    const src = BSPR[k].canvas;
    const [c, ctx] = makeCanvas(src.width, src.height);
    ctx.drawImage(src, 0, 0);
    const im = ctx.getImageData(0, 0, c.width, c.height);
    let n = 0;
    for (let i = 0; i < im.data.length; i += 4) {
      const key = im.data[i] + ',' + im.data[i + 1] + ',' + im.data[i + 2];
      if (glass.has(key)) { im.data[i] = 248; im.data[i + 1] = 216; im.data[i + 2] = key === '58,122,168' ? 96 : 128; n++; }
    }
    ctx.putImageData(im, 0, 0);
    BSPR[k].night = n ? c : null;
  }
}

<script>
// ---------- World: terrain, construction layers, regions, power, pathfinding ----------
'use strict';

class World {
  constructor(seed, w = MAP_W, h = MAP_H) {
    this.seed = seed;
    this.W = w; this.H = h;
    const N = this.W * this.H;
    this.terrain = new Uint8Array(N);
    this.variant = new Uint8Array(N);
    this.height = new Uint8Array(N); // elevation band 0-7, for shading only
    this.fence = new Uint8Array(N);
    this.fenceHp = new Float32Array(N);
    this.fenceOrig = new Uint8Array(N);
    this.fencePowered = new Uint8Array(N);
    this.path = new Uint8Array(N);
    this.track = new Uint8Array(N);
    this.bld = new Int32Array(N); // building id or 0
    this.region = new Int32Array(N);
    this.covered = new Uint8Array(N); // power coverage
    this.lavaT = new Float32Array(N); // lava cooling timers
    this.buildings = new Map();
    this.nextBid = 1;
    this.regions = [];
    this.dirtyTerrain = true;
    this.pathVersion = 0;
    this.flowCache = new Map();
    this.power = { supply: 0, demand: 0, outage: 0, backupFuel: 0, ratio: 1 };
    this.volcano = null;
    // BFS scratch
    this._seen = new Int32Array(N);
    this._prev = new Int32Array(N);
    this._stamp = 1;
    this._queue = new Int32Array(N);
  }

  idx(x, y) { return y * this.W + x; }
  inb(x, y) { return x >= 0 && y >= 0 && x < this.W && y < this.H; }

  generate() {
    const noise = makeNoise(this.seed);
    const noise2 = makeNoise(this.seed + 99);
    const noise3 = makeNoise(this.seed + 7);
    const W = this.W, H = this.H;
    const r = mulberry32(this.seed + 5);
    const hmap = new Float32Array(W * H);
    for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
      const nx = (x / W) * 2 - 1, ny = (y / H) * 2 - 1;
      const d = Math.sqrt(nx * nx * 0.9 + ny * ny * 1.1);
      let h = noise(x * 0.06, y * 0.06, 5) * 0.75 + (1 - d * d) * 0.85 - 0.45;
      hmap[this.idx(x, y)] = h;
    }
    for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
      const i = this.idx(x, y), h = hmap[i];
      let t;
      if (h < 0.05) t = T_DEEP;
      else if (h < 0.13) t = T_WATER;
      else if (h < 0.18) t = T_SAND;
      else {
        const m = noise2(x * 0.09, y * 0.09, 3);
        const f = noise3(x * 0.12, y * 0.12, 3);
        if (h > 0.52 && m > 0.55) t = T_ROCK;
        else if (m < 0.3 && h > 0.25 && h < 0.45) t = T_WATER; // inland lakes
        else if (f > 0.57) t = T_FOREST;
        else t = T_GRASS;
      }
      this.terrain[i] = t;
      this.variant[i] = Math.floor(r() * 251);
      this.height[i] = clamp(Math.floor((h - 0.18) / 0.06), 0, 7);
    }
    // Map border: always deep water
    for (let x = 0; x < W; x++) { this.terrain[this.idx(x, 0)] = T_DEEP; this.terrain[this.idx(x, H - 1)] = T_DEEP; }
    for (let y = 0; y < H; y++) { this.terrain[this.idx(0, y)] = T_DEEP; this.terrain[this.idx(W - 1, y)] = T_DEEP; }

    // Volcano: highest point that is rock or near high ground
    let best = -1, bx = 0, by = 0;
    for (let y = 4; y < H - 4; y++) for (let x = 4; x < W - 4; x++) {
      const h = hmap[this.idx(x, y)] + (this.terrain[this.idx(x, y)] === T_ROCK ? 0.2 : 0);
      if (h > best) { best = h; bx = x; by = y; }
    }
    // keep volcano away from the southern starting area
    if (by > H * 0.6) by = Math.floor(H * 0.35);
    this.volcano = { x: bx, y: by };
    for (let dy = -3; dy <= 3; dy++) for (let dx = -3; dx <= 3; dx++) {
      const x = bx + dx, y = by + dy;
      if (!this.inb(x, y)) continue;
      const d = Math.sqrt(dx * dx + dy * dy);
      if (d <= 1.5) this.terrain[this.idx(x, y)] = T_VOLCANO;
      else if (d <= 3.2) this.terrain[this.idx(x, y)] = T_ROCK;
    }
    this.removeTinyLakes();
    this.dirtyTerrain = true;
  }

  removeTinyLakes() {
    // Inland water bodies of 1-2 tiles look noisy: fill them in
    const W = this.W, H = this.H;
    const seen = new Uint8Array(W * H);
    for (let i = 0; i < W * H; i++) {
      if (seen[i] || this.terrain[i] !== T_WATER) continue;
      const comp = []; const q = [i]; seen[i] = 1;
      let touchesDeep = false;
      while (q.length) {
        const c = q.pop(); comp.push(c);
        const x = c % W, y = (c / W) | 0;
        for (const [dx, dy] of DIRS4) {
          const nx = x + dx, ny = y + dy;
          if (!this.inb(nx, ny)) continue;
          const j = this.idx(nx, ny);
          if (this.terrain[j] === T_DEEP) touchesDeep = true;
          if (!seen[j] && this.terrain[j] === T_WATER) { seen[j] = 1; q.push(j); }
        }
      }
      if (!touchesDeep && comp.length < 4) for (const c of comp) this.terrain[c] = T_GRASS;
    }
  }

  // Find a good start location for the gate: southern grass near coast
  findStartSpot() {
    const W = this.W, H = this.H;
    let best = null, bestScore = -1e9;
    for (let y = Math.floor(H * 0.55); y < H - 4; y++) for (let x = 8; x < W - 8; x++) {
      let ok = 0;
      for (let dy = -3; dy <= 3; dy++) for (let dx = -4; dx <= 4; dx++) {
        const t = this.terrain[this.idx(x + dx, y + dy)];
        if (t === T_GRASS || t === T_FOREST || t === T_SAND) ok++;
      }
      let score = ok * 10 + y * 2 - Math.abs(x - W / 2) * 1.5;
      if (this.volcano && dist(x, y, this.volcano.x, this.volcano.y) < 16) score -= 1000;
      if (ok >= 60 && score > bestScore) { bestScore = score; best = { x, y }; }
    }
    return best || { x: Math.floor(W / 2), y: Math.floor(H * 0.75) };
  }

  terrainAt(x, y) { return this.inb(x, y) ? this.terrain[this.idx(x, y)] : T_DEEP; }
  isLand(t) { return t === T_SAND || t === T_GRASS || t === T_FOREST || t === T_BASALT; }

  // ---------- passability ----------
  dinoPass(x, y) {
    if (!this.inb(x, y)) return false;
    const i = this.idx(x, y);
    const t = this.terrain[i];
    if (!(t === T_SAND || t === T_GRASS || t === T_FOREST || t === T_BASALT)) return false;
    const f = this.fence[i];
    if (isSolidFence(f)) return false;
    if (this.bld[i]) return false;
    return true;
  }
  humanPass(x, y) { return this.dinoPass(x, y); }

  canBuildAt(x, y, allowForest = true) {
    if (!this.inb(x, y)) return false;
    const i = this.idx(x, y);
    const t = this.terrain[i];
    if (!(t === T_SAND || t === T_GRASS || t === T_BASALT || (allowForest && t === T_FOREST))) return false;
    if (isSolidFence(this.fence[i])) return false;
    if (this.bld[i]) return false;
    return true;
  }

  // Why a building can't go on this tile (null = fine)
  placementBlock(x, y) {
    if (!this.inb(x, y)) return 'edge of the map';
    const i = this.idx(x, y), t = this.terrain[i];
    if (t === T_WATER || t === T_DEEP) return 'water';
    if (t === T_ROCK) return 'rock';
    if (t === T_VOLCANO) return 'the volcano';
    if (t === T_LAVA) return 'lava';
    if (this.bld[i]) return 'another building';
    if (this.path[i]) return 'a path';
    if (this.track[i]) return 'tour track';
    if (this.fence[i]) return 'a fence';
    return null;
  }

  // ---------- buildings ----------
  canPlaceBuilding(type, x, y) {
    const def = BUILDINGS[type];
    for (let dy = 0; dy < def.h; dy++) for (let dx = 0; dx < def.w; dx++) {
      if (!this.canBuildAt(x + dx, y + dy)) return false;
      if (this.path[this.idx(x + dx, y + dy)] || this.track[this.idx(x + dx, y + dy)]) return false;
      if (this.fence[this.idx(x + dx, y + dy)] === F_BROKEN) return false;
    }
    return true;
  }

  addBuilding(type, x, y) {
    const def = BUILDINGS[type];
    const b = { id: this.nextBid++, type, x, y, w: def.w, h: def.h, hp: def.hp, maxHp: def.hp, powered: false, visitors: 0, inside: 0, offline: 0, built: 0 };
    this.buildings.set(b.id, b);
    for (let dy = 0; dy < def.h; dy++) for (let dx = 0; dx < def.w; dx++) {
      const i = this.idx(x + dx, y + dy);
      this.bld[i] = b.id;
      if (this.terrain[i] === T_FOREST) this.terrain[i] = T_GRASS;
    }
    this.invalidate(x, y, def.w, def.h);
    return b;
  }

  removeBuilding(b) {
    for (let dy = 0; dy < b.h; dy++) for (let dx = 0; dx < b.w; dx++) this.bld[this.idx(b.x + dx, b.y + dy)] = 0;
    this.buildings.delete(b.id);
    this.invalidate(b.x, b.y, b.w, b.h);
  }

  buildingAt(x, y) { return this.inb(x, y) ? this.buildings.get(this.bld[this.idx(x, y)]) : null; }

  // Path tiles adjacent to a building's footprint
  accessTiles(b) {
    const out = [];
    for (let dy = -1; dy <= b.h; dy++) for (let dx = -1; dx <= b.w; dx++) {
      const corner = (dx === -1 || dx === b.w) && (dy === -1 || dy === b.h);
      const inside = dx >= 0 && dx < b.w && dy >= 0 && dy < b.h;
      if (corner || inside) continue;
      const x = b.x + dx, y = b.y + dy;
      if (this.inb(x, y) && this.path[this.idx(x, y)]) out.push(this.idx(x, y));
    }
    return out;
  }

  trackAccess(b) {
    const out = [];
    for (let dy = -1; dy <= b.h; dy++) for (let dx = -1; dx <= b.w; dx++) {
      const corner = (dx === -1 || dx === b.w) && (dy === -1 || dy === b.h);
      const inside = dx >= 0 && dx < b.w && dy >= 0 && dy < b.h;
      if (corner || inside) continue;
      const x = b.x + dx, y = b.y + dy;
      if (this.inb(x, y) && this.track[this.idx(x, y)]) out.push([x, y]);
    }
    return out;
  }

  // Passable tiles adjacent to a building (for staff spawning / dino feeding)
  adjacentPassable(b, passFn) {
    const out = [];
    for (let dy = -1; dy <= b.h; dy++) for (let dx = -1; dx <= b.w; dx++) {
      const inside = dx >= 0 && dx < b.w && dy >= 0 && dy < b.h;
      if (inside) continue;
      const x = b.x + dx, y = b.y + dy;
      if (passFn.call(this, x, y)) out.push([x, y]);
    }
    return out;
  }

  // Mark a tile rect for terrain-cache redraw (partial). No args = everything.
  markDirty(x, y, w = 1, h = 1) {
    (this.dirtyRects = this.dirtyRects || []).push([x, y, w, h]);
  }

  invalidate(x, y, w = 1, h = 1) {
    if (x === undefined) this.dirtyTerrain = true;
    else this.markDirty(x, y, w, h);
    this.pathVersion++;
    this.flowCache.clear();
    this.regionsDirty = true;
    this.powerDirty = true;
  }

  // ---------- regions (paddocks) ----------
  computeRegions() {
    const W = this.W, H = this.H, N = W * H;
    this.region.fill(-1);
    const regions = [];
    const q = this._queue;
    for (let s = 0; s < N; s++) {
      if (this.region[s] !== -1) continue;
      const sx = s % W, sy = (s / W) | 0;
      if (!this.dinoPass(sx, sy)) continue;
      const id = regions.length;
      const reg = { id, size: 0, forest: 0, water: 0, path: 0, feeders: { herb: [], carn: [] }, tiles: null, cx: 0, cy: 0, minX: sx, maxX: sx, minY: sy, maxY: sy };
      let head = 0, tail = 0;
      q[tail++] = s; this.region[s] = id;
      const tiles = [];
      const adjB = new Set();
      while (head < tail) {
        const c = q[head++];
        tiles.push(c);
        const x = c % W, y = (c / W) | 0;
        reg.size++; reg.cx += x; reg.cy += y;
        if (x < reg.minX) reg.minX = x; if (x > reg.maxX) reg.maxX = x;
        if (y < reg.minY) reg.minY = y; if (y > reg.maxY) reg.maxY = y;
        if (this.terrain[c] === T_FOREST) reg.forest++;
        if (this.path[c]) reg.path++;

          const nx = x + dx, ny = y + dy;
          if (!this.inb(nx, ny)) continue;
          const j = this.idx(nx, ny);
          const t = this.terrain[j];
          if (t === T_WATER || t === T_DEEP) reg.water++;
          if (this.bld[j]) adjB.add(this.bld[j]);
          if (this.region[j] === -1 && this.dinoPass(nx, ny)) { this.region[j] = id; q[tail++] = j; }
        }
      }
      reg.cx /= reg.size; reg.cy /= reg.size;
      reg.tiles = tiles;
      for (const bid of adjB) {
        const b = this.buildings.get(bid);
        if (!b) continue;
        const d = BUILDINGS[b.type];
        if (d.feeds) reg.feeders[d.feeds].push(b);
      }
      reg.public = reg.path > 0;
      regions.push(reg);
    }
    this.regions = regions;
    this.regionsDirty = false;
  }

  regionAt(x, y) {
    if (!this.inb(x, y)) return null;
    const r = this.region[this.idx(x, y)];
    return r >= 0 ? this.regions[r] : null;
  }

  // ---------- power ----------
  computePower(game) {
    const W = this.W, H = this.H;
    this.covered.fill(0);
    const prevPowered = this._prevPowered || (this._prevPowered = new Uint8Array(W * H));
    prevPowered.set(this.fencePowered);
    this.fencePowered.fill(0);
    let supply = 0;
    const outage = this.power.outage > 0;
    const sources = [], pylons = [];
    for (const b of this.buildings.values()) {
      if (b.type === 'power' && !outage && b.offline <= 0 && b.hp > 0) { sources.push(b); supply += BUILDINGS.power.supply * clamp(b.hp / b.maxHp + 0.3, 0.3, 1); }
      if (b.type === 'backup' && outage && this.power.backupFuel > 0 && this.power.backupDelay <= 0) { sources.push(b); supply += BUILDINGS.backup.backup; }

    }
    const coverDisc = (cx, cy, rad) => {
      const r2 = rad * rad;
      for (let y = Math.max(0, Math.floor(cy - rad)); y <= Math.min(H - 1, Math.ceil(cy + rad)); y++)
        for (let x = Math.max(0, Math.floor(cx - rad)); x <= Math.min(W - 1, Math.ceil(cx + rad)); x++)
          if ((x - cx) * (x - cx) + (y - cy) * (y - cy) <= r2) this.covered[this.idx(x, y)] = 1;
    };
    for (const s of sources) coverDisc(s.x + s.w / 2 - 0.5, s.y + s.h / 2 - 0.5, BUILDINGS[s.type].range);

    const active = new Set();
    let changed = true;
    while (changed) {
      changed = false;
      for (const p of pylons) {
        if (active.has(p.id) || p.hp <= 0) continue;
        if (this.covered[this.idx(p.x, p.y)]) { active.add(p.id); coverDisc(p.x, p.y, BUILDINGS.pylon.range); changed = true; }

    }

    const fenceTiles = [];
    let fenceDemand = 0;
    for (let i = 0; i < W * H; i++) if (this.fence[i] === F_ELECTRIC && this.covered[i]) { fenceTiles.push(i); fenceDemand += FENCE_DEF[F_ELECTRIC].power; }
    let bDemand = 0;
    const consumers = [];
    for (const b of this.buildings.values()) {
      b.powered = false;
      const need = BUILDINGS[b.type].power;
      if (!need) { b.powered = true; continue; }
      if (this.covered[this.idx(b.x, b.y)] || this.covered[this.idx(b.x + b.w - 1, b.y + b.h - 1)]) { consumers.push(b); bDemand += need; }
    }
    const demand = fenceDemand + bDemand;
    let left = supply;
    // Fences
    if (left >= fenceDemand) {
      for (const i of fenceTiles) this.fencePowered[i] = 1;
      left -= fenceDemand;

    }

    const ESSENTIAL = { shelter: 1, siren: 1, hatchery: 2, restroom: 2, restaurant: 2, visitor: 2, lamp: 3 };
    const rank = (b) => (BUILDINGS[b.type].cat === 'staff' ? 0 : ESSENTIAL[b.type] || 4);
    consumers.sort((a, b) => rank(a) - rank(b));
    for (const b of consumers) {
      const need = BUILDINGS[b.type].power;
      if (left >= need) { b.powered = true; left -= need; }
    }
    this.power.supply = supply; this.power.demand = demand;
    this.power.ratio = demand > 0 ? Math.min(1, supply / demand) : 1;
    this.powerDirty = false;
    for (let i = 0; i < W * H; i++) if (prevPowered[i] !== this.fencePowered[i]) this.markDirty(i % W, (i / W) | 0);
  }

  // ---------- guest flow fields over path tiles ----------
  // returns Int16Array distances (-1 = unreachable) toward a set of target path tiles
  flowField(key, targetsFn) {
    let f = this.flowCache.get(key);
    if (f) return f;
    const N = this.W * this.H;
    f = new Int16Array(N).fill(-1);
    const q = this._queue;
    let head = 0, tail = 0;
    for (const t of targetsFn()) { if (f[t] === -1) { f[t] = 0; q[tail++] = t; } }
    while (head < tail) {
      const c = q[head++];
      const x = c % this.W, y = (c / this.W) | 0;
      for (const [dx, dy] of DIRS4) {
        const nx = x + dx, ny = y + dy;
        if (!this.inb(nx, ny)) continue;
        const j = this.idx(nx, ny);
        if (f[j] !== -1 || !this.path[j]) continue;
        f[j] = f[c] + 1; q[tail++] = j;
      }
    }
    this.flowCache.set(key, f);
    return f;
  }

  // ---------- cheapest footpath route (Dijkstra with a bucket queue) ----------
  // Existing paths are nearly free; open land costs more; forest costs extra. Returns [[x,y],...] or null.
  route(sx, sy, tx, ty) {
    const W = this.W, N = W * this.H;
    const cost = (i) => {
      if (this.path[i]) return 1;
      const x = i % W, y = (i / W) | 0;
      if (!this.canBuildAt(x, y) || this.track[i] || this.fence[i] === F_BROKEN) return 0;
      return this.terrain[i] === T_FOREST ? 7 : 4;
    };
    const s = this.idx(sx, sy), t = this.idx(tx, ty);
    if (!cost(s) || !cost(t)) return null;
    const distA = new Int32Array(N).fill(1 << 30), prev = new Int32Array(N).fill(-1);
    const buckets = [[s]]; distA[s] = 0;
    for (let d = 0; d < buckets.length; d++) {
      const b = buckets[d]; if (!b) continue;
      for (const c of b) {
        if (distA[c] !== d) continue;
        if (c === t) {
          const out = []; let k = t;
          while (k >= 0) { out.push([k % W, (k / W) | 0]); k = prev[k]; }
          return out.reverse();
        }
        const x = c % W, y = (c / W) | 0;
        for (const [dx, dy] of DIRS4) {
          const nx = x + dx, ny = y + dy;
          if (!this.inb(nx, ny)) continue;
          const j = this.idx(nx, ny), cj = cost(j);
          if (!cj) continue;
          const nd = d + cj;
          if (nd < distA[j]) { distA[j] = nd; prev[j] = c; (buckets[nd] = buckets[nd] || []).push(j); }
        }
      }
      if (d > 40000) break;
    }
    return null;
  }

  // ---------- generic BFS for free-roaming agents ----------
  // Returns array of [x,y] from (excl) start to goal (incl), or null
  bfs(sx, sy, passFn, goalFn, maxNodes = 4000) {
    const W = this.W;
    const stamp = ++this._stamp;
    const seen = this._seen, prev = this._prev, q = this._queue;
    const s = this.idx(sx, sy);
    let head = 0, tail = 0;
    q[tail++] = s; seen[s] = stamp; prev[s] = -1;
    let found = -1;
    while (head < tail && head < maxNodes) {
      const c = q[head++];
      const x = c % W, y = (c / W) | 0;
      if (c !== s && goalFn(x, y)) { found = c; break; }
      for (let k = 0; k < 4; k++) {
        const nx = x + DIRS4[k][0], ny = y + DIRS4[k][1];
        if (!this.inb(nx, ny)) continue;
        const j = this.idx(nx, ny);
        if (seen[j] === stamp) continue;
        seen[j] = stamp;
        if (!passFn.call(this, nx, ny) && !goalFn(nx, ny)) continue;
        prev[j] = c; q[tail++] = j;
      }
    }
    if (found < 0) return null;
    const out = [];
    let c = found;
    while (c !== s && c >= 0) { out.push([c % W, (c / W) | 0]); c = prev[c]; }
    out.reverse();
    return out;
  }
  // Path to the reachable tile closest to (tx, ty): for getting as near as possible to something behind a fence
  bfsNearest(sx, sy, passFn, tx, ty, maxNodes = 4000) {
    let best = null, bd = dist2(sx + 0.5, sy + 0.5, tx, ty);
    this.bfs(sx, sy, passFn, (x, y) => { if (passFn.call(this, x, y)) { const d = dist2(x + 0.5, y + 0.5, tx, ty); if (d < bd) { bd = d; best = [x, y]; } } return false; }, maxNodes);
    if (!best) return null;
    const [bx, by] = best;
    return this.bfs(sx, sy, passFn, (x, y) => x === bx && y === by, maxNodes);
  }
}

// ---------- Shared entity helpers ----------

// the famous ones get famous names (and don't hand them to a Gallimimus)
const SPECIES_NAMES = {
  raptor: ['Blue', 'Charlie', 'Delta', 'Echo', 'Clever Girl', 'Big One', 'Muldoon', 'Ripper', 'Talon'],
  trex: ['Rexy', 'Roberta', 'Big Red', 'Queenie', 'Tiny', 'Sue'],
  indom: ['Indy', 'Snowflake', 'Ghost', 'Dr. Wu\'s Mistake'],
  spino: ['Sail', 'Spike', 'Riverqueen'],

const RESERVED_NAMES = new Set(Object.values(SPECIES_NAMES).flat());
const nameFor = (species) => {
  const own = SPECIES_NAMES[species];
  if (own && chance(0.75)) return pick(own);
  return pick(DINO_NAMES.filter((n) => !RESERVED_NAMES.has(n)));
};
const DINO_NAMES = ['Rexy', 'Blue', 'Delta', 'Echo', 'Charlie', 'Clever Girl', 'Big One', 'Spike', 'Cera', 'Littlefoot', 'Bumpy', 'Ducky', 'Petrie', 'Sarah', 'Roberta', 'Tiny', 'Nibbles', 'Chomper', 'Mabel', 'Gertie', 'Bob', 'Kevin', 'Pebbles', 'Doris', 'Hammond', 'Muldoon', 'Grant', 'Ellie', 'Ian', 'Dennis', 'Lex', 'Tim', 'Henry', 'Nedry Jr', 'Sprinkles', 'Mr. Teeth', 'Steve', 'Bubbles', 'Ziggy', 'Moxie'];

  if (!e.path || e.pi >= e.path.length) return true;

  const tx = wx + 0.5, ty = wy + 0.5;
  const dx = tx - e.x, dy = ty - e.y;
  const d = Math.sqrt(dx * dx + dy * dy);

  if (Math.abs(dx) > 0.02) e.facing = dx > 0 ? 1 : -1;
  e.vdir = Math.abs(dy) > Math.abs(dx) * 1.5 ? (dy > 0 ? 1 : -1) : 0;
  if (d <= s) { e.x = tx; e.y = ty; e.pi++; return e.pi >= e.path.length; }
  e.x += (dx / d) * s; e.y += (dy / d) * s;

<script>
// ---------- Dinosaurs ----------
'use strict';

class Dino {
  constructor(game, species, x, y) {
    this.id = _eid++;
    this.kind = 'dino';
    this.game = game;
    this.species = species;
    this.sp = SPECIES[species];
    this.x = x + 0.5; this.y = y + 0.5;
    this.home = { x, y };
    this.hp = this.sp.hp;
    this.hunger = 25; this.stress = 15; this.comfort = 70;
    this.sedation = 0; this.sedatedT = 0;
    this.state = 'idle'; this.stateT = randf(1, 3);
    this.path = null; this.pi = 0;
    this.facing = chance(0.5) ? 1 : -1;
    this.anim = rand() * 10; this.moving = false;
    this.name = nameFor(species);
    this.sick = 0; this.attackCD = 0; this.flash = 0; this.deterT = 0;
    this.loose = false; this.carried = null; this.target = null;
    this.thinkT = 0; this.age = 0; this.kills = 0;
    this.comfortParts = {};
    this.roarCD = randf(5, 20);
    this.lastBreach = 0;
    this.growth = 0.6; // hatchlings grow up over a couple of days
    this.ageDays = 0;
    this.lifespan = this.sp.life * randf(0.9, 1.15);
  }
  get elderly() { return this.ageDays > this.lifespan * 0.8; }
  get sellValue() { return Math.round(this.sp.cost * (this.growth < 1 ? 0.25 : this.elderly ? 0.15 : 0.35)); }
  get str() { return this.sp.strength * this.growth * (this.unstable ? 1.3 : 1); }

  get tx() { return Math.floor(this.x); }
  get ty() { return Math.floor(this.y); }
  get camouflaged() { return !!(this.sp.camo && !this.game.research.has('sensors') && this.loose && this.state !== 'hunt' && this.state !== 'attack' && this.sedatedT <= 0); }
  get speed() {
    let s = this.sp.speed * 0.55;
    if (this.hp < this.sp.hp * 0.4) s *= 0.7;
    if (this.sick > 0) s *= 0.7;
    if (this.elderly) s *= 0.8;
    return s;
  }

  update(dt) {
    const g = this.game, w = g.world;
    this.anim += dt;
    this.moving = false;
    if (this.flash > 0) this.flash -= dt;
    if (this.carried) return;
    this.age += dt;
    this.ageDays += dt / (g.secPerHour * 24);
    if (this.ageDays > this.lifespan && !this.loose && this.sedatedT <= 0) { g.killDino(this, 'old age', true); return; }
    if (this.elderly && !this.oldLogged) { this.oldLogged = true; if (this.growth >= 1) g.log(`${this.name} the ${this.sp.name} is getting old: about ${Math.max(1, Math.round(this.lifespan - this.ageDays))} days left.`, 'warn', this); }
    if (this.growth < 1) {
      this.growth = Math.min(1, this.growth + dt / 150);

    }

      if ((this.loose || this.relocate) && (!g.hasBuilding('helipad') || (g.helis.length && g.helis.every((h) => h.cargo)))) {
        this.truckT = (this.truckT || 0) + dt;
        if (this.truckT > 18) {
          const dest = g.findPaddockFor(this);
          if (dest) {
            g.spend(12000, 'ops');
            g.burst(this.x, this.y, '#e8d8a0', 8);
            this.x = dest.x + 0.5; this.y = dest.y + 0.5; this.home = { x: dest.x, y: dest.y };
            this.loose = false; this.relocate = false; this.orderSedate = false; this.sedatedT = 3; this.truckT = 0; this.noDestLogged = false;
            g.world.regionsDirty = true;
            g.log(`Ground crew trucked ${this.name} the ${this.sp.name} back to a paddock (-$12k). A helipad is faster.`, 'good', this);
          } else {

    if (!w.dinoPass(this.tx, this.ty)) {
      const p = w.bfs(this.tx, this.ty, () => true, (x, y) => w.dinoPass(x, y), 400);

    }

  decide() {

      }
      if (this.sp.diet === 'herb' && reg.forest > 0) {
        const p = w.bfs(this.tx, this.ty, w.dinoPass, (x, y) => w.terrain[w.idx(x, y)] === T_FOREST && w.dinoPass(x, y), 2500);
        if (p) { this.path = p; this.pi = 0; this.state = 'graze'; if (!p.length) this.arrive(); return; }
      }
    }
    // The Indominus schemes: every few days she picks a spot along her wall and works at it, calm or not
    if (this.sp.camo && !this.loose && this.growth >= 1) {
      this.schemeT = (this.schemeT === undefined ? randf(2, 4) * 24 : this.schemeT) - (this.decideClock ? (g.time - this.decideClock) : 0);
      this.decideClock = g.time;
      if (this.schemeT <= 0 && this.deterT <= 0 && this.planFenceAttack(true, true)) {
        this.schemeT = randf(2, 4) * 24; this.scheming = true;
        g.log(`${this.name} the ${this.sp.name} is clawing at her wall... Engineers need to get there before she's through.`, 'bad', this, true);
        return;
      }
    }
    // The hum stops: a predator notices the moment its fence goes quiet
    if (!this.loose && this.deterT <= 0 && this.sp.diet === 'carn' && (w.power.outage > 0 || w.power.ratio < 1) && chance(0.35)) {
      if (this.planFenceAttack(true)) {
        if (!g.quietFenceLogged) { g.quietFenceLogged = true; g.log(`${this.name} the ${this.sp.name} has noticed the fences are dead...`, 'bad', this, true); }
        return;
      }
    }
    // Fence testing
    const clever = this.sp.clever && chance(0.25);
    if (!this.loose && this.deterT <= 0 && (this.stress > 62 || clever)) {
      if (this.planFenceAttack(clever)) return;
    }
    // Loose: rampage on buildings if stressed and big
    if (this.loose && this.sp.strength >= 5 && this.stress > 60 && chance(0.4)) {
      // the park, not its own feeding trough
      const p = w.bfs(this.tx, this.ty, w.dinoPass, (x, y) => { const b = w.buildingAt(x, y); return !!b && !BUILDINGS[b.type].feeds; }, 900);
      if (p && p.length) { p.pop(); this.path = p; this.pi = 0; this.state = 'tofence'; this.attackBuilding = true; return; }
    }
    // Clever girls: hungry loose raptors work at shelters they can smell people in
    if (this.loose && this.sp.clever && this.hunger > 45 && chance(0.35)) {
      const full = (b) => b && BUILDINGS[b.type].shelter && b.inside > 0;
      const p = w.bfs(this.tx, this.ty, w.dinoPass, (x, y) => full(w.buildingAt(x, y)), 1400);
      if (p && p.length) {
        p.pop(); this.path = p; this.pi = 0; this.state = 'tofence'; this.attackBuilding = true;
        if (!this.shelterLogged) { this.shelterLogged = true; g.log(`${this.name} the ${this.sp.name} is testing the doors of a shelter full of guests!`, 'bad', this, true); }
        return;
      }
    }
    // Predators on the loose follow the noise: head for the nearest crowd within earshot
    if (this.loose && this.sp.diet === 'carn' && this.sp.danger >= 4 && this.hunger > 25 && chance(0.6)) {
      let best = null, bd = 28 * 28;
      for (const gu of g.guests) { if (gu.hidden) continue; const d = dist2(this.x, this.y, gu.x, gu.y); if (d < bd) { bd = d; best = gu; } }
      if (best) {
        const gx = best.cx, gy = best.cy;
        // stop a few tiles short: from there findPrey takes over and the guests get a chance to run
        const p = w.bfs(this.tx, this.ty, w.dinoPass, (x, y) => dist2(x, y, gx, gy) < 25, 2500);
        if (p && p.length) { this.path = p.slice(0, 14); this.pi = 0; this.state = 'walk'; return; }
      }
    }
    // Herbivores mostly sleep through the night
    if (g.isNight && this.sp.diet === 'herb' && !this.loose && this.hunger < 70 && chance(0.8)) { this.state = 'idle'; this.stateT = randf(6, 12); this.sleeping = true; return; }
    this.sleeping = false;
    // Wander
    if (chance(0.7)) {
      const rad = this.loose ? 10 : 7;
      for (let tries = 0; tries < 6; tries++) {
        const tx = this.tx + randi(-rad, rad), ty = this.ty + randi(-rad, rad);
        if (!w.dinoPass(tx, ty)) continue;
        if (!this.loose && w.region[w.idx(tx, ty)] !== w.region[w.idx(this.tx, this.ty)]) continue;
        // calm grazers stay near home even if a fence is down
        if (this.loose && this.sp.danger < 4 && this.stress < 55 && (dist2(tx, ty, this.home.x, this.home.y) > 36 || w.path[w.idx(tx, ty)])) continue;
        const p = w.bfs(this.tx, this.ty, w.dinoPass, (x, y) => x === tx && y === ty, 1500);
        if (p && p.length) { this.path = p; this.pi = 0; this.state = 'walk'; return; }
      }
    }
    // a loose raptor doesn't stand around waiting to be darted
    this.state = 'idle'; this.stateT = this.loose && this.sp.clever ? randf(0.3, 0.9) : randf(1.5, 4.5);
  }

  arrive() {
    const g = this.game, w = g.world;
    this.path = null;
    if (this.state === 'tofeed') {
      const f = this.feederTarget;
      if (f && w.buildings.has(f.id)) {
        const cost = (this.sp.diet === 'carn' ? 400 : 150) * (g.research.has('feeders') ? 0.5 : 1) * (this.sp.diet === 'carn' ? g.mod('feedMul') : 1);
        g.spend(cost, 'food');
        this.hunger = Math.max(0, this.hunger - 80);
        this.state = 'eat'; this.stateT = 3;
        if (this.sp.diet === 'carn') { g.burst(this.x + this.facing * 0.5, this.y, '#c83020', 8); g.soundAt('chomp', this.x, this.y, 1); }
        else g.burst(this.x + this.facing * 0.5, this.y, '#e8c860', 6);
        return;
      }
    } else if (this.state === 'graze') {
      this.hunger = Math.max(0, this.hunger - 30);
      this.state = 'eat'; this.stateT = 4;
      return;
    } else if (this.state === 'tofence') {
      this.state = 'attack'; this.attackCD = 0.4; this.attackT = this.scheming ? randf(28, 40) : randf(8, 16); this.schemeBout = this.scheming; this.scheming = false;
      return;
    }
    this.state = 'idle'; this.stateT = randf(1, 4);
  }

  planFenceAttack(clever, force) {
    const w = this.game.world;
    const isFence = (x, y) => {
      if (!w.inb(x, y)) return false;
      const f = w.fence[w.idx(x, y)];
      return isSolidFence(f);
    };
    let goalFence = null;
    if (clever) {
      // Raptors look for the weakest point: unpowered or damaged fence along their paddock
      const reg = w.regionAt(this.tx, this.ty);
      if (reg) {
        let best = null, bestScore = -Infinity;
        for (let k = 0; k < 60; k++) {
          const t = reg.tiles[Math.floor(rand() * reg.tiles.length)];
          const x = t % w.W, y = (t / w.W) | 0;
          for (const [dx, dy] of DIRS4) {
            if (!isFence(x + dx, y + dy)) continue;
            const j = w.idx(x + dx, y + dy);
            const score = (w.fence[j] === F_ELECTRIC && !w.fencePowered[j] ? 100 : 0) + (100 - w.fenceHp[j] / FENCE_DEF[w.fence[j]].hp * 100) + (w.fence[j] === F_WALL ? -50 : 0);
            if (score > bestScore) { bestScore = score; best = [x + dx, y + dy]; }
          }
        }
        if (best && (bestScore > 20 || force)) goalFence = best;
        else if (!(this.stress > 62)) return false;
      }
    }
    const p = w.bfs(this.tx, this.ty, w.dinoPass, goalFence
      ? (x, y) => x === goalFence[0] && y === goalFence[1]
      : (x, y) => isFence(x, y), 2500);
    if (!p || !p.length) return false;
    p.pop();
    this.path = p; this.pi = 0; this.state = 'tofence'; this.attackBuilding = false;
    if (!p.length) this.arrive();
    return true;
  }

  updateFenceAttack(dt) {
    const g = this.game, w = g.world;
    this.attackT -= dt;
    if (this.attackT <= 0 || this.sedatedT > 0) { this.state = 'idle'; this.stateT = 2; this.attackBuilding = false; this.schemeBout = false; return; }
    if (this.attackCD > 0) return;
    this.attackCD = 1.1 + rand() * 0.5;
    // find adjacent target
    let tgt = null;
    for (const [dx, dy] of DIRS4) {
      const x = this.tx + dx, y = this.ty + dy;
      if (!w.inb(x, y)) continue;
      const j = w.idx(x, y);
      if (!this.attackBuilding && (isSolidFence(w.fence[j]))) { tgt = { x, y, j, fence: true }; break; }
      if (this.attackBuilding && w.bld[j]) { tgt = { x, y, j, b: w.buildings.get(w.bld[j]) }; break; }
    }
    if (!tgt) { this.state = 'idle'; this.stateT = 1; this.attackBuilding = false; return; }
    this.facing = tgt.x + 0.5 > this.x ? 1 : -1;
    this.lunge = 0.25;
    const str = this.str;
    if (tgt.fence) {
      const type = w.fence[tgt.j];
      let dmg;
      if (type === F_ELECTRIC && w.fencePowered[tgt.j]) {
        // ZAP
        const brute = str >= (g.research.has('fence3') ? 11 : 8) && (this.stress > 85 || this.schemeBout);
        dmg = brute ? str * 0.8 : str * 0.25;
        this.flash = 0.25;
        this.hp -= 3;
        g.sparks(tgt.x + 0.5, tgt.y + 0.5);
        g.soundAt('zap', tgt.x, tgt.y, 1);
        if (!brute) {
          this.deterT = randf(20, 40) * (this.sp.clever ? 0.6 : 1) * (g.research.has('fence3') ? 1.6 : 1);
          this.stress = Math.min(100, this.stress + 4);
          this.state = 'idle'; this.stateT = 2;
        }
      } else if (type === F_WALL || type === F_GATE) {
        dmg = str * 1.4;
        g.burst(tgt.x + 0.5, tgt.y + 0.5, '#9a9a90', 4);
        g.soundAt('thud', tgt.x, tgt.y, 0.6);
      } else {
        dmg = str * 4.5;
        g.burst(tgt.x + 0.5, tgt.y + 0.5, '#6a6a6a', 4);
        g.soundAt('thud', tgt.x, tgt.y, 0.6);
      }
      g.damageFence(tgt.x, tgt.y, dmg, this);
    } else if (tgt.b) {
      g.damageBuilding(tgt.b, str * 3, this);
      g.burst(tgt.x + 0.5, tgt.y + 0.5, '#8a6a4a', 5);
      g.soundAt('thud', tgt.x, tgt.y, 0.7);
    }
    g.shake = Math.max(g.shake, str >= 8 ? 2 : 0.5);
  }

  findPrey(range) {
    const g = this.game;
    let best = null, bd = range * range;
    if (this.loose) {
      // the nearest person it can actually get to: a guest on the far side of an intact fence is no prey
      const w = g.world, at = new Map();
      for (const h of g.humans()) {
        if (h.hidden || h.dead || dist2(this.x, this.y, h.x, h.y) >= bd) continue;
        at.set(w.idx(Math.floor(h.x), Math.floor(h.y)), h);
      }
      if (at.size) {
        const p = w.bfs(this.tx, this.ty, w.dinoPass, (x, y) => at.has(w.idx(x, y)), 2500);
        if (p && p.length) { const [x, y] = p[p.length - 1]; best = at.get(w.idx(x, y)); bd = dist2(this.x, this.y, best.x, best.y); }
      }
    }
    const angry = !this.loose && this.sp.size >= 3 && this.stress > 75;
    if ((this.loose || angry) && this.sp.size >= 2) {
      for (const j of g.jeeps) {
        if (j.wrecked || !j.riders.length) continue;
        if (angry && g.world.region[g.world.idx(j.tx, j.ty)] !== g.world.region[g.world.idx(this.tx, this.ty)]) continue;
        const d = dist2(this.x, this.y, j.x, j.y);
        if (d < bd) { bd = d; best = j; }
      }
    }
    // Gyrospheres rolling through a carnivore's paddock look a lot like snacks in a jar
    if (this.sp.diet === 'carn' && this.sp.danger >= 4 && (this.loose || this.hunger > 45 || this.stress > 55)) {
      const myR = g.world.region[g.world.idx(this.tx, this.ty)];
      for (const gy of g.gyros || []) {
        if (gy.wrecked || !gy.riders.length || gy.state === 'parked') continue;
        if (!this.loose && g.world.region[g.world.idx(gy.tx, gy.ty)] !== myR) continue;
        const d = dist2(this.x, this.y, gy.x, gy.y);
        if (d < bd) { bd = d; best = gy; }
      }
    }
    // Contained carnivores (or loose ones) can also eat herbivores in their region
    const myReg = g.world.region[g.world.idx(this.tx, this.ty)];
    for (const d of g.dinos) {
      if (d === this || d.sp.diet !== 'herb' || d.carried || d.dead) continue;
      if (d.sp.size > this.sp.size + (this.sp.size >= 3 ? 0 : 0)) continue;
      if (!this.loose && g.world.region[g.world.idx(d.tx, d.ty)] !== myReg) continue;
      const dd = dist2(this.x, this.y, d.x, d.y);
      if (dd < bd) { bd = dd; best = d; }
    }
    return best;
  }

  updateHunt(dt) {
    const g = this.game, w = g.world;
    const t = this.target;
    if (!t || t.dead || t.hidden || t.carried || t.wrecked) { this.state = 'idle'; this.stateT = 1; this.target = null; return; }
    const d = dist(this.x, this.y, t.x, t.y);
    if (d > 16) { this.state = 'idle'; this.stateT = 1; this.target = null; return; }
    if (d < 0.75) {
      // Strike!
      if (this.attackCD > 0) return;
      this.attackCD = 1.2;
      this.lunge = 0.3;
      if (t.kind === 'jeep' || t.kind === 'gyro') {
        if (t.kind === 'jeep') g.jeepAttacked(t, this); else g.gyroAttacked(t, this);
        this.kills++; this.hunger = Math.max(0, this.hunger - 60);
        this.state = 'eat'; this.stateT = 6; this.target = null; return;
      }
      if (t.kind === 'dino') {
        t.hp -= this.str * (t.sp.territorial ? 2.5 : 12);
        t.flash = 0.2; t.stress = 100;
        if (t.sp.territorial && t.state !== 'hunt') { t.state = 'hunt'; t.target = this; }
        g.shake = Math.max(g.shake, t.sp.size >= 3 ? 2.5 : 0.5);
        g.burst(t.x, t.y, '#c83020', 6);
        g.soundAt('chomp', t.x, t.y, 1);
        if (t.hp <= 0) { g.killDino(t, t.sp.territorial ? `killed in a fight with ${this.name} the ${this.sp.name}` : `eaten by ${this.name} the ${this.sp.name}`); this.hunger = 0; this.kills++; this.state = 'eat'; this.stateT = 6; this.target = null; }
      } else {
        g.humanKilled(t, this);
        this.hunger = Math.max(0, this.hunger - 50); this.kills++;
        this.state = 'eat'; this.stateT = this.sp.clever ? 1.5 : 5; this.target = null;
      }
      return;
    }
    // Chase: re-path periodically, otherwise move directly when close
    const sp = this.speed * (this.loose ? 1.55 : 1.3);
    if (d < 1.6) {
      const dx = t.x - this.x, dy = t.y - this.y;
      const nx = this.x + (dx / d) * sp * dt, ny = this.y + (dy / d) * sp * dt;
      if (w.dinoPass(Math.floor(nx), Math.floor(ny))) { this.x = nx; this.y = ny; this.moving = true; this.facing = dx > 0 ? 1 : -1; }
      return;
    }
    if (this.thinkT <= 0 || !this.path) {
      this.thinkT = 0.8;
      const ttx = Math.floor(t.x), tty = Math.floor(t.y);
      const p = w.bfs(this.tx, this.ty, w.dinoPass, (x, y) => Math.abs(x - ttx) <= 0 && Math.abs(y - tty) <= 0, 2500);
      if (!p) { this.state = 'idle'; this.stateT = 2; this.target = null; return; }
      this.path = p; this.pi = 0;
      this.allowGoalBlock = true;
    }
    stepAlong(this, dt, sp, null, w);
  }

  sedate() {
    this.sedatedT = 70; this.state = 'sedated'; this.path = null; this.target = null;
    this.orderSedate = false; // order carried out (a relocation still follows via the relocate flag)
    this.game.log(`${this.name} the ${this.sp.name} has been sedated.`, 'good', this);
  }
}
