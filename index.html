<script>
// ---------- Less busywork: paddock blueprints and one-click paddock upkeep ----------
'use strict';

const BlueprintMixin = {
  // Rock or water that closes a paddock where there is no fence: a copy built elsewhere needs fence there
  naturalWalls(reg) {
    const w = this.world, out = new Set(), inReg = new Set(reg.tiles);
    for (const t of reg.tiles) {
      const x = t % w.W, y = (t / w.W) | 0;
      for (const [dx, dy] of DIRS8) {
        const nx = x + dx, ny = y + dy;
        if (!w.inb(nx, ny)) continue;
        const j = w.idx(nx, ny);
        if (inReg.has(j) || w.fence[j] || w.bld[j]) continue;
        if (!w.dinoPass(nx, ny)) out.add(j);
      }
    }
    if (!out.size) return [];
    // keep only the outer walls: a pond inside the paddock is scenery, not a wall
    const x0 = reg.minX - 2, y0 = reg.minY - 2, x1 = reg.maxX + 2, y1 = reg.maxY + 2;
    const seen = new Set(), q = [];
    for (let x = x0; x <= x1; x++) for (const y of [y0, y1]) if (w.inb(x, y)) q.push(w.idx(x, y));
    for (let y = y0; y <= y1; y++) for (const x of [x0, x1]) if (w.inb(x, y)) q.push(w.idx(x, y));
    while (q.length) {
      const j = q.pop();
      if (seen.has(j) || inReg.has(j) || w.fence[j]) continue;
      seen.add(j);
      const x = j % w.W, y = (j / w.W) | 0;
      for (const [dx, dy] of DIRS4) { const nx = x + dx, ny = y + dy; if (nx >= x0 && nx <= x1 && ny >= y0 && ny <= y1 && w.inb(nx, ny)) q.push(w.idx(nx, ny)); }
    }
    return [...out].filter((j) => seen.has(j));
  },

  // Fence tiles that enclose a region (8-neighbourhood so corner posts count)
  paddockFences(reg) {
    const w = this.world, out = new Set();
    for (const t of reg.tiles) {
      const x = t % w.W, y = (t / w.W) | 0;
      for (const [dx, dy] of DIRS8) {
        const nx = x + dx, ny = y + dy;
        if (!w.inb(nx, ny)) continue;
        const j = w.idx(nx, ny);
        if (w.fence[j]) out.add(j);
      }
    }
    return [...out];
  },

  copyPaddock(reg) {
    const w = this.world;
    const fences = this.paddockFences(reg);
    if (!fences.length) return null;
    const walls = this.naturalWalls(reg);
    let x0 = 1e9, y0 = 1e9, x1 = -1, y1 = -1;
    for (const j of fences.concat(walls)) { const x = j % w.W, y = (j / w.W) | 0; x0 = Math.min(x0, x); y0 = Math.min(y0, y); x1 = Math.max(x1, x); y1 = Math.max(y1, y); }
    const bp = { w: x1 - x0 + 1, h: y1 - y0 + 1, fences: [], feeders: [], trees: [], water: [] };
    for (const j of fences) {
      const f = w.fence[j];
      bp.fences.push([j % w.W - x0, ((j / w.W) | 0) - y0, f === F_BROKEN ? (w.fenceOrig[j] || F_ELECTRIC) : f === F_GATE ? F_ELECTRIC : f]);
    }
    for (const j of walls) bp.fences.push([j % w.W - x0, ((j / w.W) | 0) - y0, F_ELECTRIC]);
    for (const t of reg.tiles) if (w.terrain[t] === T_FOREST) bp.trees.push([t % w.W - x0, ((t / w.W) | 0) - y0]);
    // ponds inside the paddock: flood the water that touches the paddock, without crossing its outer walls
    const isWater = (j) => w.terrain[j] === T_WATER || w.terrain[j] === T_DEEP;
    const wallSet = new Set(walls), seen = new Set(), stack = [];
    for (const t of reg.tiles) {
      const x = t % w.W, y = (t / w.W) | 0;
      for (const [dx, dy] of DIRS8) { const j = w.idx(x + dx, y + dy); if (w.inb(x + dx, y + dy) && isWater(j) && !wallSet.has(j) && !seen.has(j)) { seen.add(j); stack.push(j); } }
    }
    while (stack.length) {
      const j = stack.pop(), x = j % w.W, y = (j / w.W) | 0;
      bp.water.push([x - x0, y - y0]);
      for (const [dx, dy] of DIRS4) { const nx = x + dx, ny = y + dy; if (nx < x0 || nx > x1 || ny < y0 || ny > y1) continue; const k = w.idx(nx, ny); if (isWater(k) && !wallSet.has(k) && !seen.has(k)) { seen.add(k); stack.push(k); } }
    }
    for (const b of reg.feeders.herb.concat(reg.feeders.carn)) bp.feeders.push([b.x - x0, b.y - y0, b.type]);
    return bp;
  },

  // What a stamp would build at (x, y), and what it costs
  stampPlan(bp, x, y) {
    const w = this.world;
    const plan = { fences: [], feeders: [], trees: [], water: [], cost: 0, blocked: 0 };
    for (const [dx, dy, f] of bp.fences) {
      const tx = x + dx, ty = y + dy;
      if (!w.inb(tx, ty)) { plan.blocked++; continue; }
      const i = w.idx(tx, ty), t = w.terrain[i];
      if (w.fence[i] === f) continue;
      if (!(t === T_SAND || t === T_GRASS || t === T_FOREST || t === T_BASALT) || w.bld[i] || w.path[i]) { plan.blocked++; continue; }
      plan.fences.push([tx, ty, f]); plan.cost += FENCE_DEF[f].cost + (t === T_FOREST ? 40 : 0);
    }
    for (const [dx, dy, type] of bp.feeders) {
      if (w.canPlaceBuilding(type, x + dx, y + dy)) { plan.feeders.push([x + dx, y + dy, type]); plan.cost += BUILDINGS[type].cost; }
    }
    for (const [dx, dy] of bp.water || []) {
      const tx = x + dx, ty = y + dy;
      if (!w.inb(tx, ty)) continue;
      const i = w.idx(tx, ty), t = w.terrain[i];
      if ((t === T_GRASS || t === T_FOREST || t === T_SAND) && !w.path[i] && !w.track[i] && !w.bld[i] && !w.fence[i]) { plan.water.push([tx, ty]); plan.cost += TOOL_INFO.pond.cost; }
    }
    for (const [dx, dy] of bp.trees) {
      const tx = x + dx, ty = y + dy;
      if (!w.inb(tx, ty)) continue;
      const i = w.idx(tx, ty);
      if (w.terrain[i] === T_GRASS && !w.path[i] && !w.bld[i] && !w.fence[i]) { plan.trees.push([tx, ty]); plan.cost += TOOL_INFO.trees.cost; }
    }
    return plan;
  },

  stamp(bp, x, y) {
    const plan = this.stampPlan(bp, x, y);
    if (!plan.fences.length && !plan.feeders.length) return { n: 0, plan };
    if (!this.canAfford(plan.cost)) return { n: 0, plan, money: true };
    let n = 0;
    this.startBatch();
    for (const [tx, ty, f] of plan.fences) if (this.placeFence(tx, ty, f)) n++;
    for (const [tx, ty] of plan.water) this.digPond(tx, ty);
    for (const [tx, ty] of plan.trees) this.plantTree(tx, ty);
    for (const [tx, ty, type] of plan.feeders) if (this.placeBuilding(type, tx, ty)) n++;
    this.endBatch('paddock blueprint');
    this.world.computeRegions(); this.world.computePower(this);
    return { n, plan };
  },

  // Plant trees until about `target` of the paddock is covered
  plantCover(reg, target = 0.3) {
    const w = this.world;
    const need = Math.ceil(reg.size * target) - reg.forest;
    if (need <= 0) return 0;
    const cands = reg.tiles.filter((t) => w.terrain[t] === T_GRASS && !w.path[t] && !w.bld[t] && !w.fence[t]);
    // grow clumps around the existing cover first: looks natural and keeps open ground for walking
    const score = (t) => { const x = t % w.W, y = (t / w.W) | 0; let s = 0; for (const [dx, dy] of DIRS8) { const j = w.idx(x + dx, y + dy); if (w.terrain[j] === T_FOREST) s += 2; if (w.fence[j]) s += 1; } return s + rand(); };
    cands.sort((a, b) => score(b) - score(a));
    let n = 0;
    this.startBatch();
    for (const t of cands.slice(0, need)) if (this.plantTree(t % w.W, (t / w.W) | 0)) n++;
    this.endBatch('tree planting');
    w.computeRegions();
    return n;
  },

  // Put a feeder of the given diet on a free tile inside the paddock (near its centre)
  addFeeder(reg, diet, inBatch = false) {
    const w = this.world, type = diet === 'carn' ? 'feeder_c' : 'feeder_h';
    const tiles = reg.tiles.slice().sort((a, b) => dist2(a % w.W, (a / w.W) | 0, reg.cx, reg.cy) - dist2(b % w.W, (b / w.W) | 0, reg.cx, reg.cy));
    for (const t of tiles) {
      const x = t % w.W, y = (t / w.W) | 0;
      if (this.dinos.some((d) => d.tx === x && d.ty === y)) continue;
      if (!w.canPlaceBuilding(type, x, y)) continue;
      if (!inBatch) this.startBatch();
      const b = this.placeBuilding(type, x, y);
      if (!inBatch) this.endBatch(BUILDINGS[type].name);
      if (b) { w.computeRegions(); return b; }
    }
    return null;
  },

  // Repair every damaged or breached fence: of one paddock, or of the whole park
  repairFences(reg = null) {
    const w = this.world;
    const tiles = reg ? this.paddockFences(reg) : [...w.fence.keys()].filter((i) => w.fence[i]);
    let n = 0, cost = 0, blocked = 0;
    for (const i of tiles) {
      const x = i % w.W, y = (i / w.W) | 0;
      if (!this.needsRepair(x, y)) continue;
      const f = w.fence[i] === F_BROKEN ? (w.fenceOrig[i] || F_ELECTRIC) : w.fence[i];
      const c = Math.round(FENCE_DEF[f].cost * (w.fence[i] === F_BROKEN ? 1.5 : 0.5));
      if (!this.canAfford(c)) break;
      if (w.fence[i] === F_BROKEN && !this.clearGap(x, y)) { blocked++; continue; }
      this.spend(c, 'repairs'); cost += c; n++;
      const wasBroken = w.fence[i] === F_BROKEN;
      w.fence[i] = f; w.fenceHp[i] = FENCE_DEF[f].hp;
      if (wasBroken) w.invalidate(x, y); else w.markDirty(x, y);
      this.sparks(x + 0.5, y + 0.5, '#f8e080', 4);
    }
    return { n, cost, blocked };
  },
  repairAllCost() {
    const w = this.world;
    let c = 0, n = 0;
    for (let i = 0; i < w.fence.length; i++) {
      if (!w.fence[i]) continue;
      const x = i % w.W, y = (i / w.W) | 0;
      if (!this.needsRepair(x, y)) continue;
      const f = w.fence[i] === F_BROKEN ? (w.fenceOrig[i] || F_ELECTRIC) : w.fence[i];
      c += Math.round(FENCE_DEF[f].cost * (w.fence[i] === F_BROKEN ? 1.5 : 0.5)); n++;
    }
    return { cost: c, n };
  },
};
for (const [k, v] of Object.entries(BlueprintMixin)) Game.prototype[k] = v;

<script>
// ---------- Attractions: gyrospheres, the raptor arena and feeding shows ----------
'use strict';

// A glass ball that rolls two guests around the paddock next to its station
class Gyro {
  constructor(game, station, tile) {
    this.id = _eid++;
    this.kind = 'gyro';
    this.game = game; this.station = station;
    const w = game.world;
    this.home = { x: tile % w.W, y: (tile / w.W) | 0 };
    this.x = this.home.x + 0.5; this.y = this.home.y + 0.5;
    this.region = w.region[tile];
    this.state = 'parked'; this.riders = []; this.path = null; this.pi = 0;
    this.trip = 0; this.facing = 1; this.anim = 0; this.moving = false; this.viewT = 0; this.waitT = 0;
    this.wrecked = 0; this.dead = false;
  }
  get tx() { return Math.floor(this.x); }
  get ty() { return Math.floor(this.y); }
  remove() { for (const r of this.riders) this.unload(r); this.riders = []; this.dead = true; }
  unload(r) {
    const w = this.game.world;
    const acc = w.accessTiles(this.station);
    r.hidden = false; r.inJeep = null;
    if (acc.length) { const t = pick(acc); r.cx = r.nx = t % w.W; r.cy = r.ny = (t / w.W) | 0; r.x = r.cx + 0.5; r.y = r.cy + 0.5; }
    r.state = r.stay <= 0 ? 'leave' : 'walk';
  }
  update(dt) {
    const g = this.game, w = g.world;
    this.anim += dt; this.moving = false;
    if (this.wrecked > 0) { this.wrecked -= dt; if (this.wrecked <= 0) this.dead = true; return; }
    if (!w.buildings.has(this.station.id)) { this.remove(); return; }
    const reg = w.regions[this.region];
    // the paddock was opened up or rebuilt: bring everyone home
    if (!reg || reg.public || w.region[w.idx(this.tx, this.ty)] !== this.region) { this.remove(); return; }
    const powered = this.station.powered && w.power.outage <= 0;
    if (this.state === 'parked') {
      const q = this.station.queue || [];
      this.waitT += dt;
      if (q.length && powered && (q.length >= 2 || this.waitT > 4)) {
        if (g.gyros.some((o) => o !== this && o.station === this.station && o.state === 'parked' && o.id < this.id)) return;
        this.riders = q.splice(0, 2);
        const price = BUILDINGS.gyro.income * g.priceMul;
        for (const r of this.riders) { r.state = 'ride'; r.inJeep = this; g.earn(price, 'shops'); r.spent += price; this.station.visitors++; this.station.revenue = (this.station.revenue || 0) + price; }
        this.state = 'roll'; this.trip = randf(8, 12); this.waitT = 0;
      }
      return;
    }
    if (!powered) return; // balls lock up without power
    this.trip -= dt;
    this.viewT -= dt;
    if (this.viewT <= 0) {
      this.viewT = 1;
      for (const r of this.riders) {
        let joy = 0;
        for (const d of g.dinos) {
          if (d.carried || d.loose || dist2(this.x, this.y, d.x, d.y) > 36) continue;
          const fresh = !r.seenSpecies.has(d.species);
          if (fresh) r.seenSpecies.add(d.species);
          joy += d.sp.appeal * (fresh ? 2 : 0.3) * (d.sp.diet === 'carn' ? 1.5 : 1); // up close is the whole point
        }
        r.happy = Math.min(100, r.happy + Math.min(joy, 18) + 0.5);
      }
    }
    const pass = (x, y) => w.dinoPass(x, y) && w.region[w.idx(x, y)] === this.region;
    if (this.state === 'roll' && this.trip <= 0) {
      this.state = 'home';
      this.path = w.bfs(this.tx, this.ty, pass, (x, y) => x === this.home.x && y === this.home.y, 6000); this.pi = 0;
      if (!this.path) { this.x = this.home.x + 0.5; this.y = this.home.y + 0.5; }
    }
    if (!this.path || this.pi >= this.path.length) {
      if (this.state === 'home') {
        for (const r of this.riders) { r.happy = Math.min(100, r.happy + 6); this.unload(r); }
        this.riders = []; this.state = 'parked'; this.path = null;
        return;
      }
      const t = reg.tiles[Math.floor(rand() * reg.tiles.length)];
      const tx = t % w.W, ty = (t / w.W) | 0;
      this.path = w.bfs(this.tx, this.ty, pass, (x, y) => x === tx && y === ty, 3000); this.pi = 0;
      return;
    }
    if (stepAlong(this, dt, 1.7, pass, w)) this.path = null;
    this.moving = true;
  }
}

const AttractionMixin = {
  // Paddock tiles a Gyrosphere Station can launch into (touching it, or just across its fence)
  gyroAccess(b) {
    const w = this.world, out = [];
    for (let y = b.y - 2; y <= b.y + b.h + 1; y++) for (let x = b.x - 2; x <= b.x + b.w + 1; x++) {
      if (x >= b.x && x < b.x + b.w && y >= b.y && y < b.y + b.h) continue;
      if (!w.inb(x, y) || !w.dinoPass(x, y)) continue;
      const reg = w.regions[w.region[w.idx(x, y)]];
      if (reg && !reg.public && reg.size < 1200) out.push(w.idx(x, y));
    }
    return out;
  },

  gyroAttacked(gy, dino) {
    if (gy.wrecked) return;
    gy.wrecked = 6;
    const n = gy.riders.length;
    for (const r of gy.riders) { r.hidden = false; r.x = gy.x; r.y = gy.y; this.humanKilled(r, null, 'killed when a gyrosphere was crushed'); }
    gy.riders = [];
    this.burst(gy.x, gy.y, '#c8e8f8', 18); this.burst(gy.x, gy.y, '#c82020', n * 4);
    this.shake = Math.max(this.shake, 3);
    this.soundAt('crash', gy.x, gy.y, 1);
    this.log(`${dino.name} the ${dino.sp.name} cracked open a gyrosphere!${n ? ' ' + n + ' rider' + (n > 1 ? 's' : '') + ' lost.' : ''}`, 'bad', { x: gy.x, y: gy.y }, true);
  },

  // Dinosaurs living in a paddock whose fence comes within `reach` tiles of building b
  nearbyPaddockDinos(b, filter, reach = 6) {
    const w = this.world, out = [];
    const bx0 = b.x - reach, by0 = b.y - reach, bx1 = b.x + b.w - 1 + reach, by1 = b.y + b.h - 1 + reach;
    const near = new Map();
    for (const d of this.dinos) {
      if (d.loose || d.carried || d.sedatedT > 0 || !filter(d)) continue;
      const rid = w.region[w.idx(d.tx, d.ty)];
      if (!near.has(rid)) {
        const reg = w.regions[rid];
        near.set(rid, !!reg && !reg.public && reg.maxX + 1 >= bx0 && reg.minX - 1 <= bx1 && reg.maxY + 1 >= by0 && reg.minY - 1 <= by1);
      }
      if (near.get(rid)) out.push(d);
    }
    return out;
  },

  updateAttractions(dt) {
    const w = this.world;
    this.gyros = this.gyros || [];
    // gyrosphere stations keep two balls in their paddock
    for (const st of this.buildingsOfType('gyro')) {
      if (!st.queue) st.queue = [];
      st.queue = st.queue.filter((gu) => !gu.dead && gu.state === 'queue');
      st.gyroT = (st.gyroT || 0) - dt;
      if (st.gyroT > 0) continue;
      st.gyroT = 6;
      const mine = this.gyros.filter((gy) => gy.station === st && !gy.dead);
      const acc = this.gyroAccess(st);
      st.noPaddock = !acc.length;
      if (mine.length < 3 && acc.length) this.gyros.push(new Gyro(this, st, pick(acc)));
    }
    for (const gy of this.gyros) gy.update(dt);
    this.gyros = this.gyros.filter((gy) => !gy.dead);

    const day = this.hour >= 8 && this.hour < 20;
    // raptor arena: a show every 2.5-4 game hours of daylight when the raptors are next door
    for (const b of this.buildingsOfType('arena')) {
      if (b.showing > 0) b.showing -= dt;
      b.showT = (b.showT === undefined ? randf(1, 2) * this.secPerHour : b.showT) - dt;
      if (b.showT > 0) continue;
      b.showT = randf(2.5, 4) * this.secPerHour;
      const cx = b.x + b.w / 2, cy = b.y + b.h / 2;
      const raptors = this.nearbyPaddockDinos(b, (d) => d.species === 'raptor');
      b.noRaptors = raptors.length < 2;
      if (!b.powered || !day || b.noRaptors) continue;
      const crowd = this.guests.filter((gu) => !gu.hidden && dist2(gu.x, gu.y, cx, cy) < 100);
      const pay = Math.min(crowd.length, 50) * 18 * this.priceMul;
      this.earn(pay, 'shops');
      b.revenue = (b.revenue || 0) + pay; b.visitors += crowd.length;
      for (const gu of crowd) { gu.happy = Math.min(100, gu.happy + 15); if (chance(0.25)) { gu.thought = pick(['CLEVER!', 'WOW!', 'EEK!']); gu.thoughtT = 2; } }
      if (pay) this.addFloat(cx, b.y - 0.5, '+' + fmtMoney(pay), '#f8d040');
      b.showing = 4;
      this.stats.shows = (this.stats.shows || 0) + 1;
      this.soundAt('screech', cx, cy, 1);
      const avgStress = raptors.reduce((a, d) => a + d.stress, 0) / raptors.length;
      for (const d of raptors) d.stress = Math.min(100, d.stress + 10);
      // every show is a gamble
      const risk = 0.04 + avgStress / 500 + (raptors.some((d) => d.unstable) ? 0.08 : 0) - (this.research.has('rangers') ? 0.02 : 0);
      if (chance(risk)) this.arenaIncident(b, raptors);
    }
    // feeding grandstand: noon and 6pm
    for (const b of this.buildingsOfType('feedshow')) {
      const slot = this.hour >= 18 ? 18 : this.hour >= 12 ? 12 : -1;
      const key = this.day * 100 + slot;
      if (slot < 0 || b.lastShow === key) continue;
      if (this.hour - slot > 1) { b.lastShow = key; continue; } // missed it (e.g. loaded mid-day)
      b.lastShow = key;
      if (!b.powered) continue;
      this.feedingShow(b);
    }
  },

  arenaIncident(b, raptors) {
    const r = pick(raptors);
    if (chance(0.6)) {
      this.spend(25000, 'fines');
      this.reputation = Math.max(0, this.reputation - 4);
      this.burst(b.x + b.w / 2, b.y + b.h / 2, '#c82020', 10);
      this.soundAt('scream', b.x + b.w / 2, b.y, 1);
      this.log(`A trainer was mauled during the raptor show! ${r.name} got too clever. −$25k`, 'bad', b, true);
      return;
    }
    // the raptors use the commotion to test their fence
    const reg = this.world.regionAt(r.tx, r.ty);
    if (!reg) return;
    const fences = this.paddockFences(reg).filter((j) => isSolidFence(this.world.fence[j]));
    if (!fences.length) return;
    const w = this.world;
    const j = fences.sort((a, c) => dist2(a % w.W, (a / w.W) | 0, r.x, r.y) - dist2(c % w.W, (c / w.W) | 0, r.x, r.y))[0];
    this.log('The raptor show went wrong: the pack is going for the fence!', 'bad', r, true);
    for (const d of raptors) { d.stress = 100; d.deterT = 0; }
    this.damageFence(j % w.W, (j / w.W) | 0, 9999, r);
  },

  feedingShow(b) {
    const w = this.world, cx = b.x + b.w / 2, cy = b.y + b.h / 2;
    const cands = this.nearbyPaddockDinos(b, (d) => d.sp.diet === 'carn');
    b.noCarnivore = !cands.length;
    if (!cands.length) return;
    const d = cands.sort((a, c) => c.sp.appeal - a.sp.appeal)[0];
    // walk the star to the edge of its paddock nearest the stands
    const reg = w.regionAt(d.tx, d.ty);
    if (reg) {
      let best = null, bd = 1e9;
      for (const t of reg.tiles) { const x = t % w.W, y = (t / w.W) | 0, dd = dist2(x, y, cx, cy); if (dd < bd && w.dinoPass(x, y)) { bd = dd; best = [x, y]; } }
      if (best) { const p = w.bfs(d.tx, d.ty, w.dinoPass, (x, y) => x === best[0] && y === best[1], 3000); if (p) { d.path = p; d.pi = 0; d.state = 'walk'; } }
    }
    setTimeoutSim(this, 5, () => {
      if (d.dead || d.loose) return;
      d.hunger = Math.max(0, d.hunger - 60);
      this.burst(d.x + d.facing * 0.5, d.y, '#c83020', 12);
      this.soundAt('chomp', d.x, d.y, 1);
      this.soundAt(d.sp.size >= 3 ? 'roar' : 'screech', d.x, d.y, 1);
      const crowd = this.guests.filter((gu) => !gu.hidden && dist2(gu.x, gu.y, cx, cy) < 144);
      const pay = Math.min(crowd.length, 80) * 20 * this.priceMul;
      this.earn(pay, 'shops'); b.revenue = (b.revenue || 0) + pay; b.visitors += crowd.length;
      for (const gu of crowd) { gu.happy = Math.min(100, gu.happy + 20); if (chance(0.3)) { gu.thought = pick(['WHOA!', 'GROSS!', 'AGAIN!']); gu.thoughtT = 2; } }
      if (pay) this.addFloat(cx, b.y - 0.5, '+' + fmtMoney(pay), '#f8d040');
      this.log(`Feeding show: ${d.name} the ${d.sp.name} put on a show for ${crowd.length} guests.`, 'good', d);
    });
  },
};
for (const [k, v] of Object.entries(AttractionMixin)) Game.prototype[k] = v;

<script>
// ---------- Campaign: five chapters, each unlocking a perk for the ones after it ----------
'use strict';

// only the raptors count: a storm letting the gallimimus wander is not what this chapter is about
const rapEsc = (g) => (g.stats.escBySp && g.stats.escBySp.raptor) || 0;
const CAMPAIGN_ORDER = ['c1', 'c2', 'c3', 'c4', 'c5'];
const CAMPAIGN_PERKS = {
  c1: { name: 'Investor confidence', desc: '+$100k starting money', apply: (g) => { g.money += 100000; } },
  c2: { name: 'Ranger training', desc: 'Ranger Training researched', apply: (g) => g.research.done.add('rangers') },
  c3: { name: 'Storm-tested fences', desc: 'Reinforced Fences researched', apply: (g) => g.research.done.add('fence2') },
  c4: { name: 'ACU veterans', desc: 'Fast tranquilizers and ACU Gunship researched', apply: (g) => { g.research.done.add('darts'); g.research.done.add('acu'); } },
};

function loadCampaign() { try { return JSON.parse(localStorage.getItem('jt_campaign') || '{}'); } catch (e) { return {}; } }
function saveCampaign(id, medal, day) {
  const c = loadCampaign();
  const prev = c[id];
  if (!prev || MEDAL_RANK[medal] > MEDAL_RANK[prev.medal] || (MEDAL_RANK[medal] === MEDAL_RANK[prev.medal] && day < prev.day)) c[id] = { medal, day };
  try { localStorage.setItem('jt_campaign', JSON.stringify(c)); } catch (e) { /* storage unavailable */ }
  return c;
}
function campaignUnlocked(id) {
  const i = CAMPAIGN_ORDER.indexOf(id), done = loadCampaign();
  return i <= 0 || !!done[CAMPAIGN_ORDER[i - 1]];
}
// Perks earned from chapters finished before this one
function campaignPerks(id) {
  const done = loadCampaign();
  return CAMPAIGN_ORDER.slice(0, CAMPAIGN_ORDER.indexOf(id)).filter((k) => done[k] && CAMPAIGN_PERKS[k]).map((k) => CAMPAIGN_PERKS[k]);
}
function applyPerks(g, id) {
  const perks = campaignPerks(id);
  for (const p of perks) p.apply(g);
  g.research.apply();
  if (perks.length) g.log(`Campaign perks: ${perks.map((p) => p.name).join(', ')}.`, 'good', null, true);
}

// A checklist line for the goal panel
const tick = (ok, text) => `${ok ? '✓' : '○'} ${text}`;

const CHAPTERS = {
  c1: {
    endDay: 15,
    chapter: 1, name: 'Opening Season', size: 'small', difficulty: 'normal', hints: true,
    blurb: 'Hammond has the island, the money and a dream. Build the park from nothing and prove people will come.',
    objective: 'Reach 2 stars, have 120 guests in the park at once and earn $150,000 from guests, by Day 15',
    setup(g) { g.money = 500000; applyPerks(g, 'c1'); g.scenarioState = { peak: 0 }; g.stats.guestIncome = 0; },
    tick(g) { g.scenarioState.peak = Math.max(g.scenarioState.peak || 0, g.guests.length); },
    check(g) {
      if (g.stars >= 2 && (g.scenarioState.peak || 0) >= 120 && (g.stats.guestIncome || 0) >= 150000) return 'win';
      if (g.day > 15) return 'lose';
      return null;
    },
    progress(g) { return [tick(g.stars >= 2, `★ ${g.stars}/2`), tick((g.scenarioState.peak || 0) >= 120, `Guests ${Math.max(g.guests.length, g.scenarioState.peak || 0)}/120`), tick((g.stats.guestIncome || 0) >= 150000, `Earned ${fmtMoney(g.stats.guestIncome || 0)} / $150k`), `Day ${g.day}/15`].join(' · '); },

<script>
// ---------- Synthesized retro sound effects (WebAudio) ----------
'use strict';

class Sfx {
  constructor() {
    this.ctx = null; this.muted = false; this.vol = 0.5; this.sfxVol = 1; this.musicVol = 1; this.tense = false;
    try { const a = JSON.parse(localStorage.getItem('jt_audio_levels') || 'null'); if (a) { this.vol = a.vol; this.sfxVol = a.sfx; this.musicVol = a.music; } } catch (e) { /* storage unavailable */ }
    this.last = {};
    this.alarmT = 0;
  }
  ensure() {
    if (this.ctx) return true;
    try {
      this.ctx = new (window.AudioContext || window.webkitAudioContext)();
      this.master = this.ctx.createGain(); this.master.gain.value = this.muted ? 0 : this.vol; this.master.connect(this.ctx.destination);
      this.sfxBus = this.ctx.createGain(); this.sfxBus.gain.value = this.sfxVol; this.sfxBus.connect(this.master);
      const len = this.ctx.sampleRate;
      this.noise = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
      const d = this.noise.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    } catch (e) { this.ctx = null; }
    return !!this.ctx;
  }
  tone(type, f0, f1, dur, vol = 0.3, delay = 0) {
    const c = this.ctx, t = c.currentTime + delay;
    const o = c.createOscillator(), g = c.createGain();
    o.type = type; o.frequency.setValueAtTime(f0, t);
    if (f1 !== f0) o.frequency.exponentialRampToValueAtTime(Math.max(1, f1), t + dur);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    o.connect(g); g.connect(this.sfxBus); o.start(t); o.stop(t + dur + 0.02);
  }
  noiseBurst(dur, vol = 0.3, filt = 1000, q = 1, delay = 0, type = 'lowpass') {
    const c = this.ctx, t = c.currentTime + delay;
    const s = c.createBufferSource(); s.buffer = this.noise;
    const f = c.createBiquadFilter(); f.type = type; f.frequency.value = filt; f.Q.value = q;
    const g = c.createGain(); g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    s.connect(f); f.connect(g); g.connect(this.sfxBus); s.start(t); s.stop(t + dur + 0.02);
  }
  // ---- original chiptune loop: scheduled a bar ahead ----
  startMusic() {
    if (!this.ensure() || this.musicOn) return;
    this.musicOn = true;
    this.musicGain = this.ctx.createGain(); this.musicGain.gain.value = 0.22 * this.musicVol; this.musicGain.connect(this.master);
    this.bar = 0; this.nextBarT = this.ctx.currentTime + 0.1;
    this.musicTimer = setInterval(() => this.scheduleMusic(), 200);
  }
  stopMusic() {
    this.musicOn = false;
    clearInterval(this.musicTimer);
    if (this.musicGain) { this.musicGain.gain.setTargetAtTime(0, this.ctx.currentTime, 0.2); this.musicGain = null; }
  }
  note(type, freq, t, dur, vol) {
    const c = this.ctx, o = c.createOscillator(), g = c.createGain();
    o.type = type; o.frequency.value = freq;
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + 0.02); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    o.connect(g); g.connect(this.musicGain); o.start(t); o.stop(t + dur + 0.05);
  }
  scheduleMusic() {
    if (!this.musicOn || !this.musicGain) return;
    const c = this.ctx;
    const beat = 60 / 84;
    const hz = (m) => 440 * Math.pow(2, (m - 69) / 12);
    // D major: I  V  vi  IV / I  IV  V  V  (MIDI roots)
    const prog = [[50, 54, 57], [57, 61, 64], [59, 62, 66], [55, 59, 62], [50, 54, 57], [55, 59, 62], [57, 61, 64], [57, 61, 64]];
    // melody per bar: [beat offset, midi, length in beats]
    const mel = [
      [[0, 74, 1.5], [1.5, 76, 0.5], [2, 78, 2]],
      [[0, 76, 1], [1, 73, 1], [2, 69, 2]],
      [[0, 71, 1.5], [1.5, 73, 0.5], [2, 74, 1], [3, 76, 1]],
      [[0, 74, 3], [3, 71, 1]],
      [[0, 74, 1.5], [1.5, 76, 0.5], [2, 78, 1], [3, 81, 1]],
      [[0, 79, 2], [2, 78, 1], [3, 76, 1]],
      [[0, 76, 1], [1, 78, 1], [2, 76, 1], [3, 73, 1]],
      [[0, 74, 4]],
    ];
    while (this.nextBarT < c.currentTime + 1.2) {
      if (this.tense) { this.scheduleTenseBar(); continue; }
      const t0 = this.nextBarT, i = this.bar % 8, chord = prog[i];
      const quiet = Math.floor(this.bar / 8) % 2 === 1; // every other phrase: no lead, just the bed
      this.note('triangle', hz(chord[0] - 12), t0, beat * 3.8, 0.22);
      for (let k = 0; k < 8; k++) this.note('triangle', hz(chord[k % 3] + (k >= 4 ? 12 : 0)), t0 + k * beat / 2, beat * 0.45, 0.07);
      if (!quiet) for (const [o, m, l] of mel[i]) this.note('square', hz(m), t0 + o * beat, l * beat * 0.95, 0.045);
      else this.note('sine', hz(chord[1] + 12), t0, beat * 4, 0.05);
      this.nextBarT += beat * 4; this.bar++;
    }
  }

  // Breach music: D minor ostinato, pounding low pulse, faster tempo
  scheduleTenseBar() {
    const hz = (m) => 440 * Math.pow(2, (m - 69) / 12);
    const beat = 60 / 132, t0 = this.nextBarT;
    const roots = [38, 38, 41, 36], r = roots[this.tenseBar = ((this.tenseBar || 0) + 1) % 4];
    for (let k = 0; k < 8; k++) this.note('sawtooth', hz(r + (k % 2 ? 12 : 0)), t0 + k * beat / 2, beat * 0.4, 0.05);
    for (let k = 0; k < 4; k++) this.note('sine', hz(r - 12), t0 + k * beat, beat * 0.5, 0.25);
    const stab = [62, 65, 64, 61][this.tenseBar];
    this.note('square', hz(stab), t0, beat * 1.5, 0.04); this.note('square', hz(stab + 3), t0 + beat * 2, beat * 1.5, 0.035);
    this.nextBarT += beat * 4; this.bar++;
  }
  setLevels(vol, sfx, music) {
    this.vol = vol; this.sfxVol = sfx; this.musicVol = music;
    if (this.master && !this.muted) this.master.gain.value = vol;
    if (this.sfxBus) this.sfxBus.gain.value = sfx;
    if (this.musicGain) this.musicGain.gain.value = 0.22 * music;
    try { localStorage.setItem('jt_audio_levels', JSON.stringify({ vol, sfx, music })); } catch (e) { /* storage unavailable */ }
  }

  play(name, vol = 1) {
    if (this.muted || !this.ensure()) return;
    const now = performance.now();
    const minGap = { screech: 700, honk: 600, bellow: 1500, roar: 900, zap: 120, thud: 100, scream: 400, dart: 80, chomp: 150, alarm: 2500, thunder: 300, crash: 200 }[name] || 60;
    if (this.last[name] && now - this.last[name] < minGap) return;
    this.last[name] = now;
    const v = clamp(vol, 0, 1.2);
    switch (name) {
      case 'click': this.tone('square', 880, 660, 0.05, 0.08 * v); break;
      case 'build': this.tone('square', 220, 440, 0.08, 0.12 * v); this.noiseBurst(0.08, 0.15 * v, 1500); break;
      case 'demolish': this.noiseBurst(0.25, 0.3 * v, 600); this.tone('sawtooth', 120, 40, 0.25, 0.15 * v); break;
      case 'error': this.tone('square', 200, 150, 0.15, 0.12 * v); break;
      case 'cash': this.tone('square', 1320, 1320, 0.05, 0.08 * v); this.tone('square', 1760, 1760, 0.08, 0.08 * v, 0.05); break;
      case 'roar':
        this.noiseBurst(1.2, 0.5 * v, 400, 4); this.tone('sawtooth', 90, 45, 1.2, 0.25 * v); this.tone('sawtooth', 140, 60, 1.0, 0.15 * v, 0.05); break;
      case 'screech': this.tone('sawtooth', 1400, 2400, 0.12, 0.08 * v); this.tone('sawtooth', 2200, 900, 0.35, 0.08 * v, 0.1); this.noiseBurst(0.3, 0.1 * v, 3000, 3, 0.05, 'bandpass'); break;
      case 'honk': this.tone('triangle', 220, 260, 0.35, 0.12 * v); this.tone('triangle', 330, 300, 0.4, 0.06 * v); break;
      case 'bellow': this.tone('sine', 70, 55, 1.4, 0.3 * v); this.tone('triangle', 140, 110, 1.2, 0.08 * v); break;
      case 'zap': this.noiseBurst(0.15, 0.25 * v, 4000, 2, 0, 'highpass'); this.tone('square', 1800, 300, 0.12, 0.1 * v); break;
      case 'thud': this.tone('sine', 120, 40, 0.18, 0.4 * v); this.noiseBurst(0.1, 0.2 * v, 300); break;
      case 'crash': this.noiseBurst(0.6, 0.5 * v, 900); this.tone('sawtooth', 80, 30, 0.5, 0.25 * v); break;
      case 'chomp': this.noiseBurst(0.08, 0.35 * v, 800); this.noiseBurst(0.08, 0.3 * v, 600, 1, 0.12); break;
      case 'scream': this.tone('sawtooth', 900, 1400, 0.3, 0.08 * v); this.tone('sawtooth', 1400, 600, 0.4, 0.08 * v, 0.3); break;
      case 'dart': this.noiseBurst(0.06, 0.2 * v, 3000, 1, 0, 'highpass'); this.tone('square', 600, 1200, 0.05, 0.05 * v); break;
      case 'alarm': for (let i = 0; i < 4; i++) { this.tone('square', 660, 880, 0.28, 0.1 * v, i * 0.6); this.tone('square', 880, 660, 0.28, 0.1 * v, i * 0.6 + 0.3); } break;
      case 'thunder': this.noiseBurst(1.8, 0.6 * v, 200, 1); this.noiseBurst(0.2, 0.4 * v, 3000, 1); break;
      case 'boom': this.noiseBurst(2.5, 0.7 * v, 120, 1); this.tone('sine', 60, 25, 2.0, 0.4 * v); break;
      case 'powerdown': this.tone('sawtooth', 440, 40, 1.5, 0.2 * v); break;
      case 'powerup': this.tone('sawtooth', 60, 440, 1.0, 0.15 * v); break;
      case 'hatch': this.tone('triangle', 660, 990, 0.1, 0.15 * v); this.tone('triangle', 990, 1320, 0.15, 0.15 * v, 0.1); break;
      case 'fanfare': [523, 659, 784, 1046].forEach((f, i) => this.tone('square', f, f, 0.18, 0.09 * v, i * 0.12)); break;
      case 'chirp': { const f = 2000 + Math.random() * 1800; this.tone('sine', f, f * 1.3, 0.07, 0.025 * v); this.tone('sine', f * 1.1, f * 0.9, 0.08, 0.025 * v, 0.1); break; }
      case 'cricket': for (let i = 0; i < 3; i++) this.tone('square', 4200, 4300, 0.03, 0.008 * v, i * 0.06); break;
      case 'caw': this.tone('sawtooth', 700, 420, 0.25, 0.03 * v); break;
      case 'heli': this.noiseBurst(0.8, 0.15 * v, 200, 6); break;
      case 'ring': for (let i = 0; i < 2; i++) { for (let k = 0; k < 8; k++) this.tone('square', k % 2 ? 1180 : 960, k % 2 ? 1180 : 960, 0.04, 0.05 * v, i * 0.55 + k * 0.045); } break;
    }
  }
