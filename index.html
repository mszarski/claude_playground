<script>
'use strict';

// ---------------- Guests ----------------
const GUEST_FIRST = ['Dave', 'Karen', 'Lex', 'Tim', 'Gennaro', 'Priya', 'Marco', 'Aiko', 'Olu', 'Sven', 'Rosa', 'Ben', 'Mei', 'Hank', 'Fatima', 'Liam', 'Ines', 'Carl', 'Zoe', 'Raj', 'Greta', 'Diego', 'Nora', 'Kwame'];
const GUEST_TOWNS = ['Ohio', 'Leeds', 'Osaka', 'Lagos', 'Lyon', 'Perth', 'Toronto', 'Seville', 'Pune', 'Bergen', 'Cork', 'Austin', 'Busan', 'Accra', 'Malmo', 'Porto', 'Denver', 'Bristol'];
class Guest {
  constructor(game, tile) {
    this.id = _eid++;
    this.kind = 'guest';
    this.game = game;
    const w = game.world;
    this.cx = tile % w.W; this.cy = (tile / w.W) | 0;
    this.x = this.cx + 0.5 + randf(-0.25, 0.25); this.y = this.cy + 0.5 + randf(-0.25, 0.25);
    this.nx = this.cx; this.ny = this.cy; this.prev = -1;
    this.ox = randf(-0.28, 0.28); this.oy = randf(-0.28, 0.28);
    this.kid = chance(0.22);
    this.sprite = pick(this.kid ? PEOPLE.kids : PEOPLE.guests);
    this.state = 'walk';
    this.hunger = randf(0, 40); this.toilet = randf(0, 30); this.shopUrge = randf(0, 60);
    this.happy = 60; this.fear = 0;
    this.stay = randf(10, 20); // hours in park
    this.goal = null; this.insideT = 0; this.hidden = false; this.dead = false;
    this.anim = rand(); this.facing = 1;
    this.seenSpecies = new Set();
    this.viewT = rand();
    this.speedMul = randf(0.85, 1.15);
    this.spent = 0;
    this.thought = null;
  }

  // a name only when someone looks (cosmetic, so it stays off the simulation's seeded dice)
  get label() {
    if (!this._label) {
      const pickR = (a) => a[Math.floor(Math.random() * a.length)];
      this._label = `${pickR(GUEST_FIRST)} from ${pickR(GUEST_TOWNS)}`;
    }
    return this._label;
  }
  get tx() { return Math.floor(this.x); }
  get ty() { return Math.floor(this.y); }

  update(dt) {
    const g = this.game, w = g.world;
    this.anim += dt;
    const hrs = dt / g.secPerHour;
    if (this.state === 'ride') { if (this.inJeep) { this.x = this.inJeep.x; this.y = this.inJeep.y; } return; }
    if ((this.state === 'queue' || this.state === 'inside') && (this.scareT = (this.scareT || 0) - dt) <= 0) {
      // a shop counter or a ride queue is no hiding place: a predator close by flushes everyone out
      this.scareT = 1;
      if (g.threatNear(this.cx, this.cy, 5)) { this.leaveCover(); this.state = 'flee'; this.goal = null; this.fear = 100; this.thought = 'RUN!'; this.thoughtT = 2; return; }
    }
    if (this.state === 'queue') {
      this.insideT -= dt;
      if (this.insideT <= 0) { this.happy -= 8; this.hidden = false; this.state = 'walk'; }
      return;
    }
    if (this.state === 'inside' || this.state === 'shelter') {
      this.insideT -= dt;
      if (this.state === 'shelter') {
        if (!g.alarm && g.threatNear(this.cx, this.cy, 12) == null && this.insideT <= 0) this.exitBuilding();
      } else if (this.insideT <= 0) this.exitBuilding();
      return;
    }
    if (this.state === 'frozen') { this.frozenT -= dt; if (this.frozenT <= 0) this.state = 'flee'; return; }
    this.stay -= hrs;
    this.hunger += hrs * 5; this.toilet += hrs * 6; this.shopUrge += hrs * 3;

    // Threat check
    this.viewT -= dt;
    if (this.viewT <= 0) {
      this.viewT = 0.8;
      const threat = g.threatNear(this.x, this.y, 7);
      if ((threat || g.alarm || (g.sirenAlarm && g.inSirenRange(this.x, this.y))) && this.state !== 'flee' && this.state !== 'frozen') {
        this.goal = null; this.fear = 100;
        // a predator in plain sight: some people freeze before they run (an alarm gives warning, so nobody does)
        if (threat && chance(0.3)) { this.state = 'frozen'; this.frozenT = randf(1, 2.5); this.thought = 'AAAH!'; this.thoughtT = 2; g.soundAt('scream', this.x, this.y, 0.6); }
        else this.state = 'flee';
      }
      if (this.state !== 'flee') this.lookAtDinos();
      if (this.hunger > 85 || this.toilet > 85) this.happy -= 1.5;
      if (g.crowd) {
        // people per walkable tile nearby: a wider path or plaza really does relieve the crush
        let c = 0, room = 0;
        const w = g.world;
        for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) { const x = this.cx + dx, y = this.cy + dy; if (!w.inb(x, y)) continue; const i = w.idx(x, y); c += g.crowd[i]; if (w.path[i]) room++; }
        const limit = 6 * Math.max(3, room);
        if (c > limit) {
          this.happy -= (c - limit) * 0.04;
          this.crowded = true;
          if (chance(0.03)) { this.thought = 'CROWDED'; this.thoughtT = 1.5; }
        } else this.crowded = false;
      }
      if (g.hour >= 20 || g.hour < 6) { if (!g.litNear(this.x, this.y)) this.happy -= 0.3; }
      this.happy = clamp(this.happy, 0, 100);
      if (this.happy < 12 && this.state === 'walk') this.state = 'leave';
      if (this.stay <= 0 && this.state === 'walk') this.state = 'leave';
    }
    if (this.thoughtT > 0) this.thoughtT -= dt; else this.thought = null;
    if (this.state === 'watch') { this.watchT -= dt; if (this.watchT <= 0) this.state = 'walk'; return; }

    // Movement between tiles
    // a park is a long walk: guests stroll briskly so far-off attractions are reachable in a visit
    let speed = (this.state === 'flee' ? 2.1 : 1.3) * this.speedMul;
    // a panicking crowd jams: narrow, packed paths turn an evacuation into a crush
    if (this.state === 'flee' && g.crowd) { const n = g.crowd[g.world.idx(this.cx, this.cy)] || 0; if (n > 3) speed *= clamp(1 - (n - 3) * 0.08, 0.35, 1); }
    const tx = this.nx + 0.5 + this.ox, ty = this.ny + 0.5 + this.oy;
    const dx = tx - this.x, dy = ty - this.y;
    const d = Math.sqrt(dx * dx + dy * dy);
    const s = speed * dt;
    if (d > s) {
      this.x += (dx / d) * s; this.y += (dy / d) * s;
      if (Math.abs(dx) > 0.01) this.facing = dx > 0 ? 1 : -1;
      this.moving = true;
      return;
    }
    this.x = tx; this.y = ty; this.moving = false;
    const here = w.idx(this.nx, this.ny);
    this.prev = w.idx(this.cx, this.cy);
    this.cx = this.nx; this.cy = this.ny;
    if (!w.path[here]) {
      // path removed beneath us: walk to nearest path or vanish
      this.game.removeGuest(this, false); return;
    }
    this.chooseNext(here);
  }

  lookAtDinos() {
    const g = this.game;
    let view = 6;
    const vp = g.nearBuilding(this.cx, this.cy, 'viewing', 1);
    if (vp) view = BUILDINGS.viewing.view;
    let joy = 0;
    for (const d of g.creatures()) {
      if (d.carried) continue;
      const dd = dist2(this.x, this.y, d.x, d.y);
      if (dd > view * view) continue;
      if (d.loose) continue;
      if (d.isPtera && dd > 64) continue;
      const fresh = !this.seenSpecies.has(d.species);
      if (fresh) this.seenSpecies.add(d.species);
      joy += d.sp.appeal * (fresh ? 1.2 : 0.12) * (d.sedatedT > 0 ? 0.3 : 1);
    }
    if (joy > 0) {
      this.happy = Math.min(100, this.happy + Math.min(joy, 12));
      if (joy > 3 && chance(0.15)) { this.thought = pick(['WOW!', 'COOL!', 'OOH!', '!!']); this.thoughtT = 1.6; }
    } else {
      this.happy -= 0.25;
    }
  }

  pickGoal() {
    const g = this.game;
    let type = null;
    if (this.state === 'leave') return 'gate';
    if (this.hunger > 60) type = 'restaurant';
    else if (this.toilet > 60) type = 'restroom';
    else if ((g.hour >= 19 || g.hour < 6) && this.stay > 4) type = 'hotel';
    else if (this.shopUrge > 70) type = 'shop';
    // feeding time draws a crowd: in the hour before the noon and evening shows, people head for the stands
    else if (((g.hour >= 11 && g.hour < 12) || (g.hour >= 17 && g.hour < 18)) && g.hasBuilding('feedshow') && chance(0.5)) type = 'feedshow';
    else if (chance(0.45)) {
      // something to do: only among the attractions this park actually has
      const opts = ['tour', 'tour', 'gyro', 'gyro', 'lagoon', 'lagoon', 'arena', 'feedshow', 'viewing', 'viewing', 'visitor', 'shop', 'restaurant'].filter((t) => g.hasBuilding(t));
      if (opts.length) type = pick(opts);
    }
    if (!type) return null;
    // a hotel only has so many rooms
    const cands = g.buildingsOfType(type).filter((b) => (b.powered || !BUILDINGS[b.type].power) && !(BUILDINGS[b.type].rooms && b.inside >= BUILDINGS[b.type].rooms));
    if (!cands.length) { if (type === 'restroom' || type === 'restaurant') this.happy -= 2; return null; }
    // a pressing need goes to the nearest one you can actually walk to; anything else can be anywhere
    if (type === 'restroom' || type === 'restaurant') {
      const here = g.world.idx(this.cx, this.cy);
      let best = null, bd = Infinity;
      for (const b of cands) { const d = g.buildingField(b)[here]; if (d >= 0 && d < bd) { bd = d; best = b; } }
      if (!best) { this.happy -= 2; return null; }
      return best;
    }
    return pick(cands);
  }

  chooseNext(here) {
    const g = this.game, w = g.world;
    let field = null;
    if (this.state === 'flee') {
      // people trip when they run for their lives
      if (chance(0.03)) { this.state = 'frozen'; this.frozenT = randf(0.7, 1.4); this.thought = 'OOF!'; this.thoughtT = 1; return; }
      field = g.shelterField();
      if (field[here] === -1 || !g.anyShelterSpace()) {
        if (g.gateLocked) field = null; // nowhere to run: panic in place
        else { field = g.gateField(); this.state = 'flee'; this.fleeGate = true; }
      }
    } else if (this.state === 'leave') {
      field = g.gateLocked ? null : g.gateField();
    } else {
      if (!this.goal || (this.goal !== 'gate' && !w.buildings.has(this.goal.id))) { const urgent = this.hunger > 60 || this.toilet > 60; this.goal = urgent || chance(0.25) ? this.pickGoal() : null; }
      if (this.goal && this.goal !== 'gate') field = g.buildingField(this.goal);
    }
    if (field) {
      const dHere = field[here];
      if (dHere === 0) { this.arriveAt(); return; }
      if (dHere > 0) {
        const opts = [];
        for (const [dx, dy] of DIRS4) {
          const nx = this.cx + dx, ny = this.cy + dy;
          if (!w.inb(nx, ny)) continue;
          const j = w.idx(nx, ny);
          if (field[j] >= 0 && field[j] < dHere) opts.push([nx, ny]);
        }
        if (opts.length) { const o = pick(opts); this.nx = o[0]; this.ny = o[1]; return; }
      } else if (this.goal && this.goal !== 'gate') this.goal = null;
    }
    // Random walk on path network, avoiding immediate backtrack
    const opts = [];
    for (const [dx, dy] of DIRS4) {
      const nx = this.cx + dx, ny = this.cy + dy;
      if (!w.inb(nx, ny)) continue;
      const j = w.idx(nx, ny);
      if (w.path[j] && j !== this.prev) opts.push([nx, ny]);
    }
    if (!opts.length && this.prev >= 0 && w.path[this.prev]) opts.push([this.prev % w.W, (this.prev / w.W) | 0]);
    if (opts.length > 1) {
      // At a junction: favour directions that lead toward species this guest hasn't seen yet
      const weight = (o) => {
        const px = this.cx + (o[0] - this.cx) * 5, py = this.cy + (o[1] - this.cy) * 5;
        let wgt = 1;
        for (const d of g.creatures()) {
          if (d.loose || d.carried || this.seenSpecies.has(d.species)) continue;
          if (dist2(px, py, d.x, d.y) < 64) wgt += 3;
        }
        // and away from packed crowds
        const c = g.crowd ? g.crowd[w.idx(o[0], o[1])] : 0;
        return wgt / (1 + c * 0.15);
      };
      const o = weightedPick(opts, weight) || pick(opts);
      this.nx = o[0]; this.ny = o[1];
    } else if (opts.length) { this.nx = opts[0][0]; this.ny = opts[0][1]; }
  }

  arriveAt() {
    const g = this.game, w = g.world;
    if (this.state === 'leave' || (this.state === 'flee' && this.fleeGate)) {
      if (this.state === 'flee') g.stats.fledToday++;
      g.removeGuest(this, true); return;
    }
    if (this.state === 'flee') {
      const b = g.nearShelterWithSpace(this.cx, this.cy);
      if (b) { b.inside++; this.inBuilding = b; this.state = 'shelter'; this.hidden = true; this.insideT = 6; return; }
      this.fleeGate = true; return;
    }
    const b = this.goal;
    this.goal = null;
    if (!b || b === 'gate' || !w.buildings.has(b.id)) return;
    const def = BUILDINGS[b.type];
    if (def.power && !b.powered) { this.happy -= 3; return; }
    if (b.type === 'viewing' || b.type === 'arena' || b.type === 'feedshow') {
      this.happy = Math.min(100, this.happy + 4); this.lookAtDinos();
      // waiting for feeding time: stay put by the stands
      if (b.type === 'feedshow' && ((g.hour >= 11 && g.hour < 12.2) || (g.hour >= 17 && g.hour < 18.2))) {
        const showAt = g.hour < 13 ? 12.2 : 18.2;
        this.state = 'watch'; this.watchT = Math.max(1, (showAt - g.hour) * g.secPerHour);
      }
      return;
    }
    if (b.type === 'tour' || b.type === 'gyro') {
      if (!b.queue) b.queue = [];
      if (b.queue.length >= 16) { this.happy -= 3; return; }
      b.queue.push(this); this.state = 'queue'; this.hidden = true; this.inBuilding = null; this.insideT = 40;
      return;
    }
    // a full hotel turns people away at the desk
    if (def.rooms && b.inside >= def.rooms) { this.happy -= 2; this.thought = 'NO ROOMS'; this.thoughtT = 1.5; return; }
    // Enter
    this.inBuilding = b; b.inside++;
    this.hidden = true; this.state = 'inside';
    this.insideT = b.type === 'hotel' ? randf(18, 30) : randf(3, 7);
    const price = def.income || 0;
    if (price) { g.earn(price * g.priceMul, 'shops'); this.spent += price; b.visitors++; b.revenue = (b.revenue || 0) + price * g.priceMul; }
    if (b.type === 'restaurant') this.hunger = 0;
    if (b.type === 'restroom') this.toilet = 0;
    if (b.type === 'shop') this.shopUrge = 0;
    if (b.type === 'hotel') { this.stay += 10; this.hunger = 10; this.toilet = 10; }
    this.happy = Math.min(100, this.happy + (def.appeal || 3));
  }

  leaveCover() {
    if (this.inBuilding) this.inBuilding.inside = Math.max(0, this.inBuilding.inside - 1);
    if (this.state === 'queue') for (const b of this.game.world.buildings.values()) if (b.queue) { const k = b.queue.indexOf(this); if (k >= 0) b.queue.splice(k, 1); }
    this.inBuilding = null; this.hidden = false;
  }

  exitBuilding() {
    const b = this.inBuilding;
    if (b) b.inside = Math.max(0, b.inside - 1);
    this.inBuilding = null; this.hidden = false;
    if (this.state === 'shelter') this.fear = 0;
    this.state = this.stay <= 0 || this.happy < 15 ? 'leave' : 'walk';
    this.fleeGate = false;
  }
}

<script>
'use strict';

// ---------------- Staff: rangers & engineers ----------------
class Staff {
  constructor(game, role, home) {
    this.id = _eid++;
    this.kind = role;
    this.role = role;
    this.game = game;
    this.home = home;
    const w = game.world;
    const spots = w.adjacentPassable(home, w.humanPass);
    const s = spots.length ? pick(spots) : [home.x, home.y + home.h];
    this.x = s[0] + 0.5; this.y = s[1] + 0.5;
    this.state = 'idle'; this.stateT = rand() * 2;
    this.path = null; this.pi = 0;
    this.facing = 1; this.anim = rand(); this.moving = false;
    this.target = null; this.cd = 0; this.dead = false; this.hidden = false;
    this.thinkT = rand();
    this.sprite = role === 'ranger' ? PEOPLE.ranger : PEOPLE.worker;
  }
  get tx() { return Math.floor(this.x); }
  get ty() { return Math.floor(this.y); }

  update(dt) {
    const g = this.game, w = g.world;
    this.anim += dt; this.moving = false;
    if (this.cd > 0) this.cd -= dt;
    this.thinkT -= dt;
    if (!w.buildings.has(this.home.id)) { this.dead = true; return; }
    if (this.role === 'ranger') this.updateRanger(dt);
    else this.updateWorker(dt);
  }

  updateRanger(dt) {
    const g = this.game, w = g.world;
    if (this.thinkT <= 0) {
      this.thinkT = this.order ? 0.6 : 1.0;
      const o = this.order;
      // a hunt order ends once the target is down or back in its paddock
      if (o && o.type === 'hunt' && (!o.d || o.d.dead || o.d.carried || o.d.sedatedT > 0 || (!o.d.loose && !o.d.orderSedate))) {
        this.order = null;
        g.addFloat(this.x, this.y - 1, 'Target secured', '#a8f080');
      }
      // pick most dangerous loose dino (or ordered sedation); a posted ranger only guards its post
      let best = null, bs = -1e9;
      if (this.order && this.order.type === 'hunt') best = this.order.d;
      else for (const d of g.creatures()) {
        if (d.carried || d.sedatedT > 0) continue;
        if (!d.loose && !d.orderSedate) continue;
        if (d.camouflaged && dist2(this.x, this.y, d.x, d.y) > 9) continue;
        if (this.order && dist2(this.order.x + 0.5, this.order.y + 0.5, d.x, d.y) > 49) continue;
        const s = d.sp.danger * 10 - dist(this.x, this.y, d.x, d.y);
        if (s > bs) { bs = s; best = d; }
      }
      if (best !== this.target) { this.target = best; this.path = null; if (!best) this.state = 'idle'; }
      if (this.target) {
        const d = this.target;
        const dd = dist(this.x, this.y, d.x, d.y);
        if (dd > 4.2 && (!this.path || this.thinkCount++ % 3 === 0)) {
          const tx = d.x, ty = d.y;
          let p = w.bfs(this.tx, this.ty, w.humanPass, (x, y) => dist2(x + 0.5, y + 0.5, tx, ty) < 3.5 * 3.5 && w.humanPass(x, y), 4000);
          // a contained target deep inside its paddock: wait at the nearest point of the fence for a clear shot
          if (!p && !d.loose) p = w.bfsNearest(this.tx, this.ty, w.humanPass, tx, ty, 4000);
          this.path = p; this.pi = 0;
          this.state = p ? 'move' : 'idle';
        }
      } else if (this.order && this.order.type === 'move') {
        // head to the ordered post and hold there
        const ox = this.order.x, oy = this.order.y;
        if (dist2(this.x, this.y, ox + 0.5, oy + 0.5) > 2.2) {
          if (!this.path) { this.path = w.bfs(this.tx, this.ty, w.humanPass, (x, y) => dist2(x, y, ox, oy) <= 1, 5000); this.pi = 0; if (!this.path) this.order = null; }
        } else { this.path = null; this.reached = true; }
      } else if (!this.path) {
        // patrol near home
        if (chance(0.3)) {
          const tx = this.home.x + randi(-5, 5), ty = this.home.y + randi(-5, 5);
          if (w.humanPass(tx, ty)) { this.path = w.bfs(this.tx, this.ty, w.humanPass, (x, y) => x === tx && y === ty, 600); this.pi = 0; }
        }
      }
      this.thinkCount = (this.thinkCount || 0) + 1;
    }
    if (this.target) {
      const d = this.target;
      const dd = dist(this.x, this.y, d.x, d.y);
      // over a fence, from a raised position: a contained target can be darted from a little further away
      const reach = (g.research.has('rangers') ? 5.5 : 4.5) + (d.loose ? 0 : 1.5);
      if (dd <= reach && this.cd <= 0 && !d.carried && d.sedatedT <= 0) {
        this.cd = 1.6;
        this.facing = d.x > this.x ? 1 : -1;
        g.darts.push({ x: this.x, y: this.y - 0.3, t: d, life: 1.5 });
        g.soundAt('dart', this.x, this.y, 0.7);
        this.path = null;
        return;
      }
      if (dd < 2.2 && d.sp.danger >= 4 && !this.retreating) {
        // too close: back off
        const ax = this.x - d.x, ay = this.y - d.y, al = Math.hypot(ax, ay) || 1;
        const nx = this.x + ax / al * 2.1 * dt, ny = this.y + ay / al * 2.1 * dt;
        if (w.humanPass(Math.floor(nx), Math.floor(ny))) { this.x = nx; this.y = ny; this.moving = true; }
        return;
      }
      if (dd <= 3.8) { this.path = null; return; }
    }
    // ordered units move at the double
    if (this.path) { if (stepAlong(this, dt, (g.research.has('rangers') ? 2.5 : 1.9) * g.mod('rangerSpeed') * (this.order ? 1.3 : 1), w.humanPass, w)) this.path = null; }
  }

  updateWorker(dt) {
    const g = this.game, w = g.world;
    // Engineers are not heroes: drop everything and run from loose predators
    const threat = g.threatNear(this.x, this.y, 6);
    if (threat && this.state !== 'flee') {
      this.state = 'flee'; this.job = null;
      const hx = this.home.x, hy = this.home.y;
      this.path = w.bfs(this.tx, this.ty, w.humanPass, (x, y) => dist2(x, y, hx, hy) < 6, 5000);
      this.pi = 0;
    }
    if (this.state === 'flee') {
      if (!this.path || stepAlong(this, dt, 2.2, w.humanPass, w)) { this.path = null; if (!g.threatNear(this.x, this.y, 9)) this.state = 'idle'; }
      return;
    }
    if (this.state === 'repair') {
      const j = this.job;
      const fx = j % w.W, fy = (j / w.W) | 0;
      if (Math.abs(fx + 0.5 - this.x) + Math.abs(fy + 0.5 - this.y) > 1.6) { this.state = 'idle'; return; }
      this.facing = fx + 0.5 > this.x ? 1 : -1;
      this.workT = (this.workT || 0) + dt;
      if (this.workT > 0.5) { this.workT = 0; g.sparks(fx + 0.5, fy + 0.5, '#f8e080', 2); }
      if (this.jobType === 'fence') {
        const f = w.fence[j];
        if (f === F_BROKEN) {
          // rebuild if no dino standing there
          const blocked = !g.clearGap(fx, fy);
          if (!blocked) {
            const orig = w.fenceOrig[j] || F_ELECTRIC;
            const cost = Math.round(FENCE_DEF[orig].cost * 0.6);
            if (g.money > -50000) {
              g.spend(cost, 'repairs');
              w.fence[j] = orig; w.fenceHp[j] = FENCE_DEF[orig].hp * 0.4;
              w.invalidate(fx, fy); g.onFenceRebuilt(fx, fy);
            }
          }
          this.state = 'idle';
        } else if (isSolidFence(f)) {
          const max = FENCE_DEF[f].hp;
          w.fenceHp[j] = Math.min(max, w.fenceHp[j] + dt * 22);
          g.spend(dt * 6, 'repairs');
          if (w.fenceHp[j] >= max) { this.state = 'idle'; w.markDirty(fx, fy); }
        } else this.state = 'idle';
      } else if (this.jobType === 'building') {
        const b = this.jobB;
        if (!b || !w.buildings.has(b.id)) { this.state = 'idle'; return; }
        b.hp = Math.min(b.maxHp, b.hp + dt * 30);
        g.spend(dt * 8, 'repairs');
        if (b.hp >= b.maxHp) this.state = 'idle';
      }
      return;
    }
    if (this.state === 'move') {
      if (stepAlong(this, dt, this.order ? 2.2 : 1.7, w.humanPass, w)) {
        this.path = null;
        this.state = this.job != null ? 'repair' : 'idle';
        this.workT = 0;
      }
      return;
    }
    if (this.thinkT > 0) return;
    this.thinkT = 1.5 + rand();
    const o = this.order;
    if (o && (o.type === 'repair' || o.type === 'repairB')) {
      // ordered repair: go straight to that fence or building
      const isB = o.type === 'repairB';
      const done = isB ? (!w.buildings.has(o.b.id) || o.b.hp >= o.b.maxHp) : !g.needsRepair(o.x, o.y);
      if (done || this.ordered) { this.order = done ? null : this.order; this.ordered = false; if (done) { g.addFloat(this.x, this.y - 1, 'Fixed!', '#a8f080'); return; } }
      const goal = isB ? (x, y) => w.buildingAt(x, y) === o.b || DIRS4.some(([dx, dy]) => w.buildingAt(x + dx, y + dy) === o.b) : (x, y) => Math.abs(x - o.x) + Math.abs(y - o.y) <= 1;
      const p = w.bfs(this.tx, this.ty, w.humanPass, (x, y) => w.humanPass(x, y) && goal(x, y), 8000) || (goal(this.tx, this.ty) ? [] : null);
      if (!p) { this.order = null; g.addFloat(this.x, this.y - 1, "Can't reach it", '#ff9080'); return; }
      if (isB) { this.jobType = 'building'; this.jobB = o.b; this.job = 'b' + o.b.id; }
      else { this.jobType = 'fence'; this.job = w.idx(o.x, o.y); }
      this.ordered = true;
      this.path = p; this.pi = 0; this.state = p.length ? 'move' : 'repair'; this.workT = 0;
      return;
    }
    if (o && o.type === 'move' && !this.reached) {
      const ox = o.x, oy = o.y;
      const p = w.bfs(this.tx, this.ty, w.humanPass, (x, y) => dist2(x, y, ox, oy) <= 1, 5000);
      if (!p) { this.order = null; return; }
      this.reached = true; this.job = null;
      this.path = p; this.pi = 0; this.state = p.length ? 'move' : 'idle';
      return;
    }
    // Find nearest repair job reachable
    const claimed = new Set(g.staff.filter((s) => s !== this && s.role === 'worker' && s.job != null && s.state !== 'idle').map((s) => s.job));
    const needs = (x, y) => {
      if (!w.inb(x, y)) return false;
      const j = w.idx(x, y);
      if (claimed.has(j)) return false;
      if (g.threatNear(x + 0.5, y + 0.5, 8)) return false;
      if (o && dist2(x, y, o.x, o.y) > 100) return false;
      const f = w.fence[j];
      if (f === F_BROKEN) return true;
      if ((isSolidFence(f)) && w.fenceHp[j] < FENCE_DEF[f].hp * 0.98) return true;
      const b = w.buildings.get(w.bld[j]);
      if (b && b.hp < b.maxHp * 0.95 && !claimed.has('b' + b.id)) return true;
      return false;
    };
    const p = w.bfs(this.tx, this.ty, w.humanPass, needs, 6000);
    if (p && p.length) {
      const goal = p.pop();
      const j = w.idx(goal[0], goal[1]);
      const b = w.buildings.get(w.bld[j]);
      if (b && !(w.fence[j])) { this.jobType = 'building'; this.jobB = b; this.job = 'b' + b.id; }
      else { this.jobType = 'fence'; this.job = j; }
      this.path = p; this.pi = 0; this.state = 'move';
      if (!p.length) this.state = 'repair';
    } else {
      this.job = null;
      // idle wander near home (or stay at an ordered post)
      if (!o && dist(this.x, this.y, this.home.x, this.home.y) > 4) {
        const hp = w.bfs(this.tx, this.ty, w.humanPass, (x, y) => dist2(x, y, this.home.x, this.home.y) < 9, 3000);
        if (hp) { this.path = hp; this.pi = 0; this.state = 'move'; }
      }
    }
  }
}

<script>
'use strict';

// ---------------- Pteranodons (aviary flyers) ----------------
class Ptera {
  constructor(game, x, y) {
    this.id = _eid++;
    this.kind = 'dino'; this.isPtera = true;
    this.game = game; this.species = 'ptera'; this.sp = SPECIES.ptera;
    this.x = x + 0.5; this.y = y + 0.5; this.alt = 1.5; this.home = { x, y };
    this.hp = this.sp.hp; this.hunger = 20; this.stress = 10; this.comfort = 80; this.comfortParts = {};
    this.sedation = 0; this.sedatedT = 0; this.loose = false; this.carried = null; this.dead = false;
    this.name = nameFor('ptera'); this.facing = 1; this.anim = rand() * 6; this.flash = 0; this.kills = 0;
    this.tgt = null; this.prey = null; this.cd = 0; this.sick = 0;
  }
  get tx() { return Math.floor(this.x); }
  get ty() { return Math.floor(this.y); }
  get speed() { return this.sp.speed * 0.6; }
  aviaryHere() {
    for (const a of this.game.buildingsOfType('aviary')) {
      if (this.x >= a.x && this.x < a.x + a.w && this.y >= a.y && this.y < a.y + a.h && a.hp >= a.maxHp * 0.35) return a;
    }
    return null;
  }
  sedate() {
    this.sedatedT = 70; this.prey = null; this.tgt = null; this.orderSedate = false;
    this.game.log(`${this.name} the Pteranodon has been sedated and dropped out of the sky.`, 'good', this);
  }
  update(dt) {
    const g = this.game, w = g.world;
    this.anim += dt;
    if (this.flash > 0) this.flash -= dt;
    if (this.carried) return;
    if (this.cd > 0) this.cd -= dt;
    if (this.sedatedT > 0) {
      this.sedatedT -= dt; this.alt = Math.max(0, this.alt - dt * 3);
      if (this.loose && !g.hasBuilding('helipad')) {
        this.truckT = (this.truckT || 0) + dt;
        if (this.truckT > 18) {
          const dest = g.findPaddockFor(this);
          if (dest) { g.spend(12000, 'ops'); this.x = dest.x + 0.5; this.y = dest.y + 0.5; this.sedatedT = 3; this.truckT = 0; g.log(`Ground crew returned ${this.name} the Pteranodon to the Aviary (-$12k).`, 'good', this); }
          else this.truckT = 10;
        }
      }
      if (this.sedatedT <= 0) this.sedation = 0;
      return;
    }
    const av = this.aviaryHere();
    const wasLoose = this.loose;
    this.loose = !av;
    if (this.loose && !wasLoose) {
      g.stats.escapes++; g.reputation = Math.max(0, g.reputation - 2);
      g.log(`CONTAINMENT BREACH! ${this.name} the Pteranodon has escaped the Aviary!`, 'bad', this, true);
      g.sound('alarm'); g.emit('breach', [this]);
    } else if (!this.loose && wasLoose) g.log(`${this.name} the Pteranodon is back in the Aviary.`, 'good', this);
    if (this.hp <= 0) { g.killDino(this, 'injuries'); return; }
    const fly = (tx, ty, sp) => {
      const dx = tx - this.x, dy = ty - this.y, d = Math.sqrt(dx * dx + dy * dy);
      if (Math.abs(dx) > 0.05) this.facing = dx > 0 ? 1 : -1;
      if (d < sp * dt) { this.x = tx; this.y = ty; return true; }
      this.x += dx / d * sp * dt; this.y += dy / d * sp * dt; return false;
    };
    if (!this.loose) {
      this.alt = 0.9 + Math.sin(this.anim * 0.9) * 0.3;
      if (!this.tgt || fly(this.tgt[0], this.tgt[1], this.speed * 0.6)) this.tgt = [av.x + 0.8 + rand() * (av.w - 1.6), av.y + 2 + rand() * (av.h - 2.8)];
      return;
    }
    // Loose: hunt people from the sky
    this.hunger = Math.min(100, this.hunger + dt * 0.8);
    if (!this.prey && this.cd <= 0) {
      let best = null, bd = 144;
      for (const h of g.humans()) { if (h.hidden || h.dead) continue; const d2 = dist2(this.x, this.y, h.x, h.y); if (d2 < bd) { bd = d2; best = h; } }
      this.prey = best;
    }
    const p = this.prey;
    if (p && (p.dead || p.hidden)) this.prey = null;
    if (this.prey) {
      const d = dist(this.x, this.y, p.x, p.y);
      this.alt = clamp(d * 0.4, 0.2, 2.5);
      if (fly(p.x, p.y, this.speed * 1.5) || d < 0.45) {
        g.humanKilled(p, this);
        this.kills++; this.hunger = 0; this.prey = null; this.cd = randf(18, 30); this.tgt = null;
        g.soundAt('screech', this.x, this.y, 1);
      }
      return;
    }
    this.alt = Math.min(3, this.alt + dt);
    if (!this.tgt || fly(this.tgt[0], this.tgt[1], this.speed)) {
      for (let k = 0; k < 10; k++) {
        const tx = this.x + randf(-12, 12), ty = this.y + randf(-12, 12);
        if (w.inb(Math.floor(tx), Math.floor(ty)) && w.isLand(w.terrain[w.idx(Math.floor(tx), Math.floor(ty))])) { this.tgt = [tx, ty]; break; }
      }
      if (!this.tgt) this.tgt = [w.W / 2, w.H / 2];
    }
    if (chance(dt * 0.05)) g.soundAt('screech', this.x, this.y, 0.7);
  }
}

<script>
// ---------- Vehicles: tour jeeps and the ACU helicopter ----------
'use strict';

// ---------------- Tour jeeps ----------------
class Jeep {
  constructor(game, station) {
    this.id = _eid++;
    this.kind = 'jeep';
    this.game = game; this.station = station;
    const acc = game.world.trackAccess(station);
    const [hx, hy] = acc[0];
    this.home = { x: hx, y: hy };
    this.x = hx + 0.5; this.y = hy + 0.5; this.cx = hx; this.cy = hy; this.nx = hx; this.ny = hy; this.prev = -1;
    this.state = 'parked'; this.riders = []; this.trip = 0; this.facing = 1; this.dir = 0;
    this.waitT = 0; this.viewT = 0; this.wrecked = 0; this.dead = false; this.anim = 0;
  }
  get tx() { return Math.floor(this.x); }
  get ty() { return Math.floor(this.y); }
  remove() { for (const r of this.riders) this.unload(r); this.riders = []; this.dead = true; }
  unload(r) {
    const w = this.game.world;
    const acc = w.accessTiles(this.station);
    r.hidden = false; r.inJeep = null;
    if (acc.length) { const t = pick(acc); r.cx = r.nx = t % w.W; r.cy = r.ny = (t / w.W) | 0; r.x = r.cx + 0.5; r.y = r.cy + 0.5; }
    r.state = r.stay <= 0 ? 'leave' : 'walk';
  }
  update(dt) {
    const g = this.game, w = g.world;
    this.anim += dt;
    if (this.wrecked > 0) { this.wrecked -= dt; if (this.wrecked <= 0) this.dead = true; return; }
    if (!w.buildings.has(this.station.id)) { this.remove(); return; }
    const powered = this.station.powered && w.power.outage <= 0;
    if (this.state === 'parked') {
      this.moving = false;
      const q = this.station.queue || [];
      this.waitT += dt;
      if (q.length && powered && (q.length >= 3 || this.waitT > 5)) {
        const other = g.jeeps.find((j) => j !== this && j.station === this.station && j.state === 'parked' && j.id < this.id);
        if (other) return; // first jeep in line loads first
        this.riders = q.splice(0, 6);
        for (const r of this.riders) { r.state = 'ride'; r.inJeep = this; g.earn(BUILDINGS.tour.income * g.priceMul, 'shops'); r.spent += BUILDINGS.tour.income; this.station.visitors++; this.station.revenue = (this.station.revenue || 0) + BUILDINGS.tour.income; }
        this.state = 'tour'; this.trip = 0; this.tripLen = randi(26, 46); this.waitT = 0;
      }
      return;
    }
    if (!powered) { this.moving = false; return; } // electric jeeps stall during outages
    this.viewT -= dt;
    if (this.viewT <= 0) {
      this.viewT = 1;
      for (const r of this.riders) {
        let joy = 0;
        for (const d of g.dinos) {
          if (d.carried || d.loose) continue;
          if (dist2(this.x, this.y, d.x, d.y) > 64) continue;
          const fresh = !r.seenSpecies.has(d.species);
          if (fresh) r.seenSpecies.add(d.species);
          joy += d.sp.appeal * (fresh ? 1.5 : 0.2);
        }
        r.happy = Math.min(100, r.happy + Math.min(joy, 15) + 0.5);
      }
    }
    const sp = 2.3;
    const tx = this.nx + 0.5, ty = this.ny + 0.5;
    const dx = tx - this.x, dy = ty - this.y, d = Math.sqrt(dx * dx + dy * dy);
    if (d > sp * dt) {
      this.x += dx / d * sp * dt; this.y += dy / d * sp * dt; this.moving = true;
      if (Math.abs(dx) > 0.05) this.facing = dx > 0 ? 1 : -1;
      return;
    }
    this.x = tx; this.y = ty;
    this.prev = w.idx(this.cx, this.cy); this.cx = this.nx; this.cy = this.ny;
    const here = w.idx(this.cx, this.cy);
    if (!w.track[here]) { this.remove(); return; }
    this.trip++;
    if (this.state === 'return' || this.trip >= this.tripLen) {
      if (this.cx === this.home.x && this.cy === this.home.y) {
        for (const r of this.riders) { r.happy = Math.min(100, r.happy + 8); this.unload(r); }
        this.riders = []; this.state = 'parked'; this.moving = false; return;
      }
      if (this.state !== 'return' || !this.path || !this.path.length) {
        this.state = 'return';
        this.path = w.bfs(this.cx, this.cy, (x, y) => w.inb(x, y) && !!w.track[w.idx(x, y)], (x, y) => x === this.home.x && y === this.home.y, 4000);
        if (!this.path) { this.state = 'tour'; this.tripLen += 10; }
      }
      if (this.path && this.path.length) { const [nx, ny] = this.path.shift(); this.nx = nx; this.ny = ny; return; }
    }
    const opts = [];
    for (const [ddx, ddy] of DIRS4) {
      const nx = this.cx + ddx, ny = this.cy + ddy;
      if (!w.inb(nx, ny)) continue;
      const j = w.idx(nx, ny);
      if (w.track[j] && j !== this.prev) opts.push([nx, ny]);
    }
    if (!opts.length && this.prev >= 0 && w.track[this.prev]) opts.push([this.prev % w.W, (this.prev / w.W) | 0]);
    if (opts.length) { const o = pick(opts); this.nx = o[0]; this.ny = o[1]; }
  }
}

// ---------------- ACU Helicopter ----------------
class Helicopter {
  constructor(game, pad) {
    this.id = _eid++;
    this.kind = 'heli';
    this.game = game; this.pad = pad;
    this.x = pad.x + 1.5; this.y = pad.y + 1.5;
    this.alt = 0; this.state = 'parked'; this.cargo = null; this.target = null;
    this.rotor = 0; this.facing = 1; this.thinkT = 0;
  }
  update(dt) {
    const g = this.game, w = g.world;
    this.rotor += dt * (this.alt > 0 || this.state !== 'parked' ? 30 : 0);
    if (!w.buildings.has(this.pad.id)) {
      if (this.cargo) { this.dropAt(this.tx, this.ty); }
      this.dead = true; return;
    }
    const fly = (tx, ty, sp) => {
      const dx = tx - this.x, dy = ty - this.y, d = Math.sqrt(dx * dx + dy * dy);
      if (Math.abs(dx) > 0.05) this.facing = dx > 0 ? 1 : -1;
      if (d < sp * dt) { this.x = tx; this.y = ty; return true; }
      this.x += dx / d * sp * dt; this.y += dy / d * sp * dt; return false;
    };
    switch (this.state) {
      case 'parked':
        this.alt = Math.max(0, this.alt - dt * 2);
        this.thinkT -= dt;
        if (this.thinkT <= 0) {
          this.thinkT = 1;
          if (this.cargo) { const dest = g.findPaddockFor(this.cargo); if (dest) { this.dest = dest; this.state = 'deliver'; } break; }
          const claimed = new Set(g.helis.filter((h) => h !== this && h.target).map((h) => h.target.id));
          const t = g.creatures().find((d) => d.sedatedT > 0 && (d.loose || d.relocate) && !d.carried && !claimed.has(d.id));
          if (t) { this.target = t; this.state = 'fetch'; g.soundAt('heli', this.x, this.y, 0.8); }
        }
        break;
      case 'strike': {
        // ACU gunship run: fly over the target and dart it from the air
        this.alt = Math.min(2.5, this.alt + dt * 2);
        const t = this.target;
        if (!t || t.dead || t.carried || t.sedatedT > 0) { this.target = null; this.state = 'return'; break; }
        if (dist(this.x, this.y, t.x, t.y) > 2.5) { fly(t.x, t.y, g.research.has('acu') ? 9 : 6.5); break; }
        fly(t.x + Math.cos(g.time * 3) * 1.5, t.y + Math.sin(g.time * 3) * 1.5, 4);
        this.shotT = (this.shotT || 0) - dt;
        if (this.shotT <= 0) {
          this.shotT = 0.9;
          g.darts.push({ x: this.x, y: this.y - this.alt, t, life: 1.5 });
          g.soundAt('dart', this.x, this.y, 0.8);
        }
        break;
      }
      case 'fetch': {
        this.alt = Math.min(2.5, this.alt + dt * 2);
        const t = this.target;
        if (!t || t.dead || t.sedatedT <= 0 || t.carried) { this.target = null; this.state = 'return'; break; }
        if (fly(t.x, t.y - 0.2, 5.5)) {
          t.carried = this; this.cargo = t; this.target = null;
          g.log(`ACU airlifting ${t.name} the ${t.sp.name}.`, 'info', t);
          g.spend(2500, 'ops');
          const dest = g.findPaddockFor(t);
          if (dest) { this.dest = dest; this.state = 'deliver'; }
          else { this.state = 'return'; g.log(g.makeRoomFor(t) || `No safe paddock for ${t.name} the ${t.sp.name}! Holding at the helipad until there is one: repair the fence of its old paddock, or build a new one with a ${t.sp.diet === 'carn' ? 'Carnivore' : 'Herbivore'} Feeder.`, 'warn', this, true); }
        }
        break;
      }
      case 'deliver': {
        this.alt = 2.5;
        if (fly(this.dest.x + 0.5, this.dest.y + 0.5, 5)) {
          // verify destination still valid
          const reg = w.regionAt(this.dest.x, this.dest.y);
          if (reg && !reg.public) { this.dropAt(this.dest.x, this.dest.y); this.state = 'return'; }
          else { const d2 = g.findPaddockFor(this.cargo); if (d2) this.dest = d2; else this.state = 'return'; }
        }
        break;
      }
      case 'return':
        this.alt = Math.min(2.5, this.alt + dt * 2);
        if (fly(this.pad.x + 1.5, this.pad.y + 1.5, 5.5)) this.state = 'parked';
        break;
    }
    if (this.cargo) { this.cargo.x = this.x; this.cargo.y = this.y; }
  }
  get tx() { return Math.floor(this.x); }
  get ty() { return Math.floor(this.y); }
  dropAt(x, y) {
    const d = this.cargo; if (!d) return;
    const moved = d.relocate && !d.loose;
    d.carried = null; d.x = x + 0.5; d.y = y + 0.5; d.sedatedT = 4; d.loose = d.isPtera ? d.loose : false; d.relocate = false; d.orderSedate = false;
    if (!d.loose) d.wasLooseFlag = false; // the drop is announced below, don't announce it again
    d.home = { x, y }; d.stress = Math.max(0, d.stress - 40);
    this.cargo = null;
    this.game.log(moved ? `${d.name} the ${d.sp.name} has been moved to the new paddock.` : `${d.name} the ${d.sp.name} is back in containment.`, 'good', d);
    this.game.burst(x + 0.5, y + 0.5, '#e8d8a0', 10);
  }
}

<script>
// ---------- Disasters & random events ----------
'use strict';

const DISASTERS = {
  storm: { name: 'Tropical Storm', icon: '⛈', desc: 'Lightning, power cuts, stressed dinosaurs.' },
  outage: { name: 'System Failure', icon: '⚡', desc: 'A disgruntled programmer shuts down the grid.' },
  quake: { name: 'Earthquake', icon: '〰', desc: 'Shakes fences and buildings apart.' },
  volcano: { name: 'Volcanic Eruption', icon: '🌋', desc: 'Lava pours from the mountain.' },
  disease: { name: 'Outbreak', icon: '☣', desc: 'A dinosaur falls ill. It may spread.' },
  rampage: { name: 'Rampage', icon: '‼', desc: 'A dinosaur goes berserk.' },
  raptors: { name: 'Clever Girls', icon: '◆', desc: 'Raptors coordinate a fence probe.' },
  inspection: { name: 'Safety Inspection', icon: '✔', desc: 'Inspector visit: fines or praise.' },
};

class Events {
  constructor(game) {
    this.game = game;
    this.storm = null;
    this.quake = 0;
    this.volcano = null;
    this.auto = true;
    this.nextDay = 4;
    this.lightning = 0; // flash timer
    this.bolts = [];
    this.history = [];
  }

  update(dt) {
    const g = this.game, w = g.world;
    // ----- Storm -----
    const s = this.storm;
    if (s) {
      s.t -= dt;
      if (s.phase === 'warn' && s.t <= 0) {
        s.phase = 'active'; s.t = s.duration;
        g.log('The storm has hit the island!', 'bad', null, true);
        g.sound('thunder');
      } else if (s.phase === 'active') {
        s.strikeT -= dt;
        if (s.strikeT <= 0) {
          s.strikeT = randf(1.8, 4.5);
          // the aviary dome is the tallest thing on the island
          const av = g.buildingsOfType('aviary');
          if (av.length && chance(0.15)) { const a = pick(av); this.strike(randi(a.x, a.x + a.w - 1), randi(a.y, a.y + a.h - 1)); } else this.strike();
        }
        // high winds tear at the aviary mesh
        for (const a of g.buildingsOfType('aviary')) {
          g.damageBuilding(a, dt * randf(3, 7) * (g.mod('stormproof', 0) ? 0.5 : 1), null);
          if (!s.meshLogged) { s.meshLogged = true; g.log('High winds are tearing at the Aviary mesh! If it gives way, the Pteranodons get out.', 'warn', a, true); }
        }
        s.flickerT -= dt;
        if (s.flickerT <= 0) {
          s.flickerT = randf(6, 12);
          if (chance(0.35)) {
            const plants = g.buildingsOfType('power');
            if (plants.length) {
              const p = pick(plants); p.offline = randf(10, 22); w.powerDirty = true;
              g.log('Storm surge knocked a Power Plant offline!', 'bad', p);
            }
          }
        }
        if (s.t <= 0) { this.storm = null; g.log('The storm has passed.', 'good'); }
      }
    }
    if (this.lightning > 0) this.lightning -= dt;
    for (const b of this.bolts) b.life -= dt;
    this.bolts = this.bolts.filter((b) => b.life > 0);

    // ----- Earthquake -----
    if (this.quake > 0) {
      this.quake -= dt;
      g.shake = Math.max(g.shake, 4);
      this.quakeTick = (this.quakeTick || 0) - dt;
      if (this.quakeTick <= 0) {
        this.quakeTick = 0.45;
        // scale the random fence hits with island area so big islands shake as hard
        const hits = Math.round(14 * (w.W * w.H) / (72 * 54));
        for (let k = 0; k < hits; k++) {
          const x = randi(1, w.W - 2), y = randi(1, w.H - 2);
          const j = w.idx(x, y);
          if (isSolidFence(w.fence[j])) g.damageFence(x, y, randf(15, 45), null);
        }
        for (const b of w.buildings.values()) if (chance(0.06)) g.damageBuilding(b, randf(15, 50), null);
      }
      if (this.quake <= 0) g.log('The earthquake is over. Check your fences!', 'warn');
    }

    // ----- Power outage -----
    const pw = w.power;
    if (pw.outage > 0) {
      const before = pw.backupDelay > 0;
      pw.outage -= dt;
      if (pw.backupDelay > 0) pw.backupDelay -= dt;
      if (before && pw.backupDelay <= 0 && g.hasBuilding('backup')) { w.powerDirty = true; g.log('Backup generators online.', 'good'); }
      if (pw.backupDelay <= 0 && g.hasBuilding('backup') && pw.backupFuel > 0) {
        pw.backupFuel -= dt;
        if (pw.backupFuel <= 0) { w.powerDirty = true; g.log('Backup generators out of fuel!', 'bad'); }
      }
      if (pw.outage <= 0) { pw.outage = 0; w.powerDirty = true; g.quietFenceLogged = false; g.log('Main grid restored. Fences are live.', 'good', null, true); g.sound('powerup'); }
    }

    // ----- Volcano -----
    const v = this.volcano;
    if (v) {
      v.t -= dt;
      if (v.phase === 'warn') {
        g.shake = Math.max(g.shake, 1);
        if (v.t <= 0) { v.phase = 'erupt'; v.t = 22; g.log('ERUPTION! Lava is flowing!', 'bad', w.volcano, true); g.sound('boom'); }
      } else if (v.phase === 'erupt') {
        g.shake = Math.max(g.shake, 2);
        v.spawnT -= dt;
        v.ashT -= dt;
        if (v.ashT <= 0) { v.ashT = 0.05; g.particles.push({ x: w.volcano.x + 0.5 + randf(-0.5, 0.5), y: w.volcano.y + randf(-0.5, 0.5), vx: randf(-1, 1), vy: randf(-4, -2), life: randf(1, 2.5), max: 2.5, color: chance(0.3) ? '#f86a20' : '#4a4040', size: chance(0.5) ? 2 : 1, grav: 1.5, z: true }); }
        if (v.spawnT <= 0) { v.spawnT = 0.18; this.spreadLava(); }
        if (v.t <= 0) { this.volcano = null; g.log('The eruption has subsided.', 'warn'); }
      }
    }
    // lava cooling
    this.lavaTick = (this.lavaTick || 0) - dt;
    if (this.lavaTick <= 0) {
      this.lavaTick = 1;
      let changed = false;
      for (let i = 0; i < w.W * w.H; i++) {
        if (w.terrain[i] !== T_LAVA) continue;
        w.lavaT[i] -= 1;
        if (w.lavaT[i] <= 0 && !this.volcano) { w.terrain[i] = T_BASALT; changed = true; w.markDirty(i % w.W, (i / w.W) | 0); }
      }
      if (changed) { w.regionsDirty = true; w.flowCache.clear(); w.pathVersion++; }
    }

    // ----- Disease spread -----
    this.diseaseTick = (this.diseaseTick || 0) - dt;
    if (this.diseaseTick <= 0) {
      this.diseaseTick = 5;
      const sick = g.dinos.filter((d) => d.sick > 0);
      if (sick.length && !g.hasBuilding('vet')) {
        for (const s of sick) for (const d of g.dinos) {
          if (d.sick > 0 || d.carried) continue;
          if (dist2(d.x, d.y, s.x, s.y) < 16 && chance(0.05)) { d.sick = 20; g.log(`${d.name} the ${d.sp.name} has caught the illness!`, 'warn', d); }
        }
      }
    }
  }

  onNewDay(day) {
    if (!this.auto) return;
    if (day < this.nextDay) return;
    const g = this.game;
    if (g.dinos.length === 0) { this.nextDay = day + 1; return; }
    const early = day < 8;
    const opts = [
      ['storm', 30 * g.season.storm], ['outage', early ? 4 : 14], ['quake', early ? 3 : 10], ['disease', early ? 5 : 14], ['rampage', early ? 4 : 12],
      ['raptors', g.dinos.some((d) => d.species === 'raptor') ? 14 : 0], ['inspection', 12],
      ['volcano', day > 12 ? 6 : 0],
    ];
    const ev = weightedPick(opts, (o) => o[1]);
    const m = this.evMul || 1;
    this.nextDay = day + Math.max(1, Math.round(randi(2, 4) / m));
    if (ev) this.trigger(ev[0]);
  }

  trigger(type) {
    const g = this.game, w = g.world;
    this.history.push({ type, day: g.day });
    switch (type) {
      case 'storm':
        if (this.storm) return;
        this.storm = { phase: 'warn', t: 18, duration: randf(40, 60), strikeT: 1, flickerT: 4 };
        g.log('Weather warning: a tropical storm will hit in a few hours. Consider evacuating guests.', 'warn', null, true);
        break;
      case 'outage':
        w.power.outage = randf(45, 65);
        w.power.backupDelay = 4;
        w.power.backupFuel = 50;
        w.powerDirty = true;
        g.log('SYSTEM FAILURE! The main grid is down. Electric fences are offline!', 'bad', null, true);
        g.sound('powerdown');
        break;
      case 'quake':
        this.quake = randf(6, 9);
        g.log('EARTHQUAKE!', 'bad', null, true);
        g.sound('boom');
        break;
      case 'volcano':
        if (this.volcano) return;
        this.volcano = { phase: 'warn', t: 15, spawnT: 0, ashT: 0, front: [] };
        g.log('Seismic alert: the volcano is about to erupt!', 'warn', w.volcano, true);
        break;
      case 'disease': {
        const cands = g.dinos.filter((d) => !d.sick && !d.carried);
        if (!cands.length) return;
        const d = pick(cands); d.sick = 30;
        g.log(`${d.name} the ${d.sp.name} has fallen ill!` + (g.hasBuilding('vet') ? ' The vets are on it.' : ' Build a Vet Clinic!'), 'warn', d, true);
        break;
      }
      case 'rampage': {
        const cands = g.dinos.filter((d) => !d.carried && d.sedatedT <= 0 && !d.loose && d.sp.strength >= 3);
        if (!cands.length) return;
        const d = pick(cands); d.stress = 100; d.deterT = 0; d.comfort = 0; d.rageT = 40;
        g.log(`${d.name} the ${d.sp.name} is in a rage and charging the fences!`, 'bad', d, true);
        break;
      }
      case 'raptors': {
        const rs = g.dinos.filter((d) => d.species === 'raptor' && !d.loose && !d.carried);
        for (const d of rs) { d.deterT = 0; d.stress = Math.max(d.stress, 75); d.state = 'idle'; d.stateT = 0; }
        if (rs.length) g.log('The raptors are testing the fences... systematically.', 'warn', rs[0], true);
        break;
      }
      case 'inspection': {
        const loose = g.dinos.filter((d) => d.loose).length;
        const broken = g.countBrokenFences();
        const recent = g.recentDeaths();
        if (loose || recent > 0 || broken > 3) {
          const fine = Math.min(120000, 25000 + loose * 10000 + recent * 15000 + broken * 1000);
          g.spend(fine, 'fines');
          g.reputation = Math.max(0, g.reputation - 6);
          g.log(`Safety inspector fined the park ${fmtMoney(fine)}!`, 'bad', null, true);
        } else {
          g.earn(15000, 'grants');
          g.reputation = Math.min(100, g.reputation + 5);
          g.log('Safety inspection passed with flying colors! +$15k grant.', 'good', null, true);
        }
        break;
      }
    }
  }

  strike(ax, ay) {
    const g = this.game, w = g.world;
    let tx = ax, ty = ay;
    const r = ax === undefined ? rand() : 1;
    const blds = Array.from(w.buildings.values());
    if (r < 0.35 && blds.length) { const b = pick(blds); tx = b.x + randi(0, b.w - 1); ty = b.y + randi(0, b.h - 1); }
    else if (r < 0.75) {
      // random fence tile
      for (let k = 0; k < 60; k++) {
        const x = randi(1, w.W - 2), y = randi(1, w.H - 2);
        const f = w.fence[w.idx(x, y)];
        if (isSolidFence(f)) { tx = x; ty = y; break; }
      }
    }
    if (tx === undefined) { tx = randi(2, w.W - 3); ty = randi(2, w.H - 3); }
    this.lightning = 0.25;
    this.bolts.push({ x: tx + 0.5, y: ty + 0.5, life: 0.35, seed: randi(0, 9999) });
    g.soundAt('thunder', tx, ty, 1);
    const j = w.idx(tx, ty);
    if (isSolidFence(w.fence[j]) && !g.mod('stormproof', 0)) g.damageFence(tx, ty, randf(50, 110), null);
    const b = w.buildings.get(w.bld[j]);
    if (b) {
      g.damageBuilding(b, randf(40, 120), null);
      if (b.type === 'power') { b.offline = randf(12, 25); w.powerDirty = true; g.log('Lightning struck a Power Plant! It is offline.', 'bad', b); }
    }
    if (w.terrain[j] === T_FOREST && chance(0.3)) { w.terrain[j] = T_GRASS; w.invalidate(tx, ty); }
    g.sparks(tx + 0.5, ty + 0.5, '#f8f8a0', 10);
    for (const d of g.dinos) if (dist2(d.x, d.y, tx, ty) < 36) d.stress = Math.min(100, d.stress + 15);
  }

  spreadLava() {
    const g = this.game, w = g.world;
    const v = this.volcano;
    const vx = w.volcano.x, vy = w.volcano.y;
    // pick a random existing lava tile (or the crater) and flow outward
    let src;
    if (!v.front.length || chance(0.15)) src = [vx + randi(-1, 1), vy + randi(-1, 1)];
    else src = pick(v.front);
    const opts = [];
    for (const [dx, dy] of DIRS4) {
      const nx = src[0] + dx, ny = src[1] + dy;
      if (!w.inb(nx, ny)) continue;
      const t = w.terrain[w.idx(nx, ny)];
      if (t === T_DEEP || t === T_WATER || t === T_VOLCANO || t === T_LAVA) continue;
      // prefer flowing away from crater
      const out = dist(nx, ny, vx, vy) - dist(src[0], src[1], vx, vy);
      opts.push([nx, ny, out > 0 ? 3 : 0.4]);
    }
    if (!opts.length) return;
    const o = weightedPick(opts, (q) => q[2]);
    const [nx, ny] = o;
    if (dist(nx, ny, vx, vy) > 12) return;
    const j = w.idx(nx, ny);
    w.terrain[j] = T_LAVA; w.lavaT[j] = randf(35, 60);
    w.path[j] = 0;
    if (w.fence[j]) {
      // engineers rebuild the fence once the lava has cooled, so the paddock doesn't silently open up
      const f = w.fence[j] === F_BROKEN ? (w.fenceOrig[j] || F_ELECTRIC) : w.fence[j];
      if (f !== F_GATE) g.queueFence(nx, ny, f, 48);
      w.fence[j] = F_NONE; w.fenceHp[j] = 0;
    }
    const b = w.buildings.get(w.bld[j]);
    if (b) g.damageBuilding(b, 9999, null);
    v.front.push([nx, ny]);
    if (v.front.length > 80) v.front.shift();
    // creatures caught in lava
    for (const d of g.dinos) if (!d.carried && d.tx === nx && d.ty === ny) g.killDino(d, 'lava');
    for (const h of g.humans()) if (!h.hidden && h.tx === nx && h.ty === ny) g.humanKilled(h, null, 'caught by the lava');
    w.invalidate(nx, ny);
  }
}

'use strict';

const RESEARCH = [
  { id: 'fence2', name: 'Reinforced Fences', cost: 30000, hours: 30, desc: 'Electric fences get 60% more integrity.' },
  { id: 'fence3', name: 'High-Voltage Grid', cost: 70000, hours: 48, req: ['fence2'], desc: 'Shocks deter longer, and only the very strongest can push through a live fence.' },

  { id: 'rangers', name: 'Ranger Training', cost: 35000, hours: 30, desc: 'Rangers run 30% faster and shoot from further away.' },
  { id: 'power', name: 'Efficient Turbines', cost: 45000, hours: 36, desc: 'Power plants produce 40% more electricity.' },

  { id: 'marketing', name: 'Marketing Campaign', cost: 50000, hours: 24, desc: 'Permanently draws 15% more visitors.' },

  { id: 'gen_raptor', name: 'Genome: Velociraptor', cost: 60000, hours: 36, genome: 'raptor', req: ['gen_trike'], desc: 'Unlocks Velociraptors without needing stars.' },
  { id: 'gen_ptera', name: 'Genome: Pteranodon', cost: 50000, hours: 30, genome: 'ptera', desc: 'Unlocks Pteranodons without needing stars.' },
  { id: 'gen_trex', name: 'Genome: Tyrannosaurus', cost: 140000, hours: 60, genome: 'trex', req: ['gen_raptor'], desc: 'Unlocks the T. rex without needing stars.' },
  { id: 'gen_spino', name: 'Genome: Spinosaurus', cost: 160000, hours: 60, genome: 'spino', req: ['gen_trex'], desc: 'Unlocks Spinosaurus without needing stars.' },
  { id: 'gen_indom', name: 'Hybrid: Indominus', cost: 300000, hours: 90, genome: 'indom', req: ['gen_trex', 'gen_raptor', 'fence3'], desc: 'Splice an Indominus without a 5-star rating. What could go wrong?' },
];
const RESEARCH_BY_ID = Object.fromEntries(RESEARCH.map((r) => [r.id, r]));

// Base values that research modifies (restored for every new game)
const RESEARCH_BASE = { elecHp: FENCE_DEF[F_ELECTRIC].hp, supply: BUILDINGS.power.supply };

class ResearchState {
  constructor(game) { this.game = game; this.done = new Set(); this.active = null; }
  has(id) { return this.done.has(id); }
  available(r) { return !this.done.has(r.id) && (!r.req || r.req.every((q) => this.done.has(q))); }
  labs() { return this.game.buildingsOfType('lab').filter((b) => b.powered).length; }
  start(id) {
    const r = RESEARCH_BY_ID[id], g = this.game;
    if (!r || !this.available(r)) return 'Not available yet.';
    if (!g.hasBuilding('lab')) return 'Build a Research Lab first.';
    if (this.active) return 'Another project is already running.';
    if (!g.canAfford(r.cost)) return 'Not enough money.';
    g.spend(r.cost, 'ops');
    this.active = { id, progress: 0 };
    g.log(`Research started: ${r.name}.`, 'info');
    return null;
  }
  update(dt) {
    if (!this.active) return;
    const g = this.game, n = this.labs();
    if (!n) return;
    const r = RESEARCH_BY_ID[this.active.id];
    this.active.progress += (dt / g.secPerHour) * (1 + (n - 1) * 0.6);
    if (this.active.progress >= r.hours) {
      this.done.add(r.id); this.active = null;
      this.apply();
      g.log(`Research complete: ${r.name}! ${r.desc}`, 'goal', null, true);
      g.sound('fanfare');
    }
  }
  // Push numeric effects into the shared definitions
  apply() {
    const g = this.game, w = g.world;
    const oldHp = FENCE_DEF[F_ELECTRIC].hp;
    FENCE_DEF[F_ELECTRIC].hp = RESEARCH_BASE.elecHp * (this.has('fence2') ? 1.6 : 1);
    if (oldHp !== FENCE_DEF[F_ELECTRIC].hp) for (let i = 0; i < w.fence.length; i++) if (w.fence[i] === F_ELECTRIC) w.fenceHp[i] *= FENCE_DEF[F_ELECTRIC].hp / oldHp;
    BUILDINGS.power.supply = RESEARCH_BASE.supply * (this.has('power') ? 1.4 : 1);
    w.powerDirty = true;
  }
}
