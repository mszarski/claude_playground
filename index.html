      };
    } else if (o.kind === 'guest') {
      html += `<h2>${o.label}</h2><div class="sub">${o.state === 'flee' ? 'Running for their life!' : o.state === 'shelter' ? 'Hiding in a shelter' : o.state === 'leave' ? 'Heading home' : 'Enjoying the park'}</div>`;
      html += `<div class="row"><span>Happiness</span><span>${Math.round(o.happy)}%</span></div>${this.bar(o.happy, 100, '#5ac85a')}`;
      html += `<div class="row"><span>Hunger</span><span>${Math.round(o.hunger)}%</span></div>${this.bar(o.hunger, 100, '#f0a030')}`;
      html += `<div class="row"><span>Bladder</span><span>${Math.round(o.toilet)}%</span></div>${this.bar(o.toilet, 100, '#70b8f0')}`;
      if (o.thought) html += `<div class="row"><span>Thinking</span><span>"${o.thought}"</span></div>`;
      html += `<div class="row"><span>Species seen</span><span>${o.seenSpecies.size}</span></div><div class="row"><span>Spent</span><span>${fmtMoney(o.spent + g.ticket)}</span></div>`;
    } else if (o.kind === 'ranger' || o.kind === 'worker') {
      html += `<h2>${o.kind === 'ranger' ? 'Park Ranger' : 'Engineer'}</h2>`;
      html += `<div class="sub">${o.kind === 'ranger' ? (o.target ? `Pursuing ${o.target.name} the ${o.target.sp.name}` : 'On patrol') : (o.state === 'flee' ? 'Running from a predator!' : o.state === 'repair' ? 'Repairing' : o.state === 'move' ? 'En route to a job' : 'Idle')}</div>`;
      html += `<div class="row"><span>Orders</span><span>${orderText(o).replace('Ordered: ', '')}</span></div>`;
      html += `<div class="sub">${o.kind === 'ranger' ? 'Tranquilizes loose dinosaurs within 4 tiles.' : 'Repairs fences & buildings, rebuilds breached fences.'} ${this.touchUsed ? 'Use Send… to give orders.' : 'Right-click to give orders · shift-drag to select several.'}</div>`;
      if (o.order) html += `<div class="btns"><button data-a="auto">Back to auto</button></div>`;
    } else if (o.kind === 'heli') {
      const st = { parked: 'On the pad', strike: `Darting ${o.target ? o.target.name : 'a target'} from the air`, fetch: `Fetching ${o.target ? o.target.name : 'a sedated dinosaur'}`, deliver: `Flying ${o.cargo ? o.cargo.name : 'cargo'} to a paddock`, return: 'Returning to base' }[o.state] || o.state;
      html += `<h2>ACU Helicopter</h2><div class="sub">${st}</div>`;
      html += `<div class="sub">Airlifts sedated dinosaurs home on its own. ${this.touchUsed ? 'Select it and use Send…' : 'Right-click'} a loose dinosaur for an air strike (${fmtMoney(g.research.has('acu') ? 3000 : 8000)}).</div>`;
    } else if (o.kind === 'fence') {
      const i = w.idx(o.x, o.y), f = w.fence[i];
      if (!f) { this.selected = null; el.style.display = 'none'; return; }
      const def = FENCE_DEF[f] || { name: 'Breached Fence', hp: 1 };
      html += `<h2>${def.name}</h2>`;
      if (f === F_BROKEN) html += `<div class="sub" style="color:#ff9080">Breached! Engineers will rebuild it.</div>`;
      else {
        html += `<div class="row"><span>Integrity</span><span>${Math.round(w.fenceHp[i])}/${def.hp}</span></div>${this.bar(w.fenceHp[i], def.hp, '#5ac85a')}`;
        if (f === F_ELECTRIC) html += `<div class="row"><span>Power</span><span style="color:${w.fencePowered[i] ? '#f8d040' : '#e04838'}">${w.fencePowered[i] ? 'LIVE' : 'OFFLINE'}</span></div>`;
      }
      const orig = f === F_BROKEN ? (w.fenceOrig[i] || F_ELECTRIC) : f;
      if (f === F_BROKEN || w.fenceHp[i] < def.hp) html += `<div class="btns"><button data-a="erepair" class="danger">Emergency repair ${fmtMoney(FENCE_DEF[orig].cost * 3)}</button></div>`;
    } else if (o.kind === 'paddock') {
      const reg = w.regionAt(o.x, o.y);
      if (!reg || reg.public) { this.selected = null; el.style.display = 'none'; return; }
      const ds = g.dinos.filter((d) => !d.carried && w.region[w.idx(d.tx, d.ty)] === reg.id);
      html += `<h2>Paddock</h2>`;
      html += `<div class="row"><span>Size</span><span>${reg.size} tiles</span></div>`;
      html += `<div class="row"><span>Tree cover</span><span>${Math.round(reg.forest / reg.size * 100)}%</span></div>`;
      html += `<div class="row"><span>Water</span><span>${reg.water ? 'Yes' : 'No'}</span></div>`;
      html += `<div class="row"><span>Feeders</span><span>${reg.feeders.herb.length}H / ${reg.feeders.carn.length}C</span></div>`;
      const sp = ds.reduce((a, d) => a + d.sp.space, 0);
      html += `<div class="row"><span>Space used</span><span>${sp}/${reg.size}</span></div>`;
      const eggs = g.eggs.filter((e) => w.regionAt(e.x, e.y) === reg);
      const eggText = eggs.length ? `${eggs.length} egg${eggs.length > 1 ? 's' : ''} hatching (${[...new Set(eggs.map((e) => SPECIES[e.species].name))].join(', ')})` : '';
      html += `<div class="sub">${ds.length ? ds.map((d) => d.name + ' (' + d.sp.name + ')').join(', ') + (eggText ? ' · ' + eggText : '') : eggText || 'Empty. Use Hatch to add dinosaurs.'}</div>`;
      // one-click upkeep
      const cover = reg.forest / reg.size, needTrees = Math.max(0, Math.ceil(reg.size * 0.3) - reg.forest);
      const fences = g.paddockFences(reg), dmg = fences.filter((j) => g.needsRepair(j % w.W, (j / w.W) | 0)).length;
      const diets = new Set(ds.map((d) => d.sp.diet));
      html += `<div class="btns">`;
      if (cover < 0.28 && needTrees) html += `<button data-a="cover" title="Plant trees until about 30% of the paddock is covered">Tree cover ${fmtMoney(needTrees * TOOL_INFO.trees.cost)}</button>`;
      // an empty paddock offers both: its feeder also tells the ACU which captured animals belong here
      if (!reg.feeders.herb.length && (diets.has('herb') || !ds.length)) html += `<button data-a="feedH" title="Herbivores captured by the ACU will be brought here">+ Herb feeder</button>`;
      if (!reg.feeders.carn.length && (diets.has('carn') || !ds.length)) html += `<button data-a="feedC" title="Carnivores captured by the ACU will be brought here">+ Carn feeder</button>`;
      if (dmg) html += `<button data-a="fixfence" class="danger">Repair ${dmg} fence${dmg > 1 ? 's' : ''}</button>`;
      // top up the exhibit: one more of whatever lives here most, if there is room for it
      const top = this.restockSpecies(reg, ds, eggs);
      if (top) html += `<button data-a="restock" title="Lay one more ${SPECIES[top].name} egg in this paddock">Hatch another ${SPECIES[top].name} ${fmtMoney(g.hatchCost(top))}</button>`;
      html += `<button data-a="copy" title="Copy this paddock's fences, trees and feeders, then stamp copies elsewhere">Copy layout</button></div>`;
    } else if (o.type) {
      const def = BUILDINGS[o.type];
      html += `<h2>${def.name}</h2><div class="sub">${def.desc}</div>`;
      html += `<div class="row"><span>Condition</span><span>${Math.round(o.hp)}/${o.maxHp}</span></div>${this.bar(o.hp, o.maxHp, '#5ac85a')}`;
      if (def.rooms) html += `<div class="row"><span>Rooms taken</span><span>${Math.min(o.inside, def.rooms)}/${def.rooms}</span></div>`;
      if (def.power) html += `<div class="row"><span>Power</span><span style="color:${o.powered ? '#f8d040' : '#e04838'}">${o.powered ? 'ON' : 'NO POWER'}</span></div>`;
      if (o.type === 'pylon') html += `<div class="row"><span>Grid</span><span style="color:${w.covered[w.idx(o.x, o.y)] ? '#f8d040' : '#e04838'}">${w.covered[w.idx(o.x, o.y)] ? 'CONNECTED' : 'NOT CONNECTED'}</span></div>${w.covered[w.idx(o.x, o.y)] ? '' : '<div class="sub" style="color:#ff9080">Outside the power area. Move it closer to a power plant or a connected pylon.</div>'}`;
      if (o.type === 'power') html += `<div class="row"><span>Output</span><span>${o.offline > 0 || w.power.outage > 0 ? 'OFFLINE' : def.supply + ' MW'}</span></div>`;
      if (o.type === 'gate') html += `<div class="row"><span>Park</span><span style="color:${g.parkClosed ? '#e04838' : '#5ac85a'}">${g.parkClosed ? 'CLOSED' : 'OPEN'}</span></div><div class="btns"><button data-a="toggleopen">${g.parkClosed ? 'Open the park' : 'Close the park'}</button></div>`;
      if (def.cat === 'guest' && !w.accessTiles(o).length) html += `<div class="sub" style="color:#ff9080">Not connected to a path!</div>`;
      if (o.type === 'tour') {
        html += `<div class="row"><span>Queue</span><span>${(o.queue || []).length}</span></div><div class="row"><span>Jeeps</span><span>${g.jeeps.filter((j) => j.station === o).length}</span></div>`;
        if (!w.trackAccess(o).length) html += `<div class="sub" style="color:#ff9080">Needs Tour Track next to it!</div>`;
      }
      if (o.type === 'gyro') {
        html += `<div class="row"><span>Queue</span><span>${(o.queue || []).length}</span></div><div class="row"><span>Spheres</span><span>${(g.gyros || []).filter((x) => x.station === o).length}</span></div>`;
        if (o.noPaddock) html += `<div class="sub" style="color:#ff9080">Must touch a paddock (build it right against a paddock's fence).</div>`;
      }
      if (o.type === 'arena') {
        const night = g.hour < 8 || g.hour >= 20;
        html += `<div class="row"><span>Next show</span><span>${o.noRaptors ? '—' : night ? 'after 08:00' : 'in ' + Math.max(1, Math.ceil((o.showT || 0) / g.secPerHour)) + 'h'}</span></div>`;
        if (o.noRaptors) html += `<div class="sub" style="color:#ff9080">Needs a paddock with 2+ raptors within 6 tiles.</div>`;
        if (o.revenue) html += `<div class="row"><span>Show takings</span><span>${fmtMoney(o.revenue)}</span></div>`;
      }
      if (o.type === 'lagoon') html += `<div class="row"><span>Next leap</span><span>${o.powered ? 'in ' + Math.max(1, Math.ceil((o.showT || 0) / g.secPerHour)) + 'h' : '—'}</span></div><div class="sub">Guests within 9 tiles watch the Mosasaur leap and pay for the show. Run a path past it.</div>`;
      if (o.type === 'feedshow') {
        html += `<div class="row"><span>Shows</span><span>12:00 · 18:00</span></div>`;
        if (o.noCarnivore) html += `<div class="sub" style="color:#ff9080">No carnivore paddock within 6 tiles.</div>`;
        if (o.revenue) html += `<div class="row"><span>Show takings</span><span>${fmtMoney(o.revenue)}</span></div>`;
      }
      if (def.income) html += `<div class="row"><span>Visitors</span><span>${o.visitors}</span></div><div class="row"><span>Revenue</span><span>${fmtMoney(o.revenue || 0)}</span></div>`;
      if (def.shelter) html += `<div class="row"><span>Sheltering</span><span>${o.inside}/${def.shelter}</span></div>`;
      if (o.doorsBroken) html += `<div class="sub" style="color:#ff9080">DOORS BROKEN: guests won't shelter here until engineers repair it (80% condition).</div>`;
      if (def.upkeep) html += `<div class="row"><span>Upkeep</span><span>${fmtMoney(def.upkeep)}/day</span></div>`;
      const fixCost = Math.round((1 - o.hp / o.maxHp) * def.cost * 0.3 / 100) * 100;
      html += `<div class="btns">${o.hp < o.maxHp ? `<button data-a="fixb" title="Instant repair by contractors">Repair ${fmtMoney(Math.max(100, fixCost))}</button>` : ''}<button data-a="demolish" class="danger">Demolish (+${fmtMoney(def.cost * 0.25)})</button></div>`;
    }
    if (force || html !== this.lastInfo) {
      this.lastInfo = html;
      el.innerHTML = html;
      if (portrait) portrait();
      for (const b of el.querySelectorAll('[data-a]')) b.onclick = () => this.infoAction(b.dataset.a);
    }
  }

  infoAction(a) {
    const g = this.game, o = this.selected;
    this.sfx.play('click');
    if (a === 'close') { this.select(null); return; }
    if (a === 'follow') { this.follow = !this.follow; }
    if (a === 'auto' && o) { g.releaseUnits([o]); }
    const reg = o && o.kind === 'paddock' ? g.world.regionAt(o.x, o.y) : null;
    if (reg && !reg.public) {
      if (a === 'cover') { const n = g.plantCover(reg); this.toast(n ? `Planted ${n} trees.` : 'No room for trees.', n ? 'good' : 'warn'); if (n) this.sfx.play('build'); }
      if (a === 'feedH' || a === 'feedC') { const f = g.addFeeder(reg, a === 'feedC' ? 'carn' : 'herb'); if (f) this.sfx.play('build'); else this.toast('No free tile for a feeder (or not enough money).', 'warn'); }
      if (a === 'fixfence') { const r = g.repairFences(reg); this.toast(r.n ? `Repaired ${r.n} fence tiles (${fmtMoney(r.cost)}).${r.blocked ? ' A dinosaur is blocking a gap.' : ''}` : r.blocked ? 'A dinosaur is standing in the gap! Sedate it first.' : 'Not enough money.', r.n ? 'good' : 'warn'); if (r.n) this.sfx.play('build'); }
      if (a === 'restock') {
        const ds = g.dinos.filter((d) => !d.carried && g.world.region[g.world.idx(d.tx, d.ty)] === reg.id);
        const sp = this.restockSpecies(reg, ds, g.eggs.filter((e) => g.world.regionAt(e.x, e.y) === reg));
        let err = 'No room for another.';
        if (sp) for (const t of reg.tiles) { const x = t % g.world.W, y = (t / g.world.W) | 0; err = g.canHatchAt(sp, x, y); if (!err) { g.hatch(sp, x, y); this.sfx.play('build'); break; } if (/money|power|Hatchery|star/i.test(err)) break; }
        if (err) this.toast(err, 'warn');
      }
      if (a === 'copy') { const bp = g.copyPaddock(reg); if (bp) { this.blueprint = bp; this.setTool('stamp'); this.toast(`Layout copied (${bp.w}×${bp.h}). Click to stamp a copy, Esc to stop.`, 'info'); } }
      // keep the paddock selected on a tile that is still inside it
      const t = reg.tiles.find((i) => g.world.dinoPass(i % g.world.W, (i / g.world.W) | 0));
      if (t !== undefined) { const r2 = g.world.regionAt(t % g.world.W, (t / g.world.W) | 0); if (r2) this.selected = { kind: 'paddock', x: t % g.world.W, y: (t / g.world.W) | 0, reg: r2 }; }
    }
    if (a === 'toggleopen') { g.parkClosed = !g.parkClosed; g.log(g.parkClosed ? 'The park is closed: no new visitors until you reopen the gate.' : 'The park is open!', g.parkClosed ? 'warn' : 'good', null, true); }
    if (a === 'sedate' && o) { o.orderSedate = true; g.log(`Rangers dispatched to sedate ${o.name}.`, 'info', o); }
    if (a === 'strike' && o) { const err = g.acuStrike(o); if (err) this.toast(err, 'warn'); }
    if (a === 'erepair' && o) { const err = g.emergencyRepair(o.x, o.y); if (err) this.toast(err, 'warn'); else this.sfx.play('build'); }
    if (a === 'relocate' && o) { this.moveDino = o; this.setTool('movedest'); this.toast(`Click inside the paddock where ${o.name} should go (Esc to cancel).`, 'info'); }
    if (a === 'sell' && o) {
      const err = g.sellDino(o);
      if (err) { this.toast(err, 'warn'); return; }
      this.select(null); return;
    }
    if (a === 'fixb' && o && o.type) {
      const c = Math.max(100, Math.round((1 - o.hp / o.maxHp) * BUILDINGS[o.type].cost * 0.3 / 100) * 100);
      if (!g.canAfford(c)) { this.toast('Not enough money.', 'warn'); return; }
      g.spend(c, 'repairs'); o.hp = o.maxHp; o.doorsBroken = false; g.world.flowCache.clear();
      g.sparks(o.x + o.w / 2, o.y + o.h / 2, '#f8e080', 8); this.sfx.play('build');
      this.toast(`${BUILDINGS[o.type].name} repaired (${fmtMoney(c)}).`, 'good');
    }
    if (a === 'demolish' && o) { g.startBatch(); const ok = g.demolishAt(o.x, o.y); g.endBatch('demolition'); if (ok) this.sfx.play('demolish'); this.select(null); return; }
    this.renderInfo(true);
  }

  // ---------------- modals ----------------
  showModal(html, locked = false) {
    $('#modalBox').innerHTML = html;
    $('#modal').style.display = 'flex';
    this.modalLocked = locked;
    this.hideTip();
  }
  closeModal() { $('#modal').style.display = 'none'; this.modalLocked = false; }

  showSpeciesPicker() {
    const g = this.game;
    let html = `<h1>HATCHERY</h1><p>Choose a species, then ${IS_TOUCH ? 'tap' : 'click'} inside a fenced paddock (no paths inside!). Carnivores will eat herbivores that share their paddock. Pteranodons hatch inside an Aviary.</p>`;
    if (!g.hasBuilding('hatchery')) html += `<p style="color:#ff9080">You need to build a Hatchery first (Dinos menu).</p>`;
    html += `<div class="cards">`;
    for (const k of SPECIES_ORDER) {
      const sp = SPECIES[k];
      const locked = !g.isUnlocked(k);
      html += `<div class="card ${locked ? 'locked' : ''}" data-sp="${k}"><canvas data-spr="${k}"></canvas><div class="nm">${sp.name.toUpperCase()}</div>
        <div>${sp.diet === 'carn' ? '<span style="color:#f08a5a">Carnivore</span>' : '<span style="color:#8ad06a">Herbivore</span>'} · ${g.freeEgg === k ? '<span style="color:#f8d040">FREE (Dr. Wu)</span>' : fmtMoney(sp.cost)}</div>
        <div style="color:#9ab08a">Appeal ${sp.appeal} · Danger ${sp.danger} · Str ${sp.strength}</div>
        <div style="color:#9ab08a">${sp.flying ? 'Needs an Aviary' : `Needs ${sp.space} tiles${sp.social > 1 ? ' · groups of ' + sp.social : ''}`}</div>
        ${locked ? `<div style="color:#f8d040">Unlocks at ${'★'.repeat(sp.unlock)}</div>` : ''}</div>`;
    }
    html += `</div><div class="btns" style="justify-content:flex-end"><button data-close>Close</button></div>`;
    this.showModal(html);
    for (const c of document.querySelectorAll('canvas[data-spr]')) {

      const x = c.getContext('2d'); x.imageSmoothingEnabled = false;
      x.drawImage(S.right[0], 0, 0, S.w * sc, S.h * sc);
      c.style.height = Math.min(64, S.h * sc) + 'px';

  }

  showRoster() {
    const g = this.game;
    const mini = (v, col) => `<div class="mini"><i style="width:${clamp(v, 0, 100)}%;background:${col}"></i></div>`;
    const all = g.creatures();
    let html = `<h1>DINOSAURS (${all.length})</h1>`;

    else {
      html += `<div class="rhead"><span></span><span>Name</span><span>Health</span><span>Hunger</span><span class="hide">Stress</span><span>Status</span></div><div class="roster">`;
      const order = [...all].sort((a, b) => (b.loose - a.loose) || (b.stress - a.stress));
      for (const d of order) {
        const st = d.carried ? '<span style="color:#70b8f0">AIRLIFT</span>' : d.sedatedT > 0 ? '<span style="color:#a8a8f0">SEDATED</span>' : d.loose ? '<span style="color:#ff6040">LOOSE!</span>' : d.sick > 0 ? '<span style="color:#9ae060">SICK</span>' : d.stress > 65 ? '<span style="color:#f0a030">AGITATED</span>' : '<span style="color:#8ad06a">OK</span>';
        html += `<div class="rrow" data-id="${d.id}"><canvas data-dspr="${d.species}"></canvas><span><b>${d.name}</b> <span style="color:#9ab08a">${d.sp.name}${d.ageDays !== undefined ? ' · ' + Math.floor(d.ageDays) + 'd' + (d.growth < 1 ? ' baby' : d.elderly ? ' old' : '') : ''}</span></span>${mini(d.hp / d.sp.hp * 100, '#5ac85a')}${mini(d.hunger, d.hunger > 70 ? '#e04838' : '#f0a030')}<span class="hide">${mini(d.stress, d.stress > 65 ? '#e04838' : '#c8a040')}</span><span>${st}</span></div>`;

    this.showModal(html);
    for (const c of document.querySelectorAll('canvas[data-dspr]')) {

  // the species to offer one more of in a paddock: the most common one there, if it still fits
  restockSpecies(reg, ds, eggs) {
    const g = this.game;
    if (!ds.length) return null;
    const count = {};
    for (const d of ds) count[d.species] = (count[d.species] || 0) + 1;
    const top = Object.keys(count).sort((a, b) => count[b] - count[a])[0];
    const sp = SPECIES[top];
    if (sp.flying || (sp.territorial && count[top] >= 1) || !g.isUnlocked(top)) return null;
    const used = ds.reduce((a, d) => a + d.sp.space, 0) + eggs.reduce((a, e) => a + SPECIES[e.species].space, 0);
    return used + sp.space <= reg.size ? top : null;
  }

  // where the star rating comes from, and what would raise it next
  showRating() {
    const g = this.game, w = g.world;
    let dinoPts = 0; const species = new Set();
    for (const d of g.creatures()) {
      if (d.loose || d.carried) continue;
      dinoPts += d.sp.appeal * (d.sick > 0 ? 0.5 : 1) * (0.6 + d.comfort / 250);
      species.add(d.species);
    }
    let bldPts = 0; const dark = [];
    for (const b of w.buildings.values()) {
      const a = BUILDINGS[b.type].appeal || 0; if (!a) continue;
      bldPts += a * (b.powered ? 1 : 0.5) * (b.escaped ? 0 : 1);
      if (!b.powered) dark.push(b);
    }
    const varPts = species.size * 8, repPts = g.reputation * 0.9;
    const score = dinoPts + varPts + bldPts + repPts;
    const next = STAR_THRESH[g.stars + 1];
    const row = (k, v, note) => `<div class="row"><span>${k}${note ? ` <span style="color:#9ab08a">${note}</span>` : ''}</span><span>${Math.round(v)}</span></div>`;
    let html = `<h1>PARK RATING <span style="color:var(--gold)">${'★'.repeat(g.stars)}</span><span style="color:#4a5a44">${'★'.repeat(5 - g.stars)}</span></h1>`;
    html += `<p>Score <b style="color:var(--gold)">${Math.round(score)}</b>${next ? ` · the next star needs <b>${next}</b> (${Math.ceil(next - score)} to go)` : ' · top rating!'}</p>`;
    html += row('Dinosaurs on show', dinoPts, 'appeal × comfort') + row('Variety', varPts, `${species.size} species × 8`) + row('Attractions', bldPts, 'buildings with appeal') + row('Reputation', repPts, `${Math.round(g.reputation)} × 0.9`);
    const happy = g.happySamples && g.happySamples.length ? g.happySamples.reduce((a, b) => a + b, 0) / g.happySamples.length : null;
    html += `<p style="color:#9ab08a">Reputation drifts each night toward a mix of how happy departing guests were${happy !== null ? ` (${Math.round(happy)})` : ''} and park safety (${Math.round(g.safety === undefined ? 100 : g.safety)}): deaths, loose dinosaurs and broken fences pull safety down.</p>`;
    // concrete next steps
    const tips = [];
    const fresh = SPECIES_ORDER.filter((k) => g.isUnlocked(k) && !species.has(k) && !SPECIES[k].flying);
    if (fresh.length) tips.push(`New species add their appeal plus 8 for variety. Unlocked and not yet on show: ${fresh.slice(0, 4).map((k) => `${SPECIES[k].name} (${SPECIES[k].appeal + 8})`).join(', ')}.`);
    const locked = SPECIES_ORDER.find((k) => !g.isUnlocked(k));
    if (locked) tips.push(`${SPECIES[locked].name} unlocks at ${SPECIES[locked].unlock} stars (or with genome research).`);
    const sad = g.dinos.filter((d) => !d.loose && !d.carried && d.comfort < 55);
    if (sad.length) tips.push(`${sad.length} dinosaur${sad.length > 1 ? 's are' : ' is'} uncomfortable, which cuts their appeal by up to a third: open ${sad.length > 1 ? 'their panels' : 'its panel'} to see what ${sad.length > 1 ? 'they need' : 'it needs'}.`);
    const sick = g.dinos.filter((d) => d.sick > 0).length;
    if (sick) tips.push(`${sick} sick dinosaur${sick > 1 ? 's count' : ' counts'} for half. A Vet Clinic cures them faster.`);
    if (g.looseCount) tips.push(`Loose dinosaurs count for nothing until they are back in a paddock.`);
    if (dark.length) tips.push(`${dark.length} attraction${dark.length > 1 ? 's have' : ' has'} no power and count${dark.length > 1 ? '' : 's'} for half.`);
    if (!g.hasBuilding('viewing')) tips.push('Viewing Platforms next to paddocks are cheap appeal.');
    if (!g.hasBuilding('tour') && g.stars >= 1) tips.push('A Tour Station with track through the paddocks adds a lot of appeal.');
    if (tips.length) html += `<h2>WAYS TO RAISE IT</h2><ul>${tips.map((t) => `<li>${t}</li>`).join('')}</ul>`;
    const issues = g.collectIssues().slice(0, 4);
    if (issues.length) html += `<h2>ADVISOR</h2><ul>${issues.map(([, m]) => `<li>${m}</li>`).join('')}</ul>`;
    html += `<h2>GUESTS</h2><p>The park draws about <b>${g.desiredGuests()}</b> guests right now (${g.guests.length} inside, at most 450). More appeal, a better reputation and a lower ticket price ($${g.ticket}) all bring more.</p>`;
    html += `<div class="btns" style="justify-content:flex-end;margin-top:8px"><button data-close>Close</button></div>`;
    this.showModal(html);
    $('[data-close]').onclick = () => this.closeModal();
  }

  showResearch() {
    const g = this.game, rs = g.research;
    const labs = g.buildingsOfType('lab').length;
    let html = `<h1>RESEARCH</h1><p>${labs ? `${labs} lab${labs > 1 ? 's' : ''} (${rs.labs()} powered). Extra labs speed research up.` : '<span style="color:#ff9080">Build a Research Lab (Dinos menu) to start researching.</span>'}</p><div class="rgrid">`;
    for (const r of RESEARCH) {
      const done = rs.has(r.id), active = rs.active && rs.active.id === r.id, avail = rs.available(r);

      else if (active) foot = `<div class="pbar" style="width:100%"><i style="width:${rs.active.progress / r.hours * 100}%"></i></div>`;

  showFinances() {
    const g = this.game;
    const L = g.ledger;
    const last = g.history.length ? g.history[g.history.length - 1].ledger : null;
    const row = (k, lbl, sign) => `<tr><td>${lbl}</td><td style="color:${sign > 0 ? '#8ad06a' : '#ff9080'}">${fmtMoneyFull(L[k] * sign)}</td><td style="color:#9ab08a">${last ? fmtMoneyFull(last[k] * sign) : '—'}</td></tr>`;
    let html = `<h1>FINANCES</h1><table class="fin"><tr><td></td><td>Today</td><td>Yesterday</td></tr>`;
    html += row('tickets', 'Tickets', 1) + row('shops', 'Shops & food', 1) + row('grants', 'Grants & sales', 1);
    html += row('upkeep', 'Upkeep & wages', -1) + row('food', 'Dino food', -1) + row('repairs', 'Repairs', -1) + row('construction', 'Construction', -1) + row('dinos', 'Hatching', -1) + row('ops', 'Operations', -1) + row('fines', 'Lawsuits & fines', -1);
    const IN = ['tickets', 'shops', 'grants'], OUT = ['upkeep', 'food', 'repairs', 'construction', 'dinos', 'ops', 'fines'];
    const net = (l) => IN.reduce((a, k) => a + (l[k] || 0), 0) - OUT.reduce((a, k) => a + (l[k] || 0), 0);
    const nt = net(L), ny = last ? net(last) : null;
    html += `<tr style="border-top:2px solid #4a6a3a"><td><b>Net</b></td><td style="color:${nt >= 0 ? '#8ad06a' : '#ff9080'}"><b>${fmtMoneyFull(nt)}</b></td><td style="color:${ny === null ? '#9ab08a' : ny >= 0 ? '#8ad06a' : '#ff9080'}"><b>${ny === null ? '—' : fmtMoneyFull(ny)}</b></td></tr>`;
    html += `</table>`;
    html += `<h2>TICKET PRICE</h2><div class="btns" style="align-items:center"><button data-t="-10">−10</button><button data-t="-1">−1</button><span style="font-size:26px;color:#f8d040;min-width:70px;text-align:center" id="tp">$${g.ticket}</span><button data-t="1">+1</button><button data-t="10">+10</button><span style="color:#9ab08a">Higher prices = fewer visitors.</span></div>`;
    html += `<h2>HISTORY</h2><canvas id="finChart" width="680" height="150" style="width:100%;height:150px;background:#0a120a;border:2px solid #000"></canvas>`;
    html += `<p style="color:#9ab08a">Guests total: ${g.stats.guestsTotal} · Escapes: ${g.stats.escapes} · Guest casualties: ${g.stats.deaths} · Staff lost: ${g.stats.staffDeaths} · Dinos lost: ${g.stats.dinoDeaths}</p>`;
    html += `<div class="btns" style="justify-content:flex-end"><button data-close>Close</button></div>`;
    this.showModal(html);
    for (const b of document.querySelectorAll('[data-t]')) b.onclick = () => { g.ticket = clamp(g.ticket + +b.dataset.t, 0, 400); $('#tp').textContent = '$' + g.ticket; this.sfx.play('click'); };
    $('[data-close]').onclick = () => this.closeModal();
    const c = $('#finChart'), x = c.getContext('2d');
    const H = g.history.slice(-40);
    if (H.length > 1) {
      const line = (vals, col, labelY) => {
        const mn = Math.min(0, ...vals), mx = Math.max(1, ...vals);
        const sy = (v) => 138 - (v - mn) / Math.max(1, mx - mn) * 112;
        x.strokeStyle = col; x.lineWidth = 2; x.beginPath();
        vals.forEach((v, i) => { const px = i / (vals.length - 1) * 670 + 5; if (i) x.lineTo(px, sy(v)); else x.moveTo(px, sy(v)); });
        x.stroke();
        return [mn, mx, sy];
      };
      const [mn, mx, sy] = line(H.map((h) => h.money), '#f8d040');
      x.strokeStyle = '#3a4a36'; x.lineWidth = 1; x.beginPath(); x.moveTo(0, sy(0)); x.lineTo(680, sy(0)); x.stroke();
      const [, gmx] = line(H.map((h) => h.peak || h.guests), '#70b8f0');
      x.font = '15px VT323';
      x.fillStyle = '#f8d040'; x.fillText('Funds ' + fmtMoney(mx) + ' max', 6, 14);
      x.fillStyle = '#70b8f0'; x.fillText('Peak guests ' + gmx, 160, 14);
      x.fillStyle = '#9ab08a'; x.fillText('Day ' + H[0].day, 6, 148); x.fillText('Day ' + H[H.length - 1].day, 630, 148);
    } else { x.fillStyle = '#9ab08a'; x.font = '18px VT323'; x.fillText('History appears after day 1.', 10, 80); }
  }

  showDisasters() {
    const g = this.game;
    let html = `<h1>DISASTERS</h1><p>Disasters strike on their own every few days. You can also unleash them yourself. Chaos theory in action.</p><div class="cards">`;
    for (const [k, d] of Object.entries(DISASTERS)) html += `<div class="card" data-dis="${k}"><div style="font-size:30px">${d.icon}</div><div class="nm">${d.name.toUpperCase()}</div><div style="color:#9ab08a">${d.desc}</div></div>`;
    html += `</div><div class="btns" style="justify-content:space-between;margin-top:10px"><button id="autoDis" class="${g.events.auto ? 'on' : ''}">Random disasters: ${g.events.auto ? 'ON' : 'OFF'}</button><button data-close>Close</button></div>`;
    this.showModal(html);
    const why = { rampage: 'nothing in the park is big enough to go on a rampage', raptors: 'there are no Velociraptors in a paddock', disease: 'there are no dinosaurs to fall ill', storm: 'a storm is already on the way', volcano: 'the volcano is already erupting' };
    for (const c of document.querySelectorAll('[data-dis]')) c.onclick = () => {
      const n = g.logs.length;
      g.events.trigger(c.dataset.dis);
      this.closeModal();
      // a disaster with nothing to act on does nothing: say so rather than leave the player wondering
      if (g.logs.length === n) this.toast(`Nothing happened: ${why[c.dataset.dis] || 'the conditions are not right'}.`, 'info');
    };
    $('#autoDis').onclick = () => { g.events.auto = !g.events.auto; this.showDisasters(); };
    $('[data-close]').onclick = () => this.closeModal();
  }

  showMenu() {
    let has = false;
    try { has = !!localStorage.getItem('jt_save'); } catch (e) { /* storage unavailable */ }
    let html = `<h1>MENU</h1><div class="btns" style="flex-direction:column;align-items:stretch;gap:6px">
      <button data-m="resume">Resume</button><button data-m="save">Save park</button><button data-m="load" ${has ? '' : 'disabled'}>Load saved park</button>
      <button data-m="advisor">Advisor tips: ${this.game.advisorOn === false ? 'OFF' : 'ON'}</button>
      <button data-m="calls" title="Calls from InGen with choices and consequences">InGen calls: ${this.game.decisionsOn === false ? 'OFF' : 'ON'}</button>
      <button data-m="breed">Breeding: ${this.game.breedingOff ? 'PREVENTED (lysine contingency)' : 'ALLOWED'}</button>
      <button data-m="seed" title="Share this code so a friend can play the same island">Island code: ${seedCode(this.game.seed)}${this.game.mapSize !== 'medium' ? ' · ' + MAP_SIZES[this.game.mapSize].label.toLowerCase() : ''} (copy)</button>
      <button data-m="wheel" title="What scrolling does on the map">Scroll: ${{ auto: 'AUTO (mouse wheel zooms, trackpad pans)', zoom: 'ZOOM', pan: 'PAN (pinch or +/− to zoom)' }[this.wheelMode]}</button>
      <button data-m="audio">Sound settings</button>
      <button data-m="help">How to play</button><button data-m="new" class="danger">New island (lose progress)</button></div>`;
    this.showModal(html);
    for (const b of document.querySelectorAll('[data-m]')) b.onclick = () => {
      const m = b.dataset.m;
      if (m === 'resume') this.closeModal();
      else if (m === 'save') { const ok = saveGame(this.game); this.closeModal(); this.toast(ok ? 'Park saved.' : 'Could not save (storage unavailable).', ok ? 'good' : 'bad'); }
      else if (m === 'load') { this.closeModal(); loadGameFromStorage(); }
      else if (m === 'help') this.showHelp();
      else if (m === 'audio') this.showAudio();
      else if (m === 'seed') {
        const code = seedCode(this.game.seed);
        if (navigator.clipboard) navigator.clipboard.writeText(code).then(() => this.toast(`Copied island code ${code}`, 'good'), () => this.toast(`Island code: ${code}`, 'info'));
        else this.toast(`Island code: ${code}`, 'info');
      }
      else if (m === 'calls') { this.game.decisionsOn = this.game.decisionsOn === false; this.showMenu(); }
      else if (m === 'breed') { this.game.breedingOff = !this.game.breedingOff; this.showMenu(); }
      else if (m === 'wheel') {
        this.wheelMode = { auto: 'pan', pan: 'zoom', zoom: 'auto' }[this.wheelMode];
        try { localStorage.setItem('jt_wheel', this.wheelMode); } catch (e) { /* storage unavailable */ }
        this.showMenu();
      }
      else if (m === 'advisor') { this.game.advisorOn = this.game.advisorOn === false; this.showMenu(); }
      else if (m === 'new') { this.closeModal(); showTitle(); }
    };
  }

  showHelp() {
    const html = `<h1>HOW TO PLAY</h1>
      <p>You run a dinosaur theme park on a remote island. Build attractions, hatch dinosaurs, keep guests happy and — above all — <b style="color:#f8d040">keep the dinosaurs contained</b>.</p>
      <p>${IS_TOUCH ? 'Tap' : 'Click'} the <b>Rating</b> in the top bar to see what your star rating is made of and what would raise it.</p>
      <h2>BUILDING A PADDOCK</h2>
      <p>1. Build a <b>Power Plant</b> (Power menu). Electric fences only work inside its blue coverage area; extend it with Pylons.<br>
      2. Use the <b>Paddock</b> tool to drag a fenced rectangle. Trees and water inside make dinos happier (Plant Trees and Dig Pond in the Build menu).<br>
      3. Put a <b>Feeder</b> inside (herbivore or carnivore).<br>
      4. Build a <b>Hatchery</b>, then <b>Hatch</b> a species inside the paddock.</p>
      <h2>GUESTS</h2>
      <p>Guests arrive at the Main Gate and only walk on paths. Lead paths past paddocks (dinos within ~6 tiles are visible) and add Viewing Platforms, food, shops and restrooms. A <b>Tour Station</b> with a loop of <b>Tour Track</b> running past the paddocks is the biggest crowd-pleaser — but the electric jeeps stall when the power goes out.</p>
      <h2>WHEN THINGS GO WRONG</h2>
      <p>Stressed or hungry dinosaurs attack fences. Unpowered fences fall fast. When a dinosaur escapes: sound the <b>ALARM</b> (guests run to the Visitor Center, Hotel or Bunkers), let <b>Rangers</b> tranquilize it, and the <b>ACU Helipad</b> airlifts it home. <b>Engineers</b> from Maintenance Sheds repair fences. Build a <b>Backup Generator</b> for grid failures and a <b>Vet Clinic</b> for outbreaks.</p>
      <p>Escaped predators head for the crowds. Shops and ride queues are no hiding place, and a determined dinosaur can break a shelter's doors (repair it from its panel). <b>Siren Towers</b> sound by themselves when something dangerous is near, so guests start running before you even notice. <b>Raptors</b> stalk, hunt for sport and keep testing electric fences: <b>Concrete Walls</b> hold them. You can <b>close the park</b> from the Main Gate while you deal with a crisis.</p>
      <h2>LIFE FINDS A WAY</h2>
      <p>Hatchlings grow up in a couple of days. Comfortable adults of the same species breed when their paddock has room, and every dinosaur grows old and dies eventually (its panel shows its age): keep hatching young ones, or the exhibit fades away.</p>
      <h2>CONTROLS</h2>
      <p>Left click: use tool / select · Drag: build lines & areas · Right-drag or drag in Inspect: pan · Mouse wheel or +/−: zoom · WASD/Arrows: pan<br>
      Trackpad: two-finger scroll pans, pinch zooms · Touch: one finger builds (or pans in Inspect), two fingers pan and pinch<br>
      Space: pause · 1–4: speed · E: alarm · B: respond to a breach · M: select all rangers · O: power overlay · K: paddock overlay · L: find loose dinos · G: dinosaur roster · Y: research · U or Ctrl+Z: undo · Esc: cancel</p>
      <h2>CAMPAIGN AND INGEN CALLS</h2>
      <p>The <b>Campaign</b> is five chapters, from opening day to Jurassic World; each one you finish gives a perk to the chapters after it. Every few mornings <b>InGen calls</b> with a choice: investors, lawyers, Dr. Wu, the rangers' union and more. Deals show above your goal with their deadlines. Turn calls off in the menu if you just want to build.</p>
      <h2>ATTRACTIONS</h2>
      <p><b>Gyrosphere Station</b> (1★): build it against a paddock fence; glass balls roll guests among the dinosaurs. Put it on a carnivore paddock for thrills, and the occasional cracked sphere. <b>Feeding Grandstand</b>: at noon and 6pm a nearby carnivore is fed in front of the crowd. <b>Raptor Arena</b> (2★): next to a paddock with 2+ raptors, shows pay well but stress the pack, and sometimes go badly wrong. <b>Mosasaur Lagoon</b> (4★): a huge draw; everyone within splash range pays to watch it leap. <b>Lodge Hotel</b>: guests stay the night, and stay longer.</p>
      <h2>SHORTCUTS</h2>
      <p>Click a paddock for one-click <b>Tree cover</b>, <b>feeders</b> and <b>fence repairs</b>. <b>Copy layout</b> turns a paddock into a blueprint you can stamp anywhere. Hatching into a paddock with no food adds a feeder automatically, and <b>Repair all</b> on the breached-fence alert fixes every fence at once.</p>
      <h2>COMMANDING STAFF (OPTIONAL)</h2>
      <p>Rangers, engineers and helicopters work on their own, but you can take charge. Click one to select it, shift-click or shift-drag to select several, double-click to select every one of that kind, or press <b>M</b> for all rangers. Then <b>right-click</b> (on touch: <b>Send…</b>, then tap) a dinosaur to hunt it, a broken fence to repair it, or open ground to hold a position. Units on orders move faster. <b>Back to auto</b> releases them. When something escapes, <b>RESPOND</b> (or <b>B</b>) sounds the alarm and sends every ranger and helicopter at once.</p>
      <h2>PLAY OFFLINE</h2>
      <p>Open <b>mszarski.github.io/claude_playground</b> on your phone and choose <b>Add to Home Screen</b> (Share menu on iPhone, ⋮ menu on Android). After the first visit it runs without a connection.</p>
      <p style="color:#9ab08a">Lose if you stay deeply in debt or too many guests are eaten. Win by completing all goals.</p>
      <div class="btns" style="justify-content:flex-end"><button data-close>Got it</button></div>`;
    this.showModal(html);
    $('[data-close]').onclick = () => this.closeModal();
  }

  // An InGen call: the game is paused (modal open) until the director picks an option
  showDecision(offer) {
    const g = this.game, def = DECISIONS[offer.id];
    this.decisionShown = offer;
    const html = `<div class="call"><div class="callhead"><span class="callicon">${def.icon}</span><div><div class="callfrom">☎ INCOMING CALL</div><h1>${def.from.toUpperCase()}</h1></div></div>
      <p class="calltext">${def.text(g, offer.params)}</p>
      <div class="choices">${def.choices.map((c, i) => `<button class="choice" data-ch="${i}"><b>${typeof c.label === 'function' ? c.label(offer.params) : c.label}</b><span>${choiceHint(c, offer.params)}</span></button>`).join('')}</div></div>`;
    this.showModal(html, true);
    this.sfx.play('ring');
    for (const b of document.querySelectorAll('[data-ch]')) b.onclick = () => {
      g.resolveDecision(+b.dataset.ch);
      this.decisionShown = null;
      this.closeModal();
      this.sfx.play('click');
      this.renderDeals(true);
    };
  }

  renderDeals(force) {
    const list = contractStatus(this.game);
    const html = list.map((c) => `<div class="deal ${c.kind}"><span>${c.kind === 'contract' ? '📋 ' : ''}${c.text}</span><i>${c.left}</i></div>`).join('');
    if (!force && html === this.lastDeals) return;
    this.lastDeals = html;
    const el = $('#deals');
    el.innerHTML = html;
    el.hidden = !list.length;
    document.documentElement.style.setProperty('--dealsH', (el.hidden ? 0 : el.offsetHeight + 4) + 'px');
  }

  showGameOver(reason) {
    const g = this.game;
    const html = `<div id="gameover"><h1>PARK CLOSED</h1><p style="font-size:22px">${reason}</p>
      <p style="color:#9ab08a">Survived ${g.day} days · ${g.stats.guestsTotal} guests · ${g.stats.deaths} eaten · ${g.stats.escapes} escapes</p>
      <p><i>"John, the kind of control you're attempting simply is... it's not possible."</i></p>
      <div class="btns" style="justify-content:center"><button data-m="new">Try a new island</button></div></div>`;
    this.showModal(html, true);
    $('[data-m="new"]').onclick = () => { this.closeModal(); showTitle(); };
  }

  showChapterIntro(id) {
    const c = SCENARIOS[id], perks = campaignPerks(id);
    const html = `<div id="gameover"><div style="font-family:'Press Start 2P';font-size:9px;color:var(--orange)">CHAPTER ${c.chapter} OF ${CAMPAIGN_ORDER.length}</div><h1>${c.name.toUpperCase()}</h1>
      <p style="font-size:21px">${c.blurb}</p><p style="color:var(--gold);font-size:20px">${c.objective}.</p>
      ${perks.length ? `<p style="color:#9ab08a">Your perks: ${perks.map((p) => `<b style="color:#a8f080">${p.name}</b> (${p.desc})`).join(', ')}</p>` : ''}
      <div class="btns" style="justify-content:center"><button data-close>Let's go</button></div></div>`;
    this.showModal(html);
    $('[data-close]').onclick = () => this.closeModal();
  }

  showScenarioEnd(r) {
    const g = this.game, sc = SCENARIOS[g.scenario];
    this.setSpeed(0);
    const win = r === 'win';
    if (win) this.sfx.play('fanfare');
    const medal = win && sc.medal ? sc.medal(g) : null;
    const best = medal ? saveMedal(g.scenario, medal, g.day) : false;
    // on a loss, say what the goal was and how far off it the park ended up
    const failWhy = `<p>Goal: ${sc.objective}</p><p style="color:#ff9080">Where you stood: ${sc.progress(g).replace(/<[^>]+>/g, '')}</p>`;
    if (sc.campaign) {
      if (win) saveCampaign(g.scenario, medal || 'bronze', g.day);
      const next = CAMPAIGN_ORDER[CAMPAIGN_ORDER.indexOf(g.scenario) + 1];
      const perk = win && CAMPAIGN_PERKS[g.scenario];
      const html = `<div id="gameover"><div style="font-family:'Press Start 2P';font-size:9px;color:var(--orange)">CHAPTER ${sc.chapter} OF ${CAMPAIGN_ORDER.length}</div><h1>${win ? (next ? 'CHAPTER COMPLETE' : 'CAMPAIGN COMPLETE') : 'CHAPTER FAILED'}</h1>
        <p style="font-size:22px">${sc.name}: ${win ? (next ? 'on to the next island.' : 'the greatest park on Earth. Welcome to Jurassic World.') : 'the island won this time.'}</p>
        ${medal ? `<p style="font-size:44px;margin:4px 0">${MEDAL_ICON[medal]}</p><p style="font-family:'Press Start 2P';font-size:10px;color:var(--gold)">${medal.toUpperCase()} MEDAL${best ? ' · NEW BEST' : ''}</p>` : ''}
        ${win ? (sc.medalText ? `<p style="color:#9ab08a">${sc.medalText}</p>` : '') : failWhy}
        ${perk ? `<p>New perk for the chapters ahead: <b style="color:#a8f080">${perk.name}</b> (${perk.desc})</p>` : ''}
        <p style="color:#9ab08a">Day ${g.day} · ${g.stats.deaths} guests lost · ${g.stats.escapes} escapes · ${fmtMoney(g.money)}</p>
        <div class="btns" style="justify-content:center">${win && next ? '<button data-m="next">Next chapter</button>' : ''}<button data-m="again">${win ? 'Replay' : 'Try again'}</button><button data-m="title">Main menu</button><button data-close>Keep playing</button></div></div>`;
      this.showModal(html, true);
      const nb = $('[data-m="next"]'); if (nb) nb.onclick = () => { this.closeModal(); startChapter(next); };
      $('[data-m="again"]').onclick = () => { this.closeModal(); startChapter(g.scenario); };
      $('[data-m="title"]').onclick = () => { this.closeModal(); showTitle(); };
      $('[data-close]').onclick = () => { this.closeModal(); this.setSpeed(1); };
      return;
    }
    const html = `<div id="gameover"><h1>${win ? 'SCENARIO COMPLETE' : 'SCENARIO FAILED'}</h1><p style="font-size:22px">${sc.name}: ${win ? 'you did it.' : 'the island won this time.'}</p>
      ${medal ? `<p style="font-size:44px;margin:4px 0">${MEDAL_ICON[medal]}</p><p style="font-family:'Press Start 2P';font-size:10px;color:var(--gold)">${medal.toUpperCase()} MEDAL${best ? ' · NEW BEST' : ''}</p>` : ''}
      ${win ? (sc.medalText ? `<p style="color:#9ab08a">${sc.medalText}</p>` : '') : failWhy}
      <p style="color:#9ab08a">Day ${g.day} · ${g.stats.deaths} guests lost · ${g.stats.escapes} escapes · ${fmtMoney(g.money)}</p>
      <div class="btns" style="justify-content:center"><button data-m="again">Try again</button><button data-m="title">Main menu</button><button data-close>Keep playing</button></div></div>`;
    this.showModal(html, true);
    $('[data-m="again"]').onclick = () => { this.closeModal(); startGame({ scenario: g.scenario, difficulty: 'normal' }); };
    $('[data-m="title"]').onclick = () => { this.closeModal(); showTitle(); };
    $('[data-close]').onclick = () => { this.closeModal(); this.setSpeed(1); };
  }

  showVictory() {
    const g = this.game;
    const html = `<div id="gameover"><h1>WELCOME TO JURASSIC TYCOON</h1><p style="font-size:22px">Every goal complete in ${g.day} days. You spared no expense — and kept (most of) the dinosaurs in their paddocks.</p>
      <p style="color:#9ab08a">${g.stats.guestsTotal} guests · ${g.stats.deaths} eaten · ${g.stats.escapes} escapes</p>
      <div class="btns" style="justify-content:center"><button data-close>Keep playing</button></div></div>`;
    this.showModal(html);
    $('[data-close]').onclick = () => this.closeModal();
  }
}

for (const k of Object.getOwnPropertyNames(UIPanels.prototype)) if (k !== 'constructor') UI.prototype[k] = UIPanels.prototype[k];

<script>
// ---------- Guided tutorial: highlights UI and waits for the player to do each step ----------
'use strict';

const TUTORIAL_STEPS = [
  {
    text: 'Welcome, park director! This short tutorial builds a tiny park and then lets something escape. Drag the map (or use WASD) to look around. Zoom with the mouse wheel, a pinch, or the +/− buttons by the minimap.',
    touch: 'Welcome, park director! This short tutorial builds a tiny park and then lets something escape. Drag the map with a finger to look around. Pinch, or use the +/− buttons by the minimap, to zoom.',
    next: true,
  },
  {
    text: 'Electric fences need power. Open the <b>Power</b> menu and place a <b>Power Plant</b> on open grass near the gate.',
    target: '.cat[data-cat="infra"]', tool: 'power',
    check: (g) => g.hasBuilding('power'),
  },
  {
    text: 'The blue area is power coverage. Choose the <b>Paddock</b> tool and drag a rectangle (about 10×8) <b>inside</b> the blue area. Dead fences blink red.',
    target: '.cat[data-cat="build"]', tool: 'paddock',
    check: (g) => g.world.regions.some((r) => !r.public && r.size >= 20 && r.size < 1200 && tutPaddockPowered(g, r)),
    hint: 'Make sure every side of the fence sits inside the blue coverage. You can press U to undo.',
  },
  {
    text: 'Dinosaurs get hungry. Open <b>Dinos</b> and place a <b>Herbivore Feeder</b> inside your paddock.',
    target: '.cat[data-cat="dino"]', tool: 'feeder_h',
    check: (g) => g.world.regions.some((r) => !r.public && r.size < 1200 && r.feeders.herb.length > 0),
  },
  {
    text: 'Now build a <b>Hatchery</b> (also in Dinos). It must be inside power coverage too.',
    target: '.cat[data-cat="dino"]', tool: 'hatchery',
    check: (g) => g.buildingsOfType('hatchery').some((b) => b.powered),
    hint: 'If it shows a yellow "!" it has no power: move it closer or add a Power Pylon.',
  },
  {
    text: 'Hatch two <b>Gallimimus</b>: press <b>H</b> (or Dinos → Hatch Dinosaur), pick Gallimimus, then click inside the paddock twice. (Gallimimus are happiest in threes, so add a third later.)',
    target: '.cat[data-cat="dino"]', tool: 'hatch',
    check: (g) => g.dinos.filter((d) => d.species === 'galli').length + g.eggs.filter((e) => e.species === 'galli').length >= 2,
  },
  {
    text: 'Guests arrive at the gate and only walk on paths. Build a <b>Visitor Center</b> (Guests menu) and connect it to the gate with <b>Smart Path</b>: drag from the gate path to the building.',
    target: '.cat[data-cat="guest"]', tool: 'visitor',
    check: (g) => g.buildingsOfType('visitor').some((b) => g.world.accessTiles(b).length) && g.guests.length >= 3,
    hint: 'Guests only come once there is something connected to the gate by paths. Run a path past the paddock so they can see the dinosaurs.',
  },
  {
    text: 'Every park needs a <b>Ranger Station</b> (Staff menu). Rangers tranquilize anything that gets out.',
    target: '.cat[data-cat="staff"]', tool: 'ranger',
    check: (g) => g.hasBuilding('ranger'),
  },
  {
    text: 'Uh oh. A fence just failed and a dinosaur is loose! Press <b>⚠ ALARM</b> (or E) to send guests to shelter.',
    target: '#alarmBtn',
    enter: (g) => tutStageBreach(g),
    check: (g) => g.alarm,
  },
  {
    text: 'Good. Now watch the breach cam: your rangers will dart the escapee. Then fix the fence: click the broken (red rubble) tile with Inspect and choose <b>Emergency repair</b>, or wait for engineers if you have a Maintenance Shed.',
    target: '#pip',
    check: (g) => !g.looseCount && g.countBrokenFences() === 0,
    hint: 'Sedated escapees are trucked back to a paddock by the ground crew (a Helipad is faster). Click the alert at the top to find the loose dinosaur.',
  },
  {
    text: 'Contained! Turn off the alarm so guests come back out (press ⚠ ALARM again).',
    target: '#alarmBtn',
    check: (g) => !g.alarm,
  },
  {
    text: 'That is the job: build, power, feed, and react fast when things go wrong. Follow the goals in the bottom-left to grow your park. Good luck!',
    next: true, last: true,
  },
];

function tutPaddockPowered(g, r) {
  const w = g.world;
  for (const t of r.tiles) {
    const x = t % w.W, y = (t / w.W) | 0;
    for (const [dx, dy] of DIRS4) {
      const nx = x + dx, ny = y + dy;
      if (!w.inb(nx, ny)) continue;
      const j = w.idx(nx, ny);
      if (w.fence[j] === F_ELECTRIC && !w.fencePowered[j]) return false;
    }
  }
  return true;
}

function tutStageBreach(g) {
  const w = g.world;
  const d = g.dinos.find((x) => x.species === 'galli' && !x.loose) || g.dinos[0];
  if (!d) return;
  // knock out the fence tile nearest to the dinosaur and nudge it through
  const p = w.bfs(d.tx, d.ty, w.dinoPass, (x, y) => isSolidFence(w.fence[w.idx(x, y)]), 3000);
  if (!p || !p.length) return;
  const [fx, fy] = p[p.length - 1];
  g.damageFence(fx, fy, 99999, null);
  d.stress = 30; // a calm escapee so the first breach is easy to resolve
  w.computeRegions(); g.updateLoose();
}

class Tutorial {
  constructor(ui) {
    this.ui = ui; this.i = -1; this.done = false; this.t = 0;
    this.panel = document.getElementById('tut');
    this.hl = document.getElementById('tutHl');
    this.go(0);
  }
  get step() { return TUTORIAL_STEPS[this.i]; }
  go(i) {
    this.i = i; this.t = 0; this.hintShown = false;
    const s = this.step, g = this.ui.game;
    if (!s) { this.finish(); return; }
    if (s.enter) s.enter(g);
    this.render();
    this.ui.sfx.play(i ? 'fanfare' : 'click');
  }
  render() {
    const s = this.step;
    const n = TUTORIAL_STEPS.length;
    this.panel.hidden = false;
    this.panel.innerHTML = `<b>TUTORIAL ${this.i + 1}/${n}</b><div>${tutText(s)}</div><div id="tutHint" class="sub"></div>
      <div class="btns">${s.next ? `<button id="tutNext">${s.last ? 'Start playing' : 'Next'}</button>` : ''}${s.tool ? '<button id="tutTool">Select it for me</button>' : ''}${s.last ? '' : '<button id="tutSkip">Skip tutorial</button>'}</div>`;
    const nb = document.getElementById('tutNext'); if (nb) nb.onclick = () => (s.last ? this.finish() : this.go(this.i + 1));
    const tb = document.getElementById('tutTool'); if (tb) tb.onclick = () => this.selectTool(s.tool);
    const sk = document.getElementById('tutSkip'); if (sk) sk.onclick = () => this.finish();
  }
  selectTool(t) {
    const ui = this.ui;
    if (t === 'hatch') { ui.species = 'galli'; ui.setTool('hatch'); ui.toast('Gallimimus selected: click inside your paddock.', 'info'); return; }
    ui.setTool(t);
    const grp = TOOL_GROUPS.find((gr) => gr.tools.includes(t));
    if (grp && window.innerWidth >= 760) ui.openFlyout(grp);
  }
  update(dt) {
    if (this.done) return;
    const s = this.step; if (!s) return;
    this.t += dt;
    if (s.check && s.check(this.ui.game)) { this.go(this.i + 1); return; }
    if (s.hint && !this.hintShown && this.t > 25) { this.hintShown = true; const h = document.getElementById('tutHint'); if (h) h.innerHTML = '💡 ' + tutText({ text: s.hint }); }
    // highlight target element
    const el = s.target && document.querySelector(s.target);
    if (el && el.offsetParent !== null && !el.hidden) {
      const r = el.getBoundingClientRect();
      Object.assign(this.hl.style, { left: r.left - 5 + 'px', top: r.top - 5 + 'px', width: r.width + 10 + 'px', height: r.height + 10 + 'px' });
      this.hl.hidden = false;
    } else this.hl.hidden = true;
  }
  finish() {
    this.done = true;
    this.panel.hidden = true; this.hl.hidden = true;
    const g = this.ui.game;
    g.tutorial = false;
    try { localStorage.setItem('jt_tutorial_done', '1'); } catch (e) { /* storage unavailable */ }
    document.getElementById('goal').hidden = false;
    this.ui.tutorial = null;
  }
}

// Phones and tablets: tap instead of click, and no keyboard shortcuts
function tutText(s) {
  const touch = window.matchMedia && window.matchMedia('(pointer: coarse)').matches;
  if (!touch) return s.text;
  return (s.touch || s.text).replace(' Dead fences blink red.', ' Dead fences blink red. Pinch to zoom out if it doesn\'t fit.').replace(/\bclick/g, 'tap').replace(/\bClick/g, 'Tap').replace(/ \(or [A-Z]\)/g, '').replace(/press U to undo/, 'tap ↶ (top bar) to undo').replace(/press <b>H<\/b> \(or Dinos → Hatch Dinosaur\)/, 'open Dinos → Hatch Dinosaur');
}

</script>
<script>
// ---------- Bootstrap, main loop, title screen, save/load ----------
'use strict';

let GAME = null, RENDER = null, UIX = null, SFX = null;
let lastT = 0, titleAnim = null;

function startGame(opts = {}) {
  const seed = opts.seed || window.TEST_SEED || (Math.floor(Math.random() * 1e9) + 1);
  const g = new Game(seed, opts);
  if (opts.sandbox) { g.sandbox = true; g.money = 5000000; }
  setActiveGame(g);
  if (window.innerWidth < 700) RENDER.cam.zoom = 2;
  if (!opts.loaded) {
    UIX.centerOn(g.start.x, g.start.y - 6);
    if (opts.sandbox) g.log('Sandbox: every species and building is unlocked and the park can\'t go bankrupt. Random disasters are on: switch them off, or set one off yourself, from the ☄ Disasters button.', 'goal', null, true);
    else if (!opts.scenario && !opts.tutorial) g.log('Welcome to Isla Nublar! Follow the goals in the bottom-left to build your park.', 'goal', null, true);
  }
  if (opts.tutorial) {
    g.tutorial = true; g.events.auto = false; g.advisorOn = false;
    g.secPerHour = 7.5; // slow days: time to read and build without the park running away
    document.getElementById('goal').hidden = true;
    UIX.tutorial = new Tutorial(UIX);
  } else if (UIX.tutorial) { UIX.tutorial.finish(); }
  hideTitle();
}

function setActiveGame(g) {
  GAME = g;
  const cv = document.getElementById('view');
  if (!RENDER) { RENDER = new Renderer(cv, g); RENDER.resize(window.innerWidth, window.innerHeight); }
  else RENDER.setGame(g);
  if (!UIX) UIX = new UI(g, RENDER, SFX); else UIX.attachGame(g);
  UIX.setTool('inspect'); UIX.closeFlyout(); UIX.setSpeed(1);
  if ($('#modal').style.display === 'flex') UIX.closeModal(); // nothing from the last game carries over
  window.GAME = g;
}

// ---------------- save / load ----------------
function b64(u8) { let s = ''; for (let i = 0; i < u8.length; i += 0x8000) s += String.fromCharCode.apply(null, u8.subarray(i, i + 0x8000)); return btoa(s); }
function unb64(str, Type) { const s = atob(str); const u8 = new Uint8Array(s.length); for (let i = 0; i < s.length; i++) u8[i] = s.charCodeAt(i); return new Type(u8.buffer); }

function serialize(g) {
  const w = g.world;
  return JSON.stringify({
    v: 1, size: g.mapSize, sph: g.secPerHour, lastInc: g.lastIncidentDay, closed: g.parkClosed ? 1 : 0,
    mods: g.mods || [], contracts: g.contracts || [], freeEgg: g.freeEgg || null, seenDec: g.seenDecisions || {}, nextDec: g.nextDecisionDay || 0, decOn: g.decisionsOn !== false, research: { done: [...g.research.done], active: g.research.active }, breedOff: !!g.breedingOff, seed: g.seed, diff: g.difficulty, scen: g.scenario || null, scenState: g.scenarioState || null, money: g.money, time: g.time, rep: g.reputation, ticket: g.ticket, goalIdx: g.goalIdx, sandbox: !!g.sandbox,
    stats: g.stats, history: g.history, deathLog: g.deathLog, auto: g.events.auto, nextDay: g.events.nextDay, start: g.start,
    // anything in flight when the player saved: eggs, crises, queued fences
    eggs: g.eggs.map((e) => ({ s: e.species, x: e.x, y: e.y, t: e.t, max: e.max, un: e.unstable ? 1 : 0 })), pend: g.pendingFences || [],
    ev: { storm: g.events.storm, quake: g.events.quake, volcano: g.events.volcano, outage: w.power.outage, bDelay: w.power.backupDelay, bFuel: w.power.backupFuel },
    alarm: g.alarm ? 1 : 0, gateLocked: g.gateLocked ? 1 : 0, lavaT: b64(new Uint8Array(w.lavaT.buffer)),
    terrain: b64(w.terrain), fence: b64(w.fence), fenceOrig: b64(w.fenceOrig), path: b64(w.path), track: b64(w.track), fenceHp: b64(new Uint8Array(w.fenceHp.buffer)),
    buildings: Array.from(w.buildings.values()).map((b) => ({ type: b.type, x: b.x, y: b.y, hp: b.hp, visitors: b.visitors, revenue: b.revenue || 0, esc: b.escaped ? 1 : 0, door: b.doorsBroken ? 1 : 0, off: b.offline > 0 ? b.offline : 0 })),
    dinos: g.creatures().filter((d) => !d.dead).map((d) => ({ s: d.species, x: d.x, y: d.y, hx: d.home.x, hy: d.home.y, hp: d.hp, hu: d.hunger, st: d.stress, n: d.name, sick: d.sick, k: d.kills, gr: d.growth, ag: d.ageDays, ls: d.lifespan, un: d.unstable ? 1 : 0, lo: d.loose ? 1 : 0 })),
  });
}

function saveGame(g) {
  try { localStorage.setItem('jt_save', serialize(g)); return true; } catch (e) { return false; }
}

function loadGame(json) {
  const s = JSON.parse(json);
  // saves from before island sizes existed are all 'small'
  const g = new Game(s.seed, { skipSetup: true, difficulty: s.diff, size: s.size || 'small' });
  const w = g.world;
  w.terrain.set(unb64(s.terrain, Uint8Array));
  w.fence.set(unb64(s.fence, Uint8Array));
  w.fenceOrig.set(unb64(s.fenceOrig, Uint8Array));
  w.path.set(unb64(s.path, Uint8Array));
  if (s.track) w.track.set(unb64(s.track, Uint8Array));
  w.fenceHp.set(unb64(s.fenceHp, Float32Array));
  for (const b of Array.from(w.buildings.values())) w.removeBuilding(b);
  for (const bd of s.buildings) {
    const b = w.addBuilding(bd.type, bd.x, bd.y);
    b.hp = bd.hp; b.visitors = bd.visitors; b.revenue = bd.revenue;
    if (bd.esc) b.escaped = true; if (bd.door) b.doorsBroken = true; if (bd.off) b.offline = bd.off;
    const def = BUILDINGS[bd.type];
    if (def.staff) for (let k = 0; k < def.staffN; k++) g.staff.push(new Staff(g, def.staff, b));
    if (bd.type === 'helipad') g.helis.push(new Helicopter(g, b));
    if (bd.type === 'tour' || bd.type === 'gyro') { b.queue = []; b.jeepT = 0; }
  }
  for (const dd of s.dinos) {
    const d = SPECIES[dd.s].flying ? new Ptera(g, Math.floor(dd.x), Math.floor(dd.y)) : new Dino(g, dd.s, Math.floor(dd.x), Math.floor(dd.y));
    d.x = dd.x; d.y = dd.y; d.home = { x: dd.hx, y: dd.hy }; d.hp = dd.hp; d.hunger = dd.hu; d.stress = dd.st; d.name = dd.n; d.sick = dd.sick; d.kills = dd.k || 0; if (dd.un) { d.unstable = true; } if (dd.lo) d.loose = d.wasLooseFlag = true; if (dd.gr !== undefined) d.growth = dd.gr; if (dd.ag !== undefined) { d.ageDays = dd.ag; d.lifespan = dd.ls; } // dd.lo: already loose when saved, not a new escape
    g.breedingOff = s.breedOff;
    if (d.isPtera) g.pteros.push(d); else g.dinos.push(d);
  }
  g.money = s.money; g.time = s.time; g.reputation = s.rep; g.ticket = s.ticket; g.goalIdx = s.goalIdx; g.sandbox = s.sandbox;
  g.stats = Object.assign(g.stats, s.stats); g.history = s.history || []; g.deathLog = s.deathLog || [];
  g.events.auto = s.auto; g.events.nextDay = s.nextDay; g.start = s.start;
  g.lastDay = g.day;
  if (s.sph) g.secPerHour = s.sph;
  if (s.lastInc) g.lastIncidentDay = s.lastInc;
  g.parkClosed = !!s.closed;
  g.mods = s.mods || []; g.contracts = s.contracts || []; g.freeEgg = s.freeEgg || null;
  g.seenDecisions = s.seenDec || {}; g.nextDecisionDay = s.nextDec || 0; g.decisionsOn = s.decOn !== false;
  if (s.research) { g.research.done = new Set(s.research.done); g.research.active = s.research.active; g.research.apply(); }
  if (s.scen) { g.scenario = s.scen; g.scenarioState = s.scenState || {}; }
  if (s.lavaT) w.lavaT.set(unb64(s.lavaT, Float32Array));
  g.eggs = (s.eggs || []).map((e) => ({ species: e.s, x: e.x, y: e.y, t: e.t, max: e.max, unstable: !!e.un }));
  g.pendingFences = s.pend || [];
  if (s.ev) {
    g.events.storm = s.ev.storm || null; g.events.quake = s.ev.quake || 0; g.events.volcano = s.ev.volcano || null;
    w.power.outage = s.ev.outage || 0; if (s.ev.bDelay !== undefined) w.power.backupDelay = s.ev.bDelay; if (s.ev.bFuel !== undefined) w.power.backupFuel = s.ev.bFuel;
  }
  g.alarm = !!s.alarm; g.gateLocked = !!s.gateLocked;
  w.invalidate(); w.computeRegions(); w.computePower(g); g.updateLoose();
  for (const d of g.dinos) d.wasLooseFlag = d.loose;
  return g;
}

function loadGameFromStorage() {
  try {
    const s = localStorage.getItem('jt_save');
    if (!s) return false;
    const g = loadGame(s);
    setActiveGame(g);
    UIX.centerOn(g.start.x, g.start.y - 6);
    hideTitle();
    UIX.toast('Park loaded. Welcome back!', 'good');
    return true;
  } catch (e) { console.error(e); return false; }
}

// ---------------- campaign menu ----------------
function showCampaignMenu() {
  const m = document.getElementById('scenMenu');
  const done = loadCampaign();
  m.innerHTML = CAMPAIGN_ORDER.map((k) => {
    const c = SCENARIOS[k], open = campaignUnlocked(k), won = done[k];
    const perk = CAMPAIGN_PERKS[k] ? `<br><small style="font-size:8px;color:#f8d040">REWARD: ${CAMPAIGN_PERKS[k].desc.toUpperCase()}</small>` : '';
    return `<button data-camp="${k}" ${open ? '' : 'disabled'} title="${c.blurb}">${won ? MEDAL_ICON[won.medal] + ' ' : open ? '' : '🔒 '}CHAPTER ${c.chapter}: ${c.name.toUpperCase()}<br><small style="font-size:8px;color:#9ab08a">${c.objective.toUpperCase()}</small>${perk}</button>`;
  }).join('') + '<button id="scenBack">BACK</button>';
  document.querySelector('#title .menu').hidden = true; m.hidden = false;
  for (const b of m.querySelectorAll('[data-camp]')) b.onclick = () => {
    document.querySelector('#title .menu').hidden = false; m.hidden = true;
    startChapter(b.dataset.camp);
  };
  document.getElementById('scenBack').onclick = () => { document.querySelector('#title .menu').hidden = false; m.hidden = true; };
}
function startChapter(id) {
  const c = SCENARIOS[id];
  startGame({ scenario: id, difficulty: c.difficulty || 'normal' });
  UIX.showChapterIntro(id);
}

// ---------------- title ----------------
function showTitle() {
  const t = document.getElementById('title');
  t.style.display = 'flex';
  let has = false;
  try { has = !!localStorage.getItem('jt_save'); } catch (e) { /* storage unavailable */ }
  document.getElementById('btnContinue').style.display = has ? '' : 'none';
  let tutDone = false;
  try { tutDone = !!localStorage.getItem('jt_tutorial_done'); } catch (e) { /* storage unavailable */ }
  document.getElementById('btnTut').textContent = tutDone ? 'TUTORIAL' : '★ TUTORIAL (START HERE) ★';
  if (GAME) UIX.setSpeed(0);
  startTitleAnim();
}
function hideTitle() { document.getElementById('title').style.display = 'none'; titleAnim = null; }

function startTitleAnim() {
  const c = document.getElementById('tbg');
  const ctx = c.getContext('2d');
  const S = 4;
  c.width = Math.ceil(window.innerWidth / S); c.height = Math.ceil(window.innerHeight / S);
  ctx.imageSmoothingEnabled = false;
  const W = c.width, H = c.height;
  const r = mulberry32(42);
  const parade = [];
  const order = ['galli', 'galli', 'para', 'trike', 'stego', 'brachio', 'anky', 'raptor', 'raptor', 'trex'];
  let x = -40;
  for (const sp of order) { parade.push({ sp, x, spd: SPECIES[sp].speed * 6 }); x -= DINO_SPRITES[sp].w + 16 + r() * 30; }
  const trees = []; for (let i = 0; i < W / 10; i++) trees.push({ x: r() * W, v: Math.floor(r() * 8), s: r() });
  let t = 0;
  titleAnim = true;
  const step = (now) => {
    if (!titleAnim) return;
    t += 1 / 60;
    // sky
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, '#f08a3a'); g.addColorStop(0.45, '#c84a2a'); g.addColorStop(1, '#2a1a20');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    // sun
    ctx.fillStyle = '#f8d878'; ctx.beginPath(); ctx.arc(W * 0.7, H * 0.42, Math.min(W, H) * 0.12, 0, Math.PI * 2); ctx.fill();
    // volcano silhouette
    ctx.fillStyle = '#3a1a1e';
    ctx.beginPath(); ctx.moveTo(W * 0.05, H * 0.75); ctx.lineTo(W * 0.25, H * 0.38); ctx.lineTo(W * 0.31, H * 0.38); ctx.lineTo(W * 0.55, H * 0.75); ctx.fill();
    ctx.fillStyle = 'rgba(80,60,60,0.5)';
    for (let i = 0; i < 6; i++) { const ph = (t * 0.1 + i / 6) % 1; ctx.fillRect(W * 0.28 - 3 + Math.sin(ph * 5 + i) * 6 + ph * 18, H * 0.38 - ph * H * 0.25, 4 + ph * 8, 4 + ph * 8); }
    ctx.fillStyle = '#2a141a'; ctx.fillRect(0, H * 0.75, W, H * 0.25);
    // trees
    for (const tr of trees) ctx.drawImage(treeSil(tr.v), Math.round(tr.x), Math.round(H * 0.75 - 24 - tr.s * 6));
    ctx.globalAlpha = 1;
    // dinos
    for (const p of parade) {
      p.x += p.spd / 60;
      const D = DINO_SPRITES[p.sp];
      if (p.x > W + 20) p.x = -D.w - 60 - r() * 100;
      const fr = Math.floor(t * p.spd / 3) % 2;
      const img = tintCanvasCached(p.sp, fr);
      ctx.drawImage(img, Math.round(p.x), Math.round(H * 0.78 - D.h + 4));
    }
    requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}
const _silCache = {};
function treeSil(v) {
  const k = 'tree' + v;
  if (!_silCache[k]) _silCache[k] = tintCanvas(TILES.trees[v], '#24121a', 0.9);
  return _silCache[k];
}
function tintCanvasCached(sp, fr) {
  const k = sp + fr;
  if (!_silCache[k]) _silCache[k] = tintCanvas(DINO_SPRITES[sp].right[fr], '#1a0c10', 0.92);
  return _silCache[k];
}

// ---------------- loop ----------------
function loop(now) {
  const dtReal = Math.min(0.1, (now - lastT) / 1000 || 0.016);
  lastT = now;
  if (GAME && document.getElementById('title').style.display === 'none') {
    const speed = UIX.speed;
    const modalOpen = document.getElementById('modal').style.display === 'flex';
    if (speed > 0 && !modalOpen) {
      let remaining = dtReal * speed * (UIX.slowmo > 0 ? 0.25 : 1);
      while (remaining > 1e-6) {
        const step = Math.min(1 / 30, remaining);
        GAME.update(step);
        remaining -= step;
      }
    }
    UIX.frame(dtReal);
    if (UIX.tutorial) UIX.tutorial.update(dtReal);
    if (GAME.alarm && UIX.speed > 0) SFX.play('alarm', 0.35);
    SFX.tense = GAME.looseCount > 0 || GAME.world.power.outage > 0 || GAME.alarm;
    // ambient jungle
    if (UIX.speed > 0 && Math.random() < dtReal * 0.35) SFX.play(GAME.isNight ? 'cricket' : (Math.random() < 0.15 ? 'caw' : 'chirp'), 0.8);
    RENDER.draw(dtReal, UIX);
    // breach cam follows the most dangerous loose creature
    const pip = document.getElementById('pip');
    const looseC = GAME.creatures().filter((d) => d.loose && !d.carried && !d.camouflaged);
    if (looseC.length && !UIX.pipHidden) {
      looseC.sort((a, b) => b.sp.danger - a.sp.danger);
      const tgt = looseC[0];
      if (pip.hidden) { pip.hidden = false; pip.onclick = (e) => { if (e.target.id === 'pipClose') { UIX.pipHidden = true; pip.hidden = true; return; } UIX.centerOn(UIX.pipTarget.x, UIX.pipTarget.y); UIX.select(UIX.pipTarget); }; }
      UIX.pipTarget = tgt;
      document.getElementById('pipLabel').textContent = `BREACH CAM · ${tgt.name.toUpperCase()}`;
      const pc = document.getElementById('pipCanvas');
      RENDER.drawPip(pc.getContext('2d'), pc.width, pc.height, tgt, UIX);
    } else {
      if (!pip.hidden) pip.hidden = true;
      if (!looseC.length) UIX.pipHidden = false;
    }
    RENDER.miniT = (RENDER.miniT || 0) + 1;
    if (RENDER.miniT % 3 === 0) {
      const mm = document.getElementById('minimap');
      RENDER.drawMinimap(mm.getContext('2d'), mm.width, mm.height);
    }
    // autosave each new day
    if (GAME.day !== RENDER.lastSaveDay) { RENDER.lastSaveDay = GAME.day; if (GAME.day > 1 && !GAME.gameOver) saveGame(GAME); }
  }
  requestAnimationFrame(loop);
}

function boot() {
  buildAllSprites();
  SFX = new Sfx();
  let pref = 'all';
  try { pref = localStorage.getItem('jt_audio') || 'all'; } catch (e) { /* storage unavailable */ }
  SFX.wantMusic = pref === 'all'; SFX.muted = pref === 'mute';
  // browsers only allow audio after a user gesture
  const kick = () => { if (SFX.wantMusic && !SFX.muted) SFX.startMusic(); document.getElementById('sndBtn').textContent = SFX.muted ? '✕' : SFX.musicOn ? '♫' : '♪'; window.removeEventListener('pointerdown', kick); };
  window.addEventListener('pointerdown', kick);
  // installed as a home-screen app: cache everything so it runs offline
  if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost') && document.querySelector('link[rel="manifest"]')) {
    navigator.serviceWorker.register('sw.js').catch(() => { /* offline support is optional */ });
    // an update was installed while the app was open: reload straight away on the title screen,
    // otherwise offer it, so a park in progress is never yanked away
    const hadController = !!navigator.serviceWorker.controller;
    navigator.serviceWorker.addEventListener('controllerchange', () => {
      if (!hadController) return;
      const title = document.getElementById('title');
      if (!GAME || (title && !title.hidden && getComputedStyle(title).display !== 'none')) { location.reload(); return; }
      if (UIX) UIX.toast('A new version of the game is ready. Save, then reload the page to play it.', 'info');
    });
  }
  // iOS ignores user-scalable=no: stop page pinch-zoom so pinches only zoom the map
  document.addEventListener('gesturestart', (e) => e.preventDefault());
  window.addEventListener('resize', () => {
    if (RENDER) { RENDER.resize(window.innerWidth, window.innerHeight); UIX.clampCam(); }
    if (titleAnim) startTitleAnim();
  });
  document.getElementById('btnNew').onclick = () => {
    SFX.ensure(); SFX.play('click');
    document.querySelector('#title .menu').hidden = true;
    document.getElementById('diffMenu').hidden = false;
  };
  for (const b of document.querySelectorAll('#diffMenu [data-diff]')) b.onclick = () => {
    SFX.play('click');
    document.querySelector('#title .menu').hidden = false;
    document.getElementById('diffMenu').hidden = true;
    startGame({ difficulty: b.dataset.diff, dayLength: window.currentDayLength(), size: window.currentMapSize(), seed: parseSeed(document.getElementById('seedIn').value) || undefined });
  };
  document.getElementById('btnCamp').onclick = () => { SFX.ensure(); SFX.play('click'); showCampaignMenu(); };
  document.getElementById('btnScen').onclick = () => {
    SFX.ensure(); SFX.play('click');
    const m = document.getElementById('scenMenu');
    const won = loadMedals();
    m.innerHTML = Object.entries(SCENARIOS).filter(([, sc]) => !sc.campaign).map(([k, sc]) => `<button data-scen="${k}" title="${sc.blurb}">${won[k] ? MEDAL_ICON[won[k].medal] + ' ' : ''}${sc.name.toUpperCase()}<br><small style="font-size:8px;color:#9ab08a">${sc.objective.toUpperCase()}</small></button>`).join('') + '<button id="scenBack">BACK</button>';
    document.querySelector('#title .menu').hidden = true; m.hidden = false;
    for (const b of m.querySelectorAll('[data-scen]')) b.onclick = () => {
      document.querySelector('#title .menu').hidden = false; m.hidden = true;
      startGame({ scenario: b.dataset.scen, difficulty: 'normal' });
      UIX.toast(SCENARIOS[b.dataset.scen].blurb, 'warn');
    };
    document.getElementById('scenBack').onclick = () => { document.querySelector('#title .menu').hidden = false; m.hidden = true; };
  };
  const lens = ['normal', 'long', 'short'];
  let dayLen = 'normal';
  try { dayLen = localStorage.getItem('jt_daylen') || 'normal'; } catch (e) { /* storage unavailable */ }
  const dlb = document.getElementById('dayLenBtn');
  const showLen = () => { dlb.innerHTML = `DAY LENGTH: ${dayLen.toUpperCase()}<br><small style="font-size:8px;color:#9ab08a">${{ short: '40 SECONDS PER DAY', normal: '60 SECONDS PER DAY', long: '90 SECONDS PER DAY' }[dayLen]}</small>`; };
  showLen();
  dlb.onclick = () => { dayLen = lens[(lens.indexOf(dayLen) + 1) % 3]; try { localStorage.setItem('jt_daylen', dayLen); } catch (e) { /* storage unavailable */ } showLen(); SFX.play('click'); };
  window.currentDayLength = () => dayLen;
  const sizes = Object.keys(MAP_SIZES);
  let mapSize = 'medium';
  try { mapSize = localStorage.getItem('jt_mapsize') || 'medium'; } catch (e) { /* storage unavailable */ }
  if (!MAP_SIZES[mapSize]) mapSize = 'medium';
  const msb = document.getElementById('mapSizeBtn');
  const showSize = () => { const m = MAP_SIZES[mapSize]; msb.innerHTML = `ISLAND SIZE: ${m.label}<br><small style="font-size:8px;color:#9ab08a">${m.desc} · ${m.w}×${m.h}</small>`; };
  showSize();
  msb.onclick = () => { mapSize = sizes[(sizes.indexOf(mapSize) + 1) % sizes.length]; try { localStorage.setItem('jt_mapsize', mapSize); } catch (e) { /* storage unavailable */ } showSize(); SFX.play('click'); };
  window.currentMapSize = () => mapSize;
  document.getElementById('diffBack').onclick = () => { document.querySelector('#title .menu').hidden = false; document.getElementById('diffMenu').hidden = true; };
  document.getElementById('btnTut').onclick = () => { SFX.ensure(); SFX.play('click'); startGame({ tutorial: true, difficulty: 'easy', seed: 51 }); }; // an island with open grass in front of the gate
  document.getElementById('btnSandbox').onclick = () => { SFX.ensure(); SFX.play('click'); startGame({ sandbox: true, size: window.currentMapSize() }); };
  document.getElementById('btnContinue').onclick = () => { SFX.ensure(); if (!loadGameFromStorage()) { startGame(); } };
  document.getElementById('btnHelp').onclick = () => {
    if (!UIX) { setActiveGame(new Game(1)); }
    UIX.showHelp();
    document.getElementById('modal').style.zIndex = 60;
  };
  showTitle();
  requestAnimationFrame(loop);
}

window.addEventListener('load', boot);

</script>
